<mat-toolbar color="primary">
  <span class="title" routerLink="/">AcontPlus</span>
  <span class="spacer"></span>
</mat-toolbar>

<div class="signin-content">
  <mat-card>
    <mat-card-content>
      <form [formGroup]="formLogin" (ngSubmit)="login()">
        <p>Iniciar Sesión</p>
        <mat-form-field class="full-width-input">
          <input matInput placeholder="User" formControlName="username" required>
        </mat-form-field>
        <mat-form-field class="full-width-input">
          <input matInput type="password" placeholder="Password" formControlName="password" required>
        </mat-form-field>
        <button mat-raised-button color="primary" [disabled]="formLogin.invalid">
          <mat-icon>input</mat-icon> Iniciar sesión
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
