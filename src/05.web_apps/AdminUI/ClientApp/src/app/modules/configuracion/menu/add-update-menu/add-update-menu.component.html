<h1 mat-dialog-title>{{tipoRegistro===1?'Nuevo':'Editar'}} Suscripción</h1>

<mat-dialog-content class="mat-typography">
  <form [formGroup]="dataForm">
    <mat-form-field  *ngIf="tipoRegistro==1">
      <mat-label  >Código</mat-label>
      <input formControlName="codigo" matInput type="text" placeholder="">
    </mat-form-field>

    <mat-form-field >
      <mat-label>Descripción</mat-label>
      <input formControlName="descripcion" matInput type="text" placeholder="">
    </mat-form-field>

    <mat-form-field >
      <mat-label>Url</mat-label>
      <input formControlName="urlMenu" matInput type="text" placeholder="">
    </mat-form-field>

    <mat-form-field >
      <mat-label>Icono</mat-label>
      <input formControlName="icono" type="text" matInput>
    </mat-form-field>


   <!--  <section class="example-section" *ngIf="tipoRegistro===2">
      <label class="example-margin">Estado:</label>
      <mat-radio-group formControlName="estado" >
        <mat-radio-button class="example-margin" [value]="true">Activo</mat-radio-button>
        <mat-radio-button class="example-margin" [value]="false">Inactivo</mat-radio-button>
      </mat-radio-group>
    </section> -->

  </form>

</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button color="primary" (click)="addUpdate()">
    {{tipoRegistro===1?'Guardar':'Actualizar'}}
  </button>
  <button mat-raised-button color="warn" mat-dialog-close>

    Cerrar
  </button>
</mat-dialog-actions>
