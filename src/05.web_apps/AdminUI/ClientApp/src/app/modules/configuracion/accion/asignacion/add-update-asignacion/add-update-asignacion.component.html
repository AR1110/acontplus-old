<h2 mat-dialog-title>{{tipoRegistro===1?'Nuevo':'Editar'}} Asignación</h2>

<mat-dialog-content class="mat-tipography">
  <form [formGroup]="dataForm">
    <div fxLayout="column">

      <mat-form-field >
        <mat-select placeholder="Aplicación Menú" formControlName="idAplicacionMenu">
            <mat-option [value]="item.idAplicacionMenu" *ngFor="let item of aplicacionesMenu">{{item.subMenu}}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field >
        <mat-select placeholder="Acción" formControlName="idAccion">
            <mat-option [value]="item.idAccion" *ngFor="let item of acciones">{{item.descripcion}}</mat-option>
        </mat-select>
      </mat-form-field>



    </div>
  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button color="accent" (click)="saveAndUpdate()">
    {{tipoRegistro===1?'Guardar':'Actualizar'}}
  </button>
  <button mat-raised-button color="basic" [mat-dialog-close]="true">
    Cerrar
  </button>
</mat-dialog-actions>
