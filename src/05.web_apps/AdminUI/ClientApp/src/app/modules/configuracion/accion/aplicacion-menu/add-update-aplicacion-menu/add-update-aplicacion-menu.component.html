<h2 mat-dialog-title>{{tipoRegistro===1?'Nuevo':'Editar'}} Aplicación Menú</h2>
<mat-dialog-content class="mat-typography">
  <form [formGroup]="dataForm">
    <div fxLayout="column">
      <mat-form-field  fxFlex="100%">
        <mat-label>Aplicación</mat-label>
        <mat-select formControlName="idAplicacion">
          <mat-option [value]="item.idAplicacion" *ngFor="let item of aplicaciones">{{item.descripcion}}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field  fxFlex="100%">
        <mat-label>Menú</mat-label>
        <mat-select formControlName="idMenu" (selectionChange)="getSubMenu()">
          <mat-option [value]="item.idMenu" *ngFor="let item of menus">{{item.descripcion}}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field  fxFlex="100%">
        <mat-label>Sub Menú</mat-label>
        <mat-select formControlName="idSubMenu">
          <mat-option [value]="item.idSubMenu" *ngFor="let item of subMenus">{{item.descripcion}}</mat-option>
        </mat-select>
      </mat-form-field>


      <section *ngIf="tipoRegistro===2">
        <mat-label>Estado</mat-label><br>
        <mat-radio-group  aria-label="Estado" formControlName="estado">
          <mat-radio-button [value]="true">Activo</mat-radio-button>
          <mat-radio-button [value]="false">Inactivo</mat-radio-button>
        </mat-radio-group>
      </section>

    </div>

  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button color="accent" [disabled]="dataForm.invalid" (click)="saveAndUpdate()">
    {{tipoRegistro===1?'Guardar':'Actualizar'}}
  </button>
  <button mat-stroked-button color="basic" mat-dialog-close>
    Cerrar
  </button>
</mat-dialog-actions>
