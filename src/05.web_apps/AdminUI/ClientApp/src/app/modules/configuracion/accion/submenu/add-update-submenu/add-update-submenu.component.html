<h2 mat-dialog-title>{{tipoRegistro===1?'Nuevo':'Editar'}} SubMenu </h2>
<mat-dialog-content class="mat-typography">
  <form [formGroup]="dataForm">

    <mat-form-field >
      <mat-label>Menú</mat-label>
      <mat-select formControlName="idMenu">
        <mat-option *ngFor="let item of menus" [value]="item.idMenu">
          {{item.descripcion}}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field >
      <mat-label  >Código</mat-label>
      <input formControlName="codigo" matInput type="text" placeholder="">
    </mat-form-field>

    <mat-form-field >
      <mat-label>Descripción</mat-label>
      <input formControlName="descripcion" matInput type="text" placeholder="">
    </mat-form-field>

    <mat-form-field >
      <mat-label>Url</mat-label>
      <input formControlName="urlSubMenu" matInput type="text" placeholder="">
    </mat-form-field>

    <mat-form-field >
      <mat-label>Icono</mat-label>
      <input formControlName="icono" matInput type="text" placeholder="">
    </mat-form-field>

    <section *ngIf="tipoRegistro===2">
      <label id="estado">Estado: </label><br>
      <mat-radio-group formControlName="estado" aria-label="Estado">
        <mat-radio-button [value]="true">Activo</mat-radio-button>
        <mat-radio-button [value]="false">Inactivo</mat-radio-button>
      </mat-radio-group>
    </section>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button color="accent" (click)="saveAndUpdate()">
    {{tipoRegistro===1?'Guadar':'Actualizar'}}
  </button>
  <button mat-raised-button color="default" mat-dialog-close="true">
    Cerrar
  </button>
</mat-dialog-actions>
