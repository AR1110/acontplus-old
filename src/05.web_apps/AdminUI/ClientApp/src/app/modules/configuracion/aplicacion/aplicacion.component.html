

<div fxLayout="row" fxLayoutWrap="wrap">
	<div fxFlex.gt-sm="100%" fxFlex="100">
		<mat-card>
			<div class="p-l-20 p-r-20 p-b-20">
				<mat-tab-group animationDuration="0ms" mat-align-tabs="center">
				  <mat-tab>
            <ng-template mat-tab-label>
              <mat-icon>view_compact</mat-icon>
              Aplicación
            </ng-template>

            <div fxLayout="row wrap">
              <div fxFlex="100">

                <div fxLayout="row wrap" class="align-item-center">
                  <div fxFlex.gt-md="25" fxFlex.gt-lg="25" fxFlex="100">
                    <mat-form-field>
                      <input type="text" matInput (keyup)="aplicacionFilter($event)" placeholder="Buscar Aplicación" #inputFilter>
                    </mat-form-field>
                  </div>
                  <div fxFlex.gt-md="75" class="text-right m-t-10">
                    <button mat-raised-button color="primary" (click)="openModalAdd()">
                      <mat-icon>add</mat-icon>
                      <span class="mat-button-wrapper">Nuevo</span>
                    </button>
                  </div>
                </div>

              </div>
            </div>

            <div fxLayout="row wrap">
              <div fxFlex="100">

                      <table mat-table [dataSource]="dataSource" matSort>
                        <ng-container matColumnDef="index">
                          <th mat-header-cell *matHeaderCellDef> N° </th>
                          <td mat-cell *matCellDef="let element; let i = index;">{{i+1}}</td>
                        </ng-container>

                         <!-- Fruit Column -->
                         <ng-container matColumnDef="codigo">
                          <th mat-header-cell *matHeaderCellDef mat-sort-header> Código </th>
                          <td mat-cell *matCellDef="let row"> {{row.codigo}} </td>
                        </ng-container>

                        <!-- Name Column -->
                        <ng-container matColumnDef="descripcion">
                          <th mat-header-cell *matHeaderCellDef mat-sort-header> Descripción </th>
                          <td mat-cell *matCellDef="let row"> {{row.descripcion}} </td>
                        </ng-container>

                        <ng-container matColumnDef="estado">
                          <th mat-header-cell *matHeaderCellDef mat-sort-header> Estado </th>
                          <td mat-cell *matCellDef="let row">
                            <div [innerHtml]="row.estado | estadoColor"> </div>
                          </td>
                        </ng-container>



                        <ng-container matColumnDef="op">
                          <th mat-header-cell *matHeaderCellDef mat-sort-header>Op</th>
                          <td mat-cell *matCellDef="let row">
                            <button mat-icon-button color="accent" (click)="openModalUpdate(row)">
                              <mat-icon>edit</mat-icon>
                            </button>
                            <button mat-icon-button color="warn" (click)="delete(row.idAplicacion)">
                              <mat-icon>delete</mat-icon>
                            </button>
                          </td>
                        </ng-container>




                        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>


                        <!-- Row shown when there is no matching data. -->
                        <tr class="mat-row" *matNoDataRow>
                          <td class="mat-cell" colspan="4">No se encontraron los resultados "{{inputFilter.value}}"</td>
                        </tr>

                      </table>
                      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>

              </div>
            </div>
          </mat-tab>

          <!--Tab Aplicacion Menu-->
				  <mat-tab>
            <ng-template mat-tab-label>
              <mat-icon>list_alt</mat-icon>
              Aplicación Menú
            </ng-template>
            <app-aplicacion-menu></app-aplicacion-menu>
          </mat-tab>
				</mat-tab-group>
			</div>
		</mat-card>
	</div>
</div>
