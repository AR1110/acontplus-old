<h2 mat-dialog-title>{{tipoRegistro===1?'Nuevo':'Editar'}} Sistema</h2>

<mat-dialog-content class="mat-typography">
  <form [formGroup]="dataForm">
    <div fxLayout="column" >
      <mat-form-field  fxFlex="100%">
        <input type="text" formControlName="codigo" matInput placeholder="Código">
        <mat-error *ngIf="dataForm.controls['codigo'].invalid">
          Este campo es requerido
        </mat-error>
      </mat-form-field>

      <mat-form-field  fxFlex="100%">
        <input type="text" formControlName="descripcion" matInput placeholder="Descripción">
        <mat-error *ngIf="dataForm.controls['descripcion'].invalid">
          Este campo es requerido
        </mat-error>
      </mat-form-field>

      <mat-form-field  fxFlex="100%" >
        <input type="text" formControlName="urlSistema" matInput placeholder="Url Sistema">
        <mat-error *ngIf="dataForm.controls['urlSistema'].invalid">
          Este campo es requerido
        </mat-error>
      </mat-form-field>

      <mat-form-field  fxFlex="100%" >
        <input type="text" formControlName="hostApp" matInput placeholder="Host App">
        <mat-error *ngIf="dataForm.controls['hostApp'].invalid">
          Este campo es requerido
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <input type="text" formControlName="connectionStrings" matInput placeholder="Conexión">
        <mat-error *ngIf="dataForm.controls['connectionStrings'].invalid">
          Este campo es requerido
        </mat-error>
      </mat-form-field>

      <section *ngIf="tipoRegistro===2">
        <mat-label>Estado</mat-label><br>
        <mat-radio-group  aria-label="Estado" formControlName="estado">
          <mat-radio-button [value]="true">Activo</mat-radio-button>
          <mat-radio-button [value]="false">Inactivo</mat-radio-button>
        </mat-radio-group>
      </section>

    </div>

  </form>


</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button color="accent" [disabled]="dataForm.invalid" (click)="saveAndUpdate()">
    {{tipoRegistro===1?'Guardar':'Actualizar'}}
  </button>
  <button mat-stroked-button color="basic" mat-dialog-close="">Cerrar</button>
</mat-dialog-actions>
