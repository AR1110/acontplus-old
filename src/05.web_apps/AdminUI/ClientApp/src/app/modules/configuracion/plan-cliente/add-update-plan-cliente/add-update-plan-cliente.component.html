<h2 mat-dialog-title>Nuevo Plan Cliente</h2>

<mat-dialog-content>
  <form [formGroup]="dataForm">
    <div fxLayout="column">
      <mat-form-field  fxFlex="100%">
        <mat-select placeholder="Entidad" formControlName="ruc">
            <mat-option [value]="item.ruc" *ngFor="let item of entidades">{{item.razonSocial}}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field  fxFlex="100%">
        <mat-select placeholder="Licencia" formControlName="idLicencia">
            <mat-option [value]="item.idLicencia" *ngFor="let item of licencias">{{item.descripcion}}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field  fxFlex="100%">
        <mat-select placeholder="Suscripción" formControlName="idSuscripcion">
            <mat-option [value]="item.idSuscripcion" *ngFor="let item of suscripciones">{{item.descripcion}}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field >
        <input type="number" formControlName="valor" class="webkit-outer-spin-button" placeholder="Valor" matInput>
        <span matSuffix>.00</span>
      </mat-form-field>

      <section *ngIf="tipoRegistro===2">
        <mat-label>Estado</mat-label><br>
        <mat-radio-group  aria-label="Estado" formControlName="estado">
          <mat-radio-button [value]="true">Activo</mat-radio-button>
          <mat-radio-button [value]="false">Inactivo</mat-radio-button>
        </mat-radio-group>
      </section>

    </div>
  </form>
</mat-dialog-content>


<mat-dialog-actions align="end">
  <button mat-raised-button color="accent" [disabled]="dataForm.invalid" (click)="saveAndUpdate()">
    Guardar
  </button>

  <button mat-raised-button color="basic" mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
