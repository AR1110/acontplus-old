<h1 mat-dialog-title>{{tipoRegistro===1?'Nueva':'Editar'}} Suscripción</h1>

<mat-dialog-content class="mat-typography">
  <form [formGroup]="dataForm">
    <mat-form-field >
      <mat-label  >Código</mat-label>
      <input formControlName="codigo" matInput type="text" placeholder="">
    </mat-form-field>

    <mat-form-field >
      <mat-label>Descripción</mat-label>
      <input formControlName="descripcion" matInput type="text" placeholder="">
    </mat-form-field>

    <mat-form-field >
      <mat-label>Cantidad</mat-label>
      <input formControlName="cantidad" matInput type="number" placeholder="">
    </mat-form-field>

    <mat-form-field >
      <mat-label>Tiempo</mat-label>
      <input formControlName="tiempo" matInput>
      <!-- <input formControlName="tiempo" matInput  [matDatepicker]="picker"> -->
      <!-- <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker> -->
    </mat-form-field>


    <section class="example-section" *ngIf="tipoRegistro===2">
      <label class="example-margin">Estado:</label>
      <mat-radio-group formControlName="estado" >
        <mat-radio-button class="example-margin" [value]="true">Activo</mat-radio-button>
        <mat-radio-button class="example-margin" [value]="false">Inactivo</mat-radio-button>
      </mat-radio-group>
    </section>

  </form>

</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button color="primary" (click)="addUpadteSuscripcion()">
    {{tipoRegistro===1?'Guardar':'Actualizar'}}
  </button>
  <button mat-raised-button color="warn" mat-dialog-close>

    Cerrar
  </button>
</mat-dialog-actions>
