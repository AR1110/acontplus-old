<div fxLayout="row wrap">
  <div fxFlex="100">
    <mat-card class="mat-card mat-focus-indicator">
      <mat-card-content class="mat-card-content">
        <div fxLayout="row wrap" class="align-item-center">
          <div fxFlex.gt-md="25" fxFlex.gt-lg="25" fxFlex="100">
            <mat-form-field>
              <input matInput placeholder="Buscar" #inputFilter>
            </mat-form-field>
          </div>
          <div fxFlex.gt-md="75" class="text-right">
            <button mat-raised-button color="primary" (click)="openModalAdd()" >
              <mat-icon>add</mat-icon>
              <span class="mat-button-wrapper">Nuevo</span>
            </button>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>

<div fxLayout="row wrap">
  <div fxFlex="100">
    <mat-card>
      <mat-card-content>
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="index">
            <th mat-header-cell *matHeaderCellDef> N° </th>
            <td mat-cell *matCellDef="let element; let i = index;">{{i+1}}</td>
          </ng-container>

            <!-- Fruit Column -->
          <ng-container matColumnDef="aplicacion">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Aplicación </th>
            <td mat-cell *matCellDef="let row"> {{row.aplicacion}} </td>
          </ng-container>

          <ng-container matColumnDef="licencia">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Licencia </th>
            <td mat-cell *matCellDef="let row"> {{row.licencia}} </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="costo">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Costo </th>
            <td mat-cell *matCellDef="let row"> {{row.costo | currency:'$'}} </td>
          </ng-container>

          <ng-container matColumnDef="impuesto">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Impuesto </th>
            <td mat-cell *matCellDef="let row"> {{row.impuesto | currency:'$'}} </td>
          </ng-container>

          <ng-container matColumnDef="descuento">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Descuento </th>
            <td mat-cell *matCellDef="let row"> {{row.descuento | currency:'$'}} </td>
          </ng-container>

          <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Estado </th>
            <td mat-cell *matCellDef="let row">
              <div [innerHtml]="row.estado | estadoColor"> </div>
            </td>
          </ng-container>



          <ng-container matColumnDef="op">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Op</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="accent" (click)="openModalUpdate(row)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="swalFireDelete(row)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>




          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>


          <!-- Row shown when there is no matching data. -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="6">No se encontraron los resultados "{{inputFilter.value}}"</td>
          </tr>

        </table>
        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of licencia plan"></mat-paginator>
      </mat-card-content>
    </mat-card>
  </div>
</div>
