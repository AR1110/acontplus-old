<mat-card>
  <mat-card-content>
    <div class="d-flex align-items-center">
      <h3 class="m-t-0">Menu</h3>
      <div class="ml-auto">
        <button (click)="openModalAdd()" color="primary" class="mat-focus-indicator mat-raised-button mat-button-base mat-primary">
          <span class="mat-button-wrapper">Nuevo</span>
          <span matripple="" class="mat-ripple mat-button-ripple"></span>
          <span class="mat-button-focus-overlay"></span>
        </button>
      </div>
    </div>
    <mat-divider></mat-divider>
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef> N° </th>
        <td mat-cell *matCellDef="let element; let i = index;">{{i+1}}</td>
      </ng-container>

      <!-- ID Column -->
      <ng-container matColumnDef="idMenu" >
        <th mat-header-cell *matHeaderCellDef mat-sort-header  [hidden]="true"> N°. </th>
        <td mat-cell *matCellDef="let row"  [hidden]="true"> {{row.idMenu}}</td>
      </ng-container>

       <!-- Fruit Column -->
       <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Código </th>
        <td mat-cell *matCellDef="let row"> {{row.codigo}} </td>
      </ng-container>

      <ng-container matColumnDef="urlMenu">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Url </th>
        <td mat-cell *matCellDef="let row"> {{row.urlMenu}} </td>
      </ng-container>

      <ng-container matColumnDef="icono">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Icono </th>
        <td mat-cell *matCellDef="let row"> {{row.icono}} </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Descripción </th>
        <td mat-cell *matCellDef="let row"> {{row.descripcion}} </td>
      </ng-container>
     <!--  <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Estado </th>
        <td mat-cell *matCellDef="let row"> {{row.estado?'Activo':'Inactivo'}} </td>
      </ng-container> -->

      <ng-container matColumnDef="op">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Op</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="primary" (click)="update(row)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="delete(row)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>




      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>


      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">No data matching the filter ""</td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </mat-card-content>
</mat-card>
