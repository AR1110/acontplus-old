
<div fxLayout="row" fxLayoutWrap="wrap">
	<div fxFlex.gt-sm="100%" fxFlex="100">
		<mat-card>
			<div class="p-l-20 p-r-20 p-b-20">
				<mat-tab-group animationDuration="0ms" mat-align-tabs="center">
				  <mat-tab>
            <ng-template mat-tab-label>
              <mat-icon>view_compact</mat-icon>
              Usuario
            </ng-template>

            <div fxLayout="row wrap">
              <div fxFlex="100">

                <div fxLayout="row wrap" class="align-item-center">
                  <div fxFlex.gt-md="25" fxFlex.gt-lg="25" fxFlex="100">
                    <mat-form-field>
                      <input type="text" matInput (keyup)="usuarioFilter($event)" placeholder="Buscar" #inputFilter>
                    </mat-form-field>
                  </div>
                  <div fxFlex.gt-md="75" class="text-right m-t-10">
                    <button mat-raised-button color="primary" (click)="openModalAdd()">
                      <mat-icon>person_add</mat-icon>
                      <span class="mat-button-wrapper">Nuevo</span>
                    </button>
                  </div>
                </div>

              </div>
            </div>

            <div fxLayout="row wrap">
              <div fxFlex="100">
                <table mat-table [dataSource]="dataSource" matSort>
                  <ng-container matColumnDef="index">
                    <th mat-header-cell *matHeaderCellDef>N°</th>
                    <td mat-cell *matCellDef="let row; let index=index">{{index+1}}</td>
                  </ng-container>

                  <ng-container matColumnDef="nroIdentificacion">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>N°. Identificacion</th>
                    <td mat-cell *matCellDef="let row">{{row.nroIdentificacion}}</td>
                  </ng-container>

                  <ng-container matColumnDef="nombreCompleto">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre Completo</th>
                    <td mat-cell *matCellDef="let row">{{row.nombreCompleto}}</td>
                  </ng-container>

                  <ng-container matColumnDef="correo">
                    <th mat-header-cell *matHeaderCellDef>Correo</th>
                    <td mat-cell *matCellDef="let row;">{{row.correo}}</td>
                  </ng-container>


                  <ng-container matColumnDef="usuario">
                    <th mat-header-cell *matHeaderCellDef>Usuario</th>
                    <td mat-cell *matCellDef="let row;">{{row.nombreUsuario}}</td>
                  </ng-container>

                  <ng-container matColumnDef="estado">
                    <th mat-header-cell *matHeaderCellDef>Estado</th>
                    <td mat-cell *matCellDef="let row;">
                      <div [innerHtml]="row.estado | estadoColor"> </div>
                    </td>
                  </ng-container>

                  <ng-container matColumnDef="op">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Op</th>
                    <td mat-cell *matCellDef="let row">
                      <button mat-icon-button color="accent" (click)="openModalUpdate(row)">
                        <mat-icon>edit</mat-icon>
                      </button>
                      <button mat-icon-button color="warn" (click)="swalFireDelete(row)">
                        <mat-icon>delete</mat-icon>
                      </button>
                    </td>
                  </ng-container>



                  <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky:true"></tr>
                  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                  <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" colspan="6">No se encontraron los resultados "{{inputFilter.value}}"</td>
                  </tr>

                </table>
                <mat-paginator [pageSizeOptions]="[5, 10, 25, 50, 100]" aria-label="Select page of user "></mat-paginator>

              </div>
            </div>
          </mat-tab>

          <!--Usuario Rol-->
				  <mat-tab>
            <ng-template mat-tab-label>
              <mat-icon>list_alt</mat-icon>
              Rol
            </ng-template>
            <app-usuario-rol></app-usuario-rol>
          </mat-tab>
				</mat-tab-group>
			</div>
		</mat-card>
	</div>
</div>
