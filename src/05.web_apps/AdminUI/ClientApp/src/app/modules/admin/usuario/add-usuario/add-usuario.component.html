<h2 mat-dialog-title>Nuevo Usuario</h2>

<mat-dialog-content class="mat-typography">
  <form [formGroup]="dataForm">
    <div fxLayout="column">
      <mat-form-field  fxFlex="100%">
        <input type="text" formControlName="nroIdentificacion" placeholder="Nro. Identificación" matInput>
        <mat-error *ngIf="dataForm.controls['nroIdentificacion'].invalid">
          Este campo es requerido
        </mat-error>
      </mat-form-field>

      <mat-form-field fxFlex="100%">
        <input type="text" formControlName="nombre" placeholder="Nombre" matInput>
        <mat-error *ngIf="dataForm.controls['nombre'].invalid">
          Este campo es requerido
        </mat-error>
      </mat-form-field>

      <mat-form-field fxFlex="100%">
        <input type="text" formControlName="apellido" placeholder="Apellido" matInput>
        <mat-error *ngIf="dataForm.controls['apellido'].invalid">
          Este campo es requerido
        </mat-error>
      </mat-form-field>

      <mat-form-field fxFlex="100%">
        <input type="email" formControlName="correo" placeholder="Correo" matInput>
        <mat-error *ngIf="dataForm.controls['correo'].invalid">
          Este campo es requerido
        </mat-error>
      </mat-form-field>


      <mat-form-field fxFlex="100%">
        <input type="text" formControlName="nombreUsuario" placeholder="Usuario" matInput>
        <mat-error *ngIf="dataForm.controls['nombreUsuario'].invalid">
          Este campo es requerido
        </mat-error>
      </mat-form-field>

      <mat-form-field  fxFlex="100%">
        <input [type]="hidePassword ? 'password' : 'text'" formControlName="contrasena" placeholder="Contraseña" matInput>
        <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword">
          <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button color="accent" [disabled]="dataForm.invalid" (click)="save()">
    Guardar
  </button>
  <button mat-raised-button color="basic" mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
