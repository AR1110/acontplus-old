<div fxLayout="row wrap">
  <div fxFlex="100">
    <div fxLayout="row wrap" class="align-item-center">
      <div fxFlex.gt-md="25" fxFlex.gt-lg="25" fxFlex="100">
        <mat-form-field>
          <input type="text" (keyup)="usuarioRolFilter($event)" matInput placeholder="Buscar" #inputFilter>
        </mat-form-field>
      </div>
      <div fxFlex.gt-md="75" class="text-right m-t-10">
        <button mat-raised-button color="primary" (click)="openModalAdd()">
          <mat-icon>add</mat-icon>
          <span class="mat-button-wrapper">Nuevo</span>
        </button>
      </div>
    </div>
  </div>
</div>

<div fxLayout="row wrap">
  <div fxFlex="100">
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef> N° </th>
        <td mat-cell *matCellDef="let element; let i = index;">{{i+1}}</td>
      </ng-container>

      <ng-container matColumnDef="usuario">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Usuario </th>
        <td mat-cell *matCellDef="let row">
          <div [innerHtml]="row.nombreUsuario"> </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="ruc">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Ruc </th>
        <td mat-cell *matCellDef="let row">
          <div [innerHtml]="row.ruc"> </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="entidad">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Entidad </th>
        <td mat-cell *matCellDef="let row">
          <div [innerHtml]="row.razonSocial"> </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="codRol">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Rol </th>
        <td mat-cell *matCellDef="let row">
          <div [innerHtml]="row.rol"> </div>
        </td>
      </ng-container>


      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Estado </th>
        <td mat-cell *matCellDef="let row">
          <div [innerHtml]="row.estado | estadoColor"> </div>
        </td>
      </ng-container>



      <ng-container matColumnDef="op">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Op</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="primary" (click)="openModalUpdate(row)" aria-label="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="swalFireDelete(row)" aria-label="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>




      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="6">No se encontraron los resultados "{{inputFilter.value}}"</td>
      </tr>

    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </div>
</div>
