<div fxLayout="row wrap">
  <div fxFlex="100">
    <mat-card>
      <mat-card-content>
        <div fxLayout="row wrap">
          <div fxFlex.gt-lg="25" fxFlex.gt-md="25" fxFlex="100">
            <mat-form-field>
              <input type="text" (keyup)="rolFilter($event)" placeholder="Buscar" matInput #inputFilter>
            </mat-form-field>
          </div>
          <div fxFlex.gt-lg="75" fxFlex.gt-md="75" class="text-right">
            <button mat-raised-button color="primary" (click)="openModalAdd()">
              <mat-icon>person_add</mat-icon>
              Nuevo
            </button>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>


<div fxLayout="row wrap">
  <div fxFlex="100">
    <mat-card>
      <mat-card-content>
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="index">
            <th mat-header-cell *matHeaderCellDef>N°</th>
            <td mat-cell *matCellDef="let row; let index=index">{{index+1}}</td>
          </ng-container>


          <ng-container matColumnDef="codigo">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Código</th>
            <td mat-cell *matCellDef="let row">{{row.codigo}}</td>
          </ng-container>

          <ng-container matColumnDef="ruc">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Ruc</th>
            <td mat-cell *matCellDef="let row">{{row.ruc}}</td>
          </ng-container>

          <ng-container matColumnDef="rol">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
            <td mat-cell *matCellDef="let row">{{row.rol}}</td>
          </ng-container>

          <ng-container matColumnDef="licencia">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Licencia</th>
            <td mat-cell *matCellDef="let row">{{row.licencia}}</td>
          </ng-container>


          <!-- <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef>Estado</th>
            <td mat-cell *matCellDef="let row;">
              <div [innerHtml]="row.estado | estadoColor"> </div>
            </td>
          </ng-container> -->

          <ng-container matColumnDef="op">
            <th mat-header-cell *matHeaderCellDef>Op</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="openModalUpdate(row)">
                  <mat-icon>edit</mat-icon>
                  <span>Editar</span>
                </button>
                <button mat-menu-item (click)="swalFireDelete(row)">
                  <mat-icon>delete</mat-icon>
                  <span>Eliminar</span>
                </button>
                <button mat-menu-item (click)="openModalAcceso(row)">
                  <mat-icon>vpn_key</mat-icon>
                  <span>Acceso</span>
                </button>
                <button mat-menu-item (click)="openModalDuplicar(row)">
                  <mat-icon>transform</mat-icon>
                  <span>Duplicar</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>



          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky:true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="6">No se encontraron los resultados "{{inputFilter.value}}"</td>
          </tr>

        </table>
        <mat-paginator [pageSizeOptions]="[5, 10, 25, 50, 100]" aria-label="Select page of user "></mat-paginator>
      </mat-card-content>
    </mat-card>
  </div>
</div>
