<h2 matDialogTitle>Acceso Menú</h2>

<mat-dialog-content>
  <span><strong>Politica: </strong> {{dataUsuarioRol.politica}}</span>
  <mat-divider class="mb-5"></mat-divider>
  <br>
  <mat-accordion multi>
    <mat-expansion-panel   *ngFor="let menu of menus" >
      <mat-expansion-panel-header  (click)="toggleMenu(menu)">
        <mat-panel-title>{{menu.codMenu}}</mat-panel-title>
        <mat-panel-description>{{menu.descripcion}}</mat-panel-description>
      </mat-expansion-panel-header>

      <section class="example-section" *ngFor="let subMenu of menu.subMenus">
        <span class="example-list-section">
          <mat-checkbox class="example-margin" [checked]="subMenu.estado" color="accent"
                        (change)="setAllAccion($event.checked, subMenu)">
            <strong>{{subMenu.descripcion}}</strong>
          </mat-checkbox>
        </span>
        <span class="example-list-section">
          <ul>
            <li *ngFor="let accion of subMenu.acciones">
              <mat-checkbox [(ngModel)]="accion.estado" color="warn"
              (ngModelChange)="updateAllCompleteAccion(subMenu)">
              {{accion.descripcion}}
            </mat-checkbox>
            </li>
          </ul>
        </span>
      </section>
    </mat-expansion-panel>

  </mat-accordion>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button color="accent" (click)="saveAndUpdate()">Guardar</button>
  <button mat-raised-button color="basic" matDialogClose>Cerrar</button>

</mat-dialog-actions>
