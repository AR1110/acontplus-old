

<h1 mat-dialog-title>{{tipoRegistro==='N'?'Nuevo':'Editar'}} Menú </h1>

<form [formGroup]="dataForm">
  <mat-dialog-content class="mat-typography">

    <mat-form-field appearance="outline" *ngIf="tipoRegistro=='N'">
      <mat-label  >Código</mat-label>
      <input formControlName="codigo" matInput type="text" placeholder="">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Descripción</mat-label>
      <input formControlName="descripcion" matInput type="text" placeholder="">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Url</mat-label>
      <input formControlName="urlMenu" matInput type="text" placeholder="">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Icono</mat-label>
      <input formControlName="icono" type="text" matInput>
    </mat-form-field>

  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-raised-button color="primary" (click)="save()" [disabled]="dataForm.invalid">
      {{tipoRegistro==='N'?'Guardar':'Actualizar'}}
    </button>
    <button mat-raised-button mat-dialog-close>

      Cerrar
    </button>
  </mat-dialog-actions>
</form>
