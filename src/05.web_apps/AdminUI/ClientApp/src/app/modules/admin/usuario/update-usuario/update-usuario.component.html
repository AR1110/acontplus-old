<h2 mat-dialog-title> Editar Usuario</h2>

<mat-dialog-content class="mat-typography">
  <form [formGroup]="dataForm">
    <div fxLayout="column">
      <mat-form-field fxFlex="100%">
        <input type="text" formControlName="nroIdentificacion" placeholder="Nro. Identificación" matInput>
        <mat-error *ngIf="dataForm.controls['nroIdentificacion'].invalid">
          Este campo es requerido
        </mat-error>
      </mat-form-field>

      <mat-form-field fxFlex="100%">
        <input type="text" formControlName="nombreCompleto" placeholder="Nombre Completo" matInput>
        <mat-error *ngIf="dataForm.controls['nombreCompleto'].invalid">
          Este campo es requerido
        </mat-error>
      </mat-form-field>

      <mat-form-field fxFlex="100%">
        <input type="email" formControlName="correo" placeholder="Correo" matInput>
        <mat-error *ngIf="dataForm.controls['correo'].invalid">
          Este campo es requerido
        </mat-error>
      </mat-form-field>

      <section>
        <mat-label>Estado</mat-label><br>
        <mat-radio-group  aria-label="Estado" formControlName="estado">
          <mat-radio-button [value]="true">Activo</mat-radio-button>
          <mat-radio-button [value]="false">Inactivo</mat-radio-button>
        </mat-radio-group>
      </section>

    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button color="accent" [disabled]="dataForm.invalid" (click)="update()">
    Actualizar
  </button>
  <button mat-raised-button color="basic" mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
