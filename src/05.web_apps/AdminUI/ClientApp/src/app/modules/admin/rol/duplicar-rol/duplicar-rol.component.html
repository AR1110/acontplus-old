<h2 mat-dialog-title>Duplicar Rol</h2>

<mat-dialog-content class="mat-typography">
  <form [formGroup]="dataForm">
    <div fxLayout="column">
      <mat-form-field fxFlex="100%" >
        <input type="text" formControlName="codigo" placeholder="Código" matInput>
      </mat-form-field>

      <mat-form-field fxFlex="100%" >
        <input type="text" formControlName="descripcion" placeholder="Descripción" matInput>
      </mat-form-field>

      <mat-form-field >
        <mat-label>Plan Clente</mat-label>
        <mat-select formControlName="codLicencia">
          <mat-option *ngFor="let item of planClientes" [value]="item.codLicencia">
            {{item.planCliente}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button color="accent" [disabled]="dataForm.invalid" (click)="duplicar()">
    Duplicar
  </button>
  <button mat-raised-button color="basic" mat-dialog-close>
    Cerrar
  </button>
</mat-dialog-actions>
