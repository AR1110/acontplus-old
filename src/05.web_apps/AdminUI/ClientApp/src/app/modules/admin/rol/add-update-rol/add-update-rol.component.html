<h2 mat-dialog-title>{{tipoRegistro===1?'Nuevo':'Editar'}} Rol</h2>

<mat-dialog-content class="mat-typography">
  <form [formGroup]="dataForm">
    <div fxLayout="column">
      <mat-form-field fxFlex="100%" >
        <input type="text" formControlName="codigo" placeholder="Código" matInput>
      </mat-form-field>

      <mat-form-field fxFlex="100%" >
        <input type="text" formControlName="descripcion" placeholder="Descripción" matInput>
      </mat-form-field>

      <mat-form-field >
        <mat-label>Plan Cliente</mat-label>
        <mat-select formControlName="idPlanCliente">
          <mat-option *ngFor="let item of planClientes" [value]="item.idPlanCliente">
            {{item.planCliente}}
          </mat-option>
        </mat-select>
      </mat-form-field>


      <section *ngIf="tipoRegistro===2">
        <mat-label>Estado</mat-label><br>
        <mat-radio-group  aria-label="Estado" formControlName="estado">
          <mat-radio-button [value]="true">Activo</mat-radio-button>
          <mat-radio-button [value]="false">Inactivo</mat-radio-button>
        </mat-radio-group>
      </section>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button color="accent" [disabled]="dataForm.invalid" (click)="saveAndUpdate()">
    {{tipoRegistro===1?'Guardar':'Actualizar'}}
  </button>
  <button mat-raised-button color="basic" mat-dialog-close>
    Cerrar
  </button>
</mat-dialog-actions>
