<mat-toolbar color="primary" fixed>
  <button mat-icon-button (click)="sidenav.toggle()" matTooltip="Menu">
      <mat-icon>menu</mat-icon>
  </button>
  <span>{{title}}</span>
  <span class="toolbar-item-spacer"></span>

  <button mat-icon-button matTooltip="Notifications">
      <mat-icon>notifications</mat-icon>
  </button>
  <button mat-icon-button matTooltip="My Account" [matMenuTriggerFor]="userAccountMenu">
      <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu #userAccountMenu [overlapTrigger]="false" yPosition="below">
      <button mat-menu-item routerLink="#">
          <mat-icon>person</mat-icon><span>Mi Cuenta</span>
      </button>
      <button mat-menu-item routerLink="#">
          <mat-icon>settings</mat-icon><span>Configuración</span>
      </button>
      <!-- <button mat-menu-item routerLink="#">
          <mat-icon>help</mat-icon><span>Help</span>
      </button> -->
      <mat-divider></mat-divider>
      <button mat-menu-item routerLink="#" (click)="logout()">
          <mat-icon>exit_to_app</mat-icon>Salir
      </button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="app-container">
  <mat-sidenav #sidenav mode="side" [class.mat-elevation-z4]="true" class="app-sidenav" >
      <mat-nav-list>
          <mat-list-item routerLink="/">
              <mat-icon>home</mat-icon><span>Home</span>
          </mat-list-item>
          <mat-expansion-panel [class.mat-elevation-z0]="true">
              <mat-expansion-panel-header>
                  Administración
              </mat-expansion-panel-header>
              <mat-nav-list>
                  <a mat-list-item routerLink="#">
                      <mat-icon>domain</mat-icon><span>Entidad</span>
                  </a>
                  <a mat-list-item routerLink="#">
                      <mat-icon>people</mat-icon><span>Usuario</span>
                  </a>
              </mat-nav-list>
          </mat-expansion-panel>
          <mat-expansion-panel [class.mat-elevation-z0]="true">
              <mat-expansion-panel-header>
                  Configuración
              </mat-expansion-panel-header>
              <mat-nav-list>
                  <a mat-list-item routerLink="#">Test</a>
              </mat-nav-list>
          </mat-expansion-panel>
      </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet>
      <!-- <div class="app-sidenav-content">

      </div> -->
  </router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
