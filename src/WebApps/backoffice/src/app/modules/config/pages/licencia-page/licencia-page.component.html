<app-breadcrumb />
<mat-card>
  <mat-card-content>
    <div class="row">
      <div class="col-6">
        <button (click)="openDialog()" mat-raised-button type="button">
          <mat-icon>add</mat-icon>
          Registrar
        </button>
      </div>
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
        <input
          matInput
          (keyup)="applyFilter($event)"
          class="form-control"
          placeholder="Buscar Licencia"
          #input
        />
      </div>
    </div>
    <br />
    <div class="mat-elevation-z8">
      <section class="section-container-table" tabindex="0">
        <table mat-table [dataSource]="dataSource" matSort>
          <!-- Options -->
          <ng-container matColumnDef="op">
            <th mat-header-cell *matHeaderCellDef>Op.</th>
            <td mat-cell *matCellDef="let element">
              <button
                mat-icon-button
                color="primary"
                aria-label="Update"
                (click)="dialogUpdate(element)"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <!-- <button
              mat-icon-button
              color="warn"
              aria-label="Delete"
            >
              <mat-icon>delete</mat-icon>
            </button> -->
            </td>
          </ng-container>

          <ng-container matColumnDef="code">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Código</th>
            <td mat-cell *matCellDef="let element">
              {{ element.code }}
            </td>
          </ng-container>
          <ng-container matColumnDef="licenseType">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Tipo</th>
            <td mat-cell *matCellDef="let element">
              {{ element.licenseType }}
            </td>
          </ng-container>

          <ng-container matColumnDef="total">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Total</th>
            <td mat-cell *matCellDef="let element">{{ element.total }}</td>
          </ng-container>

          <ng-container matColumnDef="tax">
            <th mat-header-cell *matHeaderCellDef>Impuesto</th>
            <td mat-cell *matCellDef="let element">{{ element.tax }}</td>
          </ng-container>

          <ng-container matColumnDef="discount">
            <th mat-header-cell *matHeaderCellDef>Descuento</th>
            <td mat-cell *matCellDef="let element">{{ element.discount }}</td>
          </ng-container>

          <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns; sticky: true"
          ></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <!-- Row shown when there is no matching data. -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="7">
              No data matching the filter {{ input.value }}
            </td>
          </tr>
        </table>
      </section>
      <mat-paginator
        [pageSizeOptions]="[25, 50, 100]"
        showFirstLastButtons
        aria-label="Select page of enterprises elements"
      >
      </mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
