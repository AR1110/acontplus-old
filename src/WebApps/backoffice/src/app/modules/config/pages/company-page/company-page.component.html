<app-breadcrumb />

<mat-card>
  <mat-card-content>
    <div class="row">
      <div class="col-6">
        <button (click)="openDialog()" mat-raised-button type="button">
          <mat-icon>add</mat-icon>
          Registrar
        </button>
      </div>
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
        <input
          matInput
          (keyup)="applyFilter($event)"
          class="form-control"
          placeholder="Buscar empresa"
          #input
        />
      </div>
    </div>
    <br />

      <section class="section-container-table" tabindex="0">
        <table mat-table [dataSource]="dataSource" matSort>
          <!-- Options -->
          <ng-container matColumnDef="op">
            <th mat-header-cell *matHeaderCellDef>Op.</th>
            <td mat-cell *matCellDef="let element">
              <button
                mat-button
                [matMenuTriggerFor]="configMenu"
                class="mat-small"
                color="primary"
              >
                <mat-icon>list</mat-icon>
              </button>
              <mat-menu #configMenu="matMenu">
                <button mat-menu-item (click)="dialogUpdate(element)">
                  <mat-icon>edit</mat-icon>
                  <span>Editar</span>
                </button>
                <button mat-menu-item (click)="scheduleConfig(element)">
                  <mat-icon>schedule</mat-icon>
                  <span>Horario</span>
                </button>
                <button
                  mat-menu-item
                  (click)="openDialogWhatsAppConfig(element)"
                >
                  <mat-icon
                    svgIcon="whatsapp"
                    style="color: #25d366"
                  ></mat-icon>
                  <span>Config. WhatsApp</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>

          <!-- Position Column -->
          <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nro.</th>
            <td mat-cell *matCellDef="let element">{{ element.position }}</td>
          </ng-container>

          <!-- IDCard Column -->
          <ng-container matColumnDef="idCard">
            <th mat-header-cell *matHeaderCellDef>RUC.</th>
            <td mat-cell *matCellDef="let element">{{ element.idCard }}</td>
          </ng-container>

          <!-- businessName Column -->
          <ng-container matColumnDef="businessName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              Razon Social
            </th>
            <td mat-cell *matCellDef="let element">
              {{ element.businessName }}
            </td>
          </ng-container>

          <!-- tradeName Column -->
          <ng-container matColumnDef="tradeName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              Nombre Fiscal
            </th>
            <td mat-cell *matCellDef="let element">
              {{ element.tradeName }}
            </td>
          </ng-container>

          <!-- Email Column -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Correo</th>
            <td mat-cell *matCellDef="let element">{{ element.email }}</td>
          </ng-container>

          <!-- Address Column -->
          <ng-container matColumnDef="address">
            <th mat-header-cell *matHeaderCellDef>Dirección</th>
            <td mat-cell *matCellDef="let element">{{ element.address }}</td>
          </ng-container>
          <ng-container matColumnDef="isActive">
            <th mat-header-cell *matHeaderCellDef>Estado</th>
            <td mat-cell *matCellDef="let element">
              <mat-slide-toggle
                class="example-margin"
                [color]="colorToggle"
                [checked]="element.isActive"
                [(ngModel)]="element.isActive"
                (change)="askToEnableDisable($event, element)"
              >
                Activa
              </mat-slide-toggle>
            </td>
          </ng-container>

          <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns; sticky: true"
          ></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <!-- Row shown when there is no matching data. -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="7">
              No data matching the filter {{ input.value }}
            </td>
          </tr>
        </table>
      </section>
      <mat-paginator
        #paginator
        [length]="totalRows"
        [pageIndex]="currentPage"
        [pageSize]="pageSize"
        [pageSizeOptions]="pageSizeOptions"
        (page)="pageChanged($event)"
        showFirstLastButtons
        aria-label="Select page"
      >
      </mat-paginator>
  </mat-card-content>
</mat-card>
