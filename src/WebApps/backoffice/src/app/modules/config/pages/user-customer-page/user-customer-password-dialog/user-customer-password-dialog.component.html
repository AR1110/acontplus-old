<form
  id="resetPasswordForm"
  [formGroup]="resetPasswordForm"
  (ngSubmit)="save()"
>
  <mat-dialog-content>
    <div class="row">
      <div class="col">
        <div class="form-group">
          <label class="form-label">Nombre Completo</label>
          <h5>{{ data.fullname }}</h5>
        </div>
        <div class="form-group">
          <label class="form-label">Usuario</label>
          <h5>{{ data.username }}</h5>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <div class="form-group">
          <label for="password">Nueva Contraseña:</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            class="form-control"
            maxlength="100"
            required
          />
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <div class="form-group">
          <label for="confirmPassword">Confirmar Contraseña:</label>
          <input
            type="password"
            id="confirmPassword"
            formControlName="confirmPassword"
            class="form-control"
            maxlength="100"
            required
          />
          @if (resetPasswordForm.hasError("matchValidator")) {
            <span class="text-danger">Las contraseñas no coinciden</span>
          }
        </div>
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions>
    <acp-mat-theme-button
      type="submit"
      variant="success"
      icon="save"
      text="Guardar"
      id="resetPasswordForm"
      [disabled]="resetPasswordForm.invalid"
    ></acp-mat-theme-button>
    <acp-mat-theme-button
      variant="dark"
      icon="close"
      text="Cancelar"
      (handleClick)="dialogClose()"
    ></acp-mat-theme-button>
  </mat-dialog-actions>
</form>
