<app-breadcrumb />

<div class="row mb-3">
  <div class="col-lg-6 col-md-6">
    <mat-card>
      <mat-card-content>
        <div class="row">
          <div class="col-md-12">
            <div class="d-flex no-block align-items-center">
              <div>
                <h3><i class="icon-screen-desktop"></i></h3>
                <p class="text-muted">TOTAL EMPRESAS</p>
              </div>
              <div class="ms-auto">
                <h2 class="counter text-primary">{{ totalCompanies }}</h2>
              </div>
            </div>
          </div>
          <div class="col-12">
            <div class="progress">
              <div
                class="progress-bar bg-primary"
                role="progressbar"
                style="width: 85%; height: 6px"
                aria-valuenow="25"
                aria-valuemin="0"
                aria-valuemax="100"
              ></div>
            </div>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
<div class="row">
  <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
    <mat-card>
      <mat-card-content>
        <div class="chart-container">
          <canvas id="licensesChart">{{ licensesChart }}</canvas>
        </div>
        <button
          (click)="exportLicensesToExcel()"
          class="btn btn-success mt-3"
          title="Exportar en Excel"
        >
          <mat-icon>download</mat-icon>
        </button>
      </mat-card-content>
    </mat-card>
  </div>
  <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
    <mat-card>
      <mat-card-content>
        <div class="chart-container">
          <canvas id="chartDocuments">{{ chartDocuments }}</canvas>
        </div>
        <button
          (click)="exportDocumentsToExcel()"
          class="btn btn-success mt-3"
          title="Exportar en Excel"
        >
          <mat-icon>download</mat-icon>
        </button>
      </mat-card-content>
    </mat-card>
  </div>
</div>
