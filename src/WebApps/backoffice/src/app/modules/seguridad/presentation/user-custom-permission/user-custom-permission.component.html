<app-breadcrumb />

<acp-mat-dynamic-card>
  <div class="d-grid gap-2">
    <div
      class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-1 row-cols-1 g-4"
    >
      <div class="col">
        <div class="hstack gap-2"></div>
      </div>
      <div class="col">
        <div class="d-flex flex-row gap-1 justify-content-end">
          <button mat-icon-button (click)="openAddEdit()" [disabled]="loading">
            <mat-icon>add</mat-icon>
          </button>
          <button mat-icon-button (click)="refresh()" [disabled]="loading">
            <mat-icon>refresh</mat-icon>
          </button>
        </div>
      </div>
    </div>

    <acp-mat-dynamic-table
      [tableData]="dataSource()"
      [columnDefinitions]="columnsDefs"
      [paginationConfig]="permissionsPagination"
      [enablePagination]="true"
      (pageEvent)="handlePageEvent($event)"
    >
    </acp-mat-dynamic-table>

    <ng-template #actionsTemplate let-item="item">
      <button mat-icon-button (click)="openAddEdit(item)">
        <mat-icon>edit</mat-icon>
      </button>
    </ng-template>
  </div>
</acp-mat-dynamic-card>
