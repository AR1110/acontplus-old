<app-breadcrumb />
<div class="my-2">
  <acp-mat-dynamic-card>
    <div class="d-grid gap-2">
      <div
        class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-1 row-cols-1 g-4"
      >
        <div class="col">
          <div class="hstack gap-2"></div>
        </div>
        <div class="col">
          <div class="d-flex flex-row gap-1 justify-content-end">
            <button
              mat-icon-button
              (click)="openDialog()"
              [disabled]="loading"
            >
              <mat-icon>add</mat-icon>
            </button>
            <button mat-icon-button (click)="refresh()" [disabled]="loading">
              <mat-icon>refresh</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="table-container small-table">
      <table mat-table [dataSource]="dataSource()" class="mat-elevation-z8">
        <ng-container matColumnDef="index">
          <th mat-header-cell *matHeaderCellDef>No.</th>
          <td mat-cell *matCellDef="let element">{{ element.index }}</td>
        </ng-container>

        <ng-container matColumnDef="op">
          <th mat-header-cell *matHeaderCellDef>Op.</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button (click)="onUpdate(element)">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef>Código</th>
          <td mat-cell *matCellDef="let element">{{ element.code }}</td>
        </ng-container>

        <!-- Weight Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let element">{{ element.name }}</td>
        </ng-container>

        <!-- Symbol Column -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let element">{{ element.description }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let element">
            <mat-slide-toggle
              [checked]="element.isActive"
              (change)="onisActive(element)"
            >
            </mat-slide-toggle>
          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns; sticky: true"
        ></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </acp-mat-dynamic-card>
</div>
