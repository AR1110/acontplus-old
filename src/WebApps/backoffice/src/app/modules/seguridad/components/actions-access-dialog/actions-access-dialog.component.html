<mat-dialog-content>
  <div class="row">
    <div class="col-xxl-4 col-xl-4 col-lg-4 col-md-4 col-sm-6 col-12">
      <div class="form-group">
        <label>Licencia:</label>
        <h5>{{ data.licenseType }}</h5>
      </div>
    </div>
    <div class="col-xxl-4 col-xl-4 col-lg-4 col-md-4 col-sm-6 col-12">
      <div class="form-group">
        <label>Rol:</label>
        <h5>{{ data.name }}</h5>
      </div>
    </div>
  </div>
  <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
    <mat-accordion [multi]="false">
      @for (item of menus; track $index) {
        <mat-expansion-panel (opened)="filterSubmenusAccordion(item.id)">
          <mat-expansion-panel-header>
            <mat-panel-title>
              {{ item.name }}
            </mat-panel-title>
          </mat-expansion-panel-header>

          <div class="table-responsive mt-2 my-custom-table">
            <table class="table">
              <thead>
                <tr>
                  <th>Id</th>
                  <th>Name</th>
                  <th>Options</th>
                </tr>
              </thead>
              <tbody>
                @for (submenu of submenusAccordion; track $index) {
                  <tr>
                    <td>{{ submenu.id }}</td>
                    <td>{{ submenu.name }}</td>
                    <td>
                      <button
                        type="button"
                        class="btn btn-outline-danger btn-sm m-l-5"
                        title="Eliminar de la lista"
                        (click)="askToDelete(submenu)"
                      >
                        <mat-icon>delete</mat-icon>
                      </button>
                      <button
                        type="button"
                        class="btn btn-outline-success btn-sm m-l-5"
                        title="Administrar Acciones"
                        (click)="onActionsOpen(submenu)"
                      >
                        <mat-icon>lock</mat-icon>
                      </button>
                    </td>
                  </tr>
                }
              </tbody>
            </table>
          </div>
        </mat-expansion-panel>
      }
    </mat-accordion>
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <acp-mat-theme-button
    variant="dark"
    icon="close"
    text="Cancelar"
    (handleClick)="close()"
  ></acp-mat-theme-button>
</mat-dialog-actions>
