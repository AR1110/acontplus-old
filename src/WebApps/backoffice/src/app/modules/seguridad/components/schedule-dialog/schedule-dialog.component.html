<form
  id="scheduleForm"
  [formGroup]="scheduleForm"
  (ngSubmit)="id > 0 ? update() : post()"
>
  <mat-dialog-content>
    <div class="row mt-4">
      <div class="col">
        <div class="form-floating">
          <select
            class="form-select"
            formControlName="dayId"
            id="dayId"
            aria-label="Seleccione el día"
          >
            <option selected>::SELECCIONE::</option>
            @for (item of days; track $index) {
              <option [value]="item.id">
                {{ item.name }}
              </option>
            }
          </select>
          <label for="dayId">DÍA</label>
        </div>
      </div>
    </div>
    <div class="row mt-4">
      <div class="col">
        <div class="form-floating mb-3">
          <input
            formControlName="startTime"
            id="floatingInput"
            type="time"
            class="form-control"
            placeholder="2024/03/21"
          />
          <label for="floatingInput">Fecha Inicio</label>
        </div>
      </div>
    </div>
    <div class="row mt-4">
      <div class="col">
        <div class="form-floating mb-3">
          <input
            formControlName="endTime"
            id="endTime"
            type="time"
            class="form-control"
            placeholder="2024/03/21"
          />
          <label for="endTime">Fecha Fin</label>
        </div>
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions>
    <acp-mat-theme-button
      type="submit"
      variant="success"
      text="Guardar"
      icon="save"
      id="scheduleForm"
      [disabled]="scheduleForm.invalid"
    ></acp-mat-theme-button>
    <acp-mat-theme-button
      variant="dark"
      text="Cancelar"
      icon="close"
      (handleClick)="dialogClose()"
    ></acp-mat-theme-button>
  </mat-dialog-actions>
</form>
