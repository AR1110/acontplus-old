<mat-dialog-content>
  <div class="form-group">
    <label>Código: </label>
    <input
      type="text"
      class="form-control"
      [(ngModel)]="data.codigo"
      required
    />
  </div>

  <div class="form-group">
    <label for="concepto">Concepto: </label>
    <textarea
      name="concepto"
      class="form-control"
      id="concepto"
      cols="30"
      rows="3"
      acpToUpperCase
      [(ngModel)]="data.concepto"
      required
    ></textarea>
  </div>

  <div class="row">
    <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
      <div class="form-group">
        <label>% Mínimo: </label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="data.porcentajeMin"
          required
        />
      </div>
    </div>
    <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
      <div class="form-group">
        <label>% Máximo: </label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="data.porcentajeMax"
          required
        />
      </div>
    </div>
  </div>

  <div class="form-group">
    <label for="status">Estado: </label>
    <mat-slide-toggle id="status" [(ngModel)]="data.estado"
      >Activo</mat-slide-toggle
    >
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <acp-mat-theme-button
    variant="success"
    icon="save"
    text="Guardar"
    (handleClick)="save()"
  >
  </acp-mat-theme-button>
  <acp-mat-theme-button
    variant="dark"
    icon="close"
    text="Cancelar"
    (handleClick)="dialogClose()"
  ></acp-mat-theme-button>
</mat-dialog-actions>
