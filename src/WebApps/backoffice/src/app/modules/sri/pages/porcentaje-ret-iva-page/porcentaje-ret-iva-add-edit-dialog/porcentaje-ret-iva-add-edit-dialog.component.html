<mat-dialog-content>
  <div class="form-group">
    <label>Código: </label>
    <input
      type="text"
      class="form-control"
      [(ngModel)]="data.codigo"
      required
    />
  </div>

  <div class="form-group">
    <label>Concepto: </label>
    <input
      type="text"
      class="form-control"
      acpToUpperCase
      [(ngModel)]="data.descripcion"
      required
    />
  </div>

  <div class="row">
    <div class="col-12">
      <div class="form-group">
        <label>% Mínimo: </label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="data.porcentaje"
          required
        />
      </div>
    </div>
  </div>

  <div class="form-group">
    <label for="status">Estado: </label>
    <mat-slide-toggle id="status" [(ngModel)]="data.estado"
      >Activo</mat-slide-toggle
    >
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <acp-mat-theme-button
    variant="success"
    icon="save"
    text="Guardar"
    (handleClick)="save()"
  ></acp-mat-theme-button>
  <acp-mat-theme-button
    variant="dark"
    icon="close"
    text="Cancelar"
    (handleClick)="dialogClose()"
  ></acp-mat-theme-button>
</mat-dialog-actions>
