<form [formGroup]="userManualForm" (ngSubmit)="onSave()">
  <mat-dialog-content>
    <div
      class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-4 row-cols-xxl-4 g-1"
    >
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Tipo:</mat-label>
          <mat-select
            formControlName="userManualTypeId"
            (selectionChange)="onUserManualTypeChange($event)"
          >
            @for (item of userManualTypes; track $index) {
              <mat-option [value]="item.id">{{ item.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Menu/Modulo:</mat-label>
          <mat-select
            formControlName="menuId"
            (selectionChange)="onMenuChange($event)"
          >
            @for (item of menus; track $index) {
              <mat-option [value]="item.id">{{ item.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      @if (menusFiltered.length > 0) {
        <div class="col">
          <mat-form-field class="w-100">
            <mat-label>Submenu/Submodulo:</mat-label>
            <mat-select
              formControlName="menuId"
              (selectionChange)="onSubmenuChange($event)"
            >
              <mat-option>Seleccione un submenu</mat-option>
              @for (item of menusFiltered; track $index) {
                <mat-option [value]="item.id">{{ item.name }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        </div>
      }
    </div>
    <div class="row">
      <div class="col-md-6 col-12">
        <mat-form-field class="w-100">
          <mat-label>Titulo:</mat-label>
          <input matInput formControlName="title" />
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <quill-editor
          formControlName="content"
          [modules]="modules"
          [styles]="{ height: '250px' }"
        ></quill-editor>
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions>
    <acp-mat-theme-button
      type="submit"
      variant="success"
      text="Guardar"
      icon="save"
      form="userManualForm"
      matStyle="raised"
      [disabled]="userManualForm.invalid"
    ></acp-mat-theme-button>
    <acp-mat-theme-button
      variant="dark"
      text="Cancelar"
      icon="close"
      (handleClick)="onClose()"
    ></acp-mat-theme-button>
  </mat-dialog-actions>
</form>
