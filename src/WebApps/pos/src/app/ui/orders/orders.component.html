<mat-card appearance="outlined">
  <mat-card-header class="m-2">
    <mat-card-title-group>
      <mat-card-title>Ordenes</mat-card-title>
      <div class="d-flex flex-row gap-2">
        @if($permissionStore.actions().crear){
          <button mat-icon-button (click)="navigateToPos()">
            <mat-icon>add</mat-icon>
          </button>
        }

        <button mat-icon-button (click)="$orderStore.handleChangeMoreFilter()">
          @if($orderStore.moreFilter()){
            <app-icon-filter-minus/>
          }@else{
          <app-icon-filter-plus/>
          }
        </button>

        <button mat-icon-button (click)="$orderStore.refresh()">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-content>
<!--    <app-order-list [dataSearch]="dataSearch" />-->
    <app-table-orders />
  </mat-card-content>
</mat-card>
