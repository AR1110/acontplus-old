<div class="d-grid gap-2">
  <div
    class="row row-cols-xxl-4 row-cols-xl-4 row-cols-lg-4 row-cols-md-3 row-cols-sm-2 row-cols-1 g-4"
  >
    <div class="col">
      <mat-form-field class="w-100">
        <mat-label>Sala/Piso</mat-label>
        <mat-select [(ngModel)]="dataSearch.roomId" (selectionChange)="handleFloorChange($event)">
          @for (item of rooms(); track $index) {
            <mat-option [value]="item.roomId">{{item.name}}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  </div>
@if(tables().length>0){
  <mat-tab-group animationDuration="0ms" [selectedIndex]="selectedIndex()"  (selectedIndexChange)="selectedIndex.set($event)">
    @for (item of tables(); track $index) {
    <mat-tab [label]="item.description">Content 1</mat-tab>
    }
  </mat-tab-group>

}
</div>
