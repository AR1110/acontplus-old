<app-custom-container-dialog
[containerTemplate]="containerTemplate"
[actionsTemplate]="actionsTemplate"
  [matDialogTitle]="'Pedidos'"
  (close)="closeDialog()"
  />


<ng-template #containerTemplate>
  <div class="d-grid gap-2">
    <div class="text-end">
      <button mat-icon-button (click)="$orderStore.handleChangeMoreFilter()">
          @if($orderStore.moreFilter()){
            <app-icon-filter-minus/>
          }@else{
            <app-icon-filter-plus/>
          }
      </button>
      <button mat-icon-button (click)="$orderStore.refresh()">
        <mat-icon>refresh</mat-icon>
      </button>
    </div>
    <app-table-orders
      (closeDialog)="closeDialog()"
      [isComingOfPos]="true"
    />

  </div>

</ng-template>

<ng-template #actionsTemplate>
  <button mat-raised-button (click)="closeDialog()">Cerrar</button>
</ng-template>
