<app-custom-container-dialog
  [containerTemplate]="containerTemplate"
  [actionsTemplate]="actionsTemplate"
  [matDialogTitle]="'Envío de notificación por Correo'"
  (close)="closeDialog()"
/>

<ng-template #containerTemplate>
  <p>Ingrese el o los correos destinatarios</p>
  @for (item of emails;track $index){
  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Correo</mat-label>
    <input
      type="email"
      matInput
      [id]="'email' + $index"
      [name]="'email' + $index"
      [(ngModel)]="emails[$index]"
      placeholder="Ej: example@gmail.com"
    />
    @if(emails.length!==1){
    <button mat-icon-button matSuffix (click)="removeEmail($event, $index)">
      <mat-icon>remove</mat-icon>
    </button>
    } @if(lastIndex===$index){
    <button mat-icon-button matSuffix (click)="addEmail($event)">
      <mat-icon>add</mat-icon>
    </button>
    }
  </mat-form-field>
  }
</ng-template>

<ng-template #actionsTemplate>
  <button mat-flat-button (click)="send()">
    <mat-icon fontIcon="send"></mat-icon>
    Enviar
  </button>
  <button mat-raised-button (click)="closeDialog()">Cerrar</button>
</ng-template>
