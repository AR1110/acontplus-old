<app-custom-container-dialog
  [containerTemplate]="body"
  [actionsTemplate]="footer"
  (close)="close()"
/>

<ng-template #body></ng-template>
<ng-template #footer>
  <button mat-flat-button (click)="send()" [disabled]="loading()">
    <mat-icon fontIcon="send"></mat-icon>
    Enviar
  </button>
  <button mat-raised-button (click)="close()">Cerrar</button>
</ng-template>
