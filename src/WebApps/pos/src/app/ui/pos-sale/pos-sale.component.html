<div class="pos-container">
  <div class="pos-header">

    <div class="pos-search-products">
      <div
        class="d-flex flex-row gap-1 justify-content-center align-items-center"
      >
        <mat-form-field class="w-100" style="border-radius: 12px;">
          <input
            matInput
            [ngModel]="dataItemSearch().textSearch"
            (keydown.enter)="onEnterInputSearch($event)"
            (blur)="onBlurTextSearch($event)"
            matTooltip="Presiona 'Enter' para buscar o haz clic en el botón recargar"
            [disabled]="loading()"
            placeholder="Buscar producto aqui..."
          />

          <button matSuffix   mat-icon-button
                  [disabled]="loading()"
                  aria-label="icon button refresh"
                  (click)="refresh()">
            <mat-icon>refresh</mat-icon>
          </button>

        </mat-form-field>
      </div>
    </div>
    <!-- Componente de categorías -->
    <div class="pos-categories">
      <div class="category-container">
        <app-categories
          [categories]="subCategorias()"
          (categorySelected)="onTabChange($event)"
        >
        </app-categories>
      </div>
    </div>


  </div>

  <!-- Contenedor del contenido de la página -->
  <div class="pos-content">
    <div class="pos-items-container">
      <!-- Cargar <app-promotions> solo si el índice es 2 -->
      @if(currentTabIndex===2){
      <ng-container>
        <app-promotions></app-promotions>
      </ng-container>
      }
      <!-- Cargar otros contenidos si el índice no es 2 -->
      @if(currentTabIndex!==2){
      <ng-container *ngTemplateOutlet="containerItems" />
      }
    </div>

    <ng-template #containerItems>
      @if(items().length === 0 && !loading()){
      <div class="d-flex h-100 justify-content-center align-items-center">
        <p>Sin Datos</p>
      </div>
      } @if(items().length > 0){
      <app-products [products]="items()"></app-products>

      }
    </ng-template>

    @if(items().length < dataPagination().totalRecords){
    <app-load-more
      [size]="'large'"
      [loading]="loading()"
      (loadMore)="onLoadMore()"
    />
    }
  </div>
</div>
