<div class="pos-container">
  <div class="pos-header">
    <!-- Componente de categorías -->
    <div class="pos-categories">
      <div class="category-container">
        <app-categories
          [categories]="subCategorias()"
          (categorySelected)="onTabChange($event)"
        >
        </app-categories>
      </div>
    </div>

    <div class="pos-search-products">
      <app-product-input-search />
    </div>
  </div>

  <!-- Contenedor del contenido de la página -->
  <div class="pos-content">
    <!-- <div class="pos-products-container">
      @for (item of items(); track $index) {
      <app-product-card [product]="item"> </app-product-card>

      }
    </div> -->
    @if (items().length>0) {

    <app-products [products]="items()"></app-products>

    <div class="pos-load-more">
      @if(items().length < dataPagination().totalRecords){
      <app-load-more
        [size]="'large'"
        [loading]="loading()"
        (loadMore)="onLoadMore()"
      />
      }
    </div>

    }
  </div>
</div>
