<div class="row my-2">
  <div
    class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12 d-flex align-items-center"
  >
    <mat-form-field class="w-100">
      <mat-label>Observación</mat-label>
      <textarea
        matInput
        appToUpperCase
        [ngModel]="obs()"
        (blur)="onBlurObs($event)"
        placeholder="..."
      ></textarea>
    </mat-form-field>
  </div>
  <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
    <div class="m-1 container-totals">
      <div [innerHTML]="htmlContentTotals()"></div>
    </div>
  </div>
</div>

<div class="grid-container">
  @if(orderId()>0){
  <button type="button" class="btn-pos btn-clean" (click)="clean()">
    Limpiar
  </button>

    @if($permissionStore.actions().editar){
      <button type="button" class="btn-pos btn-save" (click)="saveOrder()">
        Actualizar
      </button>

    }
  } @else {
  <button type="button" class="btn-pos btn-clean" (click)="clean()">
    Limpiar
  </button>

    @if($permissionStore.actions().crear){
      <button type="button" class="btn-pos btn-save" (click)="saveOrder()">
        Pedido
      </button>
    }

    @if($permissionStore.actions().create_invoice){
        <button type="button" class="btn-pos btn-invoice" (click)="saveInvoice()">
        Factura
      </button>


    }

    @if($permissionStore.actions().create_ne){
      <button
        type="button"
        class="btn-pos btn-delivery-note"
        (click)="saveNotaEntrega()"
      >
        Nota de Entrega
      </button>
    }
  }
</div>
