<app-custom-container-dialog
  [matDialogTitle]="'Mesas'"
  [containerTemplate]="body"
  [actionsTemplate]="actions"
  (close)="close()"
/>

<ng-template #body>
  <div class="mb-5">
    <mat-accordion multi>
      @for(node of roomTables();track $index){
      <mat-expansion-panel [expanded]="node.expanded">
        <mat-expansion-panel-header>
          <mat-panel-title>
            <div class="d-flex flex-row gap-1">
              <span
                class="node-label"
                [ngStyle]="{
                  'background-color': getColorForFloor(node.floorName),
                  'border-radius': '8px',
                  padding: '2px 6px'
                }"
                >{{ node.floorName }}</span
              >
              <span class="node-label">-</span>
              <span class="node-label">{{ node.roomName }}</span>
            </div>
          </mat-panel-title>
        </mat-expansion-panel-header>

        <!-- pos-categories.component.html -->
        <div class="pos-tables-container">
          <div class="pos-tables">
            @for (table of node.tables; track $index) {
            <div
              class="pos-table"
              [ngClass]="{
                'pos-table--active':
                  table.assigned || selectedOption() === table.id,
                'pos-table--disabled': table.isDisabled
              }"
              (click)="selectOption(table, node.roomName)"
            >
              <button
                mat-icon-button
                aria-label="Var pedidos"
                matTooltip="Ver pedidos"
                appActionOrderDialog
                [tableId]="table.id"
                [roomId]="node.roomId"
                class="button-order-view"
              >
                <mat-icon>launch</mat-icon>
              </button>




              <div class="vstack justify-content-center align-items-center" style="position: relative;top: -25px;">
                <div class="pos-table__text">{{ table.numberTable }}</div>
                <div class="pos-table__label">{{ table.description }}</div>
                <div>
                  <img src="img/round-table.png" width="32" height="32">
                </div>
              </div>

            </div>

            }


          </div>
        </div>

        <!-- <div class="button-grid">
          @for(table of node.tables;track table.id){
          <button
            class="button-card"
            [ngClass]="{
              selected: table.assigned || selectedOption() === table.id
            }"
            (click)="selectOption(table, node.roomName)"
          >
            @if(table.assigned || (selectedOption() === table.id)) {
            <button class="success-btn">&#10004;</button>
            }
            <div class="button-content">
              <span class="button-number">{{ table.numberTable }}</span>
              <span class="button-label">{{ table.description }}</span>
            </div>
            <div
              class="button-footer"
              appActionOrderDialog
              [tableId]="table.id"
            >
              <mat-icon>list</mat-icon>
              <span class="button-footer-text">Pedidos</span>
            </div>
          </button>

          }
        </div>  -->
      </mat-expansion-panel>
      }@empty {
      <p>Cargando...</p>
      }
    </mat-accordion>
  </div>
</ng-template>

<ng-template #actions>
  <button mat-flat-button (click)="closeDialog()">Cerrar</button>
</ng-template>
