@for(item of orderItems();track $index){
<app-cart
  [orderItem]="item"
  (onClickCartInfo)="onClickCartInfo($event)"
  (onClickRemove)="onClickRemove($event)"
  (onClickDecreaseQty)="onClickDecreaseQty($event)"
  (onClickIncreaseQty)="onClickIncreaseQty($event)"
  (changeInputQty)="changeInputQty($event)"
  [isSelectedItem]="isSelectedItem()"
/>
}
