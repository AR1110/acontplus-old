<!-- src/app/components/product-card/product-card.component.html -->
<div class="pos-product-card" (click)="onAddToCart($event)">
  <!-- Tag condicional basado en el tipo de tag del producto -->

  <div
    class="pos-product-card__tag"
    [ngClass]="{
      'pos-product-card__tag--popular': product.stock > 0,
      'pos-product-card__tag--offer': product.stock <= 0
    }"
    [style.background-color]="product.color || null"
  >
    <span class="pos-product-card__tag-icon"></span>
    {{ product.stock }}
  </div>

  <div class="pos-product-card__image-container">
    <img
      [src]="product.img"
      [alt]="product.name"
      class="pos-product-card__image"
    />
  </div>

  <div class="pos-product-card__info">
    <h3 class="pos-product-card__title">{{ product.descripcion }}</h3>
    <div class="pos-product-card__price-container">
      <span class="pos-product-card__price">
        {{ product.dataPvp.precioConIva | currency : "$" : "symbol" : "1.1-2" }}
        <!-- <span class="pos-product-card__price-size"></span> -->
      </span>
    </div>
  </div>
  <div
    class="pos-product-card__info-btn"
    cdkOverlayOrigin
    #trigger="cdkOverlayOrigin"
    (click)="infoProductCardToggle($event)"
  >
    <mat-icon style="color: var(--mdc-icon-button-icon-color)">info</mat-icon>
  </div>
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="infoProductCard()"
  class="info-product-card"
  hasBackdrop="true"
  cdkConnectedOverlay
  cdkConnectedOverlayPush="true"
  (overlayOutsideClick)="overlayOutsideClick($event)"
>
  <div class="info-product-card">
    <div class="row">
      <div class="col-12 text-start">
        <!-- Primera columna -->
        <div class="d-flex flex-column small">
          <div><span>Código:</span> {{ product.codigo }}</div>
          <div><span>Nombre:</span> {{ product.descripcion }}</div>
        </div>
      </div>
      <div class="col-12 text-start">
        <!-- Segunda columna -->
        <div class="d-flex flex-column small">
          <div><span>Iva:</span> {{ product.tipoIva }}</div>
          <div><span>Descripcion:</span> {{ product.summary }}</div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
