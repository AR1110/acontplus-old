<div class="d-flex flex-column gap-4">
  <div class="dashboard-widgets">
    @for (item of dashboardStore.documentCounts(); track $index) {
    <app-metric-card [metric]="item"></app-metric-card>
    }
  </div>
  <div class="dashboard-widgets">
    @for (item of dashboardStore.addedWidgets(); track $index) {
    <app-widget [data]="item"></app-widget>
    }
  </div>
</div>
