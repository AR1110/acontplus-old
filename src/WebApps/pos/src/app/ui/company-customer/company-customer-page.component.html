<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title>Clientes</mat-card-title>
      <div class="d-flex flex-row gap-2">
        <button mat-flat-button appActionCompanyCustomerAddEditModal>
          <mat-icon>add</mat-icon>
          Nuevo
        </button>
        <button mat-icon-button (click)="refresh()">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-content>
    <app-mat-dynamic-table
      [tableData]="data"
      [columnDefinitions]="columnsDefs"
      [visibleColumns]="columns"
      [templateOp]="templateOp"
      [paginationConfig]="pagination()"
      [enablePagination]="true"
      (onPageEvent)="handlePageEvent($event)"
      [isLoadingData]="isLoadingResults"
    >
    </app-mat-dynamic-table>

    <ng-template let-row #templateOp>
      <button
        mat-icon-button
        appActionCompanyCustomerAddEditModal
        [id]="row.idCliente"
        (onResult)="refresh()"
      >
        <mat-icon>edit</mat-icon>
      </button>
    </ng-template>

    <ng-template #statusTemplate let-item>
      <div [innerHTML]="item.estado | primaryStatus"></div>
    </ng-template>
  </mat-card-content>
</mat-card>
