<app-mat-dynamic-card>
  <div
    class="row row-cols-1 row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-2"
  >
    <div class="col">
      <h5>Clientes</h5>
    </div>
    <div class="col ">
      <div class="d-flex justify-content-end flex-row gap-2">
        <button [disabled]="isLoadingResults" mat-flat-button appActionCompanyCustomerAddEditModal>
          <mat-icon>add</mat-icon>
          Nuevo
        </button>
        <button mat-icon-button [disabled]="isLoadingResults" (click)="refresh()">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </div>
  </div>
  <app-mat-dynamic-table
    [tableData]="data"
    [columnDefinitions]="columnsDefs"
    [visibleColumns]="columns"
    [templateOp]="templateOp"
    [paginationConfig]="pagination()"
    [enablePagination]="true"
    (onPageEvent)="handlePageEvent($event)"
    [isLoadingData]="isLoadingResults"
  >
  </app-mat-dynamic-table>

  <ng-template let-row #templateOp>
    <button
      mat-icon-button
      appActionCompanyCustomerAddEditModal
      [id]="row.idCliente"
      (onResult)="refresh()"
    >
      <mat-icon>edit</mat-icon>
    </button>
  </ng-template>

  <ng-template #statusTemplate let-item>
    <div [innerHTML]="item.estado | primaryStatus"></div>
  </ng-template>
</app-mat-dynamic-card>
