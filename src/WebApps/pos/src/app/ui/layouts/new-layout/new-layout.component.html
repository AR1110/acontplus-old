<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #sidenav
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="!isMobile"
    class="sidenav"
  >
    <div class="sidenav-header">
      <img src="assets/logo.png" alt="Logo" class="logo" />
      <!-- <button mat-icon-button class="expand-button" (click)="sidenav.toggle()">
        <mat-icon>chevron_right</mat-icon>
      </button> -->
    </div>

    <mat-nav-list class="nav">
      @for (item of rootRoutes; track $index) {
      <!-- <a mat-list-item class="nav-item active" routerLink="">
        <div class="d-flex align-items-center gap-2">
          <mat-icon>home</mat-icon>
          <span>Dashboard</span>
        </div>
      </a> -->
      <a
        mat-list-item
        [routerLink]="item.path"
        #link="routerLinkActive"
        class="nav-item"
        routerLinkActive
        [class.active]="link.isActive"
        [activated]="link.isActive"
      >
        <div class="d-flex align-items-center gap-2">
          <mat-icon>{{ item.icon }}</mat-icon>
        </div>
      </a>
      }
    </mat-nav-list>

    <div class="sidenav-footer">
      <a
        mat-list-item
        class="nav-item"
        (click)="toggleTheme()"
        style="cursor: pointer"
      >
        <mat-icon>{{ isDarkMode ? "light_mode" : "dark_mode" }}</mat-icon>
      </a>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="toggleSidebar()">
        <mat-icon>menu</mat-icon>
      </button>
      <h1 class="greeting">Good morning, James!</h1>
      <span class="toolbar-spacer"></span>

      <!-- <button mat-icon-button [matMenuTriggerFor]="profileMenu">
        <img src="assets/profile.jpg" alt="" class="profile-image" />
      </button>
      <mat-menu #profileMenu="matMenu">
        <button mat-menu-item>Profile</button>
        <button mat-menu-item>Settings</button>
        <button mat-menu-item>Logout</button>
      </mat-menu> -->
      <button mat-button [matMenuTriggerFor]="userMenu">
        <mat-icon>person</mat-icon>
        <span fxShow fxHide.xs class="d-none d-xl-block d-lg-block">
          emilio
        </span>
      </button>
      <mat-menu
        #userMenu="matMenu"
        xPosition="before"
        yPosition="above"
        [overlapTrigger]="false"
      >
        <!-- <a mat-menu-item>
          <mat-icon>person</mat-icon>
          <span>Account</span>
        </a> -->

        <a mat-menu-item>
          <mat-icon>exit_to_app</mat-icon>
          <span>Cerrar sesión</span>
        </a>
      </mat-menu>
    </mat-toolbar>

    <div class="main-content">
      <router-outlet></router-outlet>
    </div>

    <!-- <div class="sidenav-scroll-wrapper">
      <div class="sidenav-content">
        <router-outlet></router-outlet>
      </div>
    </div> -->
  </mat-sidenav-content>
</mat-sidenav-container>
