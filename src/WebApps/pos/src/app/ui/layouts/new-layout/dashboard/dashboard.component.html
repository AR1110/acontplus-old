<div class="dashboard-container">
  <!-- Metrics Grid -->
  <div class="metrics-grid">
    @for (item of metrics; track $index) {
    <app-metric-card [metric]="item"></app-metric-card>

    }
  </div>

  <div class="dashboard-content">
    <!-- Main Content -->
    <div class="main-section">
      <!-- KPI Cards -->
      <div class="kpi-grid">
        <mat-card class="kpi-card">
          <mat-card-content>
            <h2>New clients</h2>
            <div class="kpi-value">
              <span class="number">54</span>
              <span class="percentage positive">+18.7%</span>
            </div>
          </mat-card-content>
        </mat-card>

        <mat-card class="kpi-card">
          <mat-card-content>
            <h2>Invoices overdue</h2>
            <div class="kpi-value">
              <span class="number">6</span>
              <span class="percentage negative">+2.7%</span>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
