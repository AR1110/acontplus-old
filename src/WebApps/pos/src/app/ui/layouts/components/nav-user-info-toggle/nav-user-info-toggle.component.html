<div
  class="d-flex flex-row justify-content-center align-items-center"
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
  (click)="isOverlayOpen.set(true)"
  [class.open]="isOverlayOpen()"
>
  <div class="d-flex flex-column justify-content-center align-items-center">
    <span class="company-name text-truncate">{{ entidadName() }}</span>
    <div class="estab-name text-truncate">
      {{ estabName() }}
    </div>
  </div>
  <div class="align-self-center">
    <mat-icon>arrow_drop_down</mat-icon>
  </div>
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="isOverlayOpen()"
  hasBackdrop="true"
  (overlayOutsideClick)="isOverlayOpen.set(false)"
>
  <!-- <div class="overlay-content">

  </div> -->
  <mat-card class="overlay-content">
    <mat-card-content class="m-0 p-0">
      <mat-form-field class="w-100">
        <mat-label>Establecimiento</mat-label>
        <mat-select [(ngModel)]="data().establecimientoId" disabled>
          @for(item of estabs();track $index){
          <mat-option [value]="item.idEstablecimiento">{{
            item.name
          }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field class="w-100">
        <mat-label>Punto Emisión</mat-label>
        <mat-select [(ngModel)]="data().puntoEmisionId" disabled>
          @for(item of puntosEmision();track $index){
          <mat-option [value]="item.idPuntoEmision">{{
            item.ptoEmi
          }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field class="w-100">
        <mat-label>Bodega</mat-label>
        <mat-select [(ngModel)]="data().bodegaId" disabled>
          @for(item of bodegas();track $index){
          <mat-option [value]="item.idBodega">{{
            item.descripcion
          }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </mat-card-content>
  </mat-card>
</ng-template>
