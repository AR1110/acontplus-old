<button mat-button [matMenuTriggerFor]="userMenu">
  <mat-icon>person</mat-icon>
  <span fxShow fxHide.xs class="d-none d-xl-block d-lg-block">
    {{ userName() }}
  </span>
</button>
<mat-menu
  #userMenu="matMenu"
  xPosition="before"
  yPosition="above"
  [overlapTrigger]="false"
>
  <!-- <a mat-menu-item>
    <mat-icon>person</mat-icon>
    <span>Account</span>
  </a> -->

  <a mat-menu-item (click)="logout()">
    <mat-icon>exit_to_app</mat-icon>
    <span>Cerrar sesión</span>
  </a>
</mat-menu>
