<app-custom-container-dialog
  [actionsTemplate]="actionsTemplate"
  [containerTemplate]="containerTemplate"
  [showHeader]="false"
/>
<ng-template #containerTemplate>
  <mat-form-field class="w-100">
    <mat-label>Establecimiento</mat-label>
    <mat-select [(ngModel)]="data().establecimientoId" disabled>
      @for(item of estabs();track $index){
      <mat-option [value]="item.idEstablecimiento">{{ item.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field class="w-100">
    <mat-label>Punto Emisión</mat-label>
    <mat-select [(ngModel)]="data().puntoEmisionId" disabled>
      @for(item of puntosEmision();track $index){
      <mat-option [value]="item.idPuntoEmision">{{ item.ptoEmi }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field class="w-100">
    <mat-label>Bodega</mat-label>
    <mat-select [(ngModel)]="data().bodegaId" disabled>
      @for(item of bodegas();track $index){
      <mat-option [value]="item.idBodega">{{ item.descripcion }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</ng-template>

<ng-template #actionsTemplate>
  <button type="button" mat-flat-button (click)="close()">Cerrar</button>
</ng-template>
