<mat-toolbar color="primary">
  <button mat-icon-button (click)="toggleSidenav.emit()">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="toolbar-spacer"></span>

  <div class="d-flex gap-1">
    <app-nav-user-info-toggle />

    @if(posStoreSvc.state().isModulePos){

    <button
      mat-icon-button
      aria-label="pedidos"
      appActionOrderDialog
      matTooltip="Pedidos Recientes"
    >
      <mat-icon>av_timer</mat-icon>
    </button>

    <button
      [matBadge]="totalOrderItems()"
      mat-icon-button
      aria-label="total"
      cdkOverlayOrigin
      #trigger="cdkOverlayOrigin"
      (click)="isOverlayOpen.set(!isOverlayOpen())"
    >
      <mat-icon>add_shopping_cart</mat-icon>
    </button>

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="trigger"
      [cdkConnectedOverlayOpen]="isOverlayOpen()"
      hasBackdrop="true"
      cdkConnectedOverlay
      cdkConnectedOverlayPush="true"
      [cdkConnectedOverlayPositionStrategy]="positionStrategy"
    >
      <app-cart-popup />
    </ng-template>
    }

    <app-nav-user-toggle />
  </div>
</mat-toolbar>
