    <app-icon-user

    @if (!sideNavCollapsed()) {
      <div class="header-text">
        <h2>{{ userName() }}</h2>
      </div>
    }

    <button
      class="d-block d-md-none hide-expanded-sidenav"
      mat-icon-button
      (click)="toggle.emit()"
    >
      <mat-icon aria-label="Close sidenav">close</mat-icon>
    </button>
  </div>

    @for (item of $permissionStore.submenus(); track $index) {
      <a
        mat-list-item
        [routerLink]="item.url"
        #link="routerLinkActive"
        class="nav-item"
        routerLinkActive
        [class.active]="link.isActive"
        [activated]="link.isActive"
      >
        <mat-icon
          [fontSet]="
            link.isActive ? 'material-icons' : 'material-icons-outlined'
          "
          matListItemIcon
          >{{ item.icon }}</mat-icon
        >
        @if (!sideNavCollapsed()) {
          <span matListItemTitle>{{ item.name }} </span>
        }
      </a>
    }
  </mat-nav-list>
</div>
