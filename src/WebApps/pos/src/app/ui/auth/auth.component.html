<section class="my-lg-14 my-8">
  <div class="container">
    <div class="row justify-content-center align-items-center">
      <!-- Left Column: Image Only -->
      <div class="col-lg-4 col-md-6 col-12 order-lg-1 order-2 text-center">
        <img
          src="/img/overview-sale.svg"
          alt="AcontPlus Overview"
          class="img-fluid d-none d-md-block mb-4 fade-in"
        />
      </div>

      <!-- Right Column: Login Form in Material Card -->
      <div class="col-lg-4 col-md-6 col-12 order-lg-2 order-1">
        <mat-card class="login-card fade-in">
          <!-- Card Title and Subtitle -->
          <mat-card-header class="text-center">
            <mat-card-title
              class="fw-bold fade-inDown"
            >
              AcontPlus Restaurante
            </mat-card-title>
            <mat-card-subtitle class="py-3">
              ¡Bienvenido! Ingresa para comenzar.
            </mat-card-subtitle>
          </mat-card-header>

          <!-- Card Content: Login Form -->
          <mat-card-content>
            <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
              <div class="mb-3">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Usuario</mat-label>
                  <input
                    matInput
                    placeholder="Usuario"
                    formControlName="username"
                  />
                </mat-form-field>
              </div>
              <div class="mb-4">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Contraseña</mat-label>
                  <input
                    [type]="hidePassword() ? 'password' : 'text'"
                    matInput
                    formControlName="password"
                    placeholder="Contraseña"
                  />
                  <button
                    type="button"
                    mat-icon-button
                    matSuffix
                    (click)="clickEvent($event)"
                    [attr.aria-label]="'Toggle password visibility'"
                  >
                    <mat-icon>{{
                      hidePassword() ? "visibility_off" : "visibility"
                    }}</mat-icon>
                  </button>
                </mat-form-field>
              </div>
              <div class="d-grid">
                <button
                  mat-raised-button
                  color="primary"
                  type="submit"
                  [disabled]="isLoading()"
                  class="w-100 text-uppercase rounded-pill"
                >
                  Ingresar
                  <mat-icon class="ms-2">exit_to_app</mat-icon>
                </button>
              </div>
            </form>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </div>
</section>
