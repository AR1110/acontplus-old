<mat-card class="shipping-card">
  <mat-card-header>
     <mat-card-title-group>
      <mat-card-title>Clientes</mat-card-title>
      <div class="d-flex flex-row gap-2">
        <button mat-flat-button appActionCompanyCustomerAddEditModal>
          <mat-icon >add</mat-icon>
          Nuevo
        </button>
        <button mat-icon-button (click)="refresh()">
          <mat-icon >refresh</mat-icon>
        </button>
      </div>
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-content> 
    <!-- setting outline form field appearance -->
    <app-custom-table-container
      [pagination]="pagination"
      [isLoadingResults]="isLoadingResults"
      (onPageEvent)="handlePageEvent($event)"
    >
      <table mat-table [dataSource]="data"
             matSort matSortActive="created" matSortDisableClear matSortDirection="desc">
        <!-- Number Column -->
        <ng-container matColumnDef="index">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let element; let i = index">
            {{ i + 1 }}
          </td>
        </ng-container>

        <ng-container matColumnDef="op">
          <th mat-header-cell *matHeaderCellDef>Op.</th>
          <td mat-cell *matCellDef="let row">
            <div class="d-flex flex-row gap-1">
              <button mat-icon-button appActionCompanyCustomerAddEditModal [id]="row.idCliente" (onResult)="refresh()">
                <mat-icon>edit</mat-icon>
              </button>
             <!-- <button mat-icon-button  color="error">
                <mat-icon>delete</mat-icon>
              </button>-->
            </div>

          </td>
        </ng-container>


        <!-- Title Column -->
        <ng-container matColumnDef="ruc">
          <th mat-header-cell *matHeaderCellDef>Ruc/Cédula</th>
          <td mat-cell *matCellDef="let row">{{row.numeroIdentificacion
            }}</td>
        </ng-container>

        <!-- State Column -->
        <ng-container matColumnDef="razonSocial">
          <th mat-header-cell *matHeaderCellDef>Razón Social</th>
          <td mat-cell *matCellDef="let row">{{row.razonSocial}}</td>
        </ng-container>

        <!-- Created Column -->
        <ng-container matColumnDef="nombreComercial">
          <th mat-header-cell *matHeaderCellDef>
            Nombre Comercial
          </th>
          <td mat-cell *matCellDef="let row">{{row.nombreComercial }}</td>
        </ng-container>

        <ng-container matColumnDef="direccion">
          <th mat-header-cell *matHeaderCellDef>Dirección</th>
          <td mat-cell *matCellDef="let row">{{row.direccion}}</td>
        </ng-container>

        <ng-container matColumnDef="correo">
          <th mat-header-cell *matHeaderCellDef>Correo</th>
          <td mat-cell *matCellDef="let row">{{row.correo}}</td>
        </ng-container>

        <ng-container matColumnDef="telefono">
          <th mat-header-cell *matHeaderCellDef>Teléfono</th>
          <td mat-cell *matCellDef="let row">{{row.telefono}}</td>
        </ng-container>

        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let row">
            <div [innerHTML]="row.estado | primaryStatus"></div>
          </td>
        </ng-container>


        <tr mat-header-row *matHeaderRowDef="displayedColumns;sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </app-custom-table-container>

  </mat-card-content>
</mat-card>
