<mat-autocomplete #auto="matAutocomplete">
  @if(isLoadingResults){
  <mat-option disabled style="display: flex;justify-content: center;align-items: center;">
    <mat-spinner diameter="35"></mat-spinner>
  </mat-option>
  }

  @for (state of filteredCustomers | async; track state) {
  <mat-option [value]="state.name" (onSelectionChange)="onSelectionChange(state)">
    <span>{{state.identificacionComprador}}</span> |
    <small>{{state.name}}</small>
  </mat-option>
  }
</mat-autocomplete>
@if (isAdvanced()){ 
<mat-form-field appearance="outline" class="m3-input-full-width">
  <mat-label>Cliente</mat-label>
  <input type="text"
         matInput
         [(ngModel)]="textName"
         [formControl]="control"
         [matAutocomplete]="auto">
  <button mat-icon-button matSuffix appActionCompanyCustomerAddEditModal>
    <mat-icon>add</mat-icon>
  </button>

  @if(id()>0){
  <button mat-icon-button matSuffix appActionCompanyCustomerAddEditModal [id]="id()">
    <mat-icon>edit</mat-icon>
  </button>
  }
</mat-form-field>
}

@if(isSimple()){
<mat-form-field appearance="outline" class="m3-input-full-width">
  <mat-label>Cliente</mat-label>
  <input type="text"
         matInput
         [formControl]="control"
         [matAutocomplete]="auto">
</mat-form-field>
}
