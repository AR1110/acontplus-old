<app-custom-table-container [pagination]="pagination()" [isLoadingResults]="isLoadingResults()"
  (onPageEvent)="handlePageEvent.emit($event)">
  <table mat-table [dataSource]="dataSource()" matSort matSortActive="created" matSortDisableClear matSortDirection="desc">
    <!-- Number Column -->
    <ng-container matColumnDef="index">
      <th mat-header-cell *matHeaderCellDef>#</th>
      <td mat-cell *matCellDef="let element; let i = index">
        {{ i + 1 }}
      </td>
    </ng-container>

    <ng-container matColumnDef="op">
      <th mat-header-cell *matHeaderCellDef>Op.</th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button [matMenuTriggerFor]="menu">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">

          @if(!isFinished()){
          <button mat-menu-item>
            <mat-icon>edit</mat-icon>
            <span>Editar</span>
          </button>
          }
          @if(!isFinished()){
          <button mat-menu-item (click)="askToAnul(row)">
            <mat-icon>delete</mat-icon>
            <span>Anular</span>
          </button>
          }

          @if(!isFinished()){
          <button mat-menu-item (click)="openOrderDivideDialog(row)">
            <mat-icon>check_circle</mat-icon>
            <span>Completar venta</span>
          </button>
          }
          <button mat-menu-item (click)="openOrderDocDialog(row)">
            <mat-icon>open_in_new</mat-icon>
            <span>Docs</span>
          </button>
          <button mat-menu-item (click)="getReport(row)">
            <mat-icon>get_app</mat-icon>
            <span>PDF</span>
          </button>

          <button mat-menu-item appActionWhatsappSend [params]="row">
            <mat-icon>share</mat-icon>
            <span>WhatsApp</span>
          </button>
        </mat-menu>

      </td>
    </ng-container>


    <!-- Title Column -->
    <ng-container matColumnDef="nroDoc">
      <th mat-header-cell *matHeaderCellDef>Nro. Doc.</th>
      <td mat-cell *matCellDef="let row">{{row.serie}}</td>
    </ng-container>

    <!-- State Column -->
    <ng-container matColumnDef="fechaEmision">
      <th mat-header-cell *matHeaderCellDef>Fecha Emisión</th>
      <td mat-cell *matCellDef="let row">{{row.createdAt}}</td>
    </ng-container>

    <!-- Created Column -->
    <ng-container matColumnDef="customer">
      <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
        Cliente
      </th>
      <td mat-cell *matCellDef="let row">
        {{row.razonSocialComprador}}
      </td>
    </ng-container>

    <ng-container matColumnDef="importeTotal">
      <th mat-header-cell *matHeaderCellDef>Total</th>
      <td mat-cell *matCellDef="let row">{{row.total}}</td>
    </ng-container>

    <ng-container matColumnDef="tableName">
      <th mat-header-cell *matHeaderCellDef>Mesa</th>
      <td mat-cell *matCellDef="let row">{{row.tableName}}</td>
    </ng-container>

    <ng-container matColumnDef="obs">
      <th mat-header-cell *matHeaderCellDef>Obs.</th>
      <td mat-cell *matCellDef="let row">{{row.obs}}</td>
    </ng-container>

    <ng-container matColumnDef="userName">
      <th mat-header-cell *matHeaderCellDef>Usuario</th>
      <td mat-cell *matCellDef="let row">{{row.userName}} </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="displayedColumns;sticky: true"></tr>
    <tr mat-row [ngClass]="{'custom-row-danger': row.deleted}" *matRowDef="let row; columns: displayedColumns;">
    </tr>

    <tr class="mat-row" *matNoDataRow class="text-center">
      <td class="mat-cell" colspan="9">Sin registro</td>
    </tr>

  </table>
</app-custom-table-container>
