
<app-custom-container-dialog
  [containerTemplate]="containerTemplate"
  [actionsTemplate]="actionsTemplate"
  [matDialogTitle]="'Detalle Personalizado'"
  (close)="closeDialog()"
/>

<ng-template #containerTemplate>
  <div class="mt-1"></div>
  <app-product-search
    [isSimple]="true"
    [labelText]="'Buscar Producto de Tipo Servicio'"
    (onSelect)="onSelectProduct($event)"
  />



  @if(orderItemCustom().productId>0){
  <div class="form-group">
    <mat-form-field class="m3-input-full-width" appearance="outline">
      <mat-label>Descripción personalizada</mat-label>
      <input matInput placeholder="..." [(ngModel)]="descriptionCustom" appToUpperCase>
    </mat-form-field>
  </div>


  <div class="d-flex justify-content-center align-items-center">
    <dl class="row">

      <dt class="col-sm-7">Código</dt>
      <dd class="col-sm-5">
        <h5>{{orderItemCustom().code}}</h5>
      </dd>


      <dt class="col-sm-7">Cantidad
      </dt>
      <dd class="col-sm-5">
        <h5>{{orderItemCustom().quantity}}</h5>
      </dd>



      <dt class="col-sm-7">Precio Unitario</dt>
      <dd class="col-sm-5">
        <h5>{{orderItemCustom().price}}</h5>
      </dd>

      <dt class="col-sm-7">Valor Iva</dt>
      <dd class="col-sm-5">
        <h5>{{orderItemCustom().taxValue}}</h5>
      </dd>

      <dt class="col-sm-7">Total</dt>
      <dd class="col-sm-5">
        <h3>{{importeTotal}}</h3>
      </dd>


    </dl>

  </div>
  }

</ng-template>


<ng-template #actionsTemplate>
  <button mat-flat-button color="primary" (click)="saveInvoice()">
    <mat-icon>save</mat-icon> Guardar como factura
  </button>
  <button mat-raised-button (click)="closeDialog()">Cerrar</button>
</ng-template>
