<mat-card style="border-radius: 0px">
  <mat-card-content>
    <app-categories-tab
      [tabs]="subCategorias()"
      [currentIndex]="currentTabIndex"
      (selectTab)="onTabChange($event)"
      [isLoading]="loading()"
    />

    <div class="my-2">
      <div class="row justify-content-between">
        <div class="col-xl-3 col-lg-3 col-md-6 col-sm-6 col-6">
          <mat-paginator
            [hidePageSize]="true"
            [showFirstLastButtons]="true"
            (page)="handlePageEvent($event)"
            [length]="dataPagination().totalRecords"
            [pageSize]="dataPagination().pageSize"
            [pageIndex]="dataPagination().pageIndex"
            aria-label="Select page"
          >
          </mat-paginator>
        </div>
        <div class="col-xl-3 col-lg-3 col-md-6 col-sm-6 col-6">
          <div class="d-flex flex-row gap-1">
            <input
              type="text"
              [ngModel]="dataItemSearch().textSearch"
              (keydown.enter)="onEnterInputSearch($event)"
              matTooltip="Presiona 'Enter' para buscar o haz clic en el botón recargar"
              [disabled]="loading()"
              class="form-control"
              placeholder="..."
              aria-label="Search Items "
            />
            <button
              mat-icon-button
              [disabled]="loading()"
              aria-label="icon button refresh"
              (click)="refresh()"
            >
              <mat-icon>refresh</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="pos-items-scroll" overlay-scrollbars>
      <div class="pos-items-container">
        <!-- Cargar <app-promotions> solo si el índice es 2 -->
        @if(currentTabIndex===2){
        <ng-container>
          <app-promotions></app-promotions>
        </ng-container>
        }
        <!-- Cargar otros contenidos si el índice no es 2 -->
        @if(currentTabIndex!==2){
        <ng-container *ngTemplateOutlet="containerItems" />
        }
      </div>

      <ng-template #containerItems>
        @if(items().length === 0 && loading()){
        <div class="d-flex h-100 justify-content-center align-items-center">
          <mat-spinner></mat-spinner>
        </div>
        } @if(items().length === 0 && !loading()){
        <div class="d-flex h-100 justify-content-center align-items-center">
          <p>Sin Datos</p>
        </div>
        } @if(items().length > 0){
        <app-items [items]="items()"></app-items>
        }
      </ng-template>
    </div>
  </mat-card-content>
</mat-card>
