<div class="row justify-content-center g-3 mt-1" style=" height: calc(98dvh - 80px - 100px);
     overflow: auto;">
  @for(item of items();track $index){
  <div class="col-xl-3  col-lg-3 col-md-4 col-sm-4 col-xs-6 col-6">
    <app-item-card
      [item]="item"
      (onSelect)="onSelect($event)"
      [isSelectedItem]="isSelectedItem()"
      [uniqueItemSelected]="uniqueItemSelected()"

    />
  </div>
  }
</div>
