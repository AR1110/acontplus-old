<div class="row">
  <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12 d-flex align-items-center">
    <div class="form-group">
      <textarea class="form-control " appToUpperCase [ngModel]="obs()" (blur)="onBlurObs($event)" rows="1"
        placeholder="Observación" ></textarea>
    </div>
  </div>
  <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">

    <div class="m-1">
      <div [innerHTML]="htmlContentTotals()"></div>
    </div>

  </div>
</div>

<div class="grid-container">
  <button type="button" class="btn-pos btn-clean" (click)="clean()">Limpiar</button>
  <button type="button" class="btn-pos btn-save " (click)="saveOrder()">Guardar</button>
  <button type="button" class="btn-pos  btn-invoice" (click)="saveInvoice()">Factura</button>
  <button type="button" class="btn-pos  btn-delivery-note" (click)="saveNotaEntrega()">Nota de Entrega</button>
</div>
