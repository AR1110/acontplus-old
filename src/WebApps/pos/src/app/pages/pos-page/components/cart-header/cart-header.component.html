<div class="d-flex flex-row gap-1 mb-2">
  <div class="form-group w-50">
    <select class="form-select" [ngModel]="userId()" (change)="onChangeVendedor($event)">
      @for(item of vendedores();track $index){
      <option [value]="item.idUsuario">{{item.nombreUsuario}}</option>
      }
    </select>
  </div>
  <div class="form-group w-50">
    <!-- <label>Mesa</label> -->
    <input type="button" [value]="tableDesc()" class="form-select" (click)="onClickTable()">
  </div>
</div>

<app-company-customer-search [isAdvanced]="true"/>
