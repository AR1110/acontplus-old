<form [formGroup]="form" (ngSubmit)="login()" class="form-horizontal form-material text-center">
  <!--Logo-->
  <a href="javascript:void(0)" class="db">
    <img src="./img/logo-icon.jpg" class="img-responsive" alt="Home" height="100" width="100" />
  </a>
  <div class="center">
    <h5>AcontPlus POS</h5>
  </div>
  <div class="center">
    <h6>Iniciar de Sesión</h6>
  </div>
  <div class="form-group mt-4">
    <div class="col-xs-12">
      <mat-form-field appearance="outline" class="m3-input-full-width">
        <mat-label>Usuario</mat-label>
        <input matInput placeholder="Usuario" formControlName="username">
        <!-- @if (form.controls.username.hasError('required')) {
          <mat-error>El usuario es <strong>requerido</strong></mat-error>
        } -->
      </mat-form-field>
    </div>
  </div>
  <div class="form-group">
    <div class="col-xs-12">
      <mat-form-field appearance="outline" class="m3-input-full-width">
        <mat-label>Contraseña</mat-label>
        <input [type]="hide() ? 'password' : 'text'" matInput formControlName="password" placeholder="Contraseña">
        <!-- @if (form.controls.password.hasError('required')) {
          <mat-error>La contraseña es <strong>requerido</strong></mat-error>
        } -->
        <button type="button" mat-icon-button matSuffix (click)="clickEvent($event)"
          [attr.aria-label]="'Hide password'">
          <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>
    </div>
  </div>

  <div class="form-group text-center m-t-20">
    <div class="col-xs-12">
      <button type="submit" mat-flat-button style=" height: 50px;" class="btn-lg w-100 text-uppercase btn-rounded">
        Ingresar
        <mat-icon>exit_to_app</mat-icon>
      </button>
    </div>
  </div>
</form>
