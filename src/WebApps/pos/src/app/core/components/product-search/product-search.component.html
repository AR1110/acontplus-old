@if (isAdvanced()){ 
<mat-form-field appearance="outline" class="m3-input-full-width">
  <mat-label>{{labelText()}}</mat-label>
  <input type="text"
         matInput
         [(ngModel)]="textName"
         [formControl]="control"
         [matAutocomplete]="auto"> 
</mat-form-field>
}

@if(isSimple()){
  <mat-form-field appearance="outline" class="m3-input-full-width">
    <mat-label>{{labelText()}}</mat-label>
    <input type="text"
           matInput
           [formControl]="control"
           [matAutocomplete]="auto">
  </mat-form-field>
}

<mat-autocomplete #auto="matAutocomplete">
  @if(isLoadingResults){
    <mat-option disabled style="display: flex;justify-content: center;align-items: center;">
        <mat-spinner diameter="35"></mat-spinner>
    </mat-option>
  }

    @for (state of filteredProducts | async; track state) {  
      <mat-option [value]="state.name" (onSelectionChange)="onSelectionChange(state)">
        <img alt="" class="example-option-img" [src]="state.s3ObjectUrl" height="30">
        <span>{{state.codigo}}</span> |
        <small>{{state.descripcion}}</small>
      </mat-option>
      
  }
</mat-autocomplete>
