<mat-card>
  <mat-card-content>
    <div class="button-grid">
      <button mat-raised-button class="value-money" (click)="appendValueMoney.emit(5)">+5</button>
      <button mat-raised-button class="value-money" (click)="appendValueMoney.emit(10)">+10</button>
      <button mat-raised-button class="value-money" (click)="appendValueMoney.emit(20)">+20</button>

      <button mat-raised-button (click)="onClickNumber.emit(7)">7</button>
      <button mat-raised-button (click)="onClickNumber.emit(8)">8</button>
      <button mat-raised-button (click)="onClickNumber.emit(9)">9</button>

      <button mat-raised-button (click)="onClickNumber.emit(4)">4</button>
      <button mat-raised-button (click)="onClickNumber.emit(5)">5</button>
      <button mat-raised-button (click)="onClickNumber.emit(6)">6</button>

      <button mat-raised-button (click)="onClickNumber.emit(1)">1</button>
      <button mat-raised-button (click)="onClickNumber.emit(2)">2</button>
      <button mat-raised-button (click)="onClickNumber.emit(3)">3</button>

      <button mat-raised-button (click)="onClickNumber.emit(0)">0</button>
      <button mat-raised-button (click)="onClickPunto.emit('.')">.</button>
      <button mat-raised-button color="warn" (click)="onClickClear.emit()">C</button>
    </div>
  </mat-card-content>
</mat-card>
