<mat-card>
  <mat-card-header>
    <mat-card-title>Ventas</mat-card-title>
  </mat-card-header>
  <mat-card-content>

    <div class="chart-container">
      <canvas baseChart width="600" height="300" [type]="'line'" [data]="lineChartData" [options]="lineChartOptions"
        [legend]="lineChartLegend">
      </canvas>
    </div>

  </mat-card-content>

</mat-card>
