<div class="hstack gap-3 my-2">
  <mat-form-field>
    <mat-label>Año</mat-label>
    <mat-select [(ngModel)]="dataSearch().anio" (selectionChange)="refresh()">
      @for(item of anios();track $index){
      <mat-option [value]="item">{{ item }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>

<div class="row gy-2">
  <div class="col-xxl-6 col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
    <app-sale-stats [sales]="sales()" />
  </div>
  <div class="col-xxl-6 col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
    <app-best-selling-product-stats
      [bestSellingProduct]="bestSellingProduct()"
    />
  </div>
</div>

<button
  class="float-button-custom-pink d-flex align-content-center"
  (click)="navigateToPos()"
>
  <mat-icon
    aria-hidden="false"
    aria-label="Example home icon"
    fontIcon="add"
  ></mat-icon>
  Crear Orden
</button>
