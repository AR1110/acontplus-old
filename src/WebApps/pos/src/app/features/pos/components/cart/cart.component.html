<div class="container-cart" [ngClass]="{'cart-loader-overlay': isSelectedItem()}">
  <section class="d-flex flex-row align-items-center p-2 mb-3 w-100">

    <img class="img-cart d-none d-sm-block" alt="item" [src]="orderItem().img" />

    <div class="d-flex flex-column flex-md-column flex-lg-row gap-1">
      <div class="d-flex flex-column flex-grow-1 mx-3">
        <div class=" lh-1">
          <span class="fw-bold" style="font-size: 0.72rem;">{{orderItem().descripcion}}</span>
        </div>

        <div class="d-flex flex-row   align-items-center gap-1 mt-2">
          <button type="button" [disabled]="orderItem().quantity===0" class="custom-btn-qty custom-btn-decrease" (click)="onClickDecreaseQty.emit(orderItem())">-</button>
          @if(!isEditing){
          <span class="mx-2 text-center" style="width: 25px;" (click)="editQuantity()">{{orderItem().quantity}}</span>
          }
          @if(isEditing){
          <input #quantityInput [(ngModel)]="quantity" appInputNumber class="custom-input-quantity" (blur)="saveQuantity()"
            (keydown.enter)="saveQuantity()">
          }
          <button type="button" class="custom-btn-qty custom-btn-increase" (click)="onClickIncreaseQty.emit(orderItem())">+</button>
        </div>
      </div>
      <div class="d-flex flex-column  justify-content-center align-items-center">
        <span class="price-small text-black-50">{{orderItem().price | currency}}</span>
        <span class="price">{{orderItem().precioTotalSinImpuesto | currency}}</span>
      </div>

    </div>

    <div class="btn-group-vertical-custom">
      <button class="btn-custom btn-delete-custom" (click)="onClickRemove.emit(orderItem())">
        &#120;
      </button>
      <button class="btn-custom btn-info-custom" (click)="onClickCartInfo.emit(orderItem())">
        &#8942;
      </button>
    </div>




  </section>
</div>
