<div class="d-flex flex-column gap-2">
  <div
    class="row row-cols-xxl-3 row-cols-xl-3 row-cols-lg-3 row-cols-md-3 row-cols-sm-3 row-cols-1 gx-2"
  >
    <mat-form-field>
      <mat-label>Usuario</mat-label>
      <mat-select
        [ngModel]="userId()"
        (selectionChange)="onChangeVendedor($event)"
      >
        @for(item of vendedores();track $index){
        <mat-option [value]="item.idUsuario">{{
          item.nombreUsuario
        }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Tarifa</mat-label>
      <mat-select
        [ngModel]="idTarifa()"
        (selectionChange)="onChangeTarifa($event)"
      >
        @for(item of tarifas();track $index){
        <mat-option [value]="item.idTarifa">{{ item.descripcion }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <button mat-stroked-button (click)="onClickTable()">
      {{ tableDesc() }}
    </button>
  </div>

  <app-company-customer-search
    [isAdvanced]="true"
    [isApplyGetId]="true"
    [textName]="order().customerName"
    [id]="order().customerCompanyId"
    (onSelect)="onSelectCustomerCompany($event)"
  />
</div>
