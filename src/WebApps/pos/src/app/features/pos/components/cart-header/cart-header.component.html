<div class="d-flex flex-row gap-1">
  <mat-form-field class="w-50">
    <mat-label>Usuario</mat-label>
    <mat-select
      [ngModel]="userId()"
      (selectionChange)="onChangeVendedor($event)"
    >
      @for(item of vendedores();track $index){
      <mat-option [value]="item.idUsuario">{{ item.nombreUsuario }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <button mat-stroked-button class="w-50" (click)="onClickTable()">
    {{ tableDesc() }}
  </button>
</div>

<app-company-customer-search
  [isAdvanced]="true"
  [isApplyGetId]="true"
  [textName]="order().customerName"
  [id]="order().customerCompanyId"
  (onSelect)="onSelectCustomerCompany($event)"
/>
