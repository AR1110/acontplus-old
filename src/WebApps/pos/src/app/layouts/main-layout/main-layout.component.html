<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav "   fixedInViewport [mode]="'over'" [opened]="false"
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'">
    <!-- Sidebar cerrado por defecto -->

    <div class="d-flex flex-column h-100">
      <mat-toolbar class="d-flex justify-content-between">

        <span>Menu</span>
        <!-- Botón para cerrar el sidebar, visible solo cuando el drawer está abierto -->
        @if(drawer.opened){

        <button mat-icon-button (click)="drawer.close()">
          <mat-icon aria-label="Close sidenav">close</mat-icon>
        </button>

        }
      </mat-toolbar>

      <mat-nav-list class="flex-grow-1">
        @for (item of rootRoutes; track $index) {
        <a mat-list-item [routerLink]="item.path" #link="routerLinkActive" routerLinkActive [activated]="link.isActive">
          {{ item.title }}
        </a>
        }

      </mat-nav-list>

      <!-- Footer en el sidenav -->
      <div class="align-self-end">
        <mat-toolbar >
          <span></span>

          <button mat-icon-button aria-label="High" (click)="changeTheme()">
            @if(isDark()){
              <mat-icon>brightness_low</mat-icon>
            }
            @else {
              <mat-icon>brightness_high</mat-icon>

            }
          </button>
        </mat-toolbar>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">

      <button type="button" aria-label="Toggle sidenav" mat-icon-button (click)="drawer.toggle()">
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
      <span class="d-none d-xl-block d-lg-block">AcontPlus POS</span>

      <span class="navbar-spacer"></span>

      <app-nav-user-info-toggle></app-nav-user-info-toggle>

      <!-- <button mat-icon-button [matMenuTriggerFor]="notificationMenu">
        <mat-icon matBadge="2" matBadgeColor="accent">notifications</mat-icon>
      </button>
      <mat-menu #notificationMenu="matMenu" xPosition="before" yPosition="above" [overlapTrigger]="false">
        <a mat-menu-item>
          <span>You have new tasks</span>
        </a>
        <a mat-menu-item>
          <span>You have a new message</span>
        </a>
      </mat-menu> -->

      <app-nav-user-toggle></app-nav-user-toggle>
    </mat-toolbar>

    <div class="sidenav-scroll-wrapper">
      <div class="sidenav-content">
        <router-outlet></router-outlet>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
