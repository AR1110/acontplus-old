<app-custom-container-dialog [containerTemplate]="containerTemplate" [actionsTemplate]="actionsTemplate"
  [matDialogTitle]="'Cobro'" (close)="closeDialog()" />

<ng-template #containerTemplate>


  <app-custom-table-container   >
    <table mat-table [dataSource]="dataSource()" matSort matSortActive="created" matSortDisableClear
      matSortDirection="desc">
      <!-- Number Column -->
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let element; let i = index">
          {{ i + 1 }}
        </td>
      </ng-container>

      <ng-container matColumnDef="op">
        <th mat-header-cell *matHeaderCellDef>Op.</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button aria-label="Clear"
          class="text-danger"
          (click)="deleteRow(row)"

          >
            <mat-icon>clear</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- State Column -->
      <ng-container matColumnDef="fechaEmision">
        <th mat-header-cell *matHeaderCellDef>Fecha Emisión</th>
        <td mat-cell *matCellDef="let row">{{row.fechaEmision}}</td>
      </ng-container>

      <!-- Created Column -->
      <ng-container matColumnDef="entidadFinanciera">
        <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
          Subentidad Financiera
        </th>
        <td mat-cell *matCellDef="let row">
          {{row.subentidadFinanciera}}
        </td>
      </ng-container>

      <ng-container matColumnDef="valor">
        <th mat-header-cell *matHeaderCellDef>Valor</th>
        <td mat-cell *matCellDef="let row">{{row.valorAbono}}</td>
      </ng-container>

      <ng-container matColumnDef="abono">
        <th mat-header-cell *matHeaderCellDef>Abono</th>
        <td mat-cell *matCellDef="let row">{{row.abonoCuota}}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns;sticky: true"></tr>
      <tr mat-row  *matRowDef="let row; columns: displayedColumns;">
      </tr>

      <tr class="mat-row" *matNoDataRow class="text-center">
        <td class="mat-cell" colspan="9">Sin registro</td>
      </tr>

    </table>
  </app-custom-table-container>




</ng-template>


<ng-template #actionsTemplate>
  <button mat-raised-button (click)="closeDialog()">Cerrar</button>

</ng-template>
