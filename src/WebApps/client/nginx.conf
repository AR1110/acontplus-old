server {
    listen 80;
    server_name client.acontplus.com;

    # Raíz del sitio
    root /usr/share/nginx/html;  # Cambia a la ruta de tu sitio Angular
    index index.html;

    # Content Security Policy
    add_header Content-Security-Policy "default-src https: data: 'unsafe-inline' 'unsafe-eval'; frame-src 'self' https://app.acontplus.com https://client.acontplus.com;" always;

    # Manejo de rutas de Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché para archivos estáticos
    location ~* \.(?:ico|css|js|gif|jpg|jpeg|png|svg|woff|woff2|ttf|otf|eot|ttf|ttc|map)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Página de error 404 redirige a index.html (útil para Angular)
    error_page 404 /index.html;
}
