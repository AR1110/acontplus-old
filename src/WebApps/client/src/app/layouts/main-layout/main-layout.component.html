<mat-sidenav-container class="sidenav-container">
  @if(isHandset$ |async){
    <mat-sidenav
      #sidenav
      class="sidenav"
      opened
      [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
      [mode]="'side'"
      opened
      [style.width]="sidenavWidth()"
      style="border-radius: 0px"
    >
      <app-sidebar [collapsed]="collapsed()" (toggle)="sidenav.toggle()" />
    </mat-sidenav>
  }@else {
    <mat-sidenav
      #sidenav
      class="sidenav"
      fixedInViewport
      [mode]="'over'"
      [opened]="false"
      [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
      style="border-radius: 0px"
    >
      <app-sidebar [collapsed]="collapsed()" (toggle)="sidenav.toggle()" />
    </mat-sidenav>
  } @if(isHandset$ |async){
  <mat-sidenav-content [style.margin-left]="sidenavWidth()">
    <app-header (toggleSidenav)="toggleSidenav()"></app-header>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
}@else {
  <mat-sidenav-content>
    <app-header (toggleSidenav)="sidenav.toggle()"></app-header>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
}
</mat-sidenav-container>
