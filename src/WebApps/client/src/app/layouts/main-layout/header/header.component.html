<mat-toolbar class="header">

  <div class="header__title">
    <button class="header__title-button" mat-mini-fab (click)="openMenu()">
      @if (isMenuOpened) {
      <mat-icon   class="header__title-button-icon">arrow_back</mat-icon>
      }@else{
      <mat-icon  class="header__title-button-icon">menu</mat-icon>

      }
    </button>
    <h6 class="header__title-text">AcontPlus</h6>
  </div>
  <div class="header-toolbar">
    <app-search></app-search>
    <app-notifications></app-notifications>
    <app-email [emails]="emails()"></app-email>
    <app-user [user]="user$ | async" (signOut)="signOut()"></app-user>
  </div>

</mat-toolbar>
