<app-breadcrumb />
<acp-dynamic-card>
  <div
    class="row row-cols-1 row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-2"
  >
    <div class="col">
      <mat-form-field class="w-100">
        <mat-select (selectionChange)="onMenuChange($event)" id="menuId">
          <mat-option>Seleccione un módulo</mat-option>
          @for (item of modules(); track $index) {
            <mat-option [value]="item.id">{{ item.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
    <div class="col">
      <mat-form-field class="w-100">
        <mat-label>Buscar</mat-label>
        <input matInput placeholder="Buscar" [(ngModel)]="data.textSearch" />
        <ng-container matSuffix>
          <button mat-icon-button (click)="refresh()">
            <mat-icon>refresh</mat-icon>
          </button>
        </ng-container>
      </mat-form-field>
    </div>
  </div>

  <div class="content-wrapper mt-2">
    <!-- Tree Menu -->
    <div class="menu-section">
      <mat-tree [dataSource]="manualTree()" [childrenAccessor]="childrenAccessor" class="tree-menu">
        <mat-tree-node *matTreeNodeDef="let node">
          <button mat-icon-button [style.visibility]="'hidden'"></button>
          <button
            mat-button
            class="menu-item"
            [class.selected]="selectedNode === node"
            (click)="selectNode(node)"
          >
            <mat-icon>play_circle_outline</mat-icon>
            <span style="font-size: 10px; width: fit-content; padding-left: 5px">{{
              node.title
            }}</span>
          </button>
        </mat-tree-node>

        <mat-tree-node *matTreeNodeDef="let node; when: hasChild" matTreeNodePadding>
          <button
            mat-icon-button
            matTreeNodeToggle
            [attr.aria-label]="'Toggle ' + node.name"
            class="toggle-button"
          >
            <mat-icon class="mat-icon-rtl-mirror">
              {{ isExpanded(node) ? 'expand_more' : 'chevron_right' }}
            </mat-icon>
          </button>
          <button mat-button class="menu-item category" (click)="toggleNode(node)">
            <mat-icon>folder</mat-icon>
            {{ node.name }}
          </button>
        </mat-tree-node>
      </mat-tree>
    </div>

    <!-- Video Content -->
    <div class="video-section">
      @if (selectedNode) {
        <acp-dynamic-card [cardTitle]="selectedNode.title" [isHeaderVisible]="true">
          <quill-view [content]="selectedNode.safeEmbedCode" theme="snow" [sanitize]="true" />
        </acp-dynamic-card>
      }
    </div>
  </div>

  <section>
    <mat-paginator
      #paginator
      (page)="onPageChanged($event)"
      [length]="pagination().totalRecords"
      [pageIndex]="pagination().pageIndex"
      [pageSizeOptions]="pagination().pageSizeOptions"
      [pageSize]="pagination().pageSize"
      [showFirstLastButtons]="true"
      aria-label="Select page"
    />
  </section>
