<app-breadcrumb />

<mat-card>
  <mat-card-content>

    <div class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-1 row-cols-1 g-1">

      <div class="col">
        <div class="w-17">
          <div class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-1 row-cols-1 g-2">
            <div class="col">
              <div class="form-group">
                <label for="estab">Estab:</label>
                <select name="" id="" class="form-select"></select>
              </div>
            </div>
            <div class="col">
              <div class="form-group">
                <label for="dateRange">Rango Fecha</label>
                <app-date-range-selection (onChangeDateRange)="onDateRangeSelection($event)"
                  [inputGroupDateChecked]="true" [requiredDate]="true" />
              </div>
            </div>
          </div>
        </div>

      </div>
      <div class="col  ">
        <div class="d-flex flex-row gap-2 justify-content-end">
          <button mat-flat-button appMeasureAddEdit (onResultModal)="refresh()">
            <mat-icon>add</mat-icon>
            Nuevo
          </button>
          <button mat-icon-button (click)="refresh()">
            <mat-icon>refresh</mat-icon>
          </button>
          <button mat-icon-button (click)="isSearchAdvanced.set(!isSearchAdvanced())">
            <mat-icon>filter_list</mat-icon>
          </button>
        </div>
      </div>

    </div>


    <app-custom-table-container [pagination]="pagination()" [isLoadingResults]="isLoadingResults()"
      (onPageEvent)="handlePageEvent($event)">

      <app-mat-dynamic-table [templateOp]="templateOp" [dataList]="dataSource.data" [displayColumnDefs]="columnsDefs"
        [displayedColumns]="columns"></app-mat-dynamic-table>

    </app-custom-table-container>

    <ng-template #templateOp let-item="item">
      <button mat-icon-button [matMenuTriggerFor]="menu" aria-hidden="false">
        <mat-icon>more_vert</mat-icon>
      </button>

      <mat-menu #menu="matMenu">



        <button mat-menu-item>
          <mat-icon>clear</mat-icon>
          <span>Anular</span>
        </button>

        <button mat-menu-item>
          <mat-icon>file_copy</mat-icon>
          <span>Duplicar</span>
        </button>

        <button mat-menu-item>
          <mat-icon>payment</mat-icon>
          <span>Cobro</span>
        </button>

        <button mat-menu-item>
          <mat-icon>list_alt</mat-icon>
          <span>Cuota</span>
        </button>

        <button mat-menu-item>
          <mat-icon>swap_horiz</mat-icon>
          <span>Convertir a FV</span>
        </button>
        <button mat-menu-item>
          <mat-icon> attach_money</mat-icon>
          <span>Cuenta por cobrar</span>
        </button>

        <button mat-menu-item [matMenuTriggerFor]="shared">
          <mat-icon>share</mat-icon>
          <span>Compartir</span>
        </button>


      </mat-menu>
      <button mat-icon-button matTooltip="Editar">
        <mat-icon>edit</mat-icon>
      </button>

      <button mat-icon-button matTooltip="Imprimir">
        <mat-icon>print</mat-icon>
      </button>
      <button mat-icon-button matTooltip="Descargar">
        <mat-icon>save_alt</mat-icon>
      </button>

    </ng-template>

    <mat-menu #shared="matMenu">
      <button mat-menu-item>Correo</button>
      <button mat-menu-item>WhatsApp</button>
    </mat-menu>


  </mat-card-content>
</mat-card>
