<app-mat-custom-dialog
(close)="closeDg()"
>
  <div ngProjectAs="content">
    <div class="row">
      <div class="col-xxl-4 col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
        <mat-form-field class="w-100">
          <mat-label>Establecimiento</mat-label>
          <mat-select>
            <mat-option>1</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-xxl-2 col-xl-2 col-lg-4 col-md-6 col-sm-12 col-12">
        <mat-form-field class="w-100">
          <mat-label>Punto Emisión</mat-label>
          <mat-select>
            <mat-option>1</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="col-xxl-2 col-xl-2 col-lg-4 col-md-6 col-sm-12 col-12">
        <mat-form-field class="w-100">
          <mat-label>Fecha de Caducidad:</mat-label>
          <input matInput [matDatepicker]="issueDate" [(ngModel)]="dataForm.issueDate" />
          <mat-hint>MM/DD/YYYY</mat-hint>
          <mat-datepicker-toggle matIconSuffix [for]="issueDate"></mat-datepicker-toggle>
          <mat-datepicker #issueDate></mat-datepicker>
        </mat-form-field>
      </div>

      <div class="col-xxl-4 col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
        <app-company-customer-search [isAdvancedMode]="true" />
      </div>
    </div>

<!-- start   row products-->
    <div class="row">
      <div class="col-xl-8 col-lg-8 col-md-12 col-sm-12 col-12">
        <div class="row">
          <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
            <mat-form-field class="w-100">
              <input matInput placeholder="Search... (Ctrl + K)" readonly (click)="openSearch()" tabindex="0" />
              <ng-container matSuffix>
                <button mat-icon-button (click)="openSearch()">
                  <mat-icon>search</mat-icon>
                </button>
                <button mat-icon-button appAddEditProduct>
                  <mat-icon>add</mat-icon>
                </button>
              </ng-container>
            </mat-form-field>
          </div>
          <div class="col-xl-3 col-lg-3 col-md-12 col-sm-12 col-12">
            <mat-form-field class="w-100">
              <input matInput placeholder="Search by code..."  />

            </mat-form-field>
          </div>
        </div>
      </div>
      <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 col-12">
        <div class="row justify-content-end">
          <div class="col-xl-5 col-lg-5 col-md-6 col-sm-12 col-12">
            <mat-form-field class="w-100">
              <mat-label>Bodega</mat-label>
              <mat-select>
                <mat-option>1</mat-option>
              </mat-select>
            </mat-form-field>
          </div>

          <div class="col-xl-5 col-lg-5 col-md-6 col-sm-12 col-12">
            <mat-form-field class="w-100">
              <mat-label>Tarifa</mat-label>
              <mat-select>
                <mat-option>1</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
      </div>
    </div>
<!--    end row products -->

<!--    start details-->
    <app-tabulator
      [columnNames]="columns()"
      [tableData]="details()"
      [options]="{
        height: '100%',
        dataTreeSelectPropagate: false,
      }"
      (cellEdited)="cellEdited($event)"
    />
<!--    end details-->

<!--    start footer-->
    <div class="row">
      <div class="col-xxl-6 col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <div class="vstack gap-2">
          <mat-form-field class="w-100">
            <mat-label>Observación</mat-label>
            <textarea matInput placeholder="Ex. It makes me feel..."></textarea>
          </mat-form-field>
          <app-data-grid
            [data]="additionalInfo()"
          [columns]="columnsAdditionalInfo"
            [showPaginator]="false"
          ></app-data-grid>
        </div>
      </div>
      <div class="col-xxl-6 col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">

      </div>
    </div>
<!--    end footer-->

  </div>
  <div ngProjectAs="actions"></div>

</app-mat-custom-dialog>
