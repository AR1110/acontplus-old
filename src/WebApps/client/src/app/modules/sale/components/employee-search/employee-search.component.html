@if(isSearchSimple){
<input
  id="typeahead-supplier"
  type="text"
  class="form-control"
  [(ngModel)]="textSearch"
  [ngbTypeahead]="search"
  [resultTemplate]="rtSuppliers"
  [class.is-invalid]="searchFailed"
  (selectItem)="onSelect($event)"
  onclick="select();"
  (keyup)="onKeyupSearch()"
  placeholder="Ej. Jorge"
/>
@if (searching) {
<small class="form-text text-muted">Buscando...</small>
} @if (searchFailed) {
<div class="invalid-feedback">
  Lo sentimos, no se han podido cargar las sugerencias.
</div>
} }

<ng-template #rtSuppliers let-r="result" let-t="term">
  <ngb-highlight
    [result]="r.nroIdentificacion + ' - ' + r.nombreCompleto"
    [term]="t"
  />
</ng-template>
