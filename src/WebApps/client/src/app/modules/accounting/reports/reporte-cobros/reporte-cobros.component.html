<app-breadcrumb />

<div class="card">
    <div class="card-body">
        <div class="row">
            <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6 col-12">
                <div class="mb-3">
                    <div class="icheck-primary">
                        <input type="radio" id="pxDocumento" 
                            [(ngModel)]="dataSearch.pxDocumento"
                            [value]="true"
                            name="pxDocumento" />
                        <label for="pxDocumento">Por Documento</label>
                    </div>
                </div>
            </div>

            <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6 col-12">
                <div class="mb-3">
                    <div class="icheck-primary">
                        <input type="radio" id="pxCuotas" [(ngModel)]="dataSearch.pxDocumento" 
                        [value]="false"
                        name="pxCuotas" />
                        <label for="pxCuotas">Por Cuotas</label>
                    </div>
                </div>
            </div>

            <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6 col-12">
                <div class="mb-3">
                    <div class="icheck-primary">
                        <input type="checkbox" id="isUseDate" [(ngModel)]="dataSearch.isUseDate" name="isUseDate" />
                        <label for="isUseDate">Por Fechas</label>
                    </div>
                </div>
            </div>
        </div>
        <hr>
        <div class="row">
            <div class="col-xxl-3 col-xl-3 col-lg-3 col-sm-6">
                <div class="mb-3">
                    <label for="disabledSelect" class="form-label">Tipo Documento: </label>
                    <select name="tipoDoc" id="tipoDoc" class="form-select form-control-border"
                        [(ngModel)]="dataSearch.codDoc">
                        <option value="">Todos</option>
                        @for (item of tiposDoc; track $index) {
                        <option [ngValue]="item.codDoc">{{ item.descripcion }}</option>
                        }
                    </select>
                </div>
            </div>
            <div class="col-xxl-3 col-xl-3 col-lg-3 col-sm-6">
                <div class="mb-3">
                    <label for="disabledSelect" class="form-label">Establecimiento: </label>
                    <select class="form-select form-control-border" [(ngModel)]="dataSearch.codEstab"
                        (change)="onChangeEstab()">
                        @for(estab of establecimientos; track $index ){
                        <option [ngValue]="estab.codEstab">
                            {{ estab.nombreComercial }}
                        </option>
                        }
                    </select>
                </div>
            </div>
            <div class="col-xxl-3 col-xl-3 col-lg-3 col-sm-6">
                <div class="mb-3">
                    <label for="disabledSelect" class="form-label">Punto Emisión: </label>
                    <select class="form-select form-control-border" [(ngModel)]="dataSearch.idPuntoEmision">
                        <option [ngValue]="0">Todos</option>
                        @for(ptoEmi of puntosEmision; track $index ){
                        <option [ngValue]="ptoEmi.idPuntoEmision">
                            {{ ptoEmi.ptoEmi }}
                        </option>
                        }
                    </select>
                </div>
            </div>
            <div class="col-xxl-3 col-xl-3 col-lg-3 col-sm-6">
                <div class="mb-3">
                    <label for="disabledSelect" class="form-label">Formas de Pagos: </label>
                    <select class="form-select form-control-border" [(ngModel)]="dataSearch.idSubEntidadFinanciera">
                        <option [ngValue]="0">Todos</option>
                        @for(estab of subEntidadFinanciera; track $index ){
                        <option [ngValue]="estab.idEntidadFinanciera">
                            {{ estab.descripcion }}
                        </option>
                        }
                    </select>
                </div>
            </div>
        </div>
        <div class="row">
            @if (dataSearch.isUseDate) {
            <div class="col-xxl-3 col-xl-3 col-lg-3 col-sm-6">
                <div class="mb-3">
                    <label for="dateRange" class="form-label">Rango de Fechas:</label>
                    <app-date-range-selection (onChangeDateRange)="onDateRangeSelection($event)" />
                </div>
            </div>
            }


            <div class="col-xxl-3 col-xl-3 col-lg-3 col-sm-6">
                <div class="mb-3">
                    <label for="clienteSearch" class="form-label">Cliente: </label>
                    <input type="email" class="form-control" id="clienteSearch">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-xxl-3 col-xl-3 col-lg-3 col-sm-12">
                <button type="button" class="btn btn-success m-r-10" (click)="getReport('pdf')">PDF</button>
                <button type="button" class="btn btn-info" (click)="getReport('excel')">EXCEL</button>
            </div>
        </div>
    </div>
</div>
