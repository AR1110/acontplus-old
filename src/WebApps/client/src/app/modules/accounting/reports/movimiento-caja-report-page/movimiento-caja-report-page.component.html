<app-breadcrumb/>


<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="col-xl-3 col-lg-3 col-md-3 col-sm-12 col-12">
        <div class="icheck-primary icheck-inline">
          <input type="checkbox" id="checkboxCompanyCustomerEmployee" />
          <label for="checkboxCompanyCustomerEmployee">Cliente/Empleado</label>
        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-3 col-sm-12 col-12">
        <div class="icheck-primary icheck-inline">
          <input type="checkbox" id="checkboxUser" />
          <label for="checkboxUser">Usuario</label>
        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-3 col-sm-12 col-12"></div>
      <div class="col-xl-3 col-lg-3 col-md-3 col-sm-12 col-12"></div>
    </div>
    <hr>
    <div class="row">
      <div class="col-xl-4 col-lg-4 col-md-4 col-sm-12 col-12">
        <div class="form-group">
          <label for="tipoDoc">Tipo Doc.: <span class="text-danger">*</span></label>
          <select name="tipoDoc" id="tipoDoc" class="form-select">
            <option value=""></option>
          </select>
        </div>
      </div>
      <div class="col-xl-4 col-lg-4 col-md-4 col-sm-12 col-12">
        <div class="form-group">
          <label for="establishment">Establecimiento: <span class="text-danger">*</span></label>
          <select name="establishment" id="establishment" class="form-select" [(ngModel)]="dataSearch.codEstab">
            @for (item of establecimientos;track $index){
              <option [ngValue]="item.codEstab">{{item.nombreComercial}}</option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-4 col-lg-4 col-md-4 col-sm-12 col-12">
        <div class="form-group">
          <label >Rango de fecha:  </label>
          <app-date-range-selection/>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
        @if(isShowCompanyCustomer){
          <div class="form-group">
            <label>Cliente: </label>
            <app-company-customer-search/>
          </div>
        }
        @if (isShowEmployee){
          <div class="form-group">
            <label>Empleado: </label>
            <app-employee-search [isSearchSimple]="true"/>
          </div>
        }
      </div>
      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">

      </div>
      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12"></div>
    </div>
  </div>
</div>
