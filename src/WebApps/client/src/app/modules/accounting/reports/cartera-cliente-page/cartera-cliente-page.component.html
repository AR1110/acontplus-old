<app-breadcrumb/>

<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="col-xl-2 col-lg-2 col-md-4 col-sm-6 col-12">
        <div class="icheck-primary">
          <input type="checkbox"
                 id="ckFecha"
                 [(ngModel)]="dataSearch.ckFecha"
                 name="ckFecha" />
          <label for="ckFecha">Rango Fecha</label>
        </div>
      </div>

      <div class="col-xl-2 col-lg-2 col-md-4 col-sm-6 col-12">
        <div class="icheck-primary">
          <input type="checkbox"
                 id="checkboxCompanyCustomer"
                 [(ngModel)]="dataSearch.checkboxCompanyCustomer"
                 name="checkboxCompanyCustomer" />
          <label for="checkboxCompanyCustomer">Cliente</label>
        </div>
      </div>
      <div class="col-xl-2 col-lg-2 col-md-4 col-sm-6 col-12">
        <div class="icheck-primary">
          <input type="checkbox" id="ckCxcVencida" [(ngModel)]="dataSearch.ckCxcVencida" />
          <label for="ckCxcVencida">Vencidas</label>
        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6 col-12">
        <div class="icheck-primary">
          <input type="checkbox" id="ckCuotas" [(ngModel)]="dataSearch.ckCuotas" />
          <label for="ckCuotas">Cuotas</label>
        </div>
      </div>
      <div class="col-xl-2 col-lg-2 col-md-4 col-sm-6 col-12">
          <div class="icheck-primary">
            <input type="checkbox" id="dirViviendaCliente" [(ngModel)]="dataSearch.checkBoxDirViviendaCliente" />
            <label for="dirViviendaCliente">Dir. Vivienda Cliente</label>
          </div>
      </div>
    </div>
    <hr />


    <div class="row">
      <div class="col-lg-3 col-md-3 col-sm-6 col-12">
        <div class="form-group">
          <label for="estabs">Estab: <span class="text-danger">*</span></label>
          <select name="estabs"
                  id="estabs"
                  class="form-select"
                  [(ngModel)]="dataSearch.codEstab"
                  (change)="onChangeEstab()">
            @for(item of establecimientos;track $index){
              <option [ngValue]="item.codEstab">
                {{item.nombreComercial}}
              </option>
            }
          </select>
        </div>
      </div>
      <div class="col-lg-2 col-md-2 col-sm-6 col-12">
        <div class="form-group">
          <label for="punto-emision">Pto. emisión: <span class="text-danger">*</span></label>
          <select name="punto-emision"
                  id="punto-emision"
                  class="form-select"
                  [(ngModel)]="dataSearch.idPuntoEmision">
            @for (item of puntosEmision;track $index){
              <option [ngValue]="item.idPuntoEmision">
                {{item.ptoEmi}}
              </option>
            }

          </select>
        </div>
      </div>
      <div class="col-lg-4 col-md-4 col-sm-6 col-12">
        <div class="form-group">
          <label  >Rango Fechas: </label>
          <app-date-range-selection (onChangeDateRange)="onDateRangeSelection($event)"/>
        </div>
      </div>
      <div class="col-lg-3 col-md-3 col-sm-6 col-12">
        <div class="form-group">
          <label for="estados-doc">Estado:</label>
          <select name="estados-doc"
                  id="estados-doc"
                  [(ngModel)]="dataSearch.codEstado"
                  class="form-select">
            <option [ngValue]="null">Todos</option>
            @for(item of estadosDoc;track $index){
              <option [ngValue]="item.codigo">
                {{item.descripcion}}
              </option>
            }

          </select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-xl-2 col-lg-2 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="tipo-doc">Tipo Doc.</label>
          <select name="tipo-doc"
                  id="tipo-doc"
                  [(ngModel)]="dataSearch.codDoc"
                  (change)="onChangeTipoDoc()"
                  class="form-select">
            <option [ngValue]="null">Todos</option>
            @for(item of tiposDoc;track $index){
              <option [ngValue]="item.codigo" >
                {{item.descripcion}}
              </option>
            }


          </select>
        </div>
      </div>
      <div class="col-xl-5 col-lg-5 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label >Cliente</label>
          <app-company-customer-search
            [isSearchSimple]="true"
            (resultEmptyInput)="resultEmptyInputCustomer()"
            (onCustomerSelected)="onCustomerSelected($event)"

          />
        </div>
      </div>
      <div class="col-lg-3 col-md-3 col-sm-12 col-12">
        <div class="form-group">
          <label for="empresa">Empresa: </label>
          <select name="empresa"
                  id="empresa"
                  [(ngModel)]="dataSearch.idEmpresa"
                  class="form-select">
            <option [ngValue]="0">Todos</option>
            @for(item of empresas;track $index){
              <option [ngValue]="item.idEmpresa">
                {{item.nombreComercial}}
              </option>
            }

          </select>
        </div>
      </div>
      <div class="col-lg-3 col-md-3 col-sm-12 col-12 d-flex align-items-center">
        @if(isSelectedNotaEntrega){
          <div class="icheck-primary icheck-inline"  >
            <input type="checkbox" id="docTransferidas" [(ngModel)]="dataSearch.convertToDoc" />
            <label for="docTransferidas">Docs. Transferidas</label>
          </div>
        }

      </div>
    </div>

    <div class="row">
      @if (dataSearch.checkBoxDirViviendaCliente) {
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="dirVivienda">Dirección de vivienda (Sector, Barrio y Calle):</label>
          <input type="text" class="form-control border-select" id="dirVivienda" [(ngModel)]="dataSearch.dirViviendaCliente" >
        </div>
      </div>
      }
    </div>


    <div class="d-flex flex-row gap-1">
      <button type="button" class="btn btn-success" (click)="getReportPdf()">PDF</button>
      <button type="button" class="btn btn-info" (click)="getReportExcel()">EXCEL</button>
    </div>
  </div>
</div>
