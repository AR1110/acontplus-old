<app-custom-container-dialog
  [containerTemplate]="containerTemplate"
  [actionsTemplate]="actionsTemplate"
  [matDialogTitle]="'Cuotas'"
  [loading]="loading()"
  [align]="'center'"
  (close)="closeDialog()"
/>

<ng-template #containerTemplate>
  <div class="d-flex flex-column gap-2">
    <div
      class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-1 row-cols-1 g-2"
    >
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Tiempo Credito</mat-label>
          <mat-select>
            @for (item of tiemposCredito(); track $index) {
            <mat-option [value]="item.idTiempoCredito">{{
              item.descripcion
            }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Configurar fecha:</mat-label>
          <input matInput [matDatepicker]="picker" />
          <mat-hint>MM/DD/YYYY</mat-hint>

          <ng-container matSuffix>
            <mat-datepicker-toggle [for]="picker"></mat-datepicker-toggle>

            <mat-datepicker touchUi #picker></mat-datepicker>

            <button
              mat-icon-button
              [matMenuTriggerFor]="menu"
              aria-label="Example icon-button with a menu"
            >
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item>
                <mat-icon>trending_flat</mat-icon>
                <span>Fin de Mes</span>
              </button>
              <button mat-menu-item>
                <mat-icon>calendar_today</mat-icon>
                <span>Mismo día</span>
              </button>
            </mat-menu>
          </ng-container>
        </mat-form-field>
      </div>
    </div>

    <div class="border rounded mb-3">
      <table mat-table [dataSource]="dataSource()">
        <ng-container matColumnDef="position">
          <th mat-header-cell *matHeaderCellDef>No.</th>
          <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
        </ng-container>

        <ng-container matColumnDef="cuota">
          <th mat-header-cell *matHeaderCellDef>Cuota</th>
          <td mat-cell *matCellDef="let element">
            <mat-form-field>
              <input matInput [(ngModel)]="element.cuota" placeholder="0.00" />
            </mat-form-field>
          </td>
        </ng-container>

        <ng-container matColumnDef="fechaVencimiento">
          <th mat-header-cell *matHeaderCellDef>Fecha Vencimiento</th>
          <td mat-cell *matCellDef="let element">
            <mat-form-field>
              <input
                matInput
                [matDatepicker]="picker"
                placeholder="DD/MM/YYYY"
                mask="00/00/0000"
                [dropSpecialCharacters]="false"
                [showMaskTyped]="true"
                placeholder="Selecciona una fecha"
              />
              <mat-datepicker-toggle
                matSuffix
                [for]="picker"
              ></mat-datepicker-toggle>
              <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </div>
</ng-template>

<ng-template #actionsTemplate>
  <button mat-flat-button>
    <mat-icon>save</mat-icon>
    Guardar
  </button>
  <button mat-stroked-button color="accent" (click)="closeDialog()">
    Cerrar
  </button>
</ng-template>
