<mat-form-field class="w-100">
  <mat-label>Ciudad</mat-label>
  <input
    type="text"
    matInput
    [matAutocomplete]="autoGroup"
    [(ngModel)]="stateCityGroup"
    (input)="onStateGroupInput($event)"
  />
  <mat-autocomplete #autoGroup="matAutocomplete">
    @for (group of ciudadGroupOptions; track group) {
      <mat-optgroup [label]="group.provincia">
        @for (name of group.ciudades; track name) {
          <mat-option
            [value]="name.descripcion"
            (onSelectionChange)="valueChangeCity(name.idCiudad)"
            >{{ name.descripcion }}</mat-option
          >
        }
      </mat-optgroup>
    }
  </mat-autocomplete>
</mat-form-field>
