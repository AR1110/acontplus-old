<div class="form-group">
  <label>Banco: <span class="text-danger">*</span></label>
  <select class="form-select border-select" [(ngModel)]="value" (change)="onChange()">
    @for (item of bancos; track $index) {
      <option [ngValue]="item.idBanco">
        {{ item.descripcion }}
      </option>
    }
  </select>
</div>
