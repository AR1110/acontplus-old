<app-breadcrumb />

<acp-dynamic-card>
  <mat-accordion>
    @for (item of entidadesFinanciera; track $index) {
      <mat-expansion-panel (opened)="showAccordion(item)">
        <mat-expansion-panel-header>
          <mat-panel-title> {{ item.descripcion }} </mat-panel-title>
        </mat-expansion-panel-header>
        <div class="p-2">
          <button type="button" mat-flat-button (click)="openDialog()">
            <mat-icon>add</mat-icon>
            Nuevo
          </button>
          @if (subEntidadesFinanciera.data.length > 0) {
            <app-mat-dynamic-table
              [tableData]="subEntidadesFinanciera.data"
              [columnDefinitions]="columnsDefs"
              [visibleColumns]="columns"
              [templateOp]="templateOp"
            />
          } @else {
            <p class="text-center">Sin datos</p>
          }
        </div>
      </mat-expansion-panel>
    }
  </mat-accordion>
</acp-dynamic-card>

<ng-template #templateOp let-item="item">
  <button type="button" mat-icon-button (click)="openDialog(item)">
    <mat-icon>edit</mat-icon>
  </button>
  <button type="button" mat-icon-button (click)="askToDelete(item)">
    <mat-icon>delete_outline</mat-icon>
  </button>
</ng-template>
