<form (ngSubmit)="onSave()" [formGroup]="subcategoryForm">
  <div class="modal-header">
    <h5 class="modal-title">
      <mat-icon>{{ modalIcon }}</mat-icon>
      {{ modalTitle }}
    </h5>
    <button
      (click)="onModalClose()"
      aria-hidden="true"
      class="btn-close"
      type="button"
    ></button>
  </div>
  <div class="modal-body">
    <div class="row">
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
        <div class="form-group">
          <label for="categoryId">Categoria:</label>
          <select
            class="form-select"
            formControlName="categoryId"
            id="categoryId"
            required=""
          >
            <option [value]="0" selected>Seleccione una categoría</option>
            @for (item of categories; track $index) {
              <option [value]="item.id">{{ item.name }}</option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
        <div class="form-group">
          <label for="name">Nombre </label>
          <input
            (blur)="setCode($event)"
            class="form-control border-select"
            formControlName="name"
            id="name"
            type="text"
          />
        </div>
      </div>
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
        <div class="form-group">
          <label for="code">Código </label>
          <input
            class="form-control border-select"
            formControlName="code"
            id="code"
            type="text"
          />
        </div>
      </div>
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
        <div class="form-group">
          <label for="enabled">Estado </label>
          <input
            class="form-check"
            formControlName="enabled"
            id="enabled"
            type="checkbox"
          />
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button
      [disabled]="subcategoryForm.invalid"
      mat-raised-button
      type="submit"
    >
      <mat-icon>save</mat-icon>
      Guardar
    </button>
    <app-theme-button
      variant="dark"
      icon="close"
      text="Cancelar"
      (handleClick)="onModalClose()"
    >
    </app-theme-button>
  </div>
</form>
