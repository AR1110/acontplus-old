<form autocomplete="off" [formGroup]="dataForm" (ngSubmit)="save()">
  <div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">{{ titleModal }}</h4>
    <button
      type="button"
      class="btn-close"
      aria-label="Close"
      (click)="onModalClose()"
    ></button>
  </div>
  <div class="modal-body">
    <div class="row justify-content-between">
      <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 col-12">
        <div class="form-group">
          <label for="establecimiento"
            >Establecimiento: <span class="text-danger">*</span></label
          >
          <select
            name="establecimiento"
            id="establecimiento"
            class="form-select form-control-border"
            formControlName="codEstab"
            required
          >
            @for (item of establecimientos; track $index) {
              <option [ngValue]="item.codEstab">
                {{ item.nombreComercial }}
              </option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 col-12">
        <div class="form-group">
          <label for="caja">Caja: <span class="text-danger">*</span></label>
          <select
            class="form-select form-control-border"
            formControlName="idCaja"
            name="idCaja"
            id="caja"
            required
          >
            @for (item of cajas; track $index) {
              <option [ngValue]="item.idCaja">{{ item.descripcion }}</option>
            }
          </select>
        </div>
      </div>

      <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 col-12">
        <div class="form-group">
          <label for="tipoDoc"
            >Tipo Documento: <span class="text-danger">*</span></label
          >
          <select
            name="tipoDoc"
            id="tipoDoc"
            class="form-select form-control-border"
            formControlName="idTipoDocumento"
            required
            (change)="onChangeTipoDoc()"
          >
            <option value="0" selected disabled>Seleccione::</option>
            @for (item of tiposDocumento; track $index) {
              <option [ngValue]="item.idTipoDocumento">
                {{ item.descripcion }}
              </option>
            }
          </select>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="entidadFinanciera"
            >Entidad Financiera: <span class="text-danger">*</span></label
          >
          <select
            name="idEntidadFinanciera"
            id="entidadFinanciera"
            class="form-select form-control-border"
            (change)="onChangeEntidadFinanciera()"
            formControlName="idEntidadFinanciera"
            required
          >
            @for (item of entidadesFinanciera; track $index) {
              <option [ngValue]="item.idEntidadFinanciera">
                {{ item.descripcion }}
              </option>
            }
          </select>
        </div>
      </div>

      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="idSubEntidadFinanciera">Sub Entidad Financiera</label>
          <select
            class="form-select form-control-border"
            formControlName="idSubEntidadFinanciera"
            name="idSubEntidadFinanciera"
            id="idSubEntidadFinanciera"
            required
          >
            @for (item of subEntidadesFinanciera; track $index) {
              <option [ngValue]="item.idSubEntidadFinanciera">
                {{ item.descripcion }}
              </option>
            }
          </select>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="valor">Valor <span class="text-danger">*</span></label>
          <input
            id="valor"
            type="number"
            class="form-control form-control-border"
            placeholder="0.00"
            formControlName="valor"
            name="valor"
            required
          />
        </div>
      </div>
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label>Cliente: <span class="text-danger">*</span></label>
          <app-company-customer-search
            [isSimpleMode]="true"
            (customerSelected)="onSelectCustomer($event)"
            (resultEmptyInput)="onEmptyCustomer()"
          />
        </div>

        <!--@if(esTipoDocGasto){
          <div class="form-group">
            <label>Proveedor: <span class="text-danger">*</span></label>
            <app-supplier-search
            (onInputEmpty)="onEmptyCustomer()"
            (onSelected)="onSelectCustomer($event)"
            />
          </div>
        }-->
      </div>
    </div>

    <div class="row">
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm 12 col-12">
        <div class="form-group">
          <label for="observaciones"
            >Observación <span class="text-danger">*</span></label
          >
          <textarea
            id="observaciones"
            name="observaciones"
            class="form-control form-control-border"
            formControlName="observaciones"
            touppercase
            required
          ></textarea>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="submit" mat-raised-button [disabled]="!dataForm.valid">
      <mat-icon>save</mat-icon>Guardar
    </button>
    <app-theme-button
      variant="dark"
      icon="close"
      text="Cancelar"
      (handleClick)="onModalClose()"
    ></app-theme-button>
  </div>
</form>
