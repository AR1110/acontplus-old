<app-breadcrumb/>

<app-mat-dynamic-card>
  <div class="d-grid gap-2">
    <div class="hstack gap-2">
      <span>Tipo de reporte: </span>
      <mat-radio-group aria-label="Select an option">
        <mat-radio-button value="1">Listado de comprobantes</mat-radio-button>
        <mat-radio-button value="2">Detalle formas de pago</mat-radio-button>
      </mat-radio-group>

    </div>

    <mat-divider/>

    <div class="row row-cols-xxl-3 row-cols-xl-3 row-cols-lg-3 row-cols-md-1 row-cols-1">
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Tipo Documento</mat-label>
          <mat-select>
            <mat-option></mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Establecimiento</mat-label>
          <mat-select>
            <mat-option></mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <app-date-range-selection
          [showInputMaterial]="true"
          [showMatSuffix]="true"
        />
      </div>
    </div>

    <div class="row row-cols-xxl-4 row-cols-xl-4 row-cols-lg-4 row-cols-md-2 row-cols-1">
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Método de pago</mat-label>
          <mat-select>
            <mat-option></mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Banco</mat-label>
          <mat-select>
            <mat-option></mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Referencia:</mat-label>
          <input matInput>
          <ng-container matSuffix>
            <mat-checkbox/>
          </ng-container>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Lote:</mat-label>
          <input matInput>
          <ng-container matSuffix>
            <mat-checkbox/>
          </ng-container>
        </mat-form-field>
      </div>
    </div>

    <div class="hstack gap-2">
      <app-theme-button
        variant="danger"
        text="Pdf" />

      <app-theme-button
        variant="success"
        text="Excel" />
      <!--        <app-svg-icon ngProjectAs="svgIcon" id="icon-pdf2"  />-->
    </div>
  </div>
</app-mat-dynamic-card>
