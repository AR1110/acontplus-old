<app-breadcrumb/>

<mat-card appearance="outlined">
  <mat-card-content>

    <div class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-1 row-cols-1 g-4">

      <div class="col">

      </div>
      <div class="col  ">
        <div class="d-flex flex-row gap-2 justify-content-end">
          <button mat-flat-button (click)="onModalOpen()"   >
            <mat-icon>add</mat-icon>
            Nuevo
          </button>
          <button mat-icon-button (click)="refresh()">
            <mat-icon>refresh</mat-icon>
          </button>
        </div>
      </div>

    </div>


    <app-mat-dynamic-table
      [dataList]="subcategories"
      [displayColumnDefs]="columnsDefs"
      [displayedColumns]="columns"
      [templateOp]="templateOp"
      [paginationConfig]="pagination()"
      [enablePagination]="true"
      (onPageEvent)="handlePageEvent($event)"
    >
    </app-mat-dynamic-table>
  </mat-card-content>

</mat-card>
<ng-template #templateOp let-item="item">

    <button type="button"  mat-icon-button  (click)="edit(item)">
      <mat-icon>edit</mat-icon>
    </button>
</ng-template>
