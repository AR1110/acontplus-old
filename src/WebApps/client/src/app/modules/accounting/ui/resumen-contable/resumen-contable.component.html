<app-breadcrumb />

<mat-card appearance="outlined">
  <mat-card-content>
    <div class="row">
      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label>Tipo Transacción</label>
          <select
            (change)="onChangeTypeTransaccion()"
            [(ngModel)]="dataSearch.idTipoTransaccion"
            class="form-select"
          >
            <option [ngValue]="0">-- Todos --</option>
            @for (item of transactionTypes; track $index) {
              <option [ngValue]="item.idTipoTransaccion">
                {{ item.descripcion }}
              </option>
            }
          </select>
        </div>
      </div>

      @if (isPurchase) {
        <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
          <div class="form-group">
            <label>Subcategoría</label>
            <select class="form-select" [(ngModel)]="dataSearch.idSubcategoria">
              <option [ngValue]="0">-- Todos --</option>
              @for (item of subcategories; track $index) {
                <option [ngValue]="item.id">{{ item.name }}</option>
              }
            </select>
          </div>
        </div>
      }

      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label>Rango fecha: </label>
          <app-date-range-selection
            (onChangeDateRange)="onDateRangeSelection($event)"
          />
        </div>
      </div>
    </div>
  </mat-card-content>
  <div class="card-footer">
    <div class="d-flex flex-row gap-1">
      <button (click)="reportPdf()" mat-raised-button type="button">
        PDF
      </button>
      <button (click)="reportExcel()" class="btn btn-info" type="button">
        EXCEL
      </button>
    </div>
  </div>
</mat-card>
