<div class="row">
  <div class="col-xxl-10 col-xl-10 col-md-10 col-sm-12 col-12">
    <div
      class="row row-cols-xxl-3 row-cols-xl-3 row-cols-lg-3 row-cols-md-2 row-cols-sm-2 row-cols-1 g-4"
    >
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Establecimiento</mat-label>
          <mat-select [(ngModel)]="dataSearch.codEstab" (selectionChange)="refresh()">
            @for (item of establecimientos(); track $index) {
              <mat-option [value]="item.codEstab">{{ item.nombreComercial }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <app-date-range-selection
          [showMatSuffix]="true"
          [(checkbox)]="dataSearch.checkBoxFecha"
          (onChangeDateRange)="onDateRangeSelection($event)"
          [showInputMaterial]="true"
          (onCheckboxChange)="refresh()"
        />
      </div>
      <div class="col">
        <app-company-customer-search
          [isSimpleMode]="true"
          (customerSelected)="onCustomerSelected($event)"
          (clearSearch)="resultCustomerEmptyInput($event)"
        />
      </div>
    </div>
  </div>
  <div class="col-xxl-2 col-xl-2 col-md-2 col-sm-12 col-12">
    <div class="hstack gap-2">
      <acp-button variant="secondary" icon="refresh" matStyle="icon" (handleClick)="refresh()" />
      @if ($userRoleStateManager.canCreate()) {
        <acp-button variant="primary" icon="add" matStyle="icon" (handleClick)="openModal()" />
      }
    </div>
  </div>
</div>

<acp-data-grid
  [data]="dataSource()"
  [columns]="columnsDefs"
  [loading]="isLoadingResults()"
  [length]="pagination().totalRecords"
  [pageIndex]="pagination().pageIndex"
  [pageSize]="pagination().pageSize"
  (page)="handlePageEvent($event)"
  [cellTemplate]="{
    op: opTpl,
  }"
/>

<ng-template #opTpl let-data>
  <button mat-icon-button [matMenuTriggerFor]="menu" aria-hidden="false">
    <mat-icon>more_vert</mat-icon>
  </button>

  <mat-menu #menu="matMenu">
    @if ($userRoleStateManager.canGenerateReport()) {
      <button mat-menu-item (click)="getReport(data)">
        <mat-icon>download</mat-icon>
        <span>Reporte</span>
      </button>
    }

    <button mat-menu-item (click)="getPrint(data)">
      <mat-icon>print</mat-icon>
      <span>Imprimir</span>
    </button>

    @if ($userRoleStateManager.canCancel()) {
      <button mat-menu-item (click)="askToDelete(data)">
        <mat-icon>delete</mat-icon>
        <span>Anular</span>
      </button>
    }
  </mat-menu>
</ng-template>
