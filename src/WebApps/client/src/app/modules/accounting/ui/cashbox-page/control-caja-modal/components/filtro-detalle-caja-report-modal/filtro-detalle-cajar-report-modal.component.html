<div class="modal-header">
  <h4 class="modal-title">Reporte Detalle Caja</h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss('Cross click')"
  ></button>
</div>
<div class="modal-body">
  <div class="row">
    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
      <div class="form-group">
        <label for="entidadFinanciera">Entidad Financiera</label>
        <select
          name="entidadFinanciera"
          id="entidadFinanciera"
          class="form-select"
          [(ngModel)]="dataSearch.idEntidadFinanciera"
        >
          <option value="">Todos</option>
          @for (item of entidadesFinanciera; track $index) {
            <option [ngValue]="item.idEntidadFinanciera">
              {{ item.descripcion }}
            </option>
          }
        </select>
      </div>
    </div>

    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
      <div class="form-group">
        <label for="tipoDocumento">Tipo Documento</label>
        <select
          name="tipoDocumento"
          id="tipoDocumento"
          class="form-select"
          [(ngModel)]="dataSearch.codDoc"
        >
          <option value="">Todos</option>
          @for (item of tipoDocumentos; track $index) {
            <option [ngValue]="item.codigo">{{ item.descripcion }}</option>
          }
        </select>
      </div>
    </div>

    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
      <div class="form-group">
        <label for="fromDate" class="form-label">Fecha de inicio</label>
        <div class="input-group">
          <input
            type="date"
            disabled
            [ngModel]="dataSearch.fromDate | date: 'yyyy-MM-dd'"
            class="form-control"
          />

          <input
            type="time"
            [value]="dataSearch.fromDate | date: 'HH:mm'"
            class="form-control"
            (change)="onTimeChange($event, true)"
          />
        </div>
      </div>
    </div>

    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
      <div class="form-group">
        <label for="toDate" class="form-label">Fecha de fin</label>
        <div class="input-group">
          <input
            type="date"
            disabled
            [ngModel]="dataSearch.toDate | date: 'yyyy-MM-dd'"
            class="form-control"
          />

          <input
            type="time"
            [value]="dataSearch.toDate | date: 'HH:mm'"
            class="form-control"
            (change)="onTimeChange($event, false)"
          />
        </div>
      </div>
    </div>
  </div>

  <div class="form-group">
    <div class="icheck-primary">
      <input type="checkbox" [(ngModel)]="dataSearch.ckHora" id="ckHora" />
      <label for="ckHora">Hora</label>
    </div>
  </div>

  <div class="d-grid gap-2 col-12 mx-auto">
    <app-theme-button
      variant="danger"
      icon="picture_as_pdf"
      text="Pdf"
      (handleClick)="getReport('pdf')"
    >
    </app-theme-button>
    <app-theme-button
      variant="success"
      icon="download"
      text="Excel"
      (handleClick)="getReport('excel')"
    >
    </app-theme-button>
  </div>
</div>
<div class="modal-footer">
  <app-theme-button
    variant="dark"
    icon="close"
    text="Cancelar"
    (handleClick)="activeModal.close()"
  >
  </app-theme-button>
</div>
