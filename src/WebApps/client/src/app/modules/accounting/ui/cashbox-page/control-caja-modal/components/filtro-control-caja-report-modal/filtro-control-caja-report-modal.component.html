<div class="modal-header">
  <h4 class="modal-title">Filtro Control Caja</h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss('Cross click')"
  ></button>
</div>
<div class="modal-body">
  <div class="row">
    <div class="col-12">
      <div class="form-group">
        <label for="sortByDefault">Ordenar por defecto:</label>
        <select
          name="sortByDefault"
          id="sortByDefault"
          class="form-select"
          [(ngModel)]="dataSearch.sortByDefault"
        >
          @for (item of sortByDefaults; track $index) {
            <option [ngValue]="item.id">{{ item.description }}</option>
          }
        </select>
      </div>
    </div>
    <div class="col-12">
      <div class="form-group">
        <label for="sortOrder">Criterio de clasificación:</label>
        <select
          name="sortOrder"
          id="sortOrder"
          class="form-select"
          [(ngModel)]="dataSearch.sortOrder"
        >
          @for (item of sortOrders; track $index) {
            <option [ngValue]="item.codigo">{{ item.description }}</option>
          }
        </select>
      </div>
    </div>
  </div>
  <div class="d-grid gap-2 col-12 mx-auto">
    <app-theme-button
      variant="danger"
      icon="picture_as_pdf"
      text="Pdf"
      (handleClick)="askToReport('pdf')"
    >
    </app-theme-button>
    <app-theme-button
      variant="success"
      icon="download"
      text="Excel"
      (handleClick)="askToReport('excel')"
    >
    </app-theme-button>
  </div>
</div>
<div class="modal-footer">
  <app-theme-button
    variant="dark"
    icon="close"
    text="Cancelar"
    (handleClick)="activeModal.close('Close click')"
  ></app-theme-button>
</div>
