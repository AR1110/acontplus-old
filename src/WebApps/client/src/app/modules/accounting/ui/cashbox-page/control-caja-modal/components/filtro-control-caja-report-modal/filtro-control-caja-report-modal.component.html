<div class="modal-header">
  <h4 class="modal-title">Filtro Control Caja</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss('Cross click')"></button>
</div>
<div class="modal-body">
  <div class="row">
    <div class="col-12">
      <div class="form-group">
        <label for="sortByDefault">Ordenar por defecto:</label>
        <select name="sortByDefault" id="sortByDefault" class="form-select" [(ngModel)]="dataSearch.sortByDefault">
          @for (item of sortByDefaults; track $index) {
          <option [ngValue]="item.id">{{item.description}}</option>
          }
        </select>
      </div>
    </div>
    <div class="col-12">
      <div class="form-group">
        <label for="sortOrder">Criterio de clasificación:</label>
        <select name="sortOrder" id="sortOrder" class="form-select" [(ngModel)]="dataSearch.sortOrder">
          @for (item of sortOrders; track $index) {
          <option [ngValue]="item.codigo">{{item.description}}</option>
          }
        </select>
      </div>
    </div>
  </div>
  <div class="d-grid gap-2 col-12 mx-auto">
    <button class="btn btn-warning" type="button" (click)="askToReport('pdf')">
      <mat-icon>picture_as_pdf</mat-icon>
      PDF
    </button>
    <button mat-raised-button type="button" (click)="askToReport('excel')">
      <mat-icon>download</mat-icon>
      EXCEL
    </button>
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-dark" (click)="activeModal.close('Close click')">&times; Cerrar</button>
</div>
