<mat-dialog-content>
  <div class="d-grid gap-2">
    <div class="row row-cols-xxl-3 row-cols-xl-3 row-cols-md-3 row-cols-md-2 row-cols-1">
      @for (item of monedas(); track $index) {
        <div class="col py-2">
          <mat-form-field class="w-100">
            <mat-label>{{ item.descripcion }}</mat-label>
            <input
              type="number"
              matInput
              [(ngModel)]="item.cantidad"
              (input)="onChangeQuantity()"
              onclick="select();"
            />
          </mat-form-field>
        </div>
      }
    </div>
    <h5 class="ml-auto text-info">
      Total: <span>{{ totalArqueo | currency: '$' }}</span>
    </h5>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <acp-button matStyle="filled" variant="success" icon="save" text="Guardar" (handleClick)="save()" />
</mat-dialog-actions>
