<app-breadcrumb />

<div class="container-fluid">
  <div class="d-grid gap-2">
    <div
      class="row row-cols-1 row-cols-xxl-4 row-cols-xl-4 row-cols-lg-4 row-cols-md-4 row-cols-sm-2"
    >
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Establecimiento</mat-label>
          <mat-select [(ngModel)]="dataSearch().codEstab">
            @for (item of estabs; track $index) {
              <mat-option [value]="item.codEstab">{{ item.nombreEstab }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <app-date-range-selection
          [showInputMaterial]="true"
          [showMatSuffix]="true"
          [(checkbox)]="dataSearch().isDate"
          (onCheckboxChange)="refresh()"
          (onChangeDateRange)="onChangeDateRange($event)"
        />
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Estado</mat-label>
          <mat-select [(ngModel)]="dataSearch().byEstado" (selectionChange)="refresh()">
            <mat-option [value]="0">Todos</mat-option>
            <mat-option [value]="1">Activo</mat-option>
            <mat-option [value]="2">Anulado</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col d-flex justify-content-end">
        <div class="hstack gap-2">
          <acp-button
            variant="secondary"
            icon="refresh"
            matStyle="icon"
            (handleClick)="refresh()"
          />
          <acp-button
            variant="info"
            icon="filter_list"
            matStyle="icon"
            (handleClick)="advancedFilter.set(!advancedFilter())"
          />
        </div>
      </div>
    </div>

    @if (advancedFilter()) {
      <div
        class="row row-cols-1 row-cols-xxl-3 row-cols-xl-3 row-cols-lg-3 row-cols-md-3 row-cols-sm-3"
      >
        <div class="col">
          <app-supplier-search
            [isSimpleMode]="true"
            (supplierSelected)="onSupplierSelected($event)"
            (clearSearch)="supplierclearSearch($event)"
            [(textSearch)]="dataSearch().nameSupplier"
          />
        </div>
        <div class="col">
          <mat-form-field class="w-100">
            <mat-label>Usuario</mat-label>
            <mat-select [(ngModel)]="dataSearch().userId" (selectionChange)="refresh()">
              <mat-option [value]="0">Todos</mat-option>
              @for (item of users(); track $index) {
                <mat-option [value]="item.idUsuario">{{ item.nombreUsuario }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col">
          <mat-form-field>
            <mat-label>Buscar por Nro. Doc</mat-label>
            <input matInput [(ngModel)]="dataSearch().nroSecuencial" />
          </mat-form-field>
        </div>
      </div>
    }

    <acp-data-grid
      [data]="dataSource()"
      [columns]="columnsDefs"
      [length]="pagination().totalRecords"
      [pageIndex]="pagination().pageIndex"
      [pageSize]="pagination().pageSize"
      (page)="handlePageEvent($event)"
      [cellTemplate]="{
        op: opTpl,
        index: indexTpl,
        nomUsuario: userTpl,
      }"
    />
  </div>
</div>

<ng-template #opTpl let-data>
  <button mat-icon-button [matMenuTriggerFor]="menu" aria-hidden="false">
    <mat-icon>more_vert</mat-icon>
  </button>

  <mat-menu #menu="matMenu">
    <button mat-menu-item appActionComprobanteEgresoAnular [id]="data.idComprobanteEgreso">
      <mat-icon>clear</mat-icon>
      <span>Anular</span>
    </button>

    <button
      mat-menu-item
      appActionComprobanteEgresoReport
      [id]="data.idComprobanteEgreso"
      [codEstab]="data.codEstab"
    >
      <mat-icon>download</mat-icon>
      <span>Reporte</span>
    </button>
  </mat-menu>
</ng-template>

<ng-template #indexTpl let-index="index">
  {{ index + 1 }}
</ng-template>

<ng-template #userTpl let-data>
  <strong>{{ data.nomUsuario }}</strong>
</ng-template>
