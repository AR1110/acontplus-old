<div class="form-group">
  <label>SubEntidad Financiera: <span class="text-danger">*</span></label>
  <select class="form-select" [(ngModel)]="value" (change)="onChange()">
    @for (item of subEntidadesFinanciera; track $index) {
      <option [ngValue]="item.idSubEntidadFinanciera">
        {{ item.descripcion }}
      </option>
    }
  </select>
</div>
