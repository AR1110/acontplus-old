<app-breadcrumb />
<mat-card appearance="outlined">
  <mat-card-content>
    <div class="row mb-3">
      <div class="col">
        <button (click)="onModalOpen()" class="btn btn-info" type="button">
          <fa-icon [icon]="'plus'"></fa-icon>
          Nuevo
        </button>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Opciones</th>
            <th class="text-center">#</th>
            <th>Tipo</th>
            <th>Código</th>
            <th>Nombre</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
          @for (item of categories; track $index) {
            <tr>
              <td class="text-center">
                <div ngbDropdown class="d-inline-block">
                  <button
                    type="button"
                    class="btn btn-outline-primary"
                    id="dropdownBasic1"
                    ngbDropdownToggle
                  >
                    <fa-icon [icon]="'bars'"></fa-icon>
                  </button>
                  <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
                    <button ngbDropdownItem (click)="edit(item)">
                      <fa-icon [icon]="'edit'"></fa-icon>
                      Editar
                    </button>
                  </div>
                </div>
              </td>
              <td class="text-center">{{ $index + 1 }}</td>
              <td>{{ item.tipoName }}</td>
              <td>{{ item.code }}</td>
              <td>{{ item.name }}</td>
              <td>
                <div [innerHTML]="item.enabled | secondaryStatus"></div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </mat-card-content>
</mat-card>
