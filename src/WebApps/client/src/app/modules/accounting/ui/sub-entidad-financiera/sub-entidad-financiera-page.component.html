<app-breadcrumb />

<mat-card appearance="outlined">
  <mat-card-content>
    <mat-accordion>
      @for (item of entidadesFinanciera; track $index) {
      <mat-expansion-panel (opened)="showAcordeon(item)">
        <mat-expansion-panel-header>
          <mat-panel-title> {{ item.descripcion }} </mat-panel-title>
        </mat-expansion-panel-header>
        <div class="p-2">
          @if (subEntidadesFinanciera.data.length>0) {
          <app-mat-dynamic-table
            [dataList]="subEntidadesFinanciera.data"
            [displayColumnDefs]="columnsDefs"
            [displayedColumns]="columns"
            [templateOp]="templateOp"
          >
          </app-mat-dynamic-table>

          }@else {
          <p class="text-center">Sin datos</p>
          }
        </div>
      </mat-expansion-panel>
      }
    </mat-accordion>
  </mat-card-content>
</mat-card>

<ng-template #templateOp let-item="item">
  <button type="button" mat-icon-button (click)="openModal(item)">
    <mat-icon>edit</mat-icon>
  </button>
  <button type="button" mat-icon-button (click)="askToDelete(item)">
    <mat-icon>delete_outline</mat-icon>
  </button>
</ng-template>
