
<mat-dialog-content>
  <div class="vstack gap-2">
    <div class="hstack gap-2"><strong>Fecha Cierre:</strong>{{ this.params.data.fechaCierre }}</div>
    <div class="hstack gap-2"><strong>Total:</strong>{{ total }}</div>
    <acp-button
      [variant]="'success'"
      [text]="'Descargar'"
      [icon]="'download'"
      matStyle="filled"
      (handleClick)="exportData()"
    />
  </div>

  <acp-data-grid [data]="arqueoCajaDetalle()" [columns]="columns" [showPaginator]="false" />
</mat-dialog-content>
<mat-dialog-actions>
  <acp-button
    type="button"
    icon="close"
    variant="dark"
    matStyle="filled"
    text="Cerrar"
    (handleClick)="close()"
  />
</mat-dialog-actions>
