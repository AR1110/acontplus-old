<app-mat-custom-dialog
  [containerTemplate]="body"
  [title]="'Detalle Arqueo Caja'"
  (close)="close()"
/>
<ng-template #body>
  <div class="vstack gap-2">
    <div class="hstack gap-2"><strong>Fecha Cierre:</strong>{{ this.params.fechaCierre }}</div>
    <div class="hstack gap-2"><strong>Total:</strong>{{ total }}</div>
    <acp-button
      [variant]="'success'"
      [text]="'Descargar'"
      [icon]="'download'"
      (handleClick)="exportData()"
    />
  </div>

  <acp-data-grid [data]="arqueoCajaDetalle()" [columns]="columns" />
</ng-template>
