<app-breadcrumb />

<acp-dynamic-card>
  <div class="d-grid gap-2">
    <div class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-2">
      <div class="col">
        <mat-checkbox [(ngModel)]="dataSearch.checkboxCompanyCustomerEmployee"
          >Cliente</mat-checkbox
        >
      </div>
      <div class="col">
        <mat-checkbox [(ngModel)]="dataSearch.checkboxUser">Usuario</mat-checkbox>
      </div>
    </div>
    <mat-divider />
    <div class="row row-cols-xxl-3 row-cols-xl-3 row-cols-lg-3 row-cols-md-2 row-cols-1">
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Tipo Documento</mat-label>
          <mat-select [(ngModel)]="dataSearch.codDoc" (selectionChange)="onChangeTipoDoc()">
            @for (item of tiposDoc; track $index) {
              <mat-option [value]="item.codDoc">{{ item.descripcion }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Establecimiento</mat-label>
          <mat-select [(ngModel)]="dataSearch.codEstab">
            @for (item of establecimientos; track $index) {
              <mat-option [value]="item.codEstab">{{ item.nombreComercial }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <app-date-range-selection
          [showInputMaterial]="true"
          (onChangeDateRange)="onDateRangeSelection($event)"
        />
      </div>
    </div>

    <div class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-1 row-cols-1">
      <div class="col">
        <app-company-customer-search
          (customerSelected)="onCustomerSelected($event)"
          (clearSearch)="clearSearchCustomer()"
          [isSimpleMode]="true"
        />
      </div>
      <div class="col">
        <app-user-search
          (clearSearch)="emptyInputUser()"
          (userSelected)="onUserSelected($event)"
          [isSimpleMode]="true"
        />
      </div>
    </div>

    <div class="hstack gap-1">
      <acp-button
        variant="danger"
        icon="picture_as_pdf"
        text="Pdf"
        (handleClick)="getReportPdf()"
      /><acp-button
        variant="success"
        icon="download"
        text="EXCEL"
        (handleClick)="getReportExcel()"
      />
    </div>
  </div>
</acp-dynamic-card>
