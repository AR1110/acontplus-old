<app-breadcrumb />

<mat-card appearance="outlined">
  <mat-card-content>
    <div class="row">
      <div class="col-xl-3 col-lg-3 col-md-3 col-sm-12 col-12">
        <div class="icheck-primary icheck-inline">
          <input
            type="checkbox"
            id="checkboxCompanyCustomerEmployee"
            [(ngModel)]="dataSearch.checkboxCompanyCustomerEmployee"
          />
          <label for="checkboxCompanyCustomerEmployee">Cliente</label>
        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-3 col-sm-12 col-12">
        <div class="icheck-primary icheck-inline">
          <input
            type="checkbox"
            id="checkboxUser"
            [(ngModel)]="dataSearch.checkboxUser"
          />
          <label for="checkboxUser">Usuario</label>
        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-3 col-sm-12 col-12"></div>
      <div class="col-xl-3 col-lg-3 col-md-3 col-sm-12 col-12"></div>
    </div>
    <hr />
    <div class="row">
      <div class="col-xl-4 col-lg-4 col-md-4 col-sm-12 col-12">
        <div class="form-group">
          <label for="tipoDoc"
            >Tipo Doc.: <span class="text-danger">*</span></label
          >
          <select
            name="tipoDoc"
            id="tipoDoc"
            class="form-select"
            [(ngModel)]="dataSearch.codDoc"
            (change)="onChangeTipoDoc()"
          >
            @for (item of tiposDoc; track $index) {
              <option [ngValue]="item.codDoc">{{ item.descripcion }}</option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-4 col-lg-4 col-md-4 col-sm-12 col-12">
        <div class="form-group">
          <label for="establishment"
            >Establecimiento: <span class="text-danger">*</span></label
          >
          <select
            name="establishment"
            id="establishment"
            class="form-select"
            [(ngModel)]="dataSearch.codEstab"
          >
            @for (item of establecimientos; track $index) {
              <option [ngValue]="item.codEstab">
                {{ item.nombreComercial }}
              </option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-4 col-lg-4 col-md-4 col-sm-12 col-12">
        <div class="form-group">
          <label>Rango de fecha: </label>
          <app-date-range-selection
            (onChangeDateRange)="onDateRangeSelection($event)"
          />
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
        <!-- @if(isShowCompanyCustomer){-->
        <div class="form-group">
          <label>Cliente: </label>
          <app-company-customer-search
            (onCustomerSelected)="onCustomerSelected($event)"
            (resultEmptyInput)="resultEmptyInputCustomer()"
            [isSearchSimple]="true"
          />
        </div>
        <!-- }-->
        <!-- @if (isShowEmployee){
          <div class="form-group">
            <label>Empleado: </label>
            <app-employee-search
              (onEmployeeSelected)="onEmployeeSelected($event)"
              (emptyInput)="emptyInputEmployee()"
              [isSearchSimple]="true"/>
          </div>
        }-->
      </div>
      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label>Usuario: </label>
          <app-user-search
            (emptyInput)="emptyInputUser()"
            (onUserSelected)="onUserSelected($event)"
            [isSearchSimple]="true"
          />
        </div>
      </div>
      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12"></div>
    </div>
  </mat-card-content>
  <div class="card-footer">
    <div class="d-grid gap-2 d-md-flex justify-content-md-start">
      <button class="btn btn-success" (click)="getReportPdf()">PDF</button>
      <button class="btn btn-info" (click)="getReportExcel()">EXCEL</button>
    </div>
  </div>
</mat-card>
