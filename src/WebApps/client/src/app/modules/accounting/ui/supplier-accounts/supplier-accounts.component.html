<app-breadcrumb />

<mat-card appearance="outlined">
  <mat-card-content>
    <div class="row">
      <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6 col-12">
        <div class="icheck-primary">
          <input
            type="checkbox"
            id="ckFecha"
            [(ngModel)]="dataSearch.ckFecha"
            name="ckFecha"
          />
          <label for="ckFecha">Rango Fecha</label>
        </div>
      </div>

      <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6 col-12">
        <div class="icheck-primary">
          <input
            type="checkbox"
            id="supplierChecked"
            [(ngModel)]="dataSearch.supplierChecked"
            name="supplierChecked"
          />
          <label for="supplierChecked">Proveedor</label>
        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6 col-12">
        <div class="icheck-primary">
          <input
            type="checkbox"
            id="ckCxcVencida"
            [(ngModel)]="dataSearch.ckCxcVencida"
            name="ckCxcVencida"
          />
          <label for="ckCxcVencida">Vencidas</label>
        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6 col-12">
        <div class="icheck-primary">
          <input
            type="checkbox"
            id="ckCuotas"
            [(ngModel)]="dataSearch.ckCuotas"
            name="ckCuotas"
          />
          <label for="ckCuotas">Cuotas</label>
        </div>
      </div>
      <div class="col-xl-4 col-lg-3 col-md-4 col-sm-6 col-12"></div>
    </div>
    <hr />
    <div class="row">
      <div class="col-xl-3 col-lg-3 col-md-3 col-sm-6 col-12">
        <div class="form-group">
          <span>Establecimiento: </span>
          <select
            class="form-select form-control-border"
            [(ngModel)]="dataSearch.codEstab"
            (change)="onChangeEstab()"
          >
            <option value="">Todos</option>
            @for (estab of establecimientos; track $index) {
              <option [ngValue]="estab.codEstab">
                {{ estab.nombreComercial }}
              </option>
            }
          </select>
        </div>
      </div>

      <div class="col-xl-2 col-lg-2 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <span>Punto emisión: </span>
          <select
            class="form-select form-control-border"
            [(ngModel)]="dataSearch.idPuntoEmision"
          >
            <option [ngValue]="0">Todos</option>
            @for (ptoEmi of puntosEmision; track $index) {
              <option [ngValue]="ptoEmi.idPuntoEmision">
                {{ ptoEmi.ptoEmi }}
              </option>
            }
          </select>
        </div>
      </div>

      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <span>Rango Fechas</span>

          <app-date-range-selection
            (onChangeDateRange)="onDateRangeSelection($event)"
          />
        </div>
      </div>

      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="estado">Estado.:</label>
          <select
            name="estado"
            id="estado"
            class="form-select form-control-border"
            [(ngModel)]="dataSearch.codEstado"
          >
            <option value="">Todos</option>
            @for (item of estadosDoc; track $index) {
              <option [ngValue]="item.codigo">{{ item.descripcion }}</option>
            }
          </select>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="tipoDoc">Tipo Doc.:</label>
          <select
            name="tipoDoc"
            id="tipoDoc"
            class="form-select form-control-border"
            [(ngModel)]="dataSearch.codDoc"
          >
            <option value="">Todos</option>
            @for (item of tiposDoc; track $index) {
              <option [ngValue]="item.codDoc">{{ item.descripcion }}</option>
            }
          </select>
        </div>
      </div>

      <div class="col-xl-6 col-lg-6 col-md-12 col-12">
        <div class="form-group">
          <span>Proveedor</span>
          <app-supplier-search
            [isSearchSimple]="isSearchSupplierSimple"
            (supplierSelected)="onSupplierSelected($event)"
            [textSearch]="dataSearch.supplierName"
            (clearEmpty)="supplierResultEmptyInput($event)"
          ></app-supplier-search>
        </div>
      </div>
    </div>
  </mat-card-content>
  <mat-card-footer>
    <div class="d-grid gap-2 d-md-flex justify-content-md-start">
      <button class="btn btn-danger" type="button" (click)="getReport('pdf')">
        PDF
      </button>
      <button
        mat-raised-button
        type="button"
        (click)="getReport('excel')"
      >
        EXCEL
      </button>
    </div>
  </mat-card-footer>
</mat-card>
