<div class="row">
          <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
              <div class="form-gorup">
                  <span for="establecimiento">Establecimiento</span>
                  <select name="establecimiento" id="establecimiento" ng-model="$ctrl.dataSearch.codEstab"
                      class="form-control  border-select" ng-change="$ctrl.getMovCajas()">

                  </select>
              </div>
          </div>
          <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
              <div class="form-group">

              </div>
          </div>
          <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
              <div class="form-group">

              </div>
          </div>
          <div class="col-xl-2 col-lg-2 col-md-6 col-sm-12 col-12">
              <div class="button-group">
                  <button type="button" class="btn waves-effect waves-light btn-sm btn-info">
                <i class="fas fa-eye fa-xs"></i>
              </button>
              <button type="button" class="btn waves-effect waves-light btn-sm btn-danger">
                <i class="fas fa-redo fa-xs"></i>
              </button>
              <button type="button" class="btn waves-effect waves-light btn-sm btn-success" (click)="openModal()">                
                <i class="ti-plus"></i>
              </button> 
              </div>
          </div>
      </div>

      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Caja</th>
              <th>Fecha</th>
              <th>Nro. Doc</th>
              <th>Entidad Financiera</th>
              <th>Valor</th>
              <th>Observación</th>
              <th>Empleado</th>
              <th>Estado</th>              
            </tr>
          </thead>
          <tbody>
            @for (item of movimientosCaja; track $index) {
              <tr>
                <td>{{item.caja}}</td>
                <td>{{item.fechaEmision}}</td>
                <td>{{item.nroDoc}}</td>
                <td>{{item.subEntidadFinanciera}}</td>
                <td>{{item.valor}}</td>
                <td>{{item.observaciones}}</td>
                <td>{{item.empleado}}</td>
                <td>
                 {{item.estado}}
                </td>
              </tr>

            } 
          </tbody>
          <tfoot>
            <tr>
            <td align="center" colspan="6">
              <ngb-pagination
                [collectionSize]="totalRecords"
                [(page)]="dataSearch.pageIndex"
                [maxSize]="dataSearch.maxSize"
                [pageSize]="dataSearch.pageSize"
                [rotate]="true"
                (pageChange)="pageChanged()"
                [boundaryLinks]="true"
              />
            </td>
          </tr>
          </tfoot>
        </table>
      </div>
