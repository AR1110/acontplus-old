<form autocomplete="off" [formGroup]="dataForm" (ngSubmit)="save()">
<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">{{titleModal}}</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss( )"></button>
</div>
<div class="modal-body">
  <div class="row">
    <div class="col-xl-12 col-lg-12 col-md-12 col-12">
      <div class="form-group">
        <label for="entidadFinanciera">Entidad Financiera: </label>
        <input type="text" class="form-control" disabled [value]="params.nameEntidadFinanciera">
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-xl-12 col-lg-12 col-md-12 col-12">
      <div class="form-group">
        <label for="descripcion">Descripción: <span class="text-danger">*</span> </label>
        <input type="text" class="form-control" formControlName="descripcion" (change)="onChangeDescripcion()" >
      </div>
    </div>
    <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
      <div class="form-group">
        <label for="entidadFinanciera">Código: <span class="text-danger">*</span> </label>
        <input type="text" class="form-control" formControlName="codigo">
      </div>
    </div>
    <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12 d-flex align-items-center">
      <div class="icheck-primary ">
        <input type="checkbox" formControlName="controlCaja"  name="controlCaja" id="controlCaja">
        <label for="controlCaja">Registro cuadre de caja</label>
      </div>
    </div>
  </div>

  @if (params.idSubEntidadFinanciera>0) {

    <div class="row justify-content-between"  >
      <div class="col-lg-3">
        <div class="icheck-primary">
          <input type="radio" formControlName="estado" [value]="true" id="someRadioId1" name="estado" />
          <label for="someRadioId1">Activo</label>
        </div>
      </div>
      <div class="col-lg-3">
        <div class="icheck-primary">
          <input type="radio" formControlName="estado" [value]="false" id="someRadioId2" name="estado" />
          <label for="someRadioId2">Inactivo</label>
        </div>
      </div>
    </div>
  }

</div>
<div class="modal-footer">
  <button type="submit" class="btn btn-success">
    {{btnText}}
  </button>
  <button type="button" class="btn btn-dark" (click)="modal.dismiss( )">
    &times; Cerrar
  </button>
</div>
</form>
