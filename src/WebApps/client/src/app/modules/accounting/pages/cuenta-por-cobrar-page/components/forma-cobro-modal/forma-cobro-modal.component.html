<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">Forma de Cobro</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
</div>
<div class="modal-body">
  @if (entidadesFinanciera.length>0) {
  <div ngbAccordion [closeOthers]="true">
    @for (item of entidadesFinanciera; track $index) {
    <div ngbAccordionItem [collapsed]="item.codigo !== 'EFE'" (show)="onChangeTabEntidadFinanciera($index)">
      <h2 ngbAccordionHeader>
        <button ngbAccordionButton>{{ item.descripcion }}</button>
      </h2>
      <div ngbAccordionCollapse>
        <div ngbAccordionBody>
          <ng-template>

            <!--TARJETA-->
            @if (item.codigo==='TAR') {
            <div class="row">
              <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 col-12">
                <app-sub-entidad-financiera [(value)]="data.idSubEntidadFinanciera"
                  [subEntidadesFinanciera]="subEntidadesFinanciera" />
              </div>

              <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 col-12">
                <app-fecha-emision [(value)]="data.fechaEmision" />
              </div>

              <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 col-12">
                <app-valor-abono [(value)]="data.valorAbono" />
              </div>
            </div>

            <div class="row">
              <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 col-12">
                <div class="form-group">
                  <label for="Referencia">Referencia: </label>
                  <input type="text" ng-model="data.referencia" class="form-control border-select" />
                </div>
              </div>
              <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 col-12">
                <div class="form-group">
                  <label>Aprobación </label>
                  <input type="text" ng-model="data.aprobacion" class="form-control border-select" />
                </div>
              </div>

              <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 col-12">
                <div class="form-group">
                  <label for="lote">Lote: </label>
                  <input type="text" ng-model="data.lote" class="form-control border-select" />
                </div>
              </div>
            </div>
            }


            <!--EFECTIVO-->
            @if (item.codigo==="EFE") {
            <div class="row">
              <div class="col-lg-4 col-md-4 col-sm-6 col-12">
                <app-sub-entidad-financiera [value]="data.idSubEntidadFinanciera"
                  [subEntidadesFinanciera]="subEntidadesFinanciera" />
              </div>

              <div class="col-lg-4 col-md-4 col-sm-6 col-12">
                <app-fecha-emision [(value)]="data.fechaEmision" />
              </div>
              <div class="col-lg-4 col-md-4 col-sm-12 col-12">
                <app-valor-abono [(value)]="data.valorAbono" />
              </div>
            </div>
            }

            <!--TRANSFERENCIA-->
            @if (item.codigo==='TRA') {

            <div class="row">
              <div class="col-lg-4 col-md-4 col-sm-6 col-12">
                <app-sub-entidad-financiera [value]="data.idSubEntidadFinanciera"
                  [subEntidadesFinanciera]="subEntidadesFinanciera" />
              </div>

              <div class="col-lg-4 col-md-4 col-sm-6 col-12">
                <app-fecha-emision [(value)]="data.fechaEmision" />
              </div>
              <div class="col-lg-4 col-md-4 col-sm-12 col-12">
                <app-valor-abono [(value)]="data.valorAbono" />
              </div>
            </div>

            <div class="row">
              <div class="col-lg-6 col-md-6 col-sm-12 col-12">
                <app-banco-select [(value)]="data.idBanco" [bancos]="bancos" />
              </div>
              <div class="col-lg-6 col-md-6 col-sm-12 col-12">
                <div class="form-group">
                  <label>Número <span class="text-danger">*</span></label>
                  <input type="text" ng-model="data.nro" class="form-control border-select" />
                </div>
              </div>
            </div>

            }

            <!--CHEQUE-->
            @if (item.codigo==="CHE") {

            <div class="row">
              <div class="col-lg-4 col-md-4 col-sm-6 col-12">
                <app-sub-entidad-financiera [value]="data.idSubEntidadFinanciera"
                  [subEntidadesFinanciera]="subEntidadesFinanciera" />
              </div>
              <div class="col-lg-4 col-md-4 col-sm-6 col-12">
                <app-fecha-emision [(value)]="data.fechaEmision" />
              </div>
              <div class="col-lg-4 col-md-4 col-sm-12 col-12">
                <app-valor-abono [(value)]="data.valorAbono" />
              </div>
            </div>

            <div class="row">
              <div class="col-lg-4 col-md-4 col-sm-12 col-12">
                <div class="form-group">
                  <label>Ciudad</label>
                  <select class="form-control border-select" ng-model="data.idCiudad" id="ciudad"
                    ng-options="cp.idCiudad as cp.descripcion group by cp.provincia for cp in ciudades">
                  </select>
                </div>
              </div>

              <div class="col-lg-4 col-md-4 col-sm-12 col-12">
                <app-banco-select [(value)]="data.idBanco" [bancos]="bancos" />
              </div>
              <div class="col-lg-4 col-md-4 col-sm-12 col-12">
                <div class="form-group">
                  <label>Número: <span class="text-danger">*</span></label>
                  <input type="text" ng-model="data.nro" class="form-control border-select" />
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-xl-8 col-lg-8 col-md-6 col-sm-12 col-12">
                <div class="form-group">
                  <label for="">Dirigido a:</label>
                  <input type="text" class="form-control border-select" [(ngModel)]="data.referencia">
                </div>
              </div>

              <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
                <div class="form-group">
                  <label>PosFechado</label>
                  <div class="icheck-primary">
                    <input type="checkbox" ng-model="data.posFechado" id="posFechado" />
                    <label for="posFechado"></label>
                  </div>
                </div>
              </div>
            </div>
            }

          </ng-template>
        </div>
      </div>
    </div>
    }
  </div>
  }
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-success" ng-click="addFormaPago()" id="btnAddFormaPago">
    Abonar
  </button>
  <button type="button" class="btn btn-dark" (click)="modal.dismiss()">
    &times; Cerrar
  </button>
</div>
