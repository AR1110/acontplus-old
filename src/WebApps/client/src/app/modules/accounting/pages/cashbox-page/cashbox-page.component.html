<app-breadcrumb/>

<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="col-md-2 col-12">
        <button
          (click)="openModalAddUpdate()"
          appActionAdd
          class="btn btn-info d-none d-lg-block m-l-15 text-white"
          type="button"
        >
          <fa-icon [icon]="'plus'"></fa-icon>
          Nuevo
        </button>
      </div>
      <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
        <div class="d-flex justify-content-start">
          <span class="form-group pull-left page-size form-inline">
            <select
              (change)="changePageSize()"
              [(ngModel)]="dataSearch.pageSize"
              class="form-select control-color"
            >
              @for (item of recordsQuantity; track $index) {
                <option [ngValue]="item">{{ item }}</option>
              }
            </select>
          </span>
        </div>
      </div>
      <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
        <div class="d-flex justify-content-end">
          <!-- <form class="form-material">
            <input
              type="text"
              class="form-control"
              ng-model="buscar"
              placeholder="..."
            />
          </form> -->
        </div>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table">
        <thead>
        <tr>
          <th></th>
          <th>N°</th>
          <th>Usuario</th>
          <th>Caja</th>
          <th>Turno</th>
          <th>Actividad</th>
          <th>Estado</th>
        </tr>
        </thead>
        <tbody>
          @for (item of cashboxs; track $index) {
            <tr>
              <td>
                <div ngbDropdown container="body">
                  <button
                    type="button"
                    class="btn btn-outline-primary btn-sm"
                    ngbDropdownToggle
                  >
                    Acciones
                  </button>
                  <div ngbDropdownMenu>
                    <button ngbDropdownItem (click)="openModalAddUpdate(item)" appActionEdit>
                      <fa-icon [icon]="'edit'"></fa-icon>
                      Editar
                    </button>

                    <button ngbDropdownItem (click)="askToDelete(item.idCaja)" appActionDelete>
                      <fa-icon [icon]="'trash'"></fa-icon>
                      Eliminar
                    </button>

                    <button ngbDropdownItem (click)="openModalAperturar(item)" appActionAperturaCaja>
                      <fa-icon [icon]="'briefcase'"></fa-icon>
                      Aperturar
                    </button>
                    <button ngbDropdownItem (click)="openModalMovimiento(item)" appActionMovCaja>
                      <fa-icon [icon]="'wallet'"></fa-icon>
                      Movimientos
                    </button>
                  </div>
                </div>
              </td>
              <td>{{ $index + 1 }}</td>

              <td>{{ item.usuario }}</td>
              <td>{{ item.descripcion }}</td>
              <td>{{ item.turno }}</td>
              <td>{{ item.actividad }}</td>
              <td>
                @if (item.estado) {
                  <span class="label label-success">Activo</span>
                }
              </td>
            </tr>
          }
        </tbody>
        <tfoot>
        <tr>
          <td align="center" colspan="7">
            <ngb-pagination
              (pageChange)="pageChanged()"
              [(page)]="dataSearch.pageIndex"
              [boundaryLinks]="true"
              [collectionSize]="totalRecords"
              [maxSize]="dataSearch.maxSize"
              [pageSize]="dataSearch.pageSize"
              [rotate]="true"
            />
          </td>
        </tr>
        </tfoot>
      </table>
    </div>
  </div>
</div>
