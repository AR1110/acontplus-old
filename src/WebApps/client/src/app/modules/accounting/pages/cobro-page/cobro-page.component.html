<app-breadcrumb/>

<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="col-xxl-3 col-xl-3 col-lg-3 col-md-4 col-sm-6 col-12">
        <div class="form-group">
          <label for="establish">Establecimiento: <span class="text-danger">*</span></label>
          <select name="establish" id="establish" class="form-select" [(ngModel)]="dataSearch.codEstab" (change)="getComprobantesIngreso()">
            @for (item of establecimientos; track $index) {
              <option [ngValue]="item.codEstab">{{item.nombreComercial}}</option>
            }
          </select>
        </div>
      </div>
      <div class="col-xxl-3 col-xl-3 col-lg-3 col-md-4 col-sm-6 col-12">
        <div class="form-group">
        <label for="dateRangeSelection">Rango Fechas: </label>
        <app-date-range-selection
          (onChangeDateRange)="onDateRangeSelection($event)"
        />
      </div>
      </div>
      <div class="col-xxl-3 col-xl-3 col-lg-3 col-md-4 col-sm-6 col-12"></div>
      <div class="col-xxl-3 col-xl-3 col-lg-3 col-md-4 col-sm-6 col-12"></div>
    </div>

    <div class="table-responsive ">
      <table class="table table-striped table-fixed">
        <thead >
          <tr>
            <th></th>
            <th>N°</th>
            <th>Nro. Doc.</th>
            <th>Fecha Emisión</th>
            <th>Cliente</th>
            <th>Total</th>
            <th>Abono</th>
            <th>Cambio</th>
            <th>Usuario</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
          @for (item of comprobantesIngreso; track $index) {
            <tr>
              <td></td>
              <td>{{$index+1}}</td>
              <td>{{item.nroDoc}}</td>
              <td>{{item.fechaRegistro}}</td>
              <td>{{item.cliente}}</td>
              <td>{{item.total}}</td>
              <td>{{item.abono}}</td>
              <td>{{item.cambio}}</td>
              <td>{{item.usuario}}</td>
              <td>{{item.estado}}</td>
            </tr>
          }
          @empty {
            <tr>
              <td colspan="10" class="text-center">No hay registros!</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
