<div class="row">
  <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
    <div class="form-gorup">
      <label for="establecimiento">Establecimiento</label>
      <select
        name="establecimiento"
        id="establecimiento"
        ng-model="$ctrl.dataSearchAnticipo.codEstab"
        class="form-select border-select"
        ng-change="$ctrl.getAnticipos()"
      >
        <option
          ng-value="item.codEstab"
          ng-repeat="item in $ctrl.establecimientos"
        ></option>
      </select>
    </div>
  </div>
  <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
    <div class="form-group"></div>
  </div>
  <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
    <div class="form-group">
      <label for="clienteFiltro">Cliente</label>
      <input
        type="text"
        id="customerInputSearch"
        class="form-control border-select"
        ng-model="$ctrl.dataSearchAnticipo.selelectedCliente"
        cliente-search-drtv
        placeholder="Ingrese C.I o Nombre Comercial"
        onclick="select();"
      />

      <script type="text/ng-template" id="autocompleteClienteTemplate.html">
        <div class="autocomplete-suggestion-uib-typeahead">
            <span class="item-title"><b> {{match.model.numeroIdentificacion}}</b> - {{match.model.nombreFiscal}}</span>
        </div>
      </script>
    </div>
  </div>
  <div class="col-xl-2 col-lg-2 col-md-6 col-sm-12 col-12">
    <div class="button-group">
      <button
        type="button"
        class="btn btn-info btn-sm mt-4"
        data-toggle="button"
        data-more="#sh"
        aria-pressed="false"
        ng-click="$ctrl.onClickBtnMoreAnticipo()"
      >
        <fa-icon [icon]="'eye'"></fa-icon>
      </button>
      <button
        type="button"
        class="btn btn-danger btn-sm mt-4"
        uib-tooltip="Recargar"
        (click)="refresh()"
      >
        <fa-icon [icon]="'redo'"></fa-icon>
      </button>
      <button
        type="button"
        class="btn btn-success btn-sm mt-4"
        (click)="openModal()"
      >
        <i class="ti-plus"></i>
      </button>
    </div>
  </div>
</div>

<div
  class="row justify-content-between"
  ng-if="$ctrl.moreSearchOptionsAnticipo"
>
  <div class="col-xl-3 col-lg-3 col-md-12 col-sm-12 col-12">
    <div class="form-group">
      <label for="estado">Estado:</label>
      <select
        id="estadoDocumentos"
        class="form-control"
        ng-model="$ctrl.dataSearch.codEstado"
        ng-change="$ctrl.getAnticipos()"
      >
        <option value="">Todos</option>
        <option
          ng-value="item.codigo"
          ng-repeat="item in $ctrl.estadoDocumentos"
        ></option>
      </select>
    </div>
  </div>
  <div class="col-xl-3 col-lg-3 col-md-12 col-sm-12 col-12">
    <div class="form-group">
      <label for="buscador">Buscar</label>
      <input
        type="text"
        class="form-control border-select"
        ng-change="$ctrl.searchFilterLocal()"
        ng-model="$ctrl.dataSearchAnticipo.bySearch"
        placeholder="Ej: 001-002"
      />
    </div>
  </div>
</div>

<div class="row">
  <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
    <div class="d-flex justify-content-start">
      <span class="form-group">
        <select
          class="form-select"
          [(ngModel)]="dataSearch.pageSize"
          (change)="changePageSize()"
        >
          @for(item of recordsQuantity; track $index){
          <option [value]="item">{{ item }}</option>
          }
        </select>
      </span>
    </div>
  </div>
  <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
    <div class="d-flex justify-content-end">
      <!-- <form class="form-material">
            <input
              type="text"
              class="form-control"
              ng-model="buscar"
              placeholder="..."
            />
          </form> -->
    </div>
  </div>
</div>

<div class="table-responsive">
  <table class="table table-striped">
    <thead>
      <tr>
        <th></th>
        <th>N°</th>

        <th>Fecha</th>
        <th>Nro. Doc</th>
        <th>E. Financiera</th>
        <th>Valor</th>
        <th>Observación</th>
        <th>Cliente</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody>
      @for (item of anticipos; track $index) {
      <tr>
        <td>
          <div ngbDropdown container="body">
            <button
              type="button"
              class="btn btn-outline-primary btn-sm"
              ngbDropdownToggle
            >
              Acciones
            </button>
            <div ngbDropdownMenu>
              <button ngbDropdownItem (click)="getPrint(item)">
                <i class="ti-printer"></i>

                Imprimir
              </button>

              <button ngbDropdownItem (click)="getReport(item)">
                <fa-icon [icon]="'file-pdf'"></fa-icon>
                Reporte
              </button>
              <button ngbDropdownItem (click)="askToDelete(item)">
                <fa-icon [icon]="'trash-alt'"></fa-icon>
                Anular
              </button>
            </div>
          </div>
        </td>
        <td>{{ $index + 1 }}</td>
        <td>{{ item.fechaEmision }}</td>
        <td>{{ item.serieComprobante }}</td>
        <td>{{ item.subEntidadFinanciera }}</td>
        <td>${{ item.valor }}</td>
        <td>{{ item.obs }}</td>
        <td>{{ item.razonSocialCiente }}</td>
        <td>{{ item.estadoDoc }}</td>
      </tr>

      }
    </tbody>
    <tfoot>
      <tr>
        <td align="center" colspan="9">
          <ngb-pagination
            [collectionSize]="totalRecords"
            [(page)]="dataSearch.pageIndex"
            [maxSize]="dataSearch.maxSize"
            [pageSize]="dataSearch.pageSize"
            [rotate]="true"
            (pageChange)="pageChanged()"
            [boundaryLinks]="true"
          />
        </td>
      </tr>
    </tfoot>
  </table>
</div>
