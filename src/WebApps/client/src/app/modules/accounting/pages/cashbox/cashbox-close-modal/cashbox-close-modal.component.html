<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">Cierra caja</h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="closeModal()"
  ></button>
</div>
<div class="modal-body">
  <div class="row">
    @for(item of monedas; track $index){
    <div class="col-lg-3 col-md-3 col-sm-4 col-12">
      <div class="form-group">
        <h6>{{ item.descripcion }}</h6>
        <input
          type="number"
          class="form-control form-control-border"
          [(ngModel)]="item.cantidad"
          (input)="onChangeQuantity()"
          onclick="select();"
        />
      </div>
    </div>
    }
  </div>
  <h5 class="ml-auto text-info">
    Total: <span>{{ totalArqueo | currency: '$' }}</span>
  </h5>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-success" (click)="save()">
    <i class="ti-save"></i> Guardar
  </button>
  <button type="button" class="btn btn-dark" (click)="closeModal()">
    &times; Cerrar
  </button>
</div>
