<form autocomplete="off" [formGroup]="dataForm" (ngSubmit)="save()">
  <div class="modal-header">
    <h5 class="modal-title">Anticipo</h5>
    <button class="btn-close" (click)="closeModal()"></button>
  </div>
  <div class="modal-body">
    <div class="form-group">
      <label for="exstablecimiento"
        >Establecimiento: <span class="text-danger">*</span></label
      >
      <select
        name="establecimiento"
        id="establecimiento"
        class="form-select form-control-border"
        formControlName="codEstab"
      >
        @for (item of establecimientos; track $index) {
        <option [ngValue]="item.codEstab">
          {{ item.nombreComercial }}
        </option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="company-customer-search"
        >Cliente: <span class="text-danger">*</span></label
      >
      <app-company-customer-search
        [isSearchSimple]="isSearchSimpleCompanyCustomer"
        (onCustomerSelected)="onCustomerSelected($event)"
      />
    </div>

    <div class="form-group">
      <label for="entidadFinanciera"
        >Entidad Financiera: <span class="text-danger">*</span></label
      >
      <select
        name="idEntidadFinanciera"
        class="form-select form-control-border"
        (change)="onChangeEntidadFinanciera()"
        formControlName="idEntidadFinanciera"
        required
      >
        @for (item of entidadesFinanciera; track $index) {

        <option [ngValue]="item.idEntidadFinanciera">
          {{ item.descripcion }}
        </option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="">Sub Entidad Financiera</label>
      <select
        class="form-select form-control-border"
        formControlName="idSubEntidadFinanciera"
        name="idSubEntidadFinanciera"
        required
      >
        @for (item of subEntidadesFinanciera; track $index) {
        <option [ngValue]="item.idSubEntidadFinanciera">
          {{ item.descripcion }}
        </option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="">Valor <span class="text-danger">*</span></label>
      <input
        type="number"
        class="form-control form-control-border"
        placeholder="0.00"
        formControlName="valor"
        name="valor"
        required
      />
    </div>

    <div class="form-group">
      <label for="observaciones">Observación </label>
      <textarea
        name="observaciones"
        class="form-control form-control-border"
        formControlName="observaciones"
        touppercase
      ></textarea>
    </div>
  </div>
  <div class="modal-footer">
    <button type="submit" class="btn btn-success">
      <i class="ti-{{ iconBtn }}"></i>
      {{ textBtn }}
    </button>
    <button type="button" class="btn btn-dark" (click)="closeModal()">&times; Cerrar</button>
  </div>
</form>
