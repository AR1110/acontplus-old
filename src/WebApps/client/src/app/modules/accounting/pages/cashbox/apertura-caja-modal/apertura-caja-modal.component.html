<form autocomplete="off" [formGroup]="dataForm" (ngSubmit)="save()">
  <div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">Apertura Caja</h4>
    <button
      type="button"
      class="btn-close"
      aria-label="Close"
      (click)="closeModal()"
    ></button>
  </div>

  <div class="modal-body">
    <div class="form-group">
      <label for="entidadesFinanciera"
        >Entidad Financiera <span class="text-danger">*</span>
      </label>
      <select
        class="form-control form-control-border"
        formControlName="idEntidadFinanciera"
      >
        @for (item of entidadesFinanciera; track $index) {
        <option [ngValue]="item.idEntidadFinanciera">
          {{ item.descripcion }}
        </option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="concepto">Concepto <span class="text-danger">*</span></label>
      <input
        class="form-control border-select"
        touppercase
        type="text"
        formControlName="concepto"
      />
    </div>
    <div class="form-group">
      <label for="concepto">Valor <span class="text-danger">*</span></label>
      <input
        class="form-control border-select"
        decimal
        type="number"
        formControlName="entrada"
      />
    </div>
  </div>
  <div class="modal-footer">
    <button type="submit" class="btn btn-success" [disabled]="!dataForm.valid">
      <i class="ti-save"></i> Guardar
    </button>
    <button type="button" class="btn btn-dark" (click)="closeModal()">
      &times; Cerrar
    </button>
  </div>
</form>
