<app-breadcrumb>

</app-breadcrumb>

<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="col-4 d-flex justify-content-start">
        <span class="form-group pull-left page-size form-inline">
          <select class="form-select" ng-model="dataSearch.pageSize" >
            @for (item of pagination.pageSizeOptions; track $index) {
              <option [ngValue]="item">{{item}}</option>
            }
          </select>
        </span>
      </div>

      <div class="col-4 d-flex justify-content-center align-items-center">
          <div class="d-grid gap-2 text-center w-100">
            <button class="btn btn-success" type="button" (click)="openDocPaymentModal()">
              <fa-icon [icon]="'money-bill'"></fa-icon> Cobrar
            </button>
          </div>
      </div>
      <div class="col-4 d-flex justify-content-end">
        <div class="form-group">
          <input type="text" class="form-control border-select" ng-change="searchFilterLocal()"
            ng-model="dataSearch.bySearch" placeholder="...">
        </div>
      </div>
    </div>
    <app-tabulator-semantic-ui [columnNames]="columns" [tableData]="cuentasPorCobrar" [options]="tabOptions"/>
  </div>
</div>
