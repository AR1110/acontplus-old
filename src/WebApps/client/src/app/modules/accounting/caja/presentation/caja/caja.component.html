<app-breadcrumb />

<acp-dynamic-card>
  <div
    class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-1 row-cols-1 g-4"
  >
    <div class="col"></div>
    <div class="col">
      <div class="d-flex flex-row gap-2 justify-content-end">
        <button mat-flat-button appActionAdd (click)="openModalAddUpdate()">
          <mat-icon>add</mat-icon>
          Nuevo
        </button>
        <button mat-icon-button (click)="refresh()">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <app-mat-dynamic-table
    [tableData]="cashboxs()"
    [columnDefinitions]="columnsDefs"
    [visibleColumns]="columns"
    [templateOp]="templateOp"
    [paginationConfig]="pagination()"
    [enablePagination]="true"
    (pageEvent)="handlePageEvent($event)"
  />
</acp-dynamic-card>
<ng-template #templateOp let-item="item">
  <button mat-icon-button [matMenuTriggerFor]="menu" aria-hidden="false">
    <mat-icon>more_vert</mat-icon>
  </button>

  <mat-menu #menu="matMenu">
    <button mat-menu-item (click)="openModalAddUpdate(item)" appActionEdit>
      <mat-icon>update</mat-icon>
      <span>Editar</span>
    </button>
    <button mat-menu-item (click)="askToDelete(item.idCaja)" appActionDelete>
      <mat-icon>delete</mat-icon>
      <span>Eliminar</span>
    </button>

    <button mat-menu-item (click)="openModalAperturar(item)" appActionAperturaCaja>
      <mat-icon>lock_open</mat-icon>
      <span>Aperturar</span>
    </button>

    <button mat-menu-item (click)="openModalMovimiento(item)" appActionMovCaja>
      <mat-icon>show_chart</mat-icon>
      <span>Movimientos</span>
    </button>
  </mat-menu>
</ng-template>
