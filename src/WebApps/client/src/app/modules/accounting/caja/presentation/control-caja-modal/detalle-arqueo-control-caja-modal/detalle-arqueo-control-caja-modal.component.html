<app-mat-custom-dialog
  [containerTemplate]="body"
  [title]="'Detalle Arqueo Caja'"
  (close)="close()"
/>
<ng-template #body>
  <div class="vstack gap-2">
    <div class="hstack gap-2">
      <strong>Fecha Cierre:</strong>{{ this.params.fechaCierre }}
    </div>
    <div class="hstack gap-2">
      <strong>Total:</strong>{{total}}
    </div>
    <app-theme-button
      [variant]="'success'"
      [text]="'Descargar'"
      [icon]="'download'"
      (handleClick)="exportData()"
    />
  </div>

  <app-mat-dynamic-table
    [tableData]="arqueoCajaDetalle()"
    [columnDefinitions]="columnsDefs"
    [visibleColumns]="columns"
  />
</ng-template>
