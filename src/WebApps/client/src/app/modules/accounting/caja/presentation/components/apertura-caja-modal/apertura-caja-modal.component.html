<app-mat-custom-dialog
  [containerTemplate]="body"
  [actionsTemplate]="footer"
  [title]="'Apertura Caja'"
  (close)="close()"
/>
<ng-template #body>
  <form autocomplete="off" [formGroup]="dataForm" id="formData" (ngSubmit)="save()">
    <div class="d-grid gap-2">
      <mat-form-field class="w-100">
        <mat-label>Entidad Financiera</mat-label>
        <mat-select formControlName="idEntidadFinanciera">
          @for (item of entidadesFinanciera; track $index) {
            <mat-option [value]="item.idEntidadFinanciera">{{ item.descripcion }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field class="w-100">
        <mat-label>Valor</mat-label>
        <input type="number" matInput formControlName="entrada" />
      </mat-form-field>
    </div>
  </form>
</ng-template>
<ng-template #footer>
  <app-theme-button
    [variant]="'success'"
    [type]="'submit'"
    [form]="'formData'"
    [disabled]="!dataForm.valid"
    [text]="'Guardar'"
    [icon]="'save'"
  />
</ng-template>
