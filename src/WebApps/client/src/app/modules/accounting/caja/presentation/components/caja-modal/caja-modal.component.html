<app-mat-custom-dialog
  [containerTemplate]="body"
  [actionsTemplate]="footer"
  [title]="titleModal()"
  (close)="close()"
/>

<ng-template #body>
  <form autocomplete="off" id="dataForm" [formGroup]="dataForm" (ngSubmit)="save()">
    <div class="d-grid gap-2">
      <mat-form-field class="w-100">
        <mat-label>Descripción</mat-label>
        <input matInput formControlName="descripcion" placeholder="..." />
      </mat-form-field>

      <mat-form-field class="w-100">
        <mat-label>Usuario</mat-label>
        <mat-select formControlName="idUsuario">
          @for (item of usuarios(); track $index) {
            <mat-option [value]="item.idUsuario">{{ item.nombreUsuario }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field class="w-100">
        <mat-label>Turno</mat-label>
        <mat-select formControlName="idTurno">
          @for (item of turnos(); track $index) {
            <mat-option [value]="item.idTurno">{{ item.descripcion }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      @if (tipoRegistro === 2) {
        <mat-radio-group aria-label="Select an option" formControlName="estado">
          <mat-radio-button [value]="true">Activo</mat-radio-button>
          <mat-radio-button [value]="false">Inactivo</mat-radio-button>
        </mat-radio-group>
      }
    </div>
  </form>
</ng-template>
<ng-template #footer>
  <acp-button
    [type]="'submit'"
    variant="success"
    [icon]="btnIcon"
    [text]="btnText"
    [form]="'dataForm'"
  />
</ng-template>
