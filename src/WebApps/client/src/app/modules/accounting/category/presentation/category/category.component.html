<app-breadcrumb />
<acp-dynamic-card>
  <div class="row mb-3">
    <div class="col">
      <button (click)="onModalOpen()" mat-raised-button type="button">
        <mat-icon>add</mat-icon>
        Nuevo
      </button>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Opciones</th>
          <th class="text-center">#</th>
          <th>Tipo</th>
          <th>Código</th>
          <th>Nombre</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        @for (item of categories(); track $index) {
          <tr>
            <td class="text-center">
              <button mat-button [matMenuTriggerFor]="menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="edit(item)">
                  <mat-icon>edit</mat-icon>
                  Editar
                </button>
              </mat-menu>
            </td>
            <td class="text-center">{{ $index + 1 }}</td>
            <td>{{ item.tipoName }}</td>
            <td>{{ item.code }}</td>
            <td>{{ item.name }}</td>
            <td>
              <div [innerHTML]="item.enabled | secondaryStatus"></div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</acp-dynamic-card>
