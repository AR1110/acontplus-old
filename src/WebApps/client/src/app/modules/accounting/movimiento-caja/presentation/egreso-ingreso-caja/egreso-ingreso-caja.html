<div class="row">
  <div class="col-xxl-10 col-xl-10 col-md-10 col-sm-12 col-12">
    <div
      class="row row-cols-xxl-3 row-cols-xl-3 row-cols-lg-3 row-cols-md-2 row-cols-sm-2 row-cols-1 g-4"
    >
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Establecimiento</mat-label>
          <mat-select [(ngModel)]="dataSearch.codEstab" (selectionChange)="getMovimientosCaja()">
            @for (item of establecimientos; track $index) {
              <mat-option [value]="item.codEstab">{{ item.nombreComercial }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <app-date-range-selection
          [showMatSuffix]="true"
          [(checkbox)]="dataSearch.enableDateFilter"
          (onCheckboxChange)="refresh()"
          (onChangeDateRange)="onDateRangeSelection($event)"
          [showInputMaterial]="true"
        />
      </div>
      <div class="col">
        <app-company-customer-search
          (customerSelected)="onSelectCustomer($event)"
          (clearSearch)="onEmptyCustomer()"
          [isSimpleMode]="true"
        />
      </div>
    </div>
  </div>
  <div class="col-xxl-2 col-xl-2 col-md-2 col-sm-12 col-12">
    <div class="hstack gap-2">
      <button mat-icon-button aria-label="refresh" (click)="refresh()">
        <mat-icon>refresh</mat-icon>
      </button>
      @if ($userRoleStateManager.canCreate()) {
        <button mat-icon-button aria-label="Add" (click)="openModal()">
          <mat-icon>add</mat-icon>
        </button>
      }
    </div>
  </div>
</div>

<app-mat-dynamic-table
  [isLoadingData]="isLoadingResults()"
  [tableData]="dataSource"
  [columnDefinitions]="columnsDefs"
  [visibleColumns]="columns"
  [templateOp]="templateOp"
  [paginationConfig]="pagination()"
  [enablePagination]="true"
  (pageEvent)="handlePageEvent($event)"
/>

<ng-template #templateOp let-item="item">
  <button mat-icon-button [matMenuTriggerFor]="menu" aria-hidden="false">
    <mat-icon>more_vert</mat-icon>
  </button>

  <mat-menu #menu="matMenu">
    @if ($userRoleStateManager.canGenerateReport()) {
      <button mat-menu-item (click)="getReport(item)">
        <mat-icon>download</mat-icon>
        <span>Reporte</span>
      </button>
    }

    <button mat-menu-item (click)="getPrint(item)">
      <mat-icon>print</mat-icon>
      <span>Imprimir</span>
    </button>

    @if ($userRoleStateManager.canCancel()) {
      <button mat-menu-item (click)="askToDelete(item)">
        <mat-icon>delete</mat-icon>
        <span>Anular</span>
      </button>
    }
  </mat-menu>
</ng-template>
