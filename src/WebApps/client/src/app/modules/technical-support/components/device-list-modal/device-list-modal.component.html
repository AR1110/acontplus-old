<div class="modal-header">
  <h5 class="modal-title"><mat-icon>search</mat-icon> Dispositivos</h5>
  <button
    type="button"
    class="btn-close"
    aria-hidden="false"
    (click)="onModalClose()"
  ></button>
</div>
<div class="modal-body">
  <div class="row">
    <div class="col">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Modelo</th>
              <th>Año</th>
              <th>Garantía</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            @for (item of devices; track $index) {
              <tr>
                <td>{{ item.name }}</td>
                <td>{{ item.model }}</td>
                <td>{{ item.year }}</td>
                <td>{{ item.deviceWarranty }}</td>
                <td>
                  <app-theme-button
                    matStyle="icon"
                    variant="info"
                    icon="arrow_forward"
                    text="Seleccionar Equipo"
                    (handleClick)="select(item)"
                  >
                  </app-theme-button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div class="modal-footer">
  <app-theme-button
    variant="dark"
    icon="close"
    text="Cerrar"
    (handleClick)="onModalClose()"
  >
  </app-theme-button>
</div>
