<div class="input-group">
  <input
    id="typeahead-devices"
    type="text"
    class="form-control"
    [(ngModel)]="textSearch"
    [ngbTypeahead]="search"
    [resultTemplate]="rt"
    [class.is-invalid]="searchFailed"
    (selectItem)="onDeviceSelect($event)"
    onclick="select();"
    (keyup)="onKeyupSearch()"
    placeholder="Buscar Equipo"
  />
  @if (device.id > 0 && !clearInput) {
  <button
    type="button"
    class="btn btn-outline-secondary btn-sm"
    (click)="openModal()"
  >
    <fa-icon [icon]="'edit'"></fa-icon>
  </button>
  } @else {
  <button
    type="button"
    class="btn btn-outline-secondary btn-sm"
    (click)="openModal()"
  >
    <fa-icon [icon]="'plus'"></fa-icon>
  </button>
  }
</div>
@if (searching) {
<small class="form-text text-muted">Buscando...</small>
} @if (searchFailed) {
<div class="invalid-feedback">
  Lo sentimos, no se han podido cargar las sugerencias.
</div>
}
<ng-template #rt let-r="result" let-t="term">
  <ngb-highlight
    [result]="r.name + ' - ' + r.year + ' - ' + r.modeloName"
    [term]="t"
  />
</ng-template>
