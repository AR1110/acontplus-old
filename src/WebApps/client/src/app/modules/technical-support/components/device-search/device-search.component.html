<div class="input-group">
  <input
    id="typeahead-devices"
    type="text"
    class="form-control"
    [(ngModel)]="textSearch"
    [ngbTypeahead]="search"
    [resultTemplate]="rt"
    [class.is-invalid]="searchFailed"
    (selectItem)="onDeviceSelect($event)"
    onclick="select();"
    (keyup)="onKeyupSearch()"
    placeholder="Buscar Equipo"
  />
  @if (device.id > 0 && !clearSearch) {
    <app-theme-button
      variant="secondary"
      icon="edit"
      matStyle="icon"
      (handleClick)="openModal()"
    >
    </app-theme-button>
  } @else {
    <app-theme-button
      variant="secondary"
      icon="add"
      matStyle="icon"
      (handleClick)="openModal()"
    >
    </app-theme-button>
  }
</div>
@if (searching) {
  <small class="form-text text-muted">Buscando...</small>
}
@if (searchFailed) {
  <div class="invalid-feedback">
    Lo sentimos, no se han podido cargar las sugerencias.
  </div>
}
<ng-template #rt let-r="result" let-t="term">
  <ngb-highlight
    [result]="r.name + ' - ' + r.year + ' - ' + r.modeloName"
    [term]="t"
  />
</ng-template>
