<div class="row">
  <div class="col-xl-3 col-lg-3 col-md-3 col-sm-12 col-12">
    <acp-dynamic-card>
      <canvas id="chartOrders" height="300px">{{ chartOrders }}</canvas>
    </acp-dynamic-card>
  </div>
  <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
    <acp-dynamic-card>
      <div class="row">
        <div class="col-md-12">
          <div class="d-flex no-block align-items-center">
            <div>
              <h3><mat-icon>settings</mat-icon></h3>
              <p class="text-muted">Ordenes</p>
            </div>
            <div class="ms-auto">
              <h2 class="counter text-primary">{{ totalOrders }}</h2>
            </div>
          </div>
        </div>
        <div class="col-12">
          <div class="progress">
            <div
              class="progress-bar bg-primary"
              role="progressbar"
              style="width: 85%; height: 6px"
              aria-valuenow="25"
              aria-valuemin="0"
              aria-valuemax="100"
            ></div>
          </div>
        </div>
      </div>
    </acp-dynamic-card>
  </div>
  <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
    <acp-dynamic-card>
      <div class="row">
        <div class="col-md-12">
          <div class="d-flex no-block align-items-center">
            <div>
              <h3><mat-icon>manage_accounts</mat-icon></h3>
              <p class="text-muted">Encargados</p>
            </div>
            <div class="ms-auto">
              <h2 class="counter text-info">{{ totalEmployes }}</h2>
            </div>
          </div>
        </div>
        <div class="col-12">
          <div class="progress">
            <div
              class="progress-bar bg-info"
              role="progressbar"
              style="width: 85%; height: 6px"
              aria-valuenow="25"
              aria-valuemin="0"
              aria-valuemax="100"
            ></div>
          </div>
        </div>
      </div>
    </acp-dynamic-card>
  </div>
  <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
    <acp-dynamic-card>
      <div class="row">
        <div class="col-md-12">
          <div class="d-flex no-block align-items-center">
            <div>
              <h3><mat-icon>person</mat-icon></h3>
              <p class="text-muted">Clientes</p>
            </div>
            <div class="ms-auto">
              <h2 class="counter text-success">{{ totalCustomers }}</h2>
            </div>
          </div>
        </div>
        <div class="col-12">
          <div class="progress">
            <div
              class="progress-bar bg-success"
              role="progressbar"
              style="width: 85%; height: 6px"
              aria-valuenow="25"
              aria-valuemin="0"
              aria-valuemax="100"
            ></div>
          </div>
        </div>
      </div>
    </acp-dynamic-card>
  </div>
</div>
<div class="row mt-2">
  <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
    <app-order-list />
  </div>
</div>
