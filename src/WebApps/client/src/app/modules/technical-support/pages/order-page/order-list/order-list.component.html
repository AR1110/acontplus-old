<div class="row mt-2">
  @if (orderStatusCode === 2) {
    <div class="col-xl-2 col-lg-2 col-md-2 col-sm-3 col-12">
      <div class="form-group">
        <acp-button variant="success" icon="add" text="Nueva" (handleClick)="onModalOpen()" />
      </div>
    </div>
  }
  <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
    <div class="form-group">
      <app-date-range-selection (onChangeDateRange)="onDateRangeSelection($event)" />
    </div>
  </div>
  <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
    <div class="form-group">
      <label for="assignedUsers">Usuarios Asignados:</label>
      <select
        name="assignedUsers"
        id="assignedUsers"
        class="form-select"
        [(ngModel)]="dataSearch.assignedUserId"
        (change)="get()"
      >
        <option [ngValue]="0" selected>Todos</option>
        @for (item of users; track $index) {
          <option [ngValue]="item.idUsuario">{{ item.nombreUsuario }}</option>
        }
      </select>
    </div>
  </div>
  <div class="col-xl-4 col-lg-4 col-md-4 col-sm-12 col-12">
    <div class="form-group">
      <label for="customer">Cliente:</label>
      <input
        type="text"
        id="customer"
        name="customer"
        class="form-control"
        (keyup)="dataSearch.customer.length > 3 ? get() : null"
        [(ngModel)]="dataSearch.customer"
      />
    </div>
  </div>
</div>

<acp-data-grid
  [data]="orders()"
  [columns]="columns"
  [pageIndex]="pagination().pageIndex"
  [pageSize]="pagination().pageSize"
  (page)="handlePageEvent($event)"
  [cellTemplate]="{
    op: templateOp,
  }"
/>

<ng-template #templateOp let-data>
  <acp-button variant="secondary" icon="more_vert" matStyle="icon" [matMenuTriggerFor]="menu" />
  <mat-menu #menu="matMenu">
    @if (orderStatusCode === 2 || orderStatusCode === 3) {
      <button mat-menu-item (click)="openModalMaintenance(data)" title="Iniciar Reparaciones">
        <mat-icon>settings</mat-icon>
        Mantenimiento
      </button>
    }
    @if (orderStatusCode === 2 || orderStatusCode === 3) {
      <button mat-menu-item (click)="onEdit(data)" title="Editar">
        <mat-icon>edit</mat-icon>
        Editar
      </button>
    }
    @if (orderStatusCode === 2) {
      <button mat-menu-item (click)="askToCancel(data)" title="Anular">
        <mat-icon>lock</mat-icon>
        Anular
      </button>
    }
    <button mat-menu-item (click)="getReport(data)" title="Reporte">
      <mat-icon>download</mat-icon>Reporte
    </button>

    @if (orderStatusCode === 4) {
      <button mat-menu-item (click)="askToDelivery(data)" title="Entregar">
        <mat-icon>place_item</mat-icon>
        Entregar
      </button>
    }
    @if (orderStatusCode === 4 || orderStatusCode === 5) {
      <button mat-menu-item (click)="onOpenDocument(data)" title="Documento">
        <mat-icon>settings</mat-icon>
        Documento vinculado
      </button>
    }
  </mat-menu>
</ng-template>
