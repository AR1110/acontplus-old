<div class="table-responsive mt-2">
  <table class="table table-hover">
    <thead>
      <tr>
        <th>#</th>
        <th>Acciones</th>
        <th>Nombre</th>
        <th>Marca</th>
        <th>Modelo</th>
        <th>Año</th>
        <th>Color</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody>
      @for (item of devices(); track $index) {
        <tr>
          <td>{{ $index + 1 }}</td>
          <td>
            <app-theme-button variant="warning" icon="edit" title="Editar" matStyle="icon" (click)="onEdit(item)" />
            <app-theme-button variant="danger"
              icon="delete"
              title="Eliminar"
              matStyle="icon"
              (handleClick)="askToDelete(item)"
             />
            <app-theme-button icon="group" matStyle="icon" title="Clientes" (handleClick)="getCustomers(item.id)" />
          </td>
          <td>{{ item.name }}</td>
          <td>{{ item.brandName }}</td>
          <td>{{ item.modeloName }}</td>
          <td>{{ item.year }}</td>
          <td>{{ item.color }}</td>
          <td>
            <div class="form-check form-switch">
              <input
                class="form-check-input"
                type="checkbox"
                role="switch"
                id="flexSwitchCheckChecked"
                [checked]="item.enabled === 1"
                (change)="updateStatus(item)"
              />
              <label class="form-check-label" for="flexSwitchCheckChecked"></label>
            </div>
          </td>
        </tr>
      }
    </tbody>
    @if (devices.length === 0) {
      <tfoot>
        <tr>
          <td colspan="6">No se encontraron registros</td>
        </tr>
      </tfoot>
    }
  </table>
</div>
