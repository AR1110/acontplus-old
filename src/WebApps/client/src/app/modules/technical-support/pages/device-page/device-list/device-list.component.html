<div class="table-responsive mt-2">
  <table class="table table-hover">
    <thead>
      <tr>
        <th>#</th>
        <th>Acciones</th>
        <th>Nombre</th>
        <th>Marca</th>
        <th>Modelo</th>
        <th>Año</th>
        <th>Color</th>
      </tr>
    </thead>
    <tbody>
      @for (item of devices; track $index) {
      <tr>
        <td>{{ $index + 1 }}</td>
        <td>
          <button
            type="button"
            class="btn btn-outline-warning btn-sm btn-rounded"
            title="Editar"
            (click)="edit(item)"
          >
            <fa-icon [icon]="'edit'"></fa-icon>
          </button>
          <button
            type="button"
            class="btn btn-outline-danger btn-sm btn-rounded m-lg-1"
            title="Eliminar"
            (click)="askToDelete(item)"
          >
            <fa-icon [icon]="'trash'"></fa-icon>
          </button>
          <button
            type="button"
            class="btn btn-outline-info btn-sm btn-rounded m-lg-1"
            title="Clientes"
            (click)="getCustomers(item.id)"
          >
            <fa-icon [icon]="'users-line'"></fa-icon>
          </button>
        </td>
        <td>{{ item.name }}</td>
        <td>{{ item.brand }}</td>
        <td>{{ item.model }}</td>
        <td>{{ item.year }}</td>
        <td>{{ item.color }}</td>
      </tr>
      }
    </tbody>
    @if(devices.length == 0){
    <tfoot>
      <tr>
        <td colspan="6">No se encontraron registros</td>
      </tr>
    </tfoot>
    }
  </table>
</div>
