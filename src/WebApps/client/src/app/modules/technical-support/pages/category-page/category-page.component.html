<app-breadcrumb />
<mat-card appearance="outlined">
  <mat-card-content>
    <div class="row mb-3">
      <div class="col-md-2 col-12">
        <button (click)="onModalOpen()" mat-raised-button type="button">
          <mat-icon>add</mat-icon>
          Nueva
        </button>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th class="text-center">#</th>
            <th>Código</th>
            <th>Nombre</th>
            <th>Opciones</th>
          </tr>
        </thead>
        <tbody>
          @for (item of categories; track $index) {
            <tr>
              <td class="text-center">{{ $index + 1 }}</td>
              <td>{{ item.code }}</td>
              <td>{{ item.name }}</td>
              <td>
                <button
                  type="button"
                  class="btn btn-outline-warning btn-sm m-r-5"
                  (click)="onEdit(item)"
                >
                  <mat-icon>edit</mat-icon>
                </button>
                <app-theme-button
                  variant="danger"
                  icon="delete"
                  matStyle="icon"
                  (handleClick)="onDelete(item)"
                >
                </app-theme-button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </mat-card-content>
</mat-card>
