<div class="modal-header">
  <h5 class="modal-title"><fa-icon [icon]="'cogs'"></fa-icon> Reparaciones</h5>
  <button type="button" class="btn-close" (click)="closeModal()"></button>
</div>
<div class="modal-body">
  <div ngbAccordion [closeOthers]="true">
    @for (item of orderDetails; track $index) {
    <div ngbAccordionItem [collapsed]="$index !== 0">
      <h2 ngbAccordionHeader>
        <button ngbAccordionButton>
          {{ item.deviceName }}
        </button>
      </h2>
      <div ngbAccordionCollapse>
        <div ngbAccordionBody>
          <ng-template>
            <div class="row">
              <div class="col-xl-3 col-lg-3 col-md-3 col-sm-4 col-12">
                <div class="form-group">
                  <label for="estab-{{ item.id }}">Establecimiento:</label>
                  <select
                    name="estab-{{ item.id }}"
                    id="estab-{{ item.id }}"
                    class="form-select"
                  >
                    @for (estab of establecimientos; track $index) {
                    <option [ngValue]="estab.idEstablecimiento">
                      {{ estab.estab }}
                    </option>
                    }
                  </select>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
                <app-product-search
                  (onProductSelected)="onProductSelected($event)"
                />
              </div>
            </div>
            <div class="row mt-2">
              <div class="col">
                <div class="table-responsive">
                  <app-tabulator
                    [columnNames]="columnNames"
                    [tableData]="orderMaintenances"
                  ></app-tabulator>
                </div>
              </div>
            </div>
          </ng-template>
        </div>
      </div>
    </div>
    }
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-success" (click)="save()">
    <fa-icon [icon]="'save'"></fa-icon> Guardar
  </button>
  <button type="button" class="btn btn-outline-dark" (click)="closeModal()">
    &times; Cancelar
  </button>
</div>
