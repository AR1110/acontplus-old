<div class="modal-header">
  <h5 class="modal-title"><fa-icon [icon]="'cogs'"></fa-icon> Reparaciones</h5>
  <button type="button" class="btn-close" (click)="closeModal()"></button>
</div>
<div class="modal-body">
  <div class="row">
  <div class="col-xl-4 col-lg-4 col-md-6 col-sm-6 col-12">
    <div class="form-group">
      <label for="establishment">Establecimiento <span class="text-danger">*</span></label>
      <select name="establishment" id="establishment" class="form-select" [(ngModel)]="order.establecimientoId">
        @for (item of establecimientos; track $index) {
          <option [ngValue]="item.idEstablecimiento">{{item.nombreComercial}}</option>
        }
      </select>
    </div>

  </div>
  <div class="col-xl-4 col-lg-4 col-md-6 col-sm-6 col-12">
    <div class="form-group">
      <label for="puntoEmision">Punto Emisión <span class="text-danger">*</span></label>
      <select name="puntoEmision" id="puntoEmision" class="form-select" [(ngModel)]="order.puntoEmisionId">
        @for (item of puntosEmision; track $index) {
          <option [ngValue]="item.idPuntoEmision">{{item.ptoEmi}}</option>
        }
      </select>
    </div>
  </div>
  <div class="col-xl-4 col-lg-4 col-md-6 col-sm-6 col-12">
    <div class="form-group">
      <label for="fechaEmision">Fecha Emisión: <span class="text-danger">*</span></label>
      <input type="date" name="fechaEmision" id="fechaEmision" class="form-control">
    </div>
  </div>
</div>

<app-order-maintenance-detail/>


</div>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-success" (click)="save()">
    <fa-icon [icon]="'save'"></fa-icon> Guardar
  </button>
  <button type="button" class="btn btn-outline-dark" (click)="closeModal()">
    &times; Cancelar
  </button>
</div>
