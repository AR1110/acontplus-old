<form [formGroup]="fbConvertDoc" (ngSubmit)="convert()">
  <div class="modal-header">
    <h4 class="modal-title">
      <fa-icon [icon]="'sync-alt'"></fa-icon> Convertir
    </h4>
    <button type="button" class="btn-close" aria-hidden="true" aria-label="btn-close" (click)="closeModal()"></button>
  </div>
  <div class="modal-body">
    <div class="col-lg">
      <div class="form-floating">
        <select class="form-select"
            formControlName="code"
            name="code"
            id="floatingSelect"
            aria-label="Floating label select example"
          >
          <option selected disabled>::SELECCIONE::</option>
          @for (item of tipoDocumento; track $index) {
          <option [ngValue]="item.code">
            {{ item.code }} - {{ item.name }}
          </option>
          }
        </select>
        <label for="floatingSelect">Tipo Documento</label>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="submit" class="btn btn-outline-success" title="Guardar Orden">
      <fa-icon [icon]="'save'"></fa-icon> Guardar
    </button>
    <button type="button" class="btn btn-outline-dark" title="Cancelar Orden" (click)="closeModal()">
      &times; Cancelar
    </button>
  </div>
</form>
