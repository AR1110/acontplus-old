<app-breadcrumb />
<acp-dynamic-card>
  <mat-tab-group [selectedIndex]="selected()" (selectedIndexChange)="selectedIndexChange($event)">
    <mat-tab label="Dashboard">
      <ng-template matTabContent>
        <app-dashboard />
      </ng-template>
    </mat-tab>
    <mat-tab label="Por Asignar">
      <ng-template matTabContent>
        <app-order-list [orderStatusCode]="active()" />
      </ng-template>
    </mat-tab>
    <mat-tab label="En Proceso">
      <ng-template matTabContent>
        <app-order-list [orderStatusCode]="active()" />
      </ng-template>
    </mat-tab>
    <mat-tab label="Por Entregar">
      <ng-template matTabContent>
        <app-order-list [orderStatusCode]="active()" />
      </ng-template>
    </mat-tab>
    <mat-tab label="Entregadas">
      <ng-template matTabContent>
        <app-order-list [orderStatusCode]="active()" />
      </ng-template>
    </mat-tab>
    <mat-tab label="Sin Solución">
      <ng-template matTabContent>
        <app-order-list [orderStatusCode]="active()" />
      </ng-template>
    </mat-tab>
    <mat-tab label="Con Garantía">
      <ng-template matTabContent>
        <app-order-list [orderStatusCode]="active()" />
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</acp-dynamic-card>
