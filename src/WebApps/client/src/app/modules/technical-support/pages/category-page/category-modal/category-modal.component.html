<app-mat-custom-dialog
  [containerTemplate]="body"
  [actionsTemplate]="footer"
  [title]="modalTitle"
  (close)="onModalClose()"
/>
<ng-template #body>
  <form [formGroup]="categoryForm" id="categoryForm" (ngSubmit)="onSave()">
      <div class="row">
        <div class="col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
          <div class="form-group">
            <label for="code">Código:</label>
            <input
              type="text"
              formControlName="code"
              id="code"
              class="form-control"
              maxlength="25"
            />
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
          <div class="form-group">
            <label for="name">Nombre:</label>
            <input
              type="text"
              formControlName="name"
              id="name"
              class="form-control"
              maxlength="100"
            />
          </div>
        </div>
      </div>
  </form>
</ng-template>
<ng-template #footer>
  <app-theme-button
    [disabled]="categoryForm.invalid"
    variant="success"
    icon="save"
    text="Guardar"
    type="submit"
    form="categoryForm"
  />
</ng-template>
