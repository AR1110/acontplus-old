<app-breadcrumb />
<acp-dynamic-card>
  <div class="row mb-3">
    <div class="col-md-2 col-12">
      <button (click)="onModalOpen()" mat-raised-button type="button">
        <mat-icon>add</mat-icon>
        Nueva
      </button>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table">
      <thead>
        <tr>
          <th class="text-center">#</th>
          <th>Categoría</th>
          <th>Código</th>
          <th>Nombre</th>
          <th>Opciones</th>
        </tr>
      </thead>
      <tbody>
        @for (item of brands(); track $index) {
          <tr>
            <td class="text-center">{{ $index + 1 }}</td>
            <td>{{ item.categoryName }}</td>
            <td>{{ item.code }}</td>
            <td>{{ item.name }}</td>
            <td>
              <acp-button
                variant="warning"
                icon="edit"
                matStyle="icon"
                title="Editar"
                (handleClick)="onEdit(item)"
              />
              <acp-button
                variant="danger"
                icon="delete"
                matStyle="icon"
                title="Eliminar"
                (handleClick)="onDelete(item)"
              />
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</acp-dynamic-card>
