<form
  [formGroup]="orderDeliveryForm"
  (ngSubmit)="save()"
  autocapitalize="true"
  autocomplete="off"
>
  <div class="modal-header">
    <h4 class="modal-title"><mat-icon>place_item</mat-icon> Entregar</h4>
    <button type="button" class="btn-close" (click)="onModalClose()"></button>
  </div>
  <div class="modal-body">
    <h5>
      ¿Esta seguro de entregar esta orden al cliente
      <strong>{{ data.razonSocialComprador }}</strong
      >?
    </h5>

    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        value=""
        id="flexCheckChecked"
        (click)="enableIsOtherReceiver()"
        [checked]="isOtherReceiver"
      />
      <label class="form-check-label" for="flexCheckChecked">
        ¿Entregar a otra persona?
      </label>
    </div>

    @if (isOtherReceiver) {
      <div class="row mt-3">
        <div class="mb-3">
          <label for="idCard">Nro Identificación</label>
          <input
            type="text"
            id="idCard"
            class="form-control"
            formControlName="receiverGovernmentId"
          />
        </div>
        <div class="mb-3">
          <label for="fullName">Nombre Completo</label>
          <input
            type="text"
            id="fullName"
            class="form-control"
            formControlName="receiver"
          />
        </div>
      </div>
    }
  </div>
  <div class="modal-footer">
    <button
      type="submit"
      mat-raised-button
      [disabled]="isOtherReceiver && !orderDeliveryForm.valid"
    >
      <mat-icon>save</mat-icon> Guardar
    </button>

    <app-theme-button
      variant="dark"
      icon="close"
      text="Cancelar"
      (handleClick)="onModalClose()"
    >
    </app-theme-button>
  </div>
</form>
