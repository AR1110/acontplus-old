<form [formGroup]="orderDeliveryForm" (ngSubmit)="save()" autocapitalize="true" autocomplete="off">
    <div class="modal-header">
        <h4 class="modal-title"><fa-icon [icon]="'sign-out'"></fa-icon> Entregar</h4>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
    </div>
    <div class="modal-body">
        <h5>¿Esta seguro de entregar esta orden al cliente <strong>{{ data.razonSocialComprador }}</strong>?</h5>

        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="flexCheckChecked"
                (click)="enableIsOtherReceiver()" [checked]="isOtherReceiver">
            <label class="form-check-label" for="flexCheckChecked">
                ¿Entregar a otra persona?
            </label>
        </div>

        @if (isOtherReceiver) {
        <div class="row mt-3">
            <div class="mb-3">
                <label class="form-label">Nro Identificación</label>
                <input type="text" class="form-control" formControlName="receiverGovernmentId">
            </div>
            <div class="mb-3">
                <label class="form-label">Nombre Completo</label>
                <input type="text" class="form-control" formControlName="receiver">
            </div>
        </div>
        }
    </div>
    <div class="modal-footer">
        <button type="submit" class="btn btn-outline-success" [disabled]="isOtherReceiver && !orderDeliveryForm.valid">
            <fa-icon [icon]="'save'"></fa-icon> Guardar
        </button>

        <button type="button" class="btn btn-outline-dark" (click)="closeModal()">
            &times; Cancelar
        </button>
    </div>
</form>
