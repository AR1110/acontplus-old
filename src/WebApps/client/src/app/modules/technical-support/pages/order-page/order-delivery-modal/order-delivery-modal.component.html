<app-mat-custom-dialog
  [containerTemplate]="body"
  [actionsTemplate]="footer"
  title="Entregar"
  (close)="onModalClose()"
/>
<ng-template #body>
  <form
    [formGroup]="orderDeliveryForm"
    (ngSubmit)="save()"
    autocapitalize="true"
    id="orderDeliveryForm"
    autocomplete="off"
  >
      <h5>
        ¿Esta seguro de entregar esta orden al cliente
        <strong>{{ data.razonSocialComprador }}</strong
        >?
      </h5>

      <div class="form-check">
        <input
          class="form-check-input"
          type="checkbox"
          value=""
          id="flexCheckChecked"
          (click)="enableIsOtherReceiver()"
          [checked]="isOtherReceiver"
        />
        <label class="form-check-label" for="flexCheckChecked">
          ¿Entregar a otra persona?
        </label>
      </div>

      @if (isOtherReceiver) {
        <div class="row mt-3">
          <div class="mb-3">
            <label for="idCard">Nro Identificación</label>
            <input
              type="text"
              id="idCard"
              class="form-control"
              formControlName="receiverGovernmentId"
            />
          </div>
          <div class="mb-3">
            <label for="fullName">Nombre Completo</label>
            <input
              type="text"
              id="fullName"
              class="form-control"
              formControlName="receiver"
            />
          </div>
        </div>
      }


  </form>
</ng-template>
<ng-template #footer>
  <app-theme-button
    [disabled]="isOtherReceiver && !orderDeliveryForm.valid"
    variant="success"
    icon="save"
    text="Guardar"
    type="submit"
    form="orderDeliveryForm"
  >
  </app-theme-button>
</ng-template>
