<form [formGroup]="orderForm">
  <div class="modal-header">
    <h5 class="modal-title">
      <fa-icon [icon]="modalIcon"></fa-icon> {{ modalTitle }}
    </h5>
    <button
      type="button"
      class="btn-close"
      aria-hidden="true"
      aria-label="btn-close"
      (click)="closeModal()"
    ></button>
  </div>
  <div class="modal-body">
    <div class="row">
      <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
        <div class="form-group">
          <label for="establecimientoId">Establecimiento:</label>
          <select
            #estabs
            id="establecimientoId"
            class="form-select"
            formControlName="establecimientoId"
            (change)="onChangeEstab()"
          >
            @for (item of establecimientos; track $index) {
            <option [ngValue]="item.idEstablecimiento">
              {{ item.nombreComercial }}
            </option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-2 col-lg-2 col-md-2 col-sm-3 col-12">
        <div class="form-group">
          <label for="idPuntoEmision">P. Emi.:</label>
          <select
            id="idPuntoEmision"
            class="form-select"
            formControlName="puntoEmisionId"
          >
            @for (item of puntosEmision; track $index) {
            <option [ngValue]="item.idPuntoEmision">
              {{ item.ptoEmi }}
            </option>
            }
          </select>
        </div>
      </div>
      <div class="col-lg-3 col-md-3 col-sm-6 col-xs-12">
        <div class="form-group">
          <label for="fechaEmision">Fecha Emisión: </label>
          <input
            type="date"
            class="form-control border-select"
            formControlName="fechaEmision"
            required
          />
        </div>
      </div>
      <div class="col-lg-3 col-md-3 col-sm-6 col-xs-12">
        <div class="form-group">
          <label for="encargado">
            Responsable: <span class="text-danger">*</span>
          </label>
          <select
            formControlName="encargado"
            id="encargado"
            class="form-control border-select"
            required
          >
            <option value=""></option>
          </select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-6">
        <div class="card rounded border border-info">
          <div class="card-header">Datos cliente:</div>
          <div class="card-body">
            <!--Start section customer -->
            <div class="form-group">
              <label for="customerSearch"
                >Cliente:
                <span class="text-danger">*</span>
              </label>
              <app-company-customer-search
                (onCustomerSelected)="onCustomerSelected($event)"
              ></app-company-customer-search>
            </div>

            <!--Start Form register-update customer-->
            <!-- @if(showForm){
                <CustomerFormFast />
                } -->
          </div>
        </div>
      </div>
    </div>

    <!--End Form register-update customer-->
    <form [formGroup]="deviceForm">
      <div class="card rounded border border-success">
        <div class="card-header d-flex justify-content-between">
          <span>Datos Equipo:</span>
          <button type="button" class="btn btn-outline-info btn-sm">
            Historial
          </button>
        </div>
        <div class="card-body">
          <!--Start Form register product-->
          <div class="row">
            <div class="col-xl-2 col-lg-2 col-md-6 col-sm-12 col-xs-12 col-12">
              <div class="form-group">
                <label for="categoryId"
                  >Categoria:
                  <span class="text-danger">*</span>
                </label>
                <select
                  formControlName="categoryId"
                  id="categoryId"
                  class="form-select"
                >
                  @for (item of categories; track $index) {
                  <option [ngValue]="item.id">{{ item.name }}</option>
                  }
                </select>
              </div>
            </div>
            <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-xs-12 col-12">
              <div class="form-group">
                <label for="productName"
                  >Nombre Producto:
                  <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  id="productName"
                  formControlName="name"
                  class="form-control border-select"
                />
              </div>
            </div>

            <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-xs-12 col-12">
              <div class="form-group">
                <label for="serie"
                  >IMEI/Serie:
                  <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  formControlName="serie"
                  id="serie"
                  class="form-control border-select"
                />
              </div>
            </div>
            <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-xs-12 col-12">
              <div class="form-group">
                <label for="brand"
                  >Marca:
                  <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  formControlName="brand"
                  id="brand"
                  class="form-control border-select"
                />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6 col-xs-12 col-12">
              <div class="form-group">
                <label for="model">Modelo: </label>
                <input
                  type="text"
                  formControlName="model"
                  id="model"
                  class="form-control border-select"
                />
              </div>
            </div>
            <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6 col-xs-12 col-12">
              <div class="form-group">
                <label for="year">Año: </label>
                <input
                  type="number"
                  name="year"
                  id="year"
                  class="form-control border-select"
                  maxlength="4"
                />
              </div>
            </div>
            <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6 col-xs-12 col-12">
              <div class="form-group">
                <label for="warranty">Garantía: </label>
                <input
                  type="number"
                  formControlName="warranty"
                  id="warranty"
                  class="form-control border-select"
                  step="any"
                  maxlength="4"
                />
              </div>
            </div>
            <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6 col-xs-12 col-12">
              <div class="form-group">
                <label for="color">Color: </label>
                <input
                  type="text"
                  formControlName="color"
                  id="color"
                  class="form-control border-select"
                />
              </div>
            </div>
          </div>
          <div class="d-inline-flex justify-content-center flex-row">
            <button
              type="button"
              class="btn btn-outline-success btn-sm"
              (click)="saveDevice()"
            >
              <fa-icon [icon]="'save'"></fa-icon>
              Guardar
            </button>
            <button
              type="button"
              class="btn btn-outline-danger mx-1"
              (click)="resetFormDevice()"
            >
              <fa-icon [icon]="'refresh'"></fa-icon> Limpiar
            </button>
          </div>
        </div>
      </div>
    </form>

    <div class="row">
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="observación">Observación:</label>
          <textarea
            class="form-control border-select"
            aria-label="obs"
          ></textarea>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="submit" class="btn btn-outline-success btn-sm">
      <fa-icon [icon]="'save'"></fa-icon> Guardar
    </button>
    <button
      type="submit"
      class="btn btn-outline-dark btn-sm"
      (click)="closeModal()"
    >
      &times; Cancelar
    </button>
  </div>
</form>
