<form [formGroup]="orderForm" (ngSubmit)="save()">
  <div class="modal-header">
    <h4 class="modal-title">
      <fa-icon [icon]="modalIcon"></fa-icon> {{ modalTitle }}
    </h4>
    <button
      type="button"
      class="btn-close"
      aria-hidden="true"
      aria-label="btn-close"
      (click)="closeModal()"
    ></button>
  </div>
  <div class="modal-body">
    <div class="row">
      <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
        <div class="form-group">
          <label for="establecimientoId">Establecimiento:</label>
          <select
            #estabs
            id="establecimientoId"
            class="form-select"
            formControlName="establecimientoId"
            (change)="onChangeEstab()"
          >
            @for (item of establecimientos; track $index) {
            <option [ngValue]="item.idEstablecimiento">
              {{ item.nombreComercial }}
            </option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-2 col-lg-2 col-md-2 col-sm-3 col-12">
        <div class="form-group">
          <label for="idPuntoEmision">P. Emi.:</label>
          <select
            id="idPuntoEmision"
            class="form-select"
            formControlName="puntoEmisionId"
          >
            @for (item of puntosEmision; track $index) {
            <option [ngValue]="item.idPuntoEmision">
              {{ item.ptoEmi }}
            </option>
            }
          </select>
        </div>
      </div>
      <div class="col-lg-3 col-md-3 col-sm-6 col-xs-12">
        <div class="form-group">
          <label for="fechaEmision">Fecha Emisión: </label>
          <input
            type="date"
            class="form-control border-select"
            formControlName="fechaEmision"
            required
          />
        </div>
      </div>
      <div class="col-lg-3 col-md-3 col-sm-6 col-xs-12">
        <div class="form-group">
          <label for="assignedUserId">
            Responsable: <span class="text-danger">*</span>
          </label>
          <select
            formControlName="assignedUserId"
            id="assignedUserId"
            class="form-select border-select"
            required
          >
            <option [value]="0">Pendiente</option>
            @for (item of users; track $index) {
            <option [ngValue]="item.idUsuario">{{ item.nombreUsuario }}</option>
            }
          </select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="customerSearch">Cliente: </label>
          <app-company-customer-search
            (onCustomerSelected)="onCustomerSelected($event)"
          ></app-company-customer-search>
        </div>
      </div>
    </div>

    <!--End Form register-update customer-->
    @if (order.customerCompanyId > 0) {
    <div class="row">
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
        <div class="form-group">
          <app-device-search (onDeviceSelected)="onDeviceSelected($event)" />
        </div>
      </div>
      <div class="col">
        <button
          type="button"
          class="btn btn-outline-success btn-sm"
          title="Ver Historial de equipos del cliente"
          (click)="getDevices()"
        >
          <fa-icon [icon]="'history'"></fa-icon> Historial
        </button>
      </div>
    </div>
    } @if (orderDetails.length > 0) {
    <app-tabulator
      [columnNames]="columnNames"
      [tableData]="orderDetails"
    ></app-tabulator>
    }

    <div class="row">
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="observación">Observación:</label>
          <textarea
            id="obs"
            formControlName="obs"
            class="form-control border-select"
            aria-label="obs"
          ></textarea>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button
      type="submit"
      class="btn btn-outline-success"
      title="Guardar Orden"
      [disabled]="orderForm.invalid"
    >
      <fa-icon [icon]="'save'"></fa-icon> Guardar
    </button>
    <button
      type="button"
      class="btn btn-outline-dark"
      title="Cancelar Orden"
      (click)="closeModal()"
    >
      &times; Cancelar
    </button>
  </div>
</form>
