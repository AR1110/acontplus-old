<form [formGroup]="deviceForm" (ngSubmit)="isUpdate ? onUpdate() : onSave()">
  <div class="modal-header">
    <h4 class="modal-title">
      <fa-icon [icon]="modalIcon"></fa-icon> {{ modalTitle }}
    </h4>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="modal"
      aria-label="Close"
      (click)="closeModal()"
    ></button>
  </div>
  <div class="modal-body">
    <div class="row">
      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-xs-12 col-12">
        <div class="form-group">
          <label for="categoryId"
            >Categoria:
            <span class="text-danger">*</span>
          </label>
          <select
            formControlName="categoryId"
            id="categoryId"
            class="form-select"
          >
            @for (item of categories; track $index) {
            <option [ngValue]="item.id">{{ item.name }}</option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-xs-12 col-12">
        <div class="form-group">
          <label for="productName"
            >Nombre Producto:
            <span class="text-danger">*</span>
          </label>
          <input
            type="text"
            id="productName"
            formControlName="name"
            class="form-control border-select"
          />
        </div>
      </div>

      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-xs-12 col-12">
        <div class="form-group">
          <label for="serie"
            >IMEI/Serie:
            <span class="text-danger">*</span>
          </label>
          <input
            type="text"
            formControlName="serie"
            id="serie"
            class="form-control border-select"
          />
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-xs-12 col-12">
        <div class="form-group">
          <label for="brand"
            >Marca:
            <span class="text-danger">*</span>
          </label>
          <input
            type="text"
            formControlName="brand"
            id="brand"
            class="form-control border-select"
          />
        </div>
      </div>
      <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-xs-12 col-12">
        <div class="form-group">
          <label for="model">Modelo: </label>
          <input
            type="text"
            formControlName="model"
            id="model"
            class="form-control border-select"
          />
        </div>
      </div>
      <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-xs-12 col-12">
        <div class="form-group">
          <label for="year">Año: </label>
          <input
            type="number"
            formControlName="year"
            id="year"
            class="form-control border-select"
            maxlength="4"
          />
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-xs-12 col-12">
        <div class="form-group">
          <label for="warranty">Garantía: </label>
          <input
            type="number"
            formControlName="warranty"
            id="warranty"
            class="form-control border-select"
            step="any"
            maxlength="4"
          />
        </div>
      </div>
      <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-xs-12 col-12">
        <div class="form-group">
          <label for="color">Color: </label>
          <input
            type="text"
            formControlName="color"
            id="color"
            class="form-control border-select"
          />
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="submit" class="btn btn-outline-success btn-lg">
      <fa-icon [icon]="'save'"></fa-icon> Guardar
    </button>
    <button
      type="button"
      class="btn btn-outline-dark btn-lg"
      (click)="closeModal()"
    >
      &times; Cancelar
    </button>
  </div>
</form>
