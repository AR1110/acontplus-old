<app-breadcrumb />

<mat-card>
  <mat-card-content>
    <div class="row">
      <div class="col-xxl-10 col-xl-10 col-lg-10 col-md-10 col-sm-12 col-12">
        <div
          class="row row-cols-xxl-3 row-cols-xl-3 row-cols-lg-3 row-cols-md-3 row-cols-sm-1 row-cols-1 g-2"
        >
          <div class="col">
            <mat-form-field class="w-100">
              <mat-label>Establecimiento</mat-label>
              <mat-select>
                <mat-option value="one">First option</mat-option>
                <mat-option value="two">Second option</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
          <div class="col">
            <mat-form-field class="w-100">
              <mat-label>Punto Emisión</mat-label>
              <mat-select>
                <mat-option value="one">First option</mat-option>
                <mat-option value="two">Second option</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
          <div class="col">
            <app-date-range-selection
              (onChangeDateRange)="onDateRangeSelection($event)"
              [(checkbox)]="dataSearch().checkBoxDate"
              [showInputMaterial]="true"
              [showMatPrefix]="true"
            />
          </div>
        </div>
      </div>
      <div class="col-xxl-2 col-xl-2 col-lg-2 col-md-2 col-sm-12 col-12">
        <div
          class="d-flex flex-row gap-2 justify-content-end align-items-center"
        >
          <button mat-icon-button (click)="refresh()">
            <mat-icon>refresh</mat-icon>
          </button>
          <button
            mat-icon-button
            (click)="isSearchAdvanced.set(!isSearchAdvanced())"
          >
            <mat-icon>filter_list</mat-icon>
          </button>
        </div>
      </div>
    </div>
    <div
      class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-1 row-cols-1 g-4"
    >
      <div class="col"></div>
      <div class="col"></div>
    </div>

    <app-custom-table-container
      [pagination]="pagination()"
      [isLoadingResults]="isLoadingResults()"
      (onPageEvent)="handlePageEvent($event)"
    >
      <app-mat-dynamic-table
        [templateOp]="templateOp"
        [dataList]="dataSource.data"
        [displayColumnDefs]="columnsDefs"
        [displayedColumns]="columns"
      ></app-mat-dynamic-table>
    </app-custom-table-container>

    <ng-template #templateOp let-item="item">
      <button mat-icon-button [matMenuTriggerFor]="menu" aria-hidden="false">
        <mat-icon>more_vert</mat-icon>
      </button>

      <mat-menu #menu="matMenu">
        <button mat-menu-item>
          <mat-icon>download</mat-icon>
          <span>Pdf</span>
        </button>

        <button mat-menu-item>
          <mat-icon>list_alt</mat-icon>
          <span>Detalle</span>
        </button>
      </mat-menu>

      <button mat-icon-button aria-label="Icon Email">
        <mat-icon>email</mat-icon>
      </button>
      <button mat-icon-button aria-label="Icon Email">
        <img
          src="assets/icons/icons8/svg/whatsapp.svg"
          alt="WhatsApp Icon"
          style="width: 24px; height: 24px"
        />
      </button>
    </ng-template>
  </mat-card-content>
</mat-card>
