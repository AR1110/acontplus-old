<app-breadcrumb />

<app-mat-dynamic-card>
  <div class="d-grid gap-2">
    <div class="row">
      <div class="col-xxl-7 col-xl-7 col-lg-7 col-md-12 col-12">
        <div
          class="row row-cols-1 row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-2"
        >
          <div class="col">
            <mat-form-field class="w-100">
              <mat-label>Establecimiento</mat-label>
              <mat-select [(ngModel)]="dataSearch.codEstab">
                @for(item of estabs(); track $index){
                <mat-option [value]="item.codEstab">{{
                  item.nombreEstab
                }}</mat-option>

                }
              </mat-select>
            </mat-form-field>
          </div>
          <div class="col">
            <app-date-range-selection [showInputMaterial]="true" />
          </div>
        </div>
      </div>
      <div class="col-xxl-5 col-xl-5 col-lg-5 col-md-12 col-12">
        <div class="row">
          <div class="col-xxl-8 col-xl-8 col-lg-8 col-md-12 col-12">
            <app-company-customer-search-mat [isSimpleMode]="true" />
          </div>
          <div class="col-xxl-4 col-xl-4 col-lg-4 col-md-12 col-12">
            <div class="d-flex flex-row gap-1 justify-content-end">
              <button
                mat-icon-button
                appAddEditProduct
                (onResult)="refresh()"
                [disabled]="loading"
              >
                <mat-icon>add</mat-icon>
              </button>
              <button mat-icon-button (click)="refresh()" [disabled]="loading">
                <mat-icon>refresh</mat-icon>
              </button>
              <button
                mat-icon-button
                (click)="isFilterAdvanced.set(!isFilterAdvanced())"
                [disabled]="loading"
              >
                <mat-icon>filter_list</mat-icon>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <app-mat-dynamic-table
      [tableData]="dataSource()"
      [columnDefinitions]="columnsDefs"
      [visibleColumns]="columns"
      [templateOp]="templateOp"
      [paginationConfig]="pagination()"
      [enablePagination]="true"
      (pageEvent)="handlePageEvent($event)"
    >
    </app-mat-dynamic-table>

    <ng-template #templateOp let-item="item"> </ng-template>
  </div>
</app-mat-dynamic-card>
