<div class="row g-2 align-items-center" [formGroup]="taxGroup()">
  <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6">
    <select
      class="form-select"
      formControlName="idImpuesto"
      id="idImpuesto-{{ indexTax() }}"
      (change)="selectTax(taxGroup().value)"
    >
      <option>Seleccione un impuesto</option>
      @for (sriTax of taxes(); track $index) {
        <option [value]="sriTax.idImpuesto">
          {{ sriTax.descripcion }}
        </option>
      }
    </select>
  </div>
  <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6">
    <select
      class="form-select"
      formControlName="idTarifaImpuesto"
      id="idTarifaImpuesto-{{ indexTax() }}"
      (change)="selectTarifa(taxGroup().value)"
    >
      <option>Seleccione una tarifa</option>
      @for (tarifaImpuesto of tarifaImpuestosFiltered(); track $index) {
        <option [value]="tarifaImpuesto.idTarifaImpuesto">
          {{ tarifaImpuesto.descripcion }}
        </option>
      }
    </select>
  </div>
  <div class="col-xl-2 col-lg-2 col-md-4 col-sm-4">
    <input
      class="form-control"
      formControlName="baseImponible"
      id="tax-{{ indexTax() }}"
      type="number"
      step="any"
      placeholder="Base imponible"
    />
  </div>
  <div class="col-xl-2 col-lg-2 col-md-4 col-sm-4">
    <input
      class="form-control"
      formControlName="tarifa"
      id="tarifa-{{ indexTax() }}"
      type="number"
      step="any"
      readonly
      placeholder="Tarifa"
    />
  </div>
  <div class="col-xl-2 col-lg-2 col-md-4 col-sm-4">
    <input
      class="form-control"
      formControlName="valorImpuesto"
      id="valorImpuesto-{{ indexTax() }}"
      type="number"
      step="any"
      readonly
      placeholder="Valor impuesto"
    />
  </div>
  <div class="col-auto">
    <app-theme-button
      variant="danger"
      icon="delete"
      matStyle="icon"
      (handleClick)="removeTax(indexDoc(), indexTax())"
    ></app-theme-button>
  </div>
</div>
