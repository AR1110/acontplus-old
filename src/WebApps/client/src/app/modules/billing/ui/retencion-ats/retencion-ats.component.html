<app-breadcrumb></app-breadcrumb>
<mat-card appearance="outlined">
  <mat-card-content>
    <div class="row mb-3">
      <div class="col-xxl-4 col-xl-4 col-lg-4 col-md-4 col-sm-4 col-6">
        <app-theme-button
          icon="add"
          text="Registrar"
          (handleClick)="onDialogOpen()"
        ></app-theme-button>
      </div>
      <div class="col-xxl-8 col-xl-8 col-lg-8 col-md-8 col-sm-8 col-6 d-flex">
        <div class="ms-auto">
          <app-theme-button
            variant="secondary"
            icon="refresh"
            matStyle="icon"
            title="Recargar"
            (handleClick)="refresh()"
          ></app-theme-button>
        </div>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col">
        @if (this.retenciones().length > 0) {
          <div class="table-responsive">
            <app-mat-dynamic-table
              [templateOp]="templateOp"
              [tableData]="retenciones()"
              [columnDefinitions]="columnsDefs"
              [visibleColumns]="columns"
              [showSelectBox]="true"
            ></app-mat-dynamic-table>
          </div>

          <mat-paginator
            [length]="pagination().totalRecords"
            [pageIndex]="pagination().pageIndex"
            [pageSize]="pagination().pageSize"
            [pageSizeOptions]="pagination().pageSizeOptions"
            (page)="onPageChanged($event)"
            showFirstLastButtons
            aria-label="Select page"
          >
          </mat-paginator>
        } @else {
          <h5>No hay registros</h5>
        }
      </div>
    </div>

    <ng-template #templateOp let-item="item">
      <mat-menu #menu="matMenu">
        @if ([0, 2, 5, 7, 8].includes(item.codEstado)) {
          <button mat-menu-item (click)="edit(item)">
            <mat-icon>edit</mat-icon>
            Editar
          </button>
        }

        @if (!item.isAutomatic && [3].includes(item.codEstado)) {
          <button
            mat-menu-item
            (click)="authorize(item)"
            matTooltip="Autorizar en el SRI"
          >
            <mat-icon>send</mat-icon>
            Autorizar
          </button>
        }
        <button
          mat-menu-item
          (click)="getRide(item)"
          matTooltip="Ver PDF de la retención"
        >
          <mat-icon>picture_as_pdf</mat-icon>
          Ride
        </button>
        @if (item.codEstado === 4) {
          <button (click)="downloadXml(item)" mat-menu-item>
            <mat-icon>download</mat-icon>
            Descargar Xml
          </button>
        }
        <button
          mat-menu-item
          appSendMailDialog
          [data]="sendEmail(item)"
          [notificationSri]="true"
          matTooltip="Enviar por correo"
        >
          <mat-icon>mail</mat-icon>
          Correo
        </button>
        <button mat-menu-item (click)="sendWhatsApp(item)">
          <fa-icon [icon]="faWhatsapp"></fa-icon>
          Whatsapp
        </button>

        @if (item.codEstado === 4) {
          <button mat-menu-item (click)="cancel(item)">
            <mat-icon>undo</mat-icon>
            Anular
          </button>
        }
      </mat-menu>
      <button
        [matMenuTriggerFor]="menu"
        aria-label="Open Options"
        mat-icon-button
      >
        <mat-icon>menu</mat-icon>
      </button>
    </ng-template>
  </mat-card-content>
</mat-card>
