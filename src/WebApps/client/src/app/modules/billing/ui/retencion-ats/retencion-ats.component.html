<app-breadcrumb />
<acp-dynamic-card>
  <app-doc-elect-filters
    [showMoreOptions]="showMoreOptions()"
    [filterOptions]="myCustomFilterOptions"
    (triggerSearch)="onSearch($event)"
    (selectCliente)="onSelectCliente($event)"
    (keyupCliente)="onKeyupCliente()"
    (toggleMoreOptions)="toggleMoreOptions()"
    (selectUsuario)="onSelectUsuario($event)"
    (keyupUsuario)="onKeyupUsuario($event)"
    (dialogOpen)="onDialogOpen()"
  />
  <div class="row mb-3">
    <div class="col">
      @if (this.retenciones().length > 0) {
        <acp-data-grid
          [data]="retenciones()"
          [columns]="columns"
          [pageIndex]="pagination().pageIndex"
          [pageSize]="pagination().pageSize"
          (page)="onPageChanged($event)"
          [cellTemplate]="{
            op: templateOp,
          }"
        />
      } @else {
        <h5>No hay registros</h5>
      }
    </div>
  </div>

  <ng-template #templateOp let-data>
    <mat-menu #menu="matMenu">
      @if ([0, 1, 2, 5, 7, 8].includes(data.codEstado)) {
        <button mat-menu-item (click)="edit(data)">
          <mat-icon>edit</mat-icon>
          Editar
        </button>
      }

      @if ([2, 3, 7].includes(data.codEstado)) {
        <button mat-menu-item (click)="authorize(data)" matTooltip="Autorizar en el SRI">
          <mat-icon>send</mat-icon>
          Autorizar
        </button>
      }
      <button mat-menu-item (click)="getRide(data)" matTooltip="Ver PDF de la retención">
        <mat-icon>picture_as_pdf</mat-icon>
        Ride
      </button>
      @if (data.codEstado === 4) {
        <button (click)="downloadXml(data)" mat-menu-item>
          <mat-icon>download</mat-icon>
          Descargar Xml
        </button>
      }
      <button
        mat-menu-item
        appSendMailDialog
        [data]="sendEmail(data)"
        [notificationSri]="true"
        matTooltip="Enviar por correo"
      >
        <mat-icon>mail</mat-icon>
        Correo
      </button>
      <button mat-menu-item (click)="sendWhatsApp(data)">
        <mat-icon>chat</mat-icon>
        Whatsapp
      </button>

      @if (data.codEstado === 4) {
        <button mat-menu-item (click)="cancel(data)">
          <mat-icon>undo</mat-icon>
          Anular
        </button>
      }
    </mat-menu>
    <button [matMenuTriggerFor]="menu" aria-label="Open Options" mat-icon-button>
      <mat-icon>menu</mat-icon>
    </button>
  </ng-template>
</acp-dynamic-card>
