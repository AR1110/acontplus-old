<app-mat-custom-dialog
  [containerTemplate]="contentTemplate"
  [actionsTemplate]="actionsTemplate"
  [icon]="dialogIcon()"
  [title]="dialogTitle()"
  (close)="onClose()"
/>
<ng-template #contentTemplate>
  <p>
    Seleccione los documentos del proveedor {{ data.idCard }} - {{ data.idProveedor }} emitidos en
    {{ fechaEmision() | date: 'MM/yyyy' }}
  </p>
  <span class="text-danger">{{ messageTextError() }}</span>
  <app-mat-dynamic-table
    [templateOp]="templateOp"
    [tableData]="documents()"
    [columnDefinitions]="columnsDefs"
    [visibleColumns]="columns"
    [showSelectBox]="true"
    (rowSelected)="onRowSelected($event)"
  ></app-mat-dynamic-table>
</ng-template>
<ng-template #templateOp let-item="item"></ng-template>
<ng-template #actionsTemplate>
  @if (this.documentsSelected().length > 0) {
    <button mat-raised-button (click)="selectDocuments()" [disabled]="!!messageTextError()">
      <mat-icon aria-hidden="false" aria-label="Check Icon" fontIcon="check"></mat-icon>
      Seleccionar Documentos
    </button>
  }
</ng-template>
