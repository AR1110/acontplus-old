<app-mat-custom-dialog
  [containerTemplate]="contentTemplate"
  [actionsTemplate]="actionsTemplate"
  [icon]="dialogIcon()"
  [title]="dialogTitle()"
  (close)="onClose()"
/>
<ng-template #contentTemplate>
  <p>
    Seleccione los documentos del proveedor {{ data.idCard }} - {{ data.idProveedor }} emitidos en
    {{ fechaEmision() | date: 'MM/yyyy' }}
  </p>
  <span class="text-danger">{{ messageTextError() }}</span>
  <acp-data-grid
    [data]="documents()"
    [columns]="columns"
    [showPaginator]="false"
    [multiSelectable]="true"
    [rowSelectable]="true"
    [rowSelected]="documentsSelected()"
    (rowSelectedChange)="rowAllSelected($event)"
    [cellTemplate]="{
      op: templateOp,
    }"
  />
</ng-template>

<ng-template #templateOp let-data />

<ng-template #actionsTemplate>
  @if (this.documentsSelected().length > 0) {
    <acp-button
      variant="primary"
      icon="check"
      text="Seleccionar Documentos"
      (handleClick)="selectDocuments()"
      [disabled]="!!messageTextError()"
    />
  }
</ng-template>
