<form [formGroup]="infoAdicionalGroup()">
  <div class="row mb-3">
    <div class="col-xxl-4 col-xl-4 col-lg-4 col-md-4 col-sm-4 col-12">
      <mat-form-field class="w-100">
        <mat-label>Nombre</mat-label>
        <input
          matInput
          type="text"
          id="nombre-{{ indexInfoAdicional() }}"
          placeholder="Nombre"
          formControlName="nombre"
          [minlength]="1"
          [maxlength]="300"
        />
      </mat-form-field>
    </div>
    <div class="col-xxl-4 col-xl-4 col-lg-4 col-md-4 col-sm-4 col-12">
      <mat-form-field class="w-100">
        <mat-label>Valor</mat-label>
        <input
          matInput
          type="text"
          id="valor-{{ indexInfoAdicional() }}"
          placeholder="Valor"
          formControlName="valor"
          [minlength]="1"
          [maxlength]="300"
        />
      </mat-form-field>
    </div>
    <div class="col-xxl-2 col-xl-2 col-lg-2 col-md-2 col-sm-2 col-6">
      <app-theme-button
        variant="danger"
        icon="delete"
        matStyle="icon"
        id="btnDeleteInfoAdicional-{{
          infoAdicionalGroup().get('uniqueIdDoc')?.value
        }}"
        (handleClick)="removeInfoAdicional()"
      ></app-theme-button>
    </div>
  </div>
</form>
