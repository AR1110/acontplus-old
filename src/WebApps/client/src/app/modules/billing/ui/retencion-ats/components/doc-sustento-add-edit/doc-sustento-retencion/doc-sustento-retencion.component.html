<form [formGroup]="formGroup">
  <div class="row mb-3">
    <div class="col-xxl-3 col-xl-3 col-lg-3 col-md-3 col-sm-3 col-6">
      <mat-form-field class="w-100">
        <mat-label>Impuesto:</mat-label>
        <mat-select
          formControlName="impuestoRetencionId"
          id="impuestoRetencionId-{{ formGroup.get('uniqueIdDoc')?.value }}"
          (selectionChange)="selectImpuestoRetencion(formGroup.get('impuestoRetencionId')?.value)"
          required
        >
          <mat-option [value]="">Seleccione un impuesto</mat-option>
          @for (impuesto of impuestosRetencion(); track $index) {
            <mat-option [value]="impuesto.id">
              {{ impuesto.codigo }} - {{ impuesto.descripcion }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
    <div class="col-xxl-4 col-xl-4 col-lg-4 col-md-4 col-sm-4 col-6">
      <app-ng-dynamic-select
        [options]="options()"
        label="Código Retención"
        (selectionChange)="selectCodigoRetencion($event)"
      />
    </div>
    <div class="col-xxl-3 col-xl-3 col-lg-3 col-md-3 col-sm-3 col-6">
      <mat-form-field class="w-100">
        <mat-label>Base Imponible:</mat-label>
        <input
          #baseImponibleRet
          matInput
          type="number"
          formControlName="baseImponible"
          id="baseImponible-{{ formGroup.get('uniqueIdDoc')?.value }}"
          step="any"
          min="0"
          (click)="baseImponibleRet.select()"
          required
          (blur)="calcularRetencion()"
        />
      </mat-form-field>
    </div>
    <div class="col-xxl-2 col-xl-2 col-lg-2 col-md-2 col-sm-2 col-6">
      <mat-form-field class="w-100">
        <mat-label>Porcentaje:</mat-label>
        <input
          #porcentajeRet
          matInput
          type="number"
          formControlName="porcentajeRetener"
          id="porcentajeRetener-{{ formGroup.get('uniqueIdDoc')?.value }}"
          step="any"
          min="0"
          required
          (click)="porcentajeRet.select()"
          (blur)="calcularRetencion()"
        />
      </mat-form-field>
    </div>
  </div>
  <div class="row mb-3">
    <div class="col-xxl-2 col-xl-2 col-lg-2 col-md-2 col-sm-2 col-6">
      <mat-form-field class="w-100">
        <mat-label>Valor Retenido:</mat-label>
        <input
          matInput
          type="number"
          formControlName="valorRetenido"
          id="valorRetenido-{{ formGroup.get('uniqueIdDoc')?.value }}"
          step="any"
          min="0"
          readonly
        />
      </mat-form-field>
    </div>

    <div class="col-xxl-2 col-xl-2 col-lg-2 col-md-2 col-sm-2 col-6">
      @if (formGroup.get('idRetAtsDocSustento')?.value) {
        <app-theme-button
          variant="success"
          icon="save"
          matStyle="icon"
          id="btn-save-ret-{{ formGroup.get('uniqueIdDoc')?.value }}"
          title="Guardar retención del sustento"
          (handleClick)="onSave()"
        />
      }
      <app-theme-button
        variant="danger"
        icon="delete"
        matStyle="icon"
        id="btnDeleteRetencion-{{ formGroup.get('uniqueIdDoc')?.value }}"
        title="Eliminar retención del sustento"
        (handleClick)="removeRetencion()"
      />
    </div>
  </div>
</form>
