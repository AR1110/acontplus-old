<form [formGroup]="retencionGroup()">
  <div class="row">
    <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-6">
      <div class="form-group">
        <label
          for="idImpuestoRetencion-{{
            retencionGroup().get('uniqueIdDoc')?.value
          }}"
          >Impuesto:</label
        >
        <select
          formControlName="idImpuestoRetencion"
          id="idImpuestoRetencion-{{
            retencionGroup().get('uniqueIdDoc')?.value
          }}"
          class="form-control"
          (change)="
            setPorcentajesRet(
              retencionGroup().get('codigo')?.value,
              retencionGroup().get('uniqueIdDoc')?.value
            )
          "
        >
          <option value="">Seleccione un impuesto</option>
          @for (impuesto of impuestosRetencion(); track $index) {
            <option [value]="impuesto.idImpuestoRetencion">
              {{ impuesto.codigo }} - {{ impuesto.descripcion }}
            </option>
          }
        </select>
      </div>
    </div>
    <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-6">
      <div class="form-group">
        <label
          for="codigoRetencion-{{ retencionGroup().get('uniqueIdDoc')?.value }}"
          >Código Retención:</label
        >
        <select
          formControlName="idCodigoRetencion"
          id="{{
            retencionGroup().get('uniqueIdDoc')?.value
          }}-idCodigoRetencion"
          class="form-control"
          (change)="setPorcentajeRet()"
        >
          <option value="">Seleccione un código</option>
          @for (codigoRetencion of codigosRetencion(); track $index) {
            <option [value]="codigoRetencion.idCodigoRetencion">
              {{ codigoRetencion.codigo }} - {{ codigoRetencion.descripcion }}
            </option>
          }
        </select>
      </div>
    </div>
    <div class="col-xl-2 col-lg-2 col-md-2 col-sm-2 col-3">
      <div class="form-group">
        <label
          for="baseImponible-{{ retencionGroup().get('uniqueIdDoc')?.value }}"
          >Base Imponible:</label
        >
        <input
          type="number"
          formControlName="baseImponible"
          id="baseImponible-{{ retencionGroup().get('uniqueIdDoc')?.value }}"
          class="form-control"
          step="any"
          min="0"
          (blur)="setValueRet()"
        />
      </div>
    </div>
    <div class="col-xl-2 col-lg-2 col-md-2 col-sm-2 col-3">
      <div class="form-group">
        <label
          for="porcentajeRetener-{{
            retencionGroup().get('uniqueIdDoc')?.value
          }}"
          >Porcentaje:</label
        >
        <input
          type="text"
          formControlName="porcentajeRetener"
          id="porcentajeRetener-{{
            retencionGroup().get('uniqueIdDoc')?.value
          }}"
          class="form-control"
          step="any"
          min="0"
          (blur)="setPorcentajeRet()"
        />
      </div>
    </div>
    <div class="col-xl-2 col-lg-2 col-md-2 col-sm-2 col-3">
      <div class="form-group">
        <label
          for="valorRetenido-{{ retencionGroup().get('uniqueIdDoc')?.value }}"
          >Valor Retenido:</label
        >
        <input
          type="text"
          formControlName="valorRetenido"
          id="valorRetenido-{{ retencionGroup().get('uniqueIdDoc')?.value }}"
          class="form-control"
          step="any"
          min="0"
          readonly
        />
      </div>
    </div>
  </div>
