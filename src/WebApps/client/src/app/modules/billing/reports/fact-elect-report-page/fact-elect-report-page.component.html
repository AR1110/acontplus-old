<app-breadcrumb/>


<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="col-lg-3 col-md-3 col-sm-12 col-12">
        <div class="icheck-primary">
          <input type="checkbox" id="checkBoxCustomer" [(ngModel)]="dataSearch.checkBoxCustomer" name="checkBoxCustomerName" />
          <label for="checkBoxCustomer">Cliente</label>
        </div>
      </div>
      <div class="col-lg-3 col-md-3 col-sm-12 col-12">
        <div class="icheck-primary">
          <input type="checkbox" id="checkBoxUser" [(ngModel)]="dataSearch.checkBoxUser" name="checkBoxUser" />
          <label for="checkBoxUser">Usuario</label>
        </div>
      </div>

    </div>
    <hr>

    <div class="row">
      <div class="col-lg-3 col-md-3 col-sm-12 col-12">
        <div class="form-group">
          <label>Tipo Documento: </label>
          <select class="form-select"
                  [(ngModel)]="dataSearch.idTipoDocumento"
                  (change)="onChangeTipoDoc()"
          >
            @for(item of tiposDoc;track $index){
              <option [ngValue]="item.idTipoDocumento"  >
                {{item.descripcion}}
              </option>
            }

          </select>
        </div>
      </div>
      <div class="col-lg-3 col-md-3 col-sm-12 col-12">
        <div class="form-group">
          <label>Establecimiento:</label>
          <select class="form-select"
                  [(ngModel)]="dataSearch.idEstablecimiento"
                  (change)="onChangeEstab()"
          >
            <option [ngValue]="0">Todos</option>
            @for (item of establecimientos;track $index){
              <option [ngValue]="item.idEstablecimiento">
                {{item.nombreComercial}}
              </option>
            }

          </select>
        </div>
      </div>
      <div class="col-lg-3 col-md-3 col-sm-12 col-12">
        <div class="form-group">
          <label>Punto Emisión</label>
          <select class="form-select" [(ngModel)]="dataSearch.idPuntoEmision">
            <option [ngValue]="0">Todos</option>
            @for(item of puntosEmision;track $index){
              <option [ngValue]="item.idPuntoEmision" >
                {{item.ptoEmi}}
              </option>
            }

          </select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-3 col-md-3 col-sm-12 col-12">
        <label  >Rango Fechas: </label>
        <app-date-range-selection (onChangeDateRange)="onDateRangeSelection($event)"/>
      </div>
      <div class="col-lg-3 col-md-3 col-sm-12 col-12">
        <div class="form-group">
          <label>Estado</label>
          <select class="form-select" [(ngModel)]="dataSearch.idEstadoDocumento">
            <option [ngValue]="0">Todos</option>
            @for(item of estadosDoc;track $index){
              <option [ngValue]="item.idEstadoDocumento" >
                {{item.descripcion}}
              </option>
            }

          </select>
        </div>
      </div>

      @if (showField){
      <div class="col-lg-3 col-md-3 col-sm-12 col-12"  >
        <div class="form-group">
          <label>Retencion</label>
          <select class="form-select" [(ngModel)]="dataSearch.codeRetencion">
            @for (item of retenciones;track $index){
              <option [ngValue]="item.code" >
                {{item.descripcion}}
              </option>
            }

          </select>
        </div>
      </div>
      <div class="col-lg-3 col-md-3 col-sm-12 col-12" >
        <div class="form-group">
          <label>Devolución</label>
          <select class="form-select" [(ngModel)]="dataSearch.codeDevolucion">
            @for (item of devoluciones;track $index){
              <option [ngValue]="item.code"  >
                {{item.descripcion}}
              </option>
            }

          </select>
        </div>
      </div>
      }
    </div>

    <div class="row">
      <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
        <div class="form-group">
          <label >Cliente</label>
          <app-company-customer-search
            [isSearchSimple]="true"
            (resultEmptyInput)="resultEmptyInputCustomer()"
            (onCustomerSelected)="onCustomerSelected($event)"

          />
        </div>

      </div>
      <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 col-12">
        <div class="form-group">
          <label >Usuario: </label>
          <app-user-search
            (emptyInput)="emptyInputUser()"
            (onUserSelected)="onUserSelected($event)"
            [isSearchSimple]="true"
          />
        </div>
      </div>
    </div>



    <div class="d-flex flex-row gap-1">
      <button type="button" class="btn btn-success" (click)="getReportPdf()">PDF</button>
      <button type="button" class="btn btn-info" (click)="getReportExcel()">EXCEL</button>
    </div>




  </div>
</div>
