<div class="modal-header">
  <h5 class="modal-title" id="modal-basic-title">{{titleModal}}</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
</div>
<div class="modal-body">
  <div class="card border border-info rounded">
    <div class="card-header">
      <span class="card-title">Cliente/Conductor</span>
    </div>
    <div class="card-body ">
      <div class="form-group">
        <label for="serachCustomer">Buscar Cliente/Conductor</label>
        <app-company-customer-search [isSearchSimple]="true" (onCustomerSelected)="onCustomerSelected($event)" />
      </div>

      <div class="row">
        <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
          <div class="form-group">
            <label for="identificacion">Identificación:</label>
            <input type="text" class="form-control" readonly [value]="customer.idCard">
          </div>
        </div>
        <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
          <div class="form-group">
            <label for="razonSocial">Razon Social: </label>
            <input type="text" class="form-control" readonly [value]="customer.businessName">

          </div>
        </div>
        <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
          <label for="email">Correo: </label>
            <input type="text" class="form-control" readonly [value]="customer.email">

        </div>
      </div>
    </div>
  </div>

  <div class="card border border-info rounded">
    <div class="card-header">
      <span class="card-title">Vehículo:</span>
    </div>
    <div class="card-body ">
      <div class="row">
        <div class="col-xl-3 col-lg-3 col-md-3 col-sm-2 col-6">
          <div class="form-group">
            <label for="country">País <span class="text-danger"> *</span></label>
            <select name="country" id="country" class="form-select" [(ngModel)]="data.countryId">
              @for (item of countries; track $index) {
                <option [ngValue]="item.countryId">{{item.description}}
                </option>
              }


            </select>
          </div>
        </div>
        <div class="col-xl-3 col-lg-3 col-md-3 col-sm-2 col-6">
          <div class="form-group">
            <label for="">Tipo de Vehículo <span class="text-danger"> *</span></label>
            <select name="vehicleType" id="vehicleType" class="form-select" [(ngModel)]="data.vehicleTypeId">
              @for (item of vehicleTypes; track $index) {
                <option [ngValue]="item.vehicleTypeId">
                  {{item.description}}
                </option>
              }
            </select>
          </div>
        </div>
        <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-6">
          <div class="form-group">
            <label for="">Placa <span class="text-danger"> *</span></label>
            <input type="text" class="form-control" [(ngModel)]="data.licensePlate"   />
          </div>
        </div>
        <div class="col-xl-3 col-lg-3 col-md-3 col-sm-2 col-6">
          <div class="form-group">
            <label for="">Marca <span class="text-danger"> *</span></label>
            <input type="text" class="form-control" [(ngModel)]="data.brand"  />
          </div>
        </div>
        <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-6">
          <div class="form-group">
            <label for="">Modelo</label>
            <input type="text" class="form-control" [(ngModel)]="data.model"  />
          </div>
        </div>
        <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-6">
          <div class="form-group">
            <label for="">Año de Fabricación <span class="text-danger"> *</span></label>
            <input type="number" class="form-control" [(ngModel)]="data.year"  />
          </div>
        </div>
        <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-6">
          <div class="form-group">
            <label for="">Color <span class="text-danger"> *</span></label>
            <input type="text" class="form-control"  [(ngModel)]="data.color" />
          </div>
        </div>

        <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-6">
          <div class="form-group">
            <label for="">Motor <span class="text-danger"> *</span></label>
            <input type="text" class="form-control" [(ngModel)]="data.engine"  />
          </div>
        </div>
        <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-6">
          <div class="form-group">
            <label for="">Chasis <span class="text-danger"> *</span></label>
            <input type="text" class="form-control" [(ngModel)]="data.chassis" />
          </div>
        </div>
        <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-6">
          <div class="form-group">
            <label for="">Cilindraje <span class="text-danger"> *</span></label>
            <input type="text" class="form-control" [(ngModel)]="data.cylindraje"   />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-success" (click)="onSubmit()">
    {{btnText}}
  </button>
  <button type="button" class="btn btn-dark" (click)="modal.close()">
  &times; Cerrar</button>
</div>
