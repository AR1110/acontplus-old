<app-mat-custom-dialog
  [containerTemplate]="body"
  [actionsTemplate]="footer"
  title="Convertir a un documento"
  (close)="close()"
/>

<ng-template #body>
  <div class="d-flex flex-column bd-highlight mb-3">
    <div class="p-2 bd-highlight">
      Ruc/Cédula: {{ companyCustomer.identificacionComprador }}
    </div>
    <div class="p-2 bd-highlight">
      Razon Social: {{ companyCustomer.razonSocialComprador }}
    </div>
    <!-- <div class="p-2 bd-highlight">Flex item 3</div> -->
    <hr />
    <div class="d-flex justify-content-center">
      <h4><b>Total</b> {{ data.total }}</h4>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <app-tabulator
        [columnNames]="columns"
        [tableData]="infoAdicionalDoc"
        [options]="tabulatorOptions"
      >
      </app-tabulator>
    </div>
  </div>
</ng-template>
<ng-template #footer>
  <app-theme-button
    variant="success"
    icon="save"
    text="Factura"
    (handleClick)="saveInvoice()"
  ></app-theme-button>
  <app-theme-button
    variant="warning"
    icon="save"
    text="Nota de Entrega"
    (handleClick)="saveNotaEntrega()"
  ></app-theme-button>
</ng-template>
