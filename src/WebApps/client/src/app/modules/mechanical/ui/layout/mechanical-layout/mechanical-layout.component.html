<app-breadcrumb />

<app-mat-dynamic-card>
  <mat-tab-group [selectedIndex]="store.selectedIndex()"
                 (selectedIndexChange)="store.selectedIndexChange($event)">
    <mat-tab label="Dashboard">
      <ng-template matTabContent>
        <div class="mx-3 mt-2">
        <app-mechanical-dashboard/>

        </div>
      </ng-template>
    </mat-tab>
    <mat-tab label="Pendiente">
      <ng-template matTabContent>
        <ng-container *ngTemplateOutlet="templateSupport"></ng-container>
      </ng-template>
    </mat-tab>
    <mat-tab label="En Proceso">
      <ng-template matTabContent>
        <ng-container *ngTemplateOutlet="templateSupport"></ng-container>
      </ng-template>
    </mat-tab>
    <mat-tab label="Por Entregar">
      <ng-template matTabContent>
        <ng-container *ngTemplateOutlet="templateSupport"></ng-container>
      </ng-template>
    </mat-tab>

    <mat-tab label="Inspección">
      <ng-template matTabContent>
        <app-inspection-page />
      </ng-template>
    </mat-tab>

    <mat-tab label="Aprobado">
      <ng-template matTabContent>
        <ng-container *ngTemplateOutlet="templateSupport"></ng-container>
      </ng-template>
    </mat-tab>

    <mat-tab label="Anulado">
      <ng-template matTabContent>
        <ng-container *ngTemplateOutlet="templateSupport"></ng-container>
      </ng-template>
    </mat-tab>

  </mat-tab-group>

  <ng-template #templateSupport>
    <div class="mx-3 mt-2">
    @if (store.supportStatus().length > 0) {
      <app-support-page/>
    }
    </div>
  </ng-template>


</app-mat-dynamic-card>
