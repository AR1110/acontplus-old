<app-mat-custom-dialog [containerTemplate]="body" title="Mantenimiento" (close)="modal.close()" />

<ng-template #body>
  <div class="vstack gap-2">
    <div class="row">
      <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
        <div class="row">
          <div class="col-xl-5 col-lg-5 col-md-6 col-sm-12 col-12">
            <mat-form-field class="w-100">
              <mat-label>Establecimiento</mat-label>
              <input matInput [value]="data.establecimiento" readonly />
            </mat-form-field>
          </div>
          <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
            <mat-form-field class="w-100">
              <mat-label>Punto Emisión:</mat-label>
              <input matInput [value]="data.ptoEmi" readonly />
            </mat-form-field>
          </div>
          <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
            <mat-form-field class="w-100">
              <mat-label>Fecha Emisión:</mat-label>
              <input matInput [value]="fechaLegible" readonly />
            </mat-form-field>
          </div>
        </div>
      </div>
      <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
        <div class="row">
          <div class="col-xl-8 col-lg-8 col-md-8 col-sm-12 col-12">
            <mat-form-field class="w-100">
              <mat-label>Cliente:</mat-label>
              <input matInput [value]="data.businessName" readonly />
              <ng-container matSuffix>
                <button type="button" mat-icon-button (click)="showClientInfo()">
                  <mat-icon>info</mat-icon>
                </button>
              </ng-container>
            </mat-form-field>
          </div>
          <div class="col-xl-4 col-lg-4 col-md-4 col-sm-12 col-12">
            <mat-form-field class="w-100">
              <mat-label>Placa:</mat-label>
              <input matInput [value]="vehicle().licensePlate" readonly />
              <ng-container matSuffix>
                <button type="button" mat-icon-button (click)="showVehicleInfo()">
                  <mat-icon>info</mat-icon>
                </button>
              </ng-container>
            </mat-form-field>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 col-12">
        <app-product-search-overlay
          (optionSelected)="onResultSelectedProduct($event)"
          [searchSale]="true"
        />
      </div>
      <div class="col-xl-2 col-lg-2 col-md-12 col-sm-12 col-12">
        <mat-form-field class="w-100">
          <mat-label>Bodega: </mat-label>
          <mat-select [(ngModel)]="data.bodegaId" (selectionChange)="onChangeBodega()">
            @for (item of bodegas(); track $index) {
              <mat-option [value]="item.idBodega">{{ item.descripcion }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <div class="col-xl-2 col-lg-2 col-md-12 col-sm-12 col-12">
        <mat-form-field class="w-100">
          <mat-label>Tarifa: </mat-label>
          <mat-select [(ngModel)]="data.feeId" (selectionChange)="onChangeFee()">
            @for (item of feeds(); track $index) {
              <mat-option [value]="item.idTarifa">{{ item.descripcion }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <div class="col-xl-4 col-lg-4 col-md-4 col-sm-12 col-12">
        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
          <acp-button
            type="button"
            variant="success"
            text="Guardar"
            icon="save"
            (handleClick)="save()"
          />
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-12">
        <acp-tabulator-table
          [columns]="columns"
          [data]="details()"
          [options]="tabulatorOptions"
          (cellEdited)="cellEdited($event)"
        />
      </div>
    </div>

    <div class="row">
      <div class="col-xl-9 col-lg-9 col-md-6 col-sm-12 col-12">
        <mat-form-field class="w-100">
          <mat-label>Observación</mat-label>
          <textarea matInput [value]="data.obs" placeholder="..." readonly></textarea>
        </mat-form-field>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <div class="mt-2">
          <app-draw-tax-total
            [subTotalSinImpuesto]="data.subTotalSinImpuesto"
            [htmlImpuestoTotal]="htmlImpuestoTotal()"
            [discount]="data.discount"
            [htmlIvaTotal]="htmlIvaTotal()"
            [importeTotal]="data.total"
          />
        </div>
      </div>
    </div>
  </div>
</ng-template>
