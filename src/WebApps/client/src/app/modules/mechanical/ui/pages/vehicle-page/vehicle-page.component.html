<app-breadcrumb />

<acp-dynamic-card
  cardTitle="Producto Destacado"
  cardSubtitle="¡El mejor producto del año!"
  [primaryButtonText]="'Comprar'"
  [secondaryButtonText]="'Ver más'"
>
  <ng-container>
    <div
      class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-1 row-cols-1 g-4"
    >
      <div class="col"></div>
      <div class="col">
        <div class="d-flex flex-row gap-1 justify-content-end">
          <acp-button
            variant="success"
            icon="add"
            matStyle="icon"
            (resultModalHandler)="resultModal($event)"
            appVehicleAddEdit
            [disabled]="isLoading()"
          />
          <acp-button
            variant="secondary"
            icon="refresh"
            matStyle="icon"
            (handleClick)="refresh()"
            [disabled]="isLoading()"
          />
        </div>
      </div>
    </div>

    <acp-data-grid
      [data]="dataSource()"
      [columns]="columns"
      [loading]="isLoading()"
      [length]="pagination().totalRecords"
      [pageIndex]="pagination().pageIndex"
      [pageSize]="pagination().pageSize"
      (page)="handlePageEvent($event)"
      [cellTemplate]="{
        op: templateOp,
        nomEstado: statusTemplate,
      }"
    />

    <ng-template #templateOp let-data>
      <acp-button
        variant="info"
        icon="edit"
        matStyle="icon"
        (resultModalHandler)="resultModal($event)"
        [params]="{ id: data.id }"
        appVehicleAddEdit
      />
      <acp-button
        variant="danger"
        icon="delete"
        matStyle="icon"
        (handleClick)="askToDelete(data.id)"
      />
    </ng-template>

    <ng-template #statusTemplate let-data>
      <mat-slide-toggle (change)="putState(data.id, data.enabled)" [(ngModel)]="data.enabled" />
    </ng-template>
  </ng-container>
</acp-dynamic-card>
