<div class="d-grid gap-2">
  <div
    class="row row-cols-4 row-cols-xxl-4 row-cols-xl-4 row-cols-lg-4 row-cols-md-3 row-cols-sm-3"
  >
    <div class="col">
      <acp-dynamic-card>
        <div class="row">
          <div class="col-md-12">
            <div class="d-flex no-block align-items-center">
              <div>
                <h3>
                  <mat-icon>settings</mat-icon>
                </h3>
                <p class="text-muted">Soportes</p>
              </div>
              <div class="ms-auto">
                <h2 class="counter text-primary">
                  {{ data.quantitySupport }}
                </h2>
              </div>
            </div>
          </div>
          <div class="col-12">
            <div class="progress">
              <div
                class="progress-bar bg-primary"
                role="progressbar"
                style="width: 85%; height: 6px"
                aria-valuenow="25"
                aria-valuemin="0"
                aria-valuemax="100"
              ></div>
            </div>
          </div>
        </div>
      </acp-dynamic-card>
    </div>
    <div class="col">
      <acp-dynamic-card>
        <div class="row">
          <div class="col-md-12">
            <div class="d-flex no-block align-items-center">
              <div>
                <h3>
                  <mat-icon>settings</mat-icon>
                </h3>
                <p class="text-muted">Inspecciones</p>
              </div>
              <div class="ms-auto">
                <h2 class="counter text-danger">
                  {{ data.quantityInspection }}
                </h2>
              </div>
            </div>
          </div>
          <div class="col-12">
            <div class="progress">
              <div
                class="progress-bar bg-danger"
                role="progressbar"
                style="width: 85%; height: 6px"
                aria-valuenow="25"
                aria-valuemin="0"
                aria-valuemax="100"
              ></div>
            </div>
          </div>
        </div>
      </acp-dynamic-card>
    </div>
    <div class="col">
      <acp-dynamic-card>
        <div class="row">
          <div class="col-md-12">
            <div class="d-flex no-block align-items-center">
              <div>
                <h3>
                  <mat-icon>directions_car</mat-icon>
                </h3>
                <p class="text-muted">Vehículos</p>
              </div>
              <div class="ms-auto">
                <h2 class="counter text-success">
                  {{ data.quantityVehicleCompany }}
                </h2>
              </div>
            </div>
          </div>
          <div class="col-12">
            <div class="progress">
              <div
                class="progress-bar bg-success"
                role="progressbar"
                style="width: 85%; height: 6px"
                aria-valuenow="25"
                aria-valuemin="0"
                aria-valuemax="100"
              ></div>
            </div>
          </div>
        </div>
      </acp-dynamic-card>
    </div>

    <div class="col">
      <acp-dynamic-card>
        <canvas id="chartSupports" height="200px"></canvas>
      </acp-dynamic-card>
    </div>
  </div>

  <div class="row row-xxl-1">
    <app-support-page />
  </div>
</div>
