<div class="d-grid gap-2">
  <div
    class="row row-cols-4 row-cols-xxl-4 row-cols-xl-4 row-cols-lg-4 row-cols-md-3 row-cols-sm-3"
  >
    <div class="col">
      <mat-card appearance="outlined">
        <mat-card-content>
          <div class="row">
            <div class="col-md-12">
              <div class="d-flex no-block align-items-center">
                <div>
                  <h3>
                    <fa-icon [icon]="'tools'"></fa-icon>
                  </h3>
                  <p class="text-muted">Soportes</p>
                </div>
                <div class="ms-auto">
                  <h2 class="counter text-primary">
                    {{ data.quantitySupport }}
                  </h2>
                </div>
              </div>
            </div>
            <div class="col-12">
              <div class="progress">
                <div
                  class="progress-bar bg-primary"
                  role="progressbar"
                  style="width: 85%; height: 6px"
                  aria-valuenow="25"
                  aria-valuemin="0"
                  aria-valuemax="100"
                ></div>
              </div>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
    <div class="col">
      <mat-card appearance="outlined">
        <mat-card-content>
          <div class="row">
            <div class="col-md-12">
              <div class="d-flex no-block align-items-center">
                <div>
                  <h3>
                    <fa-icon [icon]="'cogs'"></fa-icon>
                  </h3>
                  <p class="text-muted">Inspecciones</p>
                </div>
                <div class="ms-auto">
                  <h2 class="counter text-danger">
                    {{ data.quantityInspection }}
                  </h2>
                </div>
              </div>
            </div>
            <div class="col-12">
              <div class="progress">
                <div
                  class="progress-bar bg-danger"
                  role="progressbar"
                  style="width: 85%; height: 6px"
                  aria-valuenow="25"
                  aria-valuemin="0"
                  aria-valuemax="100"
                ></div>
              </div>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
    <div class="col">
      <mat-card>
        <mat-card-content>
          <div class="row">
            <div class="col-md-12">
              <div class="d-flex no-block align-items-center">
                <div>
                  <h3>
                    <fa-icon [icon]="'car'"></fa-icon>
                  </h3>
                  <p class="text-muted">Vehículos</p>
                </div>
                <div class="ms-auto">
                  <h2 class="counter text-success">
                    {{ data.quantityVehicleCompany }}
                  </h2>
                </div>
              </div>
            </div>
            <div class="col-12">
              <div class="progress">
                <div
                  class="progress-bar bg-success"
                  role="progressbar"
                  style="width: 85%; height: 6px"
                  aria-valuenow="25"
                  aria-valuemin="0"
                  aria-valuemax="100"
                ></div>
              </div>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    </div>

    <div class="col-2">
      <mat-card appearance="outlined">
        <mat-card-content>
          <canvas id="chartSupports" height="200px"></canvas>
        </mat-card-content>
      </mat-card>
    </div>
  </div>

  <div class="row row-xxl-1">
    <app-mat-dynamic-card>
      <app-support-page
        [valueStatus]="valueStatus"
        [supportStatus]="supportStatus"
      />
    </app-mat-dynamic-card>
  </div>
</div>
