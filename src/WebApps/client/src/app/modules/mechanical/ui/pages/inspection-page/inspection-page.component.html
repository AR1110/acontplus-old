<acp-data-grid
  [loading]="isLoadingResults()"
  [data]="dataSource"
  [columns]="columns"
  [length]="pagination().totalRecords"
  [pageIndex]="pagination().pageIndex"
  [pageSize]="pagination().pageSize"
  (page)="handlePageEvent($event)"
  [cellTemplate]="{
    op: templateOp,
  }"
/>

<ng-template #templateOp let-data>
  <acp-button variant="secondary" icon="more_vert" matStyle="icon" [matMenuTriggerFor]="menu" />

  <mat-menu #menu="matMenu">
    <button mat-menu-item (click)="getReport(data)">
      <mat-icon>download</mat-icon>
      <span>Reporte</span>
    </button>

    <button mat-menu-item (click)="openModal(data.id, data.supportId)">
      <mat-icon>edit</mat-icon>
      <span>Editar</span>
    </button>
  </mat-menu>
</ng-template>
