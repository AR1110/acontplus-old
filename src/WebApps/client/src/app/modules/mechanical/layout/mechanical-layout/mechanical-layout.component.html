<app-breadcrumb></app-breadcrumb>

<div class="card">
  <div class="card-body">
    <ul ngbNav #nav="ngbNav" [(activeId)]="active" (shown)="onShown($event)" class="nav-tabs">
      <li [ngbNavItem]="0">
        <button ngbNavLink>Dashboard</button>
        <ng-template ngbNavContent>
          <app-mechanical-dashboard/>
        </ng-template>
      </li>
      <li [ngbNavItem]="1">
        <button ngbNavLink>Soporte</button>
        <ng-template ngbNavContent>
          <app-support-page [status]="active" />
        </ng-template>
      </li>
      <li [ngbNavItem]="2">
        <button ngbNavLink>En proceso</button>
        <ng-template ngbNavContent>
            <app-support-page [status]="active" />
          <!-- <app-inspection-page /> -->
        </ng-template>
      </li>

      <li [ngbNavItem]="3">
        <button ngbNavLink>Inspección</button>
        <ng-template ngbNavContent>

           <app-inspection-page />
        </ng-template>
      </li>
    </ul>

    <div [ngbNavOutlet]="nav" class="mt-2"></div>
  </div>
</div>
