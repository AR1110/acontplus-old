<app-breadcrumb>
  <!-- appActionAdd -->
  <button type="button" class="btn btn-info" appVehicleAddEdit>
    <fa-icon [icon]="'add'"></fa-icon> Nuevo
  </button>
</app-breadcrumb>

<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="col-xl-6 col-lg-6 col-12">

        <div class="form-group">
          <input type="text" class="form-control" placeholder="Buscar vehiculo">
        </div>
      </div>
    </div>
    <section class="section-container-table">
      <table mat-table [dataSource]="dataSource">

        <!-- Position Column -->
        <ng-container matColumnDef="position">
          <th mat-header-cell *matHeaderCellDef> No. </th>
          <td mat-cell *matCellDef="let element"> {{element.position}} </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="op">
          <th mat-header-cell *matHeaderCellDef> Op. </th>
          <td mat-cell *matCellDef="let element">
            <button class="btn btn-outline-warning btn-sm" appVehicleAddEdit [params]="{id: element.id}"
              (resultModalHandler)="resultModal($event)">
              <fa-icon [icon]="'pencil'"></fa-icon>
            </button>
            <button class="btn btn-outline-danger btn-sm" (click)="askToDelete(element.id)">
              <fa-icon [icon]="'trash'"></fa-icon>
            </button>
          </td>
        </ng-container>

        <ng-container matColumnDef="tipoVehiculo">
          <th mat-header-cell *matHeaderCellDef> T. Vehiculo </th>
          <td mat-cell *matCellDef="let element"> {{element.vehicleType}} </td>
        </ng-container>

        <!-- Weight Column -->
        <ng-container matColumnDef="placa">
          <th mat-header-cell *matHeaderCellDef> Placa </th>
          <td mat-cell *matCellDef="let element"> {{element.licensePlate}} </td>
        </ng-container>

        <ng-container matColumnDef="identificacion">
          <th mat-header-cell *matHeaderCellDef> Identificación </th>
          <td mat-cell *matCellDef="let element"> {{element.idCard}} </td>
        </ng-container>

        <!-- Symbol Column -->
        <ng-container matColumnDef="cliente-conductor">
          <th mat-header-cell *matHeaderCellDef> Cliente/Conductor </th>
          <td mat-cell *matCellDef="let element"> {{element.tradeName}} </td>
        </ng-container>

        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef> Estado </th>
          <td mat-cell *matCellDef="let element">
            <mat-slide-toggle [(ngModel)]="element.enabled"></mat-slide-toggle>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </section>

  </div>
</div>
