<div class="row">
  <div class="col-4">
    <div class="card-body border">
      <div class="row">
        <div class="col-md-12">
          <div class="d-flex no-block align-items-center">
            <div>
              <h3>
                <fa-icon [icon]="'tools'"></fa-icon>
              </h3>
              <p class="text-muted">Soportes</p>
            </div>
            <div class="ms-auto">
              <h2 class="counter text-primary">{{data.quantitySupport}}</h2>
            </div>
          </div>
        </div>
        <div class="col-12">
          <div class="progress">
            <div class="progress-bar bg-primary" role="progressbar" style="width: 85%; height: 6px;" aria-valuenow="25"
              aria-valuemin="0" aria-valuemax="100"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-4">
    <div class="card-body border">
      <div class="row">
        <div class="col-md-12">
          <div class="d-flex no-block align-items-center">
            <div>
              <h3>
                <fa-icon [icon]="'cogs'"></fa-icon>
              </h3>
              <p class="text-muted">Inspecciones</p>
            </div>
            <div class="ms-auto">
              <h2 class="counter text-danger">{{data.quantityInspection}}</h2>
            </div>
          </div>
        </div>
        <div class="col-12">
          <div class="progress">
            <div class="progress-bar bg-danger" role="progressbar" style="width: 85%; height: 6px;" aria-valuenow="25"
              aria-valuemin="0" aria-valuemax="100"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-4">
    <div class="card-body border">
      <div class="row">
        <div class="col-md-12">
          <div class="d-flex no-block align-items-center">
            <div>
              <h3>
                <fa-icon [icon]="'car'"></fa-icon>
              </h3>
              <p class="text-muted">Vehículos</p>
            </div>
            <div class="ms-auto">
              <h2 class="counter text-success">{{data.quantityVehicleCompany}}</h2>
            </div>
          </div>
        </div>
        <div class="col-12">
          <div class="progress">
            <div class="progress-bar bg-success" role="progressbar" style="width: 85%; height: 6px;" aria-valuenow="25"
              aria-valuemin="0" aria-valuemax="100"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>


<div class="row">
  <div class="col-xl-4 col-lg-4 col-md-4 col-sm-12 col-12">
    <div class="card">
      <div class="card-body">
        <canvas id="chartSupports" height="200px"></canvas>
      </div>
    </div>
  </div>
</div>
