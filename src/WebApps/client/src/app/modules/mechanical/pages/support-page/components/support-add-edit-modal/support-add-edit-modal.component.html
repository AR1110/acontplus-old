<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">
    {{titleModal}}
  </h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
</div>
<div class="modal-body">
  <div class="row">
    <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
      <div class="form-group">
        <label for="establecimiento">Establecimiento: <span class="text-danger">*</span></label>
        <select name="establecimiento" id="establecimiento" class="form-select" [(ngModel)]="data.establecimientoId" (change)="onChangeEstab()">
          @for (item of establishments; track $index) {
            <option [ngValue]="item.establecimientoId">{{item.nombreComercial}}</option>
          }
        </select>
      </div>
    </div>
    <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
      <div class="form-group">
        <label for="puntoEmision">Punto Emisión: <span class="text-danger">*</span></label>
        <select name="puntoEmision" id="puntoEmision" class="form-select" [(ngModel)]="data.puntoEmisionId">
          @for (item of emissionPoints; track $index) {
            <option [ngValue]="item.puntoEmisionId">{{item.ptoEmi}}</option>
          }
        </select>
      </div>
    </div>
    <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
      <div class="form-group">
        <label for="fechaEmision">Fecha Emisión: <span class="text-danger">*</span></label>
         <app-input-date></app-input-date>
      </div>
    </div>
    <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
      <div class="form-group">
        <label for="secuencia">Secuencia: <span class="text-danger">*</span></label>
        <input type="text" class="form-control" name="secuencia" id="secuencia" [value]="data.sequence" readonly>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-xl-8 col-lg-8 col-md-6 col-sm-12 col-12">
      <div class="form-group">
        <label for="cliente-vehiculo">Cliente/Vehiculo: <span class="text-danger">*</span></label>
        <div class="input-group">
          <input
          type="search"
          class="form-control"
          placeholder="Buscar Cliente o Vehículo"
          [(ngModel)]="dataSearchVehicle.model"
        [ngbTypeahead]="search"
        [resultTemplate]="rt"
        [inputFormatter]="formatter"
          >
          <ng-template #rt let-r="result" let-t="term">
            <img [src]="'https://upload.wikimedia.org/wikipedia/commons/thumb/' + r['flag']" class="me-1" style="width: 16px" />
            <ngb-highlight [result]="r.name" [term]="t"></ngb-highlight>
          </ng-template>

          <button type="button" class="btn btn-secondary btn-sm" appVehicleAddEdit (resultModalHandler)="resultModalVehicle($event)">
            <fa-icon [icon]="'plus'"></fa-icon>
          </button>
            <button type="button" class="btn btn-secondary btn-sm">
              <fa-icon [icon]="'pencil'"></fa-icon>
            </button>
        </div>
      </div>
    </div>
    <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
      <div class="form-group">
        <label for="tecnicoEncargado">Técnico Encargado: <span class="text-danger">*</span></label>
        <select name="tecnicoEncargado" id="tecnicoEncargado" class="form-select" [(ngModel)]="data.userAssignedId">
          @for (item of users; track $index) {
            <option [ngValue]="item.userAssignedId">{{item.userName}}</option>
          }

        </select>
      </div>
    </div>
  </div>
  <div class="form-group">
    <label for="soporteRealizar">Soporte a realizar: <span class="text-danger">*</span></label>
    <textarea name="soporteRealizar" id="soporteRealizar" class="form-control" [(ngModel)]="data.obs"></textarea>
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-success">
    {{btnText}}
  </button>
  <button type="button" class="btn btn-dark" (click)="modal.close()">
    &times; Cerrar
  </button>
</div>
