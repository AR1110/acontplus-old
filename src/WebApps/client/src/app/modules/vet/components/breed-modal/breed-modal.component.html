<form (ngSubmit)="onSave()" [formGroup]="breedForm">
  <div class="modal-header">
    <h5 class="modal-title">
      <mat-icon>{{modalIcon}}</mat-icon>
      {{ modalTitle }}
    </h5>
    <button (click)="onModalClose()" class="btn-close" type="button"></button>
  </div>
  <div class="modal-body">
    <div class="row">
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
        <div class="form-group">
          <label for="petTypeId">Especie:</label>
          <select
            class="form-select"
            formControlName="petTypeId"
            id="petTypeId"
            required
          >
            <option disabled selected>Seleccione la especie</option>
            @for (item of petTypes; track $index) {
              <option [value]="item.id">{{ item.name }}</option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
        <div class="form-group">
          <label for="code">Código</label>
          <input
            class="form-control"
            formControlName="code"
            id="code"
            maxlength="5"
            required
            type="text"
          />
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
        <div class="form-group">
          <label for="name">Nombre</label>
          <input
            class="form-control"
            formControlName="name"
            id="name"
            required
            type="text"
          />
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
        <div class="form-group">
          <label for="description">Descripción</label>
          <input
            class="form-control"
            formControlName="description"
            id="description"
            type="text"
          />
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-xl-4 col-lg-4 col-md-4 col-sm-4 col-12">
        <div class="form-group">
          <label for="enabled">Estado:</label>
          <input class="form-check" formControlName="enabled" id="enabled" type="checkbox"/>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button mat-raised-button type="submit">
      <mat-icon>save</mat-icon>Guardar
    </button>
    <button (click)="onModalClose()"
            class="btn btn-dark btn-sm"
            type="button"
    >
      <i class="ti-close"></i> Cancelar
    </button>
  </div>
</form>
