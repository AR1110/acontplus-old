<app-mat-custom-dialog
  [containerTemplate]="body"
  [actionsTemplate]="footer"
  [title]="modalTitle"
  (close)="onModalClose()"
/>
<ng-template #body>
  <form (ngSubmit)="onSave()" id="petForm" [formGroup]="petForm">
    <div class="row">
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <app-company-customer-search
            (customerSelected)="onCustomerSelected($event)"
            [textSearch]="customerBusinessName"
            [isAdvancedMode]="true"
          />
        </div>
      </div>
    </div>
    <acp-dynamic-card>
      <h5 class="card-subtitle">Datos de la mascota</h5>
      <div class="row">
        <div class="col-xl-4 col-lg-4 col-md-4 col-sm-4 col-12">
          <div class="form-group">
            <label for="name">Nombre</label>
            <input
              class="form-control"
              formControlName="name"
              id="name"
              placeholder="Nombre"
              required
              type="text"
            />
          </div>
        </div>
        <div class="col-xl-4 col-lg-4 col-md-4 col-sm-4 col-12">
          <div class="form-group">
            <label for="petTypeId">Especie:</label>
            <select
              (change)="onPetTypeChange($event)"
              class="form-select"
              formControlName="petTypeId"
              id="petTypeId"
              required
            >
              <option disabled selected>Seleccione la especie</option>
              @for (item of petTypes(); track $index) {
                <option [value]="item.id">{{ item.name }}</option>
              }
            </select>
          </div>
        </div>
        @if (breedsFiltered().length > 0) {
          <div class="col-xl-4 col-lg-4 col-md-4 col-sm-4 col-12">
            <div class="form-group">
              <label for="breedId">Raza:</label>
              <select class="form-select" id="breedId" formControlName="breedId" required>
                <option disabled selected>Seleccione la raza</option>
                @for (item of breedsFiltered(); track $index) {
                  <option [value]="item.id">{{ item.name }}</option>
                }
              </select>
            </div>
          </div>
        }
      </div>

      <div class="row">
        <div class="col-xl-4 col-lg-4 col-md-4 col-sm-4 col-12">
          <div class="form-group">
            <label for="genderId">Sexo:</label>
            <select class="form-select" formControlName="genderId" id="genderId">
              <option disabled selected>Seleccione el sexo</option>
              @for (item of genders(); track $index) {
                <option [value]="item.id">{{ item.name }}</option>
              }
            </select>
          </div>
        </div>
        <div class="col-xl-4 col-lg-4 col-md-4 col-sm-4 col-12">
          <div class="form-group">
            <label for="color">Color:</label>
            <input
              class="form-control"
              formControlName="color"
              id="color"
              placeholder="blanco"
              required
              type="text"
            />
          </div>
        </div>
        <div class="col-xl-4 col-lg-4 col-md-4 col-sm-4 col-12">
          <div class="form-group">
            <label for="birthdate">Fecha de Nacimiento:</label>
            <input class="form-control" formControlName="birthdate" id="birthdate" type="date" />
          </div>
        </div>
      </div>
    </acp-dynamic-card>
  </form>
</ng-template>
<ng-template #footer>
  <acp-button
    [disabled]="petForm.invalid"
    variant="success"
    icon="save"
    text="Guardar"
    type="submit"
    form="petForm"
  />
</ng-template>
