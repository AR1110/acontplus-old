<app-breadcrumb />
<acp-dynamic-card>
  <div class="row mb-3">
    <div class="col-md-2 col-12">
      <button (click)="onModalOpen()" mat-raised-button type="button">
        <mat-icon>add</mat-icon>
        Nueva
      </button>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table table-bordered">
      <thead>
        <tr>
          <th class="text-center">Opciones</th>
          <th class="text-center">#</th>
          <th>Especie</th>
          <th>Código</th>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        @for (item of breeds(); track $index) {
          <tr>
            <td class="text-center">
              <button mat-button [matMenuTriggerFor]="menu">Menu</button>

              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="onEdit(item)">
                  <mat-icon>edit</mat-icon>
                  Editar
                </button>
                <button mat-menu-item (click)="onDelete(item)">
                  <mat-icon>delete</mat-icon>
                  Eliminar
                </button>
              </mat-menu>
            </td>
            <td class="text-center">{{ $index + 1 }}</td>
            <td>{{ item.petType?.name }}</td>
            <td>{{ item.code }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.description }}</td>
            <td>
              <div [innerHTML]="item.enabled | secondaryStatus"></div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</acp-dynamic-card>
