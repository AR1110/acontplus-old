<app-breadcrumb>
  <button
    (click)="onModalOpen()"
    class="btn btn-info d-block d-lg-inline-block m-l-15"
    type="button"
  >
    <fa-icon [icon]="'plus-circle'"></fa-icon>
    Nueva
  </button>
</app-breadcrumb>
@if (breeds.length > 0) {
  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-bordered">
          <thead>
          <tr>
            <th>Especie</th>
            <th>Código</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Opciones</th>
          </tr>
          </thead>
          <tbody>
            @for (item of breeds; track $index) {
              <tr>
                <td>{{ item.petType?.name }}</td>
                <td>{{ item.code }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.description }}</td>
                <td>
                  <button (click)="onEdit(item)"
                          class="btn btn-outline-warning btn-sm"
                          type="button"
                  ><i class="ti-pencil"></i></button>
                  <button (click)="onDelete(item)"
                          class="btn btn-outline-danger btn-sm"
                          type="button"
                  ><i class="ti-trash"></i></button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
} @else {
  <h5 class="text-info">No se encontraron registros de razas</h5>
}
