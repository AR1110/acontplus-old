<!-- src/app/components/breed/breed.component.html -->
<div class="row page-titles">
  <div class="col-md-5 align-self-center">
    <h5 class="text-themecolor">Razas de Mascotas</h5>
  </div>
  <div class="col-md-7 align-self-center text-right">
    <div class="d-flex justify-content-end align-items-center">
      <button
        class="btn btn-info d-block d-lg-inline-block m-l-15"
        type="button"
      >
        <i class="fa fa-plus-circle"></i> Nueva
      </button>
    </div>
  </div>
</div>


<div *ngIf="breeds.length > 0">
  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-bordered">
          <thead>
          <tr>
            <th>Especie</th>
            <th>Código</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Opciones</th>
          </tr>
          </thead>
          <tbody>
          <ng-container>
            <tr *ngFor="let item of breeds">
              <td>{{ item.petType }}</td>
              <td>{{ item.code }}</td>
              <td>{{ item.name }}</td>
              <td>{{ item.description }}</td>
              <td>
                <button
                  class="btn btn-outline-warning btn-sm"
                  type="button"
                ><i class="ti-pencil"></i></button>
                <button
                  class="btn btn-outline-danger btn-sm"
                  type="button"
                ><i class="ti-trash"></i></button>
              </td>
            </tr>
          </ng-container>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div *ngIf="breeds.length === 0">
  <h5 class="text-info">No se encontraron registros de razas</h5>
</div>
