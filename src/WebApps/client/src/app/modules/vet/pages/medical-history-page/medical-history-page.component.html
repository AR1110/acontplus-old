<app-breadcrumb />

<acp-dynamic-card>
  <div class="vstack gap-2">
    <div class="row">
      <div class="col-md-2 col-12">
        <acp-button
          variant="success"
          icon="add"
          text="Nuevo Historial"
          (handleClick)="onModalOpen()"
        />
      </div>
    </div>

    <div class="row row-cols-2">
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Establecimiento: </mat-label>
          <mat-select (selectionChange)="refresh()" [(ngModel)]="dataSearch.idEstablecimiento">
            @for (estab of establecimientos(); track $index) {
              <mat-option [value]="estab.idEstablecimiento">
                {{ estab.nombreComercial }}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Buscar mascota o cliente</mat-label>
          <input matInput [(ngModel)]="dataSearch.textSearch" />
          <ng-container matSuffix>
            <button type="button" mat-icon-button (click)="refresh()">
              <mat-icon>refresh</mat-icon>
            </button>
          </ng-container>
        </mat-form-field>
      </div>
    </div>
  </div>

  <app-mat-dynamic-table
    [tableData]="dataSource()"
    [columnDefinitions]="columnsDefs"
    [visibleColumns]="columns"
    [templateOp]="templateOp"
    [paginationConfig]="pagination()"
    [enablePagination]="true"
    (pageEvent)="handlePageEvent($event)"
  />

  <ng-template #templateOp let-item="item">
    <acp-button variant="primary" [icon]="'edit'" matStyle="icon" (handleClick)="onEdit(item)" />
    <acp-button variant="warning" icon="delete " matStyle="icon" (handleClick)="onDelete(item)" />
    <acp-button
      matStyle="icon"
      variant="secondary"
      icon="download"
      (handleClick)="onReport(item)"
    />
  </ng-template>
</acp-dynamic-card>
