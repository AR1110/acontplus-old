<app-breadcrumb />

<app-mat-dynamic-card>
  <div class="row">
    <div class="row">
      <div class="col-md-2 col-12">
        <app-theme-button
          variant="success"
          icon="add"
          text="Nueva Historia"
          (handleClick)="onModalOpen()"
        ></app-theme-button>
      </div>
    </div>
    <div class="col-xl-8 col-lg-8 col-md-8 col-sm-12 col-12">
      <div class="form-group">
        <span>Establecimiento: </span>
        <div class="input-group">
          <select
            (change)="onChangeEstab()"
            [(ngModel)]="dataSearch.idEstablecimiento"
            class="form-select form-control-border"
          >
            <option value="">Todos</option>
            @for (estab of establecimientos(); track $index) {
            <option [ngValue]="estab.idEstablecimiento">
              {{ estab.nombreComercial }}
            </option>
            }
          </select>
          <input
            #input
            (keyup)="applyFilter($event)"
            class="form-control"
            matInput
            placeholder="Buscar mascota o cliente"
          />
        </div>
      </div>
    </div>
  </div>

  <app-mat-dynamic-table
    [tableData]="dataSource.data"
    [columnDefinitions]="columnsDefs"
    [visibleColumns]="columns"
    [templateOp]="templateOp"
    [paginationConfig]="pagination()"
    [enablePagination]="true"
    (pageEvent)="handlePageEvent($event)"
  />

  <ng-template #templateOp let-item="item">
    <app-theme-button
      variant="primary"
      [icon]="'edit'"
      matStyle="icon"
      (handleClick)="onEdit(item)"
    ></app-theme-button>
    <app-theme-button
      variant="warning"
      icon="delete "
      matStyle="icon"
      (handleClick)="onDelete(item)"
    ></app-theme-button>
    <app-theme-button
      matStyle="icon"
      variant="secondary"
      icon="download"
      (handleClick)="onReport(item)"
    ></app-theme-button>
  </ng-template>
</app-mat-dynamic-card>
