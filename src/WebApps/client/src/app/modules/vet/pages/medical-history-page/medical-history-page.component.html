<app-breadcrumb />

<acp-dynamic-card>
  <div class="vstack gap-2">
    <div class="row">
      <div class="col-md-2 col-12">
        <acp-button
          variant="success"
          icon="add"
          text="Nuevo Historial"
          (handleClick)="onModalOpen()"
        />
      </div>
    </div>

    <div class="row row-cols-2">
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Establecimiento: </mat-label>
          <mat-select (selectionChange)="refresh()" [(ngModel)]="dataSearch.idEstablecimiento">
            @for (estab of establecimientos(); track $index) {
              <mat-option [value]="estab.idEstablecimiento">
                {{ estab.nombreComercial }}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Buscar mascota o cliente</mat-label>
          <input matInput [(ngModel)]="dataSearch.textSearch" />
          <ng-container matSuffix>
            <acp-button
              variant="secondary"
              icon="refresh"
              matStyle="icon"
              (handleClick)="refresh()"
            />
          </ng-container>
        </mat-form-field>
      </div>
    </div>
  </div>

  <acp-data-grid
    [data]="dataSource()"
    [columns]="columns"
    [length]="pagination().totalRecords"
    [pageIndex]="pagination().pageIndex"
    [pageSize]="pagination().pageSize"
    (page)="handlePageEvent($event)"
    [cellTemplate]="{
      op: templateOp,
    }"
  />

  <ng-template #templateOp let-data>
    <acp-button variant="primary" [icon]="'edit'" matStyle="icon" (handleClick)="onEdit(data)" />
    <acp-button variant="warning" icon="delete " matStyle="icon" (handleClick)="onDelete(data)" />
    <acp-button
      matStyle="icon"
      variant="secondary"
      icon="download"
      (handleClick)="onReport(data)"
    />
  </ng-template>
</acp-dynamic-card>
