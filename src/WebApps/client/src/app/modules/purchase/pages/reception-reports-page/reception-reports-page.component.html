<app-breadcrumb />

<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="col-xl-4 col-lg-3 col-md-4 col-sm-6 col-12">
        <div class="icheck-primary">
          <input
            type="checkbox"
            id="supplierChecked"
            [(ngModel)]="dataSearch.supplierChecked"
            name="supplierChecked"
          />
          <label for="supplierChecked">Proveedor</label>
        </div>
      </div>
      <div class="col-xl-4 col-lg-3 col-md-4 col-sm-6 col-12">

      </div>
      <div class="col-xl-4 col-lg-3 col-md-4 col-sm-6 col-12"></div>
      <div class="col-xl-4 col-lg-3 col-md-4 col-sm-6 col-12"></div>
    </div>
    <hr />
    <div class="row">

      <div class="col-xl-3 col-lg-3 col-md-12 col-12">
        <div class="form-group">
          <label for="tipoComprobante">Tipo comprobante</label>
          <select
            name="tipoComprobante"
            id="tipoComprobante"
            class="form-select"
            [(ngModel)]="dataSearch.codDoc"
          >
            @for (item of tiposComprobante; track $index) {
            <option [ngValue]="item.codigoSri">{{ item.descripcion }}</option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-12 col-12">
        <div class="form-group">
          <label for="establecimiento">Establecimiento: </label>
          <select
            name="establecimiento"
            id="establecimiento"
            class="form-select"
            [(ngModel)]="dataSearch.codEstab"
          >
            <option [ngValue]="">Todos</option>
            @for (item of establecimientos; track $index) {
            <option [ngValue]="item.codEstab">
              {{ item.nombreComercial }}
            </option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-4 col-lg-4  col-md-12 col-12">
        <div class="form-group">
          <label for="dateRangeSelect">Rango Fechas</label>
          <app-date-range-selection (onChangeDateRange)="onDateRangeSelection($event)"/>
        </div>
      </div>
    </div>
    <div class="row">
      @if (dataSearch.supplierChecked) {
      <div class="col-xl-4 col-lg-4  col-md-12 col-12">
        <div class="form-group">
          <label for="supplierSearch">Proveedor</label>
          <app-supplier-search
            [isSearchSimple]="isSearchSupplierSimple"
            (onSupplierSelected)="onSupplierSelected($event)"
            [textSearch]="dataSearch.supplierName"
            (emptyInput)="resultEmptyInput($event)"
          ></app-supplier-search>
        </div>
      </div>

      }
    </div>
  </div>
  <div class="card-body">
    <div class="d-grid gap-2 d-md-flex justify-content-md-start">
      <button class="btn btn-danger" type="button" (click)="pdf()">PDF</button>
      <button class="btn btn-success" type="button" (click)="excel()">
        EXCEL
      </button>
    </div>
  </div>
</div>
