<app-breadcrumb/>

<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="col-xl-4 col-lg-3 col-md-4 col-sm-6 col-12">
        <div class="icheck-primary">
          <input
            [(ngModel)]="dataSearch.supplierChecked"
            id="supplierChecked"
            name="supplierChecked"
            type="checkbox"
          />
          <label for="supplierChecked">Proveedor</label>
        </div>
      </div>
      <div class="col-xl-4 col-lg-3 col-md-4 col-sm-6 col-12"></div>
      <div class="col-xl-4 col-lg-3 col-md-4 col-sm-6 col-12"></div>
      <div class="col-xl-4 col-lg-3 col-md-4 col-sm-6 col-12"></div>
    </div>
    <hr/>
    <div class="row">
      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="tipoDoc">Tipo Doc.:</label>
          <select
            [(ngModel)]="dataSearch.codDoc"
            class="form-select form-control-border"
            id="tipoDoc"
            name="tipoDoc"
          >
            <option value="">Todos</option>
            @for (item of tiposDoc; track $index) {
              <option [ngValue]="item.codDoc">{{ item.descripcion }}</option>
            }
          </select>
        </div>
      </div>

      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label>Establecimiento: </label>
          <select
            (change)="onChangeEstab()"
            [(ngModel)]="dataSearch.codEstab"
            class="form-select form-control-border"
          >
            <option value="">Todos</option>
            @for (estab of establecimientos; track $index) {
              <option [ngValue]="estab.codEstab">
                {{ estab.nombreComercial }}
              </option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="estado">Estado.:</label>
          <select
            [(ngModel)]="dataSearch.codEstado"
            class="form-select form-control-border"
            id="estado"
            name="estado"
          >
            <option value="">Todos</option>
            @for (item of estadosDoc; track $index) {
              <option [ngValue]="item.codigo">{{ item.descripcion }}</option>
            }
          </select>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label>Punto emisión: </label>
          <select
            [(ngModel)]="dataSearch.idPuntoEmision"
            class="form-select form-control-border"
          >
            <option [ngValue]="0">Todos</option>
            @for (ptoEmi of puntosEmision; track $index) {
              <option [ngValue]="ptoEmi.idPuntoEmision">
                {{ ptoEmi.ptoEmi }}
              </option>
            }
          </select>
        </div>
      </div>
      @if (dataSearch.supplierChecked) {
        <div class="col-xl-4 col-lg-4 col-md-12 col-12">
          <div class="form-group">
            <label>Proveedor</label>
            <app-supplier-search
              [isSearchSimple]="isSearchSupplierSimple"
              (onSupplierSelected)="onSupplierSelected($event)"
              [textSearch]="dataSearch.supplierName"
              (emptyInput)="supplierResultEmptyInput($event)"
            ></app-supplier-search>
          </div>
        </div>
      }
      <div class="col-xl-3 col-lg-3 col-md-4 col-sm-12 col-12">
        <div class="form-group">
          <label>Rango Fechas</label>

          <app-date-range-selection
            (onChangeDateRange)="onDateRangeSelection($event)"
          />
        </div>
      </div>
      <div class="col-xl-2 col-lg-2 col-md-2 col-sm-6 col-12">
        <div class="form-group">
          <label for="subcategoryId">Subcategoría:</label>
          <select [(ngModel)]="dataSearch.subcategoryId" class="form-select border-select" id="subcategoryId">
            <option [ngValue]="0">Todas</option>
            @for (item of subcategories; track $index) {
              <option [ngValue]="item.id">
                {{ item.name }}
              </option>
            }
          </select>
        </div>
      </div>
    </div>
  </div>
  <div class="card-body">
    <div class="d-grid gap-2 d-md-flex justify-content-md-start">
      <button (click)="getReport('pdf')" class="btn btn-danger" type="button">
        PDF
      </button>
      <button
        (click)="getReport('excel')"
        class="btn btn-success"
        type="button"
      >
        EXCEL
      </button>
    </div>
  </div>
</div>
