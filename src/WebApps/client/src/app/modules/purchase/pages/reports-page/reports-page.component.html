<app-breadcrumb />

<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="tipoDoc">Tipo Doc.:</label>
          <select
            name="tipoDoc"
            id="tipoDoc"
            class="form-select form-control-border"
            [(ngModel)]="dataSearch.codDoc"
          >
            @for (item of tiposDoc; track $index) {
            <option [ngValue]="item.codigo">{{ item.descripcion }}</option>
            }
          </select>
        </div>
      </div>

      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label>Establecimiento: </label>
          <select
            class="form-select form-control-border"
            [(ngModel)]="dataSearch.codEstab"
            (change)="onChangeEstab()"
          >
            <option value="">Todos</option>
            @for(estab of establecimientos; track $index ){
            <option [ngValue]="estab.codEstab">
              {{ estab.nombreComercial }}
            </option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label>Punto emisión: </label>
          <select
            class="form-select form-control-border"
            [(ngModel)]="dataSearch.idPuntoEmision"
          >
            <option [ngValue]="0">Todos</option>
            @for(ptoEmi of puntosEmision; track $index ){
            <option [ngValue]="ptoEmi.idPuntoEmision">
              {{ ptoEmi.ptoEmi }}
            </option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="estado">Estado.:</label>
          <select
            name="estado"
            id="estado"
            class="form-select form-control-border"
            [(ngModel)]="dataSearch.codEstado"
          >
            <option value="">Todos</option>
            @for (item of estadosDoc; track $index) {
            <option [ngValue]="item.codigo">{{ item.descripcion }}</option>
            }
          </select>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="range-date-filter">Rango de Fechas</label>
          <app-custom-date-range (onChangeDateRange)="onChangeDateRange($event)" />
        </div>
      </div>

      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="supplierFilter">Proveedor:</label>
          <div class="input-group">
            <div class="input-group-text">
              <input
                class="form-check-input mt-0"
                type="checkbox"
                value=""
                aria-label="Checkbox for following text input"
                [(ngModel)]="dataSearch.checkboxSupplier"
              />
            </div>
            <input
              id="typeahead-supplier"
              type="text"
              class="form-control form-control-border"
              [(ngModel)]="supplierRazonSocial"
              [ngbTypeahead]="searchSupplier"
              [resultTemplate]="rt"
              (selectItem)="onSelectSupplier($event)"
              onclick="select();"
            />
          </div>

          <ng-template #rt let-r="result" let-t="term">
            <ngb-highlight
              [result]="r.numeroIdentificacion + ' - ' + r.razonSocial"
              [term]="t"
            />
          </ng-template>
        </div>
      </div>
    </div>
  </div>
  <div class="card-footer">
    <button class="btn btn-info m-r-5" (click)="getReport('pdf')">PDF</button>
    <button class="btn btn-success" (click)="getReport('excel')">EXCEL</button>
  </div>
</div>
