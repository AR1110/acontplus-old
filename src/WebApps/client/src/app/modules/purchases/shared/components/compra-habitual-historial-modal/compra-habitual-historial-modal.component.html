<mat-dialog-content>
  <h1>{{'Historial de Compras Habituales -' + articleName}}</h1>
    <acp-data-grid
      [data]="comprasHabituales()"
      [columns]="columns"
      [showPaginator]="false"
      [cellTemplate]="{
        op: templateOp,
      }"
    />

  <ng-template #templateOp let-data>
    <acp-button
      variant="danger"
      icon="remove_shopping_cart"
      matStyle="icon"
      (handleClick)="askToDeleteCH(data)"
    />
  </ng-template>
</mat-dialog-content>
