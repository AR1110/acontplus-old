<form autocomplete="off" [formGroup]="dataForm" (ngSubmit)="save()">
<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">Profile update</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()"></button>
</div>
<div class="modal-body">
  <div class="form-group">
    <label for="room">Sala:  </label>
    <select name="room" id="room" class="form-select">
      <option value=""></option>
    </select>
  </div>
  <div class="form-group">
    <label for="description">Descripción: </label>
    <input type="text" name="description" formControlName="description" id="description" class="form-control" required>
  </div>

  <div class="row">
    <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
      <div class="form-group">
        <label for="nroTable">Número de mesa:</label>
        <input type="number" name="nroTable" id="nroTable" class="form-control" required>

      </div>
    </div>
    <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
      <div class="form-group">
        <label for="capacidad">Capacidad:</label>
        <input type="number" name="capacidad" id="capacidad" class="form-control" required>
      
      </div>
    </div>
  </div>

</div>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-success" (click)="closeModal()">
    Guardar
  </button>
  <button type="button" class="btn btn-outline-dark" (click)="closeModal()">Cerrar</button>
</div>
</form>
