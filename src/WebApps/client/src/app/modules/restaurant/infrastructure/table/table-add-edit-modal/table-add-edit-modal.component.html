<form (ngSubmit)="onSave()" [formGroup]="tableForm" autocomplete="off">
  <div class="modal-header">
    <h5 class="modal-title">
      <fa-icon [icon]="modalIcon"></fa-icon>
      {{ modalTitle }}
    </h5>
    <button (click)="onModalClose()" aria-label="Close" class="btn-close" type="button"></button>
  </div>
  <div class="modal-body">
    <div class="row">
      <div class="col">
        <div class="form-group">
          <label for="roomId">Sala: </label>
          <select class="form-select" formControlName="roomId" id="roomId" required>
            <option value="">Seleccione una sala</option>
            @for (item of rooms; track $index) {
              <option [value]="item.id">{{ item.floor?.description }} - {{ item.description }}</option>
            }
          </select>
        </div>
        <div class="form-group">
          <label for="description">Descripción: </label>
          <input [maxlength]="50" [minlength]="1" class="form-control" formControlName="description" id="description"
                 placeholder="Mesa I"
                 required
                 type="text">
        </div>
      </div>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-2 row-cols-lg-2 row-cols-xl-2 row-cols-xxl-2">
      <div class="col">
        <div class="form-group">
          <label for="numberTable">N°. de mesa:</label>
          <input [min]="1" class="form-control" formControlName="numberTable" id="numberTable" required type="number">
        </div>
      </div>
      <div class="col">
        <div class="form-group">
          <label for="capacity">Capacidad:</label>
          <input [min]="1" class="form-control" formControlName="capacity" id="capacity" required type="number">
        </div>
      </div>
    </div>

  </div>
  <div class="modal-footer">
    <button [disabled]="tableForm.invalid" class="btn btn-outline-success" type="submit">
      <fa-icon [icon]="'save'"></fa-icon>
      Guardar
    </button>
    <button (click)="onModalClose()" class="btn btn-outline-dark" type="button"> &times; Cancelar</button>
  </div>
</form>
