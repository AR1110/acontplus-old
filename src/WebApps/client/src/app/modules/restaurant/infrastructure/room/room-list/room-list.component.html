<div class="card w-100">
  <div class="card-body">
    <div class="row mt-2 mb-2">
      <div class="col-6">
        <button (click)="onModalOpen()" mat-raised-button type="button">
          <fa-icon [icon]="'plus'"></fa-icon>
          Registrar
        </button>
      </div>
    </div>

    @if (rooms.length > 0) {
      <div class="table-responsive">
        <table class="table">
          <caption>Salas</caption>
          <thead>
          <tr>
            <th></th>
            <th>N°</th>
            <th>Código</th>
            <th>Descripcion</th>
            <th>Capacidad</th>
            <th>Estado</th>
          </tr>
          </thead>
          <tbody>
            @for (item of rooms; track $index) {
              <tr>
                <td>
                  <a
                    href="javascript:void(0)"
                    class="btn btn-sm btn-success"
                    (click)="onEdit(item)"
                  >
                    <i class="fas fa-edit"></i>
                  </a>
                  <a
                    href="javascript:void(0)"
                    class="btn btn-sm btn-danger"
                    (click)="onDelete(item)"
                  >
                    <i class="fas fa-trash"></i>
                  </a>
                </td>
                <td>{{ $index + 1 }}</td>
                <td>{{ item.code }}</td>
                <td>{{ item.floor.description }} - {{ item.description }}</td>
                <td>{{ item.capacity }}</td>
                <td>
          <span
            class="badge"
            [ngClass]="item.enabled ? 'badge-success' : 'badge-danger'"
          >
            {{ item.enabled ? 'Activo' : 'Inactivo' }}
          </span>
                </td>
              </tr>
            }

          </tbody>
        </table>
      </div>

    } @else {
      <h5>No hay registros</h5>
    }

  </div>
</div>
