<div class="card w-100">
  <div class="card-body">
    <div class="row mt-2 mb-2">
      <div class="col-6">
        <button (click)="onModalOpen()" mat-raised-button title="Registrar nueva sala" type="button">
          <fa-icon [icon]="'plus'"></fa-icon>
          Registrar
        </button>
      </div>
      <div class="col-xxl-6 col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
        <div class="form-group">
          <select (change)="onEstabChange($event)" class="form-select" id="codEstab" name="codEstab">
            <option value="">Seleccione un establecimiento</option>
            @for (item of establecimientos; track $index) {
              <option [value]="item.codEstab" [selected]="codEstab">{{ item.nombreComercial }}</option>
            }
          </select>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-xxl-6 col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <app-tabulator-semantic-ui
          [columnNames]="columnNames"
          [options]="{ dataTree: true, dataTreeStartExpanded: true, reactiveData: true  }"
          [tableData]="rooms"
        ></app-tabulator-semantic-ui>
      </div>
    </div>
