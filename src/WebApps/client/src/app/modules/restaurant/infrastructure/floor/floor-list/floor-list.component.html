<div class="card">
  <div class="card-body">
    <div class="row mt-2 mb-2">
      <div class="col-6">
        <button (click)="onModalOpen()" mat-raised-button type="button">
          <fa-icon [icon]="'plus'"></fa-icon>
          Registrar
        </button>
      </div>
    </div>
    @if (floors.length > 0) {
      <div class="table-responsive">
        <table class="table">
          <caption>Pisos</caption>
          <thead>
          <tr>
            <th></th>
            <th>N°</th>
            <th>Código</th>
            <th>Descripcion</th>
            <th>Capacidad</th>
            <th>Estado</th>
          </tr>
          </thead>
          <tbody>
            @for (item of floors; track $index) {
              <tr>
                <td>
                  <a
                    (click)="onEdit(item)"
                    class="btn btn-sm btn-success"
                    href="javascript:void(0)"
                  >
                    <i class="fas fa-edit"></i>
                  </a>
                  <a
                    (click)="onDelete(item)"
                    class="btn btn-sm btn-danger"
                    href="javascript:void(0)"
                  >
                    <i class="fas fa-trash"></i>
                  </a>
                </td>
                <td>{{ $index + 1 }}</td>
                <td>{{ item.code }}</td>
                <td>{{ item.description }}</td>
                <td>{{ item.capacity }}</td>
                <td>
                <span
                  [ngClass]="item.enabled ? 'badge-success' : 'badge-danger'"
                  class="badge"
                >
                  {{ item.enabled ? 'Activo' : 'Inactivo' }}
                </span>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    } @else {
      <h5>No hay registros</h5>
    }
  </div>
</div>
