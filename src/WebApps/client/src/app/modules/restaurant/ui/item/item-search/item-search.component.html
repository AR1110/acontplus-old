<input
  (keyup)="onKeyupSearch()"
  (keyup.enter)="onEnterKeyPressed($event)"
  (selectItem)="onSelect($event)"
  [(ngModel)]="textSearch"
  [class.is-invalid]="searchFailed"
  [ngbTypeahead]="search"
  [resultTemplate]="rt"
  class="form-control"
  id="typeahead-item-search"
  onclick="select();"
  placeholder="Buscar item"
  type="text"
/>

<ng-template #rt let-r="result" let-t="term">
  <ngb-highlight
    [result]="r.descripcion"
    [term]="t"
  />
</ng-template>
