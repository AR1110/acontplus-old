<app-mat-dynamic-card>
  <mat-tab-group [selectedIndex]="selected()" (selectedIndexChange)="selectedIndexChange($event)">
    @for (item of establecimientos; track $index) {
      <mat-tab [label]="item.estab + '-' + item.nombreComercial">
        <ng-template matTabContent>
          <div class="row mt-2 mb-2">
            <div class="col-6">
              <button (click)="onModalOpen()" mat-raised-button type="button">
                <mat-icon>add</mat-icon>
                Registrar
              </button>
            </div>
          </div>
          @if (productionAreas.length > 0) {
            <div class="table-responsive">
              <table class="table table-bordered">
                <thead>
                  <tr>
                    <th>Op.</th>
                    <th class="text-center">N°</th>
                    <th class="text-center">Código</th>
                    <th>Descripcion</th>
                    <th>Estado</th>
                  </tr>
                </thead>
                <tbody>
                  @for (item of productionAreas; track $index) {
                    <tr>
                      <td class="text-center">
                        <acp-button
                          variant="warning"
                          icon="edit"
                          title="Editar"
                          matStyle="icon"
                          (handleClick)="onEdit(item)"
                        /><acp-button
                          variant="danger"
                          icon="delete"
                          title="Eliminar"
                          matStyle="icon"
                          (handleClick)="onDelete(item)"
                        />
                      </td>
                      <td class="text-center">{{ $index + 1 }}</td>
                      <td class="text-center">{{ item.code }}</td>
                      <td>{{ item.description }}</td>
                      <td>
                        <span
                          [ngClass]="item.enabled ? 'text-success' : 'text-danger'"
                          class="badge"
                        >
                          {{ item.enabled ? 'Activo' : 'Inactivo' }}
                        </span>
                      </td>
                    </tr>
                  }
                </tbody>
              </table>
            </div>
          } @else {
            <h5>No hay registros</h5>
          }
        </ng-template>
      </mat-tab>
    }
  </mat-tab-group>
</app-mat-dynamic-card>
