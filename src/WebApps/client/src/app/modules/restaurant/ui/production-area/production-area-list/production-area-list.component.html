<mat-card appearance="outlined">
  <mat-card-content>
    <div ngbAccordion>
      @for (item of establecimientos; track $index) {
        <div ngbAccordionItem #accordionItem="ngbAccordionItem">
          <h2 ngbAccordionHeader>
            <button ngbAccordionButton (click)="onPanelToggle(item)">
              {{ item.estab }} - {{ item.nombreComercial }}
            </button>
          </h2>
          <div ngbAccordionCollapse>
            <div ngbAccordionBody>
              <ng-template>
                <div class="row mt-2 mb-2">
                  <div class="col-6">
                    <button
                      (click)="onModalOpen()"
                      mat-raised-button
                      type="button"
                    >
                      <mat-icon>add</mat-icon>
                      Registrar
                    </button>
                  </div>
                </div>
                @if (productionAreas.length > 0) {
                  <div class="table-responsive">
                    <table class="table table-bordered">
                      <thead>
                        <tr>
                          <th>Op.</th>
                          <th class="text-center">N°</th>
                          <th class="text-center">Código</th>
                          <th>Descripcion</th>
                          <th>Estado</th>
                        </tr>
                      </thead>
                      <tbody>
                        @for (item of productionAreas; track $index) {
                          <tr>
                            <td class="text-center">
                              <app-theme-button
                                variant="warning"
                                icon="edit"
                                title="Editar"
                                matStyle="icon"
                                (handleClick)="onEdit(item)"
                              >
                              </app-theme-button
                              ><app-theme-button
                                variant="danger"
                                icon="delete"
                                title="Eliminar"
                                matStyle="icon"
                                (handleClick)="onDelete(item)"
                              >
                              </app-theme-button>
                            </td>
                            <td class="text-center">{{ $index + 1 }}</td>
                            <td class="text-center">{{ item.code }}</td>
                            <td>{{ item.description }}</td>
                            <td>
                              <span
                                [ngClass]="
                                  item.enabled ? 'text-success' : 'text-danger'
                                "
                                class="badge"
                              >
                                {{ item.enabled ? "Activo" : "Inactivo" }}
                              </span>
                            </td>
                          </tr>
                        }
                      </tbody>
                    </table>
                  </div>
                } @else {
                  <h5>No hay registros</h5>
                }
              </ng-template>
            </div>
          </div>
        </div>
      }
    </div>
  </mat-card-content>
</mat-card>
