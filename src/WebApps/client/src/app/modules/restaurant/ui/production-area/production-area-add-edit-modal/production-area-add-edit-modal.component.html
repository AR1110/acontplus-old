<app-mat-custom-dialog
    [containerTemplate]="body"
    [actionsTemplate]="footer"
    (close)="onModalClose()"
    [title]="modalTitle"
/>
<ng-template #body>
  <form (ngSubmit)="onSave()" id="productionAreaForm" [formGroup]="productionAreaForm">

      <div class="row">
        <div class="col">
          <div class="form-group">
            <label for="establecimientoId">Establecimiento: </label>
            <select class="form-select border-select" formControlName="establecimientoId" id="establecimientoId">
              <option>Seleccione un establecimiento</option>
              @for (item of establecimientos; track $index) {
                <option [value]="item.idEstablecimiento">
                  {{ item.nombreComercial }}
                </option>
              }

            </select>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col">
          <div class="form-group">
            <label for="description">Descripción:</label>
            <input (keyup)="setCode()" class="form-control border-select" formControlName="description" id="description"
                   placeholder="Cocina" required type="text">
          </div>
          <div class="form-group">
            <label for="code">Código:</label>
            <input class="form-control border-select" formControlName="code" id="code" required type="text">
          </div>
        </div>
      </div>
      @if (data.id > 0) {
        <div class="row mb-3">
          <div class="col">
            <mat-slide-toggle formControlName="enabled">
              Activo
            </mat-slide-toggle>
          </div>
        </div>
      }


  </form>
</ng-template>
<ng-template #footer>
  <app-theme-button
    variant="success"
    icon="save"
    text="Guardar"
    form="productionAreaForm"
    [disabled]="productionAreaForm.invalid"
  />
</ng-template>
