<ng-template #popContent>Hello, <b>Mundo</b>!</ng-template>

<div class="mat-elevation-z8">
    <section class="table-container small-table section-container-table mt-1">
        @if (isLoadingResults || isRateLimitReached) {
        <div [ngClass]="{'loading-shade':isLoadingResults }">
            @if (isLoadingResults) {
            <mat-spinner></mat-spinner>
            }

        </div>
        }
        <table mat-table [dataSource]="dataSource" tabindex="0" matSort (matSortChange)="sortData($event)">

            @for (column of columns; track $index) {

            <ng-container [matColumnDef]="column.columnDef">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> {{column.header}} </th>
                <td mat-cell *matCellDef="let element; let i = index"
                    [ngClass]="{'highlighted': highlightRowIndex === i}">

                    @if (column.columnDef==="s3ObjectUrl") {
                    <img class="rounded" [ngClass]="{'img-thumbnail': !element.s3ObjectUrl}" width="80"
                        src="{{element.s3ObjectUrl}}" />
                    }
                    @else {
                    {{element[column.columnDef]}}
                    }

                </td>
            </ng-container>
            }
            

            <tr mat-header-row *matHeaderRowDef="visibleColumns;sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: visibleColumns;" (click)="selectRow(row)"></tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell text-center" colspan="13">
                    Sin registro
                </td>
            </tr>

        </table>

    </section>
    <!-- [pageSizeOptions]="pagination.pageSizeOptions" -->

    @if (pagination) {
    <mat-paginator #paginator class="demo-paginator" (click)="onClickPaginator.emit()" (page)="onPageEvent($event)"
        [length]="pagination.totalRecords" [pageSize]="pagination.pageSize" [showFirstLastButtons]="true"
        [pageIndex]="pagination.pageIndex" aria-label="Select page">
    </mat-paginator>
    }
</div>
