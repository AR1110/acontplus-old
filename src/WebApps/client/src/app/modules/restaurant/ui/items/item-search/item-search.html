<mat-form-field class="w-100" >
  <mat-label>{{ label() }}</mat-label>
  <input
    type="text"
    matInput
    (input)="onSearch($event)"
    [matAutocomplete]="autoProductSearchSimple"
  />

  <mat-autocomplete #autoProductSearchSimple="matAutocomplete">
    @for (state of items(); track $index) {
      <mat-option [value]="state.descripcion" (onSelectionChange)="onSelect(state)">
        <div class="vstack gap-2">
          <span class="text-muted">{{ state.code }}</span>
          <span class="description">{{ state.description }}</span>
        </div>
      </mat-option>
    }
  </mat-autocomplete>

  <ng-container matSuffix>
    @if (loading()) {
      <mat-spinner diameter="30" />
    }
  </ng-container>
</mat-form-field>
