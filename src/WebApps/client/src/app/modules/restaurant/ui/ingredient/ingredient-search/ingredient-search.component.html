<mat-form-field class="w-100">
  <mat-label>Buscar Ingredientes</mat-label>
  <input type="text" matInput [formControl]="control" [matAutocomplete]="autoProductSearchSimple" />
  <mat-autocomplete #autoProductSearchSimple="matAutocomplete">
    @for (state of filteredProducts | async; track $index) {
      <mat-option [value]="state.descripcion" (onSelectionChange)="onSelect(state)">
        <div class="vstack gap-2">
          <span class="text-muted">{{ state.code }}</span>
          <span class="description">{{ state.productDescription }}</span>
        </div>
      </mat-option>
    }
  </mat-autocomplete>
  <ng-container matSuffix>
    @if (isLoading()) {
      <mat-spinner diameter="30" />
    }
  </ng-container>
</mat-form-field>
