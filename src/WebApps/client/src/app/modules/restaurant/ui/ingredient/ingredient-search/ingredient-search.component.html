<mat-form-field class="w-100">
  <mat-label>Buscar Ingredientes</mat-label>
  <input
    type="text"
    matInput
    [value]="textSearch"
    [formControl]="control"
    [matAutocomplete]="autoProductSearchSimple"
  />
  <mat-autocomplete #autoProductSearchSimple="matAutocomplete">
    @for (state of filteredProducts | async; track state) {
    <mat-option
      [value]="state.descripcion"
      (onSelectionChange)="onSelect(state)"
    >
      <div class="vstack gap-2">
        <span class="text-muted">{{ state.productDescription }}</span>
        <span class="description">{{ state.summary }}</span>
      </div>
    </mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
