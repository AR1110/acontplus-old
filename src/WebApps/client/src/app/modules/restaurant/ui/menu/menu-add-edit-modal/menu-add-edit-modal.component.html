<form (ngSubmit)="onSave()" [formGroup]="menuForm">
  <div class="modal-header">
    <h5 class="modal-title">
      <mat-icon>{{ modalIcon }}</mat-icon>
      {{ modalTitle }}
    </h5>
    <button
      (click)="onModalClose()"
      aria-hidden="true"
      class="btn-close"
      title="Cerrar"
      type="button"
    ></button>
  </div>
  <div class="modal-body">
    <div class="row">
      <div class="col-6 col-md-6 col-sm-12">
        <div class="form-group">
          <label for="title">Nombre</label>
          <input
            class="form-control input-group-lg"
            formControlName="title"
            id="title"
            type="text"
          />
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class="form-group">
          <label for="summary"
            >Descripción -
            <span>
              <button
                (click)="generateDescription()"
                class="btn btn-sm btn-outline-info mb-3"
                title="Generar la descripción para el combo"
                type="button"
              >
                <i class="fa-solid fa-sync"></i> Generar descripción
              </button>
            </span>
          </label>
          <textarea
            class="form-control"
            formControlName="summary"
            id="summary"
          ></textarea>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-6 col-md-6 col-sm-6">
        <div class="form-group">
          <mat-slide-toggle formControlName="forPromotion" id="forPromotion">
            Usar en promoción
          </mat-slide-toggle>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class="form-group">
          <label>Buscar productos</label>
          <app-item-search
            (onItemSelected)="onItemSelected($event)"
            [textSearch]="itemSearch"
          ></app-item-search>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <app-tabulator-semantic-ui
          [columnNames]="productColumns"
          [options]="{ reactiveData: true }"
          [tableData]="productsAdded"
        ></app-tabulator-semantic-ui>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button
      [disabled]="menuForm.invalid"
      mat-raised-button
      title="guardar"
      type="submit"
    >
      <mat-icon>save</mat-icon>
      Guardar
    </button>
    <button
      (click)="onModalClose()"
      class="btn btn-outline-dark"
      title="Cancelar"
      type="button"
    >
      &times; Cancelar
    </button>
  </div>
</form>
