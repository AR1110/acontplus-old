<app-breadcrumb />
<ng-template #toolbarTpl>
  <div class="d-flex gap-5 justify-content-center align-items-center">
    <section>
      <mat-button-toggle-group
        name="ingredients"
        aria-label="Ingredients"
        multiple
        [(ngModel)]="categoryAbbreviationsSelected"
        (change)="refresh()"
      >
        @for (item of categoryAbbreviations(); track $index) {
        <mat-button-toggle [value]="item.code">{{ item.name }}</mat-button-toggle>
        }
      </mat-button-toggle-group>
    </section>
    <button mat-icon-button (click)="refresh()">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>
</ng-template>

<app-data-grid
  showToolbar="true"
  [toolbarTemplate]="toolbarTpl"
  [data]="list()"
  [columns]="columns"
  [cellTemplate]="{
  op: opTpl,
    productData: productDataTpl,
  }"
  [length]="pagination().totalRecords"
  [loading]="isLoading()"
  [pageOnFront]="false"
  [pageIndex]="pagination().pageIndex"
  [pageSize]="pagination().pageSize"
  [pageSizeOptions]="pagination().pageSizeOptions"
  (page)="getNextPage($event)"
/>

<ng-template #productDataTpl let-row>
  <div class="product-info">
    <div class="main">{{ row.description }}</div>
    <small class="code">{{ row.code }}</small>
    <small class="auxiliary_code">{{ row.auxiliaryCode }}</small>
  </div>
</ng-template>
<ng-template #opTpl let-row>
  <app-theme-button
    variant="success"
    icon="build"
    matStyle="icon"
    title="Editar"
    (handleClick)="onEdit(row)"
  />
</ng-template>
