<div class="row mt-3">
  @for (item of menus; track $index) {
    <div class="col-4 col-md-4 col-sm-12">
      <mat-card appearance="outlined">
        <mat-card-header>
          <h5 class="card-title">{{ item.title }}</h5>
        </mat-card-header>
        <mat-card-content>
          <img
            [src]="item.s3ObjectUrl || '../assets/images/blank.png'"
            width="500"
            height="500"
            class="img-fluid img-responsive m-r-5"
            alt="Image Description"
          />
        </mat-card-content>
        <mat-card-footer>
          <button
            type="button"
            class="btn btn-outline-primary"
            (click)="onEdit(item)"
          >
            <fa-icon [icon]="'cogs'"></fa-icon>
            Administrar
          </button>
        </mat-card-footer>
      </mat-card>
    </div>
  }
</div>
