<div class="products-grid">
  @for (item of menus(); track $index) {
    <div class="product-card" [style]="{ 'animation-delay': $index * 0.1 + 's' }">
      <!-- Product Badge -->
      @if (item.forPromotion) {
        <div class="product-badge">En promoción</div>
      }

      <!-- Product Image Section -->
      <div class="product-image-section" [class]="'gradient-' + (($index % 6) + 1)">
        <img [src]="item.s3ObjectUrl || '../assets/images/blank.png'" alt="{{ item.title }}" class="circular-image" />
      </div>

      <!-- Product Content -->
      <div class="product-content">
        <h3 class="product-title">{{ item.title }}</h3>
        <p class="product-description">{{ item.description }}</p>
        <div class="product-price">{{ item.price }}</div>

        <!-- Product Actions -->
        <div class="product-actions">
          <button class="action-button primary-button" (click)="onEdit(item)">
            <mat-icon>settings</mat-icon>
            <span>Administrar</span>
          </button>
        </div>
      </div>
    </div>
  }
</div>
