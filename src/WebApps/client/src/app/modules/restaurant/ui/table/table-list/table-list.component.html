<div class="card w-100">
  <div class="card-body">

    <div class="row cols-xxl-6 cols-xl-6 cols-lg-6 cols-md-6 cols-sm-12 cols-12">
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Establecimiento</mat-label>
          <mat-select [(ngModel)]="establecimientoId" (selectionChange)="onEstabChange($event)">
            @for(item of  establecimientos; track $index){
              <mat-option [value]="item.idEstablecimiento">{{item.estab}}-{{item.nombreComercial}}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <div class="d-flex gap-2 align-items-center justify-content-end">
          <button mat-icon-button aria-label="Nuevo" (click)="onModalOpen()">
            <mat-icon>add</mat-icon>
          </button>
          <button mat-icon-button aria-label="Refresh" (click)="refresh()">
            <mat-icon>refresh</mat-icon>
          </button>
        </div>
      </div>
    </div>


    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>
          <span [style.paddingLeft.px]="40"> Descripción </span>
        </th>
        <td mat-cell *matCellDef="let data">
          <button mat-icon-button
                  [style.visibility]="!data.expandable ? 'hidden' : ''"
                  [style.marginLeft.px]="data.level * 32"
                  (click)="treeControl.toggle(data)">
            <mat-icon class="mat-icon-rtl-mirror">
              {{treeControl.isExpanded(data) ? 'expand_more' : 'chevron_right'}}
            </mat-icon>
          </button>

          {{data.description}}
        </td>
      </ng-container>

      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef> Nro. </th>
        <td mat-cell *matCellDef="let data"> {{data.index}} </td>
      </ng-container>

      <ng-container matColumnDef="capacity">
        <th mat-header-cell *matHeaderCellDef> Capacidad </th>
        <td mat-cell *matCellDef="let data"> {{data.capacity}} </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let data">
        @if(data.hasStatus){
          <mat-slide-toggle
            [(ngModel)]="data.enabled"
            [checked]="data.enabled"
            (toggleChange)="onDelete(data)"

          ></mat-slide-toggle>
        }
        </td>
      </ng-container>

      <ng-container matColumnDef="op">
        <th mat-header-cell *matHeaderCellDef> Op. </th>
        <td mat-cell *matCellDef="let data">
          @if (data.hasOp){
            <button mat-icon-button aria-label="Editar" (click)="onModalOpen(data)">
              <mat-icon>edit</mat-icon>
            </button>
          }

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

  </div>
</div>
