<app-mat-dynamic-table
  [tableData]="dataSource()"
  [columnDefinitions]="columnsDefs"
  [visibleColumns]="columns"
  [templateOp]="templateOp"
  [paginationConfig]="pagination()"
  [enablePagination]="true"
  (pageEvent)="handlePageEvent($event)"
/>
<ng-template #templateOp let-item="item">
  <acp-button (handleClick)="onEdit(item)" icon="edit" matStyle="icon" title="Editar" />
</ng-template>
