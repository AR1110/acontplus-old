<app-mat-custom-dialog
  [title]="modalTitle"
  [containerTemplate]="body"
  [actionsTemplate]="footer"
  (close)="onModalClose()"
/>
<ng-template #body>
  <form (ngSubmit)="onSave()" [formGroup]="floorForm" id="floorForm" autocomplete="off">
    <div class="d-grid gap-2">
      <div class="row rows-col-xl-3 row-cols-lg-3 row-cols-md-3 row-cols-sm-1 row-cols-1">
        <div class="col">
          <mat-form-field class="w-100">
            <mat-label>Descripción</mat-label>
            <input matInput (keyup)="setCode()" formControlName="description" />
          </mat-form-field>
        </div>
        <div class="col">
          <mat-form-field class="w-100">
            <mat-label>Código</mat-label>
            <input matInput formControlName="code" />
          </mat-form-field>
        </div>
        <div class="col">
          <mat-form-field class="w-100">
            <mat-label>Capacidad: <small>(Salas)</small></mat-label>
            <input
              matInput
              formControlName="capacity"
              id="capacity"
              min="1"
              required
              type="number"
            />
          </mat-form-field>
        </div>
      </div>

      @if (data.id > 0) {
        <mat-slide-toggle formControlName="enabled"> Activo </mat-slide-toggle>
      }
    </div>

    <div class="my-2">
      <acp-button icon="plus" variant="info" text="Añadir sala" (handleClick)="addRoom()" />
    </div>
    <acp-tabulator-table
      [columns]="roomColumns"
      [options]="{ reactiveData: true }"
      [data]="rooms"
    />
  </form>
</ng-template>
<ng-template #footer>
  <acp-button
    type="submit"
    icon="save"
    variant="success"
    text="Añadir piso"
    form="floorForm"
    [disabled]="floorForm.invalid"
  />
</ng-template>
