<app-mat-custom-dialog
  [containerTemplate]="body"
  [actionsTemplate]="footer"
  (close)="onModalClose()"
  [title]="modalTitle"
/>
<ng-template #body>
  <form (ngSubmit)="onSave()" id="ingredientForm" [formGroup]="ingredientForm">

      <div class="row">
        <div class="col">
          <mat-form-field class="w-100">
            <mat-label>Resumen - Descripción</mat-label>
            <input matInput   formControlName="summary" appToUpperCase>
          </mat-form-field>

        </div>
        <div class="col">

          <mat-form-field class="w-100">
            <mat-label>Tipo</mat-label>
            <mat-select  formControlName="ingredientTypeId">
              <mat-option [value]="">Seleccione un tipo</mat-option>
              @for (item of ingredientTypes(); track $index) {
                <mat-option [value]="item.id">{{ item.name }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Cantidad</mat-label>
          <input type="number" matInput min="0"   formControlName="quantity" >
        </mat-form-field>

        </div>
        <div class="col">
          <mat-form-field class="w-100">
            <mat-label>Unidad</mat-label>
            <input type="number" matInput min="0"   formControlName="unit" >
          </mat-form-field>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col">
          <mat-form-field class="w-100">
            <mat-label>Contenido</mat-label>
            <textarea matInput   formControlName="content" placeholder="..." appToUpperCase></textarea>
          </mat-form-field>
        </div>
      </div>

  </form>

</ng-template>
<ng-template #footer>
  <app-theme-button
    type="submit"
    variant="success"
    icon="save"
    text="Guardar"
    form="ingredientForm"
    [disabled]="ingredientForm.invalid"
  />
</ng-template>
