<app-breadcrumb />

<app-mat-dynamic-card>
  <mat-tab-group (selectedTabChange)="onTabChange($event)" dynamicHeight>
    <mat-tab label="Productos">
      <ng-template matTabContent>
        <div class="mx-3">
          <app-item-list />
        </div>
      </ng-template>
    </mat-tab>
    <mat-tab label="Menus">
      <ng-template matTabContent>
        <app-menu-list />
      </ng-template>
    </mat-tab>
    <mat-tab label="Promociones">
      <ng-template matTabContent>
        <app-promotion-list />
      </ng-template>
    </mat-tab>
    <mat-tab label="Ingredientes">
      <ng-template matTabContent>
        <app-ingredient-list />
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</app-mat-dynamic-card>
