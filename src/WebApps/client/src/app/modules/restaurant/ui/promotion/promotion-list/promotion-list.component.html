<mat-card appearance="outlined">
  <mat-card-content>
    <div class="row justify-content-between">
      <div class="col-xxl-3 col-xl-3 col-lg-3 col-md-4 col-sm-6 col-12">
        <div class="form-group">
          <label for="estab">Establecimiento: </label>
          <select
            name="estab"
            id="estab"
            class="form-select"
            (change)="onChangeEstab()"
          >
            @for (item of estabs(); track $index) {
              <option [value]="item.idEstablecimiento">
                {{ item.nombreComercial }}
              </option>
            }
          </select>
        </div>
      </div>

      <div
        class="col-xxl-3 col-xl-3 col-lg-3 col-md-4 col-sm-6 col-12 d-flex align-items-center justify-content-end"
      >
        <button type="button" mat-raised-button (click)="openModalAddEdit()">
          <mat-icon>add</mat-icon>
          Agregar
        </button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover">
        <thead class="thead-light">
          <tr>
            <th scope="col"></th>
            <th scope="col">Op.</th>
            <th scope="col">Imagen</th>
            <th scope="col">Descripción</th>
            <th scope="col">Fecha Inicio</th>
            <th scope="col">Fecha Fin</th>
          </tr>
        </thead>
        <tbody>
          @for (item of promotions(); track $index) {
            <tr>
              <td>
                {{ $index + 1 }}
              </td>
              <td class="text-center">
                <app-theme-button
                  icon="edit"
                  matStyle="icon"
                  title="Editar"
                  (handleClick)="openModalAddEdit(item)"
                >
                </app-theme-button>
              </td>
              <td>
                <img [src]="item.img" width="70" class="rounded" alt="" />
              </td>
              <th scope="row">{{ item.description }}</th>
              <td>{{ item.startDate }}</td>
              <td>{{ item.endDate }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="6" class="text-center"></td>
            </tr>
          }
        </tbody>
        <tfoot>
          <tr>
            <td colspan="4">
              <ngb-pagination
                (pageChange)="refresh()"
                [(page)]="pagination().pageIndex"
                [boundaryLinks]="true"
                [collectionSize]="pagination().totalRecords"
                [maxSize]="pagination().maxSize"
                [pageSize]="pagination().pageSize"
                [rotate]="true"
              />
            </td>
            <td colspan="2"></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </mat-card-content>
</mat-card>
