<div class="my-2">
  <div
    class="row row-cols-xxl-4 row-cols-xl-4 row-cols-lg-4 row-cols-md-3 row-cols-sm-2 row-cols-1 g-4"
  >
    <div class="col">
      <mat-form-field class="w-100">
        <mat-label>Establecimiento</mat-label>
        <mat-select [(ngModel)]="estabId" (selectionChange)="onChangeEstab($event)">
          @for (item of estabs(); track $index) {
            <mat-option [value]="item.idEstablecimiento">
              {{ item.nombreComercial }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
    <div class="col"></div>
    <div class="col"></div>
    <div class="col">
      <app-theme-button
        icon="add"
        variant="success"
        text="Añadir promoción"
        (handleClick)="openModalAddEdit()"
      />
    </div>
  </div>
</div>

<app-mat-dynamic-table
  [tableData]="dataSource()"
  [columnDefinitions]="columnsDefs"
  [visibleColumns]="columns"
  [templateOp]="templateOp"
  [paginationConfig]="pagination()"
  [enablePagination]="false"
  (pageEvent)="handlePageEvent($event)"
/>
<ng-template #templateOp let-item="item">
  <app-theme-button
    icon="edit"
    matStyle="icon"
    title="Editar"
    (handleClick)="openModalAddEdit(item)"
  />
</ng-template>
