<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="col-xxl-3 col-xl-3 col-lg-3 col-md-4 col-sm-4 col-12">
        <div class="form-group">
          <div class="input-group mb-3">
            <input
              aria-describedby="basic-addon1"
              aria-label=""
              class="form-control search-input w-25"
              placeholder="Buscar..."
              [(ngModel)]="dataSearch.textSearch"
              type="text"
            />
            <div class="input-group-append">
              <button
                class="btn btn-outline-primary"
                type="button"
                (click)="refresh()"
              >
                <fa-icon [icon]="'sync'"></fa-icon>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div
        class="col-xxl-3 col-xl-3 col-lg-3 col-md-3 col-sm-8 col-12 align-items-end align-content-end"
      ></div>
    </div>

    <app-custom-table-container
      [pagination]="pagination()"
      [isLoadingResults]="isLoadingResults()"
      (onPageEvent)="handlePageEvent($event)"
    >
      <app-mat-dynamic-table
        [templateOp]="templateOp"
        [dataList]="dataSource.data"
        [displayColumnDefs]="columnsDefs"
        [displayedColumns]="columns"
      ></app-mat-dynamic-table>
    </app-custom-table-container>

    <ng-template #templateOp let-item="item">
      <button
        (click)="onEdit(item)"
        class="btn btn-outline-warning btn-rounded btn-sm"
        type="button"
        title="Editar"
      >
        <fa-icon [icon]="'edit'"></fa-icon>
      </button>
    </ng-template>
  </div>
</div>
