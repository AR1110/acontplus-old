<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="col-xxl-2 col-xl-2 col-lg-2 col-md-2 col-sm-4 col-12">
        <div class="form-group">
          <select (change)="loadData()" [(ngModel)]="pagination.pageSize" class="form-select">
            @for (page of pagination.pageSizeOptions; track $index) {
              <option value="{{page}}">{{ page }}</option>
            }
          </select>
        </div>
      </div>
      <div class="col-xxl-3 col-xl-3 col-lg-3 col-md-3 col-sm-8 col-12 align-items-end align-content-end">
        <div class="input-group mb-3">
          <input
            aria-describedby="basic-addon1"
            aria-label=""
            class="form-control search-input"
            placeholder="Buscar..."
            type="text"
          />
          <div class="input-group-append">
            <button
              class="btn btn-outline-primary"
              type="button">
              <fa-icon [icon]="'sync'"></fa-icon>
            </button
            >
          </div>
        </div>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table">
        <thead>
        <tr>
          <th scope="col">Op.</th>
          <th scope="col">N°</th>
          <th scope="col">Categoría</th>
          <th scope="col">Item</th>
          <th scope="col">Resumen</th>
        </tr>
        </thead>
        <tbody>
          @if (items.length > 0) {
            @for (item of items; track $index) {
              <tr>
                <td>
                  <button class="btn btn-outline-warning btn-rounded btn-sm" type="button">
                    <fa-icon [icon]="'edit'"></fa-icon>
                  </button>
                </td>
                <td>{{ $index + 1 }}</td>
                <td>{{ item.categoria }}</td>
                <td>
                  <img
                    [ngSrc]="item.s3ObjectUrl || '../assets/images/blank.png'"
                    width="75"
                    height="75"
                    priority
                    class="img-fluid img-responsive"
                    alt="Image Description"
                  />
                  {{ item.descripcion }}
                </td>
                <td>{{ item.summary }}</td>
              </tr>
            }
          } @else {
            <tr>
              <td><h5>No existen registros</h5></td>
            </tr>
          }
        </tbody>
      </table>
      <ngb-pagination
        (pageChange)="loadData()"
        [(page)]="pagination.pageIndex"
        [boundaryLinks]="true"
        [collectionSize]="pagination.totalRecords"
        [maxSize]="pagination.maxSize"
        [pageSize]="pagination.pageSize"
        [rotate]="true"
      />
    </div>
  </div>
</div>
