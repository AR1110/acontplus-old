<form [formGroup]="menuForm">
  <div class="modal-header"></div>
  <div class="modal-body">
    <div class="row">
      <div class="col-6 col-md-6 col-sm-12">
        <div class="form-group">
          <label for="title">Nombre</label>
          <input
            class="form-control input-group-lg"
            formControlName="title"
            id="title"
            type="text"
          />
        </div>
      </div>
      <div class="col-6 col-md-6 col-sm-6">
        <div class="form-group">
          <label for="forPromotion">Usar en promoción</label>
          <mat-slide-toggle formControlName="forPromotion" id="forPromotion">
            Activo
          </mat-slide-toggle>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class="form-group">
          <label for="summary"
          >Descripción -
            <span>
                <button
                  (click)="generateDescription()"
                  class="btn btn-sm btn-outline-info"
                  title="Generar la descripción para el combo"
                  type="button"
                >
                  <i class="fa-solid fa-sync"></i> Generar descripción
                </button>
              </span>
          </label>
          <textarea
            class="form-control"
            formControlName="summary"
            id="summary"
          ></textarea>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class="form-group">
          <label>Buscar productos</label>
          <app-item-search (onItemSelected)="onItemSelected($event)"
                           [textSearch]="itemSearch"></app-item-search>
        </div>
      </div>
    </div>

    <button
      (click)="onModalClose()"
