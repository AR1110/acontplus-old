<div class="card">
    <div class="card-body">
        <div class="row justify-content-between">
            <div class="col-xxl-3 col-xl-3 col-lg-3 col-md-4 col-sm-6 col-12">
                <div class="form-group">
                    <label for="estab">Establecimiento: </label>
                    <select name="estab" id="estab" class="form-select">
                        @for(item of estabs();track $index){
                        <option [value]="item.idEstablecimiento">{{item.nombreComercial}}</option>
                        }
                    </select>
                </div>
            </div>

            <div
                class="col-xxl-3 col-xl-3 col-lg-3 col-md-4 col-sm-6 col-12 d-flex align-items-center justify-content-end">
                <button type="button" class="btn btn-success" (click)="openModalAddEdit()">Agregar</button>
            </div>
        </div>



        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="thead-light">
                    <tr>
                        <th scope="col"></th>
                        <th scope="col">Imagen</th>
                        <th scope="col">Promoción</th>
                        <th scope="col">Fecha Inicio</th>
                        <th scope="col">Fecha Fin</th>
                        <th scope="col">Opción</th>
                    </tr>
                </thead>
                <tbody>
                    @for(item of promotions();track $index){
                    <tr>
                        <td>
                        
                        </td>
                        <td>

                        </td>
                        <th scope="row">{{item.description}}</th>
                        <td>{{item.startDate}}</td>
                        <td>{{item.endDate}}</td>
                        <td>

                        </td>
                    </tr>
                    }@empty {
                    <tr>
                        <td colspan="6" class="text-center">

                        </td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>










    </div>
</div>
