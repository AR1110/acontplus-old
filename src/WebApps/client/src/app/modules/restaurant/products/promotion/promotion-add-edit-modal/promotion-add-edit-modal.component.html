<div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">{{titleModal()}}</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-xxl-8 col-xl-8 col-lg-8 col-md-6 col-12">
            <div class="row  row-cols-1 row-cols-xxl-1 row-cols-xl-1 row-cols-lg-1 row-cols-md-1 row-cols-sm-1">
                <div class="form-group">
                    <label for="estab">Establecimiento: <span class="text-danger">*</span> </label>
                    <select name="estab" id="estab" class="form-select">
                        @for(item of estabs();track $index){
                        <option [value]="item.idEstablecimiento">{{item.nombreComercial}}</option>
                        }
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Descripción: <span class="text-danger">*</span></label>
                    <input type="text" class="form-control">
                </div>
            </div>

            <div class="row  row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-1 row-cols-sm-1  row-cols-1">

                <div class="form-group">
                    <label for="startDate">Fecha Inicio</label>
                    <input type="date" class="form-control">
                </div>
                <div class="form-group">
                    <label for="endDate">Fecha Final</label>
                    <input type="date" class="form-control">
                </div>

            </div>
        </div>
        <div class="col-xxl-4 col-xl-4 col-lg-4 col-md-6 col-12">
            foto
        </div>

    </div>


    <ul class="nav nav-tabs">
        <li class="nav-item" style="cursor: pointer;">
            <a class="nav-link" [class.active]="selectedTab() === 0" (click)="selectedTab.set(0)">Dias</a>
        </li>
        <li class="nav-item" style="cursor: pointer;">
            <a class="nav-link" [class.active]="selectedTab() === 1" (click)="selectedTab.set(1)">Productos</a>
        </li>
    </ul>

    @if(selectedTab()===0){

    <div class="d-flex  ">
        <div class="table-responsive w-auto">
            <table class="table ">
                <thead>
                    <tr>
                        <th>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="allDays">
                                <label class="form-check-label" for="allDays">Todos</label>
                            </div>
                        </th>
                        <th>Hora Inicio - Hora Fin</th>
                    </tr>
                </thead>
                <tbody>
                    @for(day of daysOfWeek();track $index){
                    <tr>
                        <td >
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" [id]="day.id">
                                <label class="form-check-label" [for]="day.id">{{ day.name }}</label>
                            </div>
                        </td>
                        <td >
                            <div class="hstack gap-3">
                                <div class="col-4">
                                    <label [for]="day.id + 'Start'" class="form-label"></label>
                                    <input type="time" class="form-control" [id]="day.id + 'Start'">
                                </div>
                                <span>-</span>
                                <div class="col-4">
                                    <label [for]="day.id + 'End'" class="form-label"></label>
                                    <input type="time" class="form-control" [id]="day.id + 'End'">
                                </div>
                            </div>
                        </td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>

    }


    @if(selectedTab()===1){
    <span>Productos</span>

    }




</div>
<div class="modal-footer">
    <button type="button" class="btn btn-dark" (click)="close()">&times; Cerrar</button>
</div>
