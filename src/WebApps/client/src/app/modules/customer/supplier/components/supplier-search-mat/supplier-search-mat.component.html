<mat-autocomplete #auto="matAutocomplete">
  @if(isLoadingResults){
  <mat-option
    disabled
    style="display: flex; justify-content: center; align-items: center"
  >
    <mat-spinner diameter="35"></mat-spinner>
  </mat-option>
  } @for (state of filters | async; track $index) {
  <mat-option
    [value]="state.name"
    (onSelectionChange)="onSelectionChange(state)"
  >
    <span>{{ state.identificacionComprador }}</span> |
    <small>{{ state.name }}</small>
  </mat-option>
  }
</mat-autocomplete>
@if (isAdvancedMode()){
<mat-form-field class="w-100">
  <mat-label>Proveedor</mat-label>
  <input
    type="text"
    matInput
    [formControl]="control"
    [matAutocomplete]="auto"
    (keydown.enter)="onEnter($event)"
    onclick="select();"
  />

  <ng-container matSuffix>
    <button mat-icon-button appActionCompanyCustomerAddEditModal>
      <mat-icon>add</mat-icon>
    </button>

    @if(id()>0){
    <button mat-icon-button appActionCompanyCustomerAddEditModal [id]="id()">
      <mat-icon>edit</mat-icon>
    </button>
    }
  </ng-container>
</mat-form-field>
} @if(isSimpleMode()){
<mat-form-field class="w-100">
  <mat-label>Proveedor</mat-label>
  <input
    type="text"
    matInput
    [formControl]="control"
    [matAutocomplete]="auto"
  />
</mat-form-field>
}
