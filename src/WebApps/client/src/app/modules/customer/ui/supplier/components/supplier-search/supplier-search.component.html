@if (isSearchSimple()) {
  <mat-form-field class="w-100">
    <mat-label>Proveedor:</mat-label>
    <input
      matInput
      id="typeahead-supplier"
      type="text"
      [(ngModel)]="textSearch"
      [ngbTypeahead]="search"
      [resultTemplate]="rtSuppliers"
      [class.is-invalid]="searchFailed"
      (selectItem)="onSelect($event.item)"
      onclick="select();"
      (keyup)="onKeyupSearch()"
      [inputFormatter]="formatter"
      [resultFormatter]="formatter"
      placeholder="Buscar proveedor"
    />
  </mat-form-field>

  @if (searching) {
    <small class="form-text text-muted">Buscando...</small>
  }
  @if (searchFailed) {
    <div class="invalid-feedback">
      Lo sentimos, no se han podido cargar las sugerencias.
    </div>
  }
}

<ng-template #rtSuppliers let-r="result" let-t="term">
  <ngb-highlight
    [result]="r.identificacionComprador + ' - ' + r.name"
    [term]="t"
  />
</ng-template>
