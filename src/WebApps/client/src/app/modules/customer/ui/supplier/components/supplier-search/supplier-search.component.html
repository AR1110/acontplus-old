@if (isSearchSimple()) {
  <mat-form-field class="w-100">
    <mat-label>Proveedor:</mat-label>
    <input
      matInput
      [formControl]="textSearchControl"
      [matAutocomplete]="auto"
      placeholder="Buscar proveedor"
      (keyup)="onKeyupSearch()"
    />
    <mat-autocomplete
      #auto="matAutocomplete"
      (optionSelected)="onSelect($event.option.value)"
      [displayWith]="formatter"
    >
      @for (supplier of filteredSuppliers | async; track $index) {
        <mat-option [value]="supplier">
          {{ supplier.identificacionComprador }} -
          {{ supplier.razonSocialComprador }}
        </mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>
}

@if (searching) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
}
@if (searchFailed) {
  <mat-error> Lo sentimos, no se han podido cargar las sugerencias. </mat-error>
}
