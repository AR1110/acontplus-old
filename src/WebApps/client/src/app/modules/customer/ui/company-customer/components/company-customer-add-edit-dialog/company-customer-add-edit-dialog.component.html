<app-mat-custom-dialog
  [containerTemplate]="containerTemplate"
  [actionsTemplate]="actionsTemplate"
  [title]="title"
  [loading]="loading"
  (close)="close()"
/>

<ng-template #containerTemplate>
  <form (ngSubmit)="onSave()" [formGroup]="customerForm" autocomplete="off">
    <mat-tab-group>
      <mat-tab label="Datos Principales">
        <div class="d-grid gap-2 mx-3 mt-2">
          <div
            class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-2 row-cols-1 g-1"
          >
            <div class="col">
              <mat-form-field class="w-100">
                <mat-label>Tipo Identificación: </mat-label>
                <mat-select formControlName="idTipoIdentificacion">
                  @for (item of tiposIdentificacion; track $index) {
                  <mat-option [value]="item.idTipoIdentificacion">{{
                    item.descripcion
                  }}</mat-option>
                  }
                </mat-select>
              </mat-form-field>
            </div>
            <div class="col">
              <mat-form-field class="w-100">
                <mat-label>Número de Identificación</mat-label>
                <input matInput />
              </mat-form-field>
            </div>
          </div>

          <div
            class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-2 row-cols-1 g-1"
          >
            <div class="col">
              <mat-form-field class="w-100">
                <mat-label>Nombre Fiscal:</mat-label>
                <input matInput />
              </mat-form-field>
            </div>
            <div class="col">
              <mat-form-field class="w-100">
                <mat-label>Nombre Comercial:</mat-label>
                <input
                  matInput
                  autocomplete="off"
                  formControlName="nombreComercial"
                  placeholder="Ej: TECNOMEGA"
                  touppercase
                  type="text"
                />
              </mat-form-field>
            </div>
          </div>

          <div>
            <mat-form-field class="w-100">
              <mat-label>Dirección:</mat-label>
              <input
                matInput
                formControlName="direccion"
                placeholder="AV. 09 DE OCTUBRE..."
                touppercase
              />
            </mat-form-field>
          </div>

          <div
            class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-2 row-cols-1 g-1"
          >
            <div class="col">
              <app-m3-input-chip [chips]="emails" [labelText]="'Correo'" />
            </div>
            <div class="col">
              <app-m3-input-chip
                [chips]="telephones"
                [labelText]="'Teléfono'"
              />
            </div>
          </div>
        </div>
      </mat-tab>
      <mat-tab label="Datos Adicionales"> Content 2 </mat-tab>
    </mat-tab-group>
  </form>
</ng-template>

<ng-template #actionsTemplate>
  <button type="button" mat-flat-button>Guardar</button>
</ng-template>
