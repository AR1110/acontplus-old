@if (isSearchSimple) {
  <input
    id="typeahead-company-customers-simple"
    type="text"
    class="form-control"
    [(ngModel)]="textSearch"
    [ngbTypeahead]="search"
    [resultTemplate]="rt"
    [class.is-invalid]="searchFailed"
    (selectItem)="onSelect($event)"
    onclick="select();"
    (keyup)="onKeyupSearch()"
    placeholder="..."
    (keyup.enter)="onEnterKeyPressed($event)"
  />
} @else {
  <div class="input-group">
    <input
      id="typeahead-company-customers-advanced"
      type="text"
      class="form-control"
      [(ngModel)]="textSearch"
      [ngbTypeahead]="search"
      [resultTemplate]="rt"
      [class.is-invalid]="searchFailed"
      (selectItem)="onSelect($event)"
      onclick="select();"
      (keyup)="onKeyupSearch()"
      placeholder="Buscar cliente"
    />

    <button
      type="button"
      mat-icon-button
      (onResult)="onResult($event)"
      appCompanyCustomerAddEdit
    >
      <mat-icon>add</mat-icon>
    </button>

    @if (id > 0) {
      <button
        type="button"
        mat-icon-button
        (onResult)="onResult($event)"
        appCompanyCustomerAddEdit
        [id]="id"
      >
        <mat-icon>edit</mat-icon>
      </button>
    }
    <button type="button" mat-icon-button>
      <mat-icon>search</mat-icon>
    </button>
  </div>
}
@if (searching) {
  <small class="form-text text-muted">Buscando...</small>
}
@if (searchFailed) {
  <div class="invalid-feedback">
    Lo sentimos, no se han podido cargar las sugerencias.
  </div>
}

<ng-template #rt let-r="result" let-t="term">
  <ngb-highlight
    [result]="r.numeroIdentificacion + ' - ' + r.nombreFiscal"
    [term]="t"
  />
</ng-template>
