<form [formGroup]="customerForm" (ngSubmit)="save()">
  <div class="modal-header">
    <h5 class="modal-title">
      <fa-icon [icon]="modalIcon"></fa-icon> {{ modalTitle }}
    </h5>
    <button type="button" class="btn-close" (click)="closeModal()"></button>
  </div>
  <div class="modal-body">
    <ul ngbNav #nav="ngbNav" [(activeId)]="activeTab" class="nav-tabs">
      <li [ngbNavItem]="1">
        <button ngbNavLink>Datos Principales</button>
        <ng-template ngbNavContent>
          <div class="row">
            <div class="col-xl-3 col-lg-3 col-md-3 col-sm-4 col-12">
              <div class="form-group">
                <label for=""
                  >Tipo Identificación: <span class="text-danger">*</span>
                </label>
                <select
                  class="form-select"
                  formControlName="idTipoIdentificacion"
                  (change)="onChangeTipoIdentificacion()"
                  formControlName="idTipoIdentificacion"
                >
                  @for (item of tiposIdentificacion; track $index) {
                  <option [ngValue]="item.idTipoIdentificacion">
                    {{ item.descripcion }}
                  </option>
                  }
                </select>
              </div>
            </div>
            <div class="col-xl-3 col-lg-3 col-md-3 col-sm-4 col-12">
              <div class="form-group">
                <label for="numeroIdentificacion"
                  >Número de Identificación</label
                >
                <input
                  type="text"
                  class="form-control border-select"
                  id="numeroIdentificacion"
                  formControlName="numeroIdentificacion"
                  (keydown.enter)="validarNumeroIdentificacion()"
                  maxlength="15"
                  placeholder="Ej: 2105234568"
                />

                <div
                  *ngIf="
                    numeroIdentificacion.invalid &&
                    (numeroIdentificacion.dirty || numeroIdentificacion.touched)
                  "
                  class="alert alert-danger"
                >
                  Numero invalido
                </div>

                <!-- <small class="invalid-feedback text-right">{{ message }} </small>
              <small class="valid-feedback text-right">{{ message }} </small> -->
              </div>
            </div>
            <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
              <div class="form-group">
                <label>Nombre Fiscal: <span class="text-danger">*</span></label>
                <input
                  type="text"
                  class="form-control border-select"
                  id="nombreComercial"
                  (keyup)="copyTradeName()"
                  touppercase
                  autocomplete="off"
                  formControlName="nombreFiscal"
                  placeholder="Ej: TECNOMEGA"
                />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-lg-12 col-md-12 col-sm-12 col-12">
              <div class="form-group">
                <label>Dirección</label>
                <input
                  type="text"
                  class="form-control border-select"
                  formControlName="direccion"
                  touppercase
                  placeholder="AV. 09 DE OCTUBRE..."
                />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-xl-6 col-md-6 col-sm-6 col-12">
              <div class="form-group">
                <label
                  >Email:
                  <span
                    tooltip-placement="top"
                    ngbTooltip="Haz doble 'Click' sobre el correo para editar"
                  >
                    <fa-icon [icon]="'info-circle'"></fa-icon>
                  </span>
                </label>
                <mat-chip-grid #chipGridEmail aria-label="Enter emails">
                  <mat-chip-row
                    *ngFor="let email of emails"
                    (removed)="removeEmail(email)"
                    [editable]="true"
                    (edited)="editEmail(email, $event)"
                    [aria-description]="'press enter to edit ' + email"
                  >
                    {{ email }}
                    <button matChipRemove [attr.aria-label]="'remove ' + email">
                      <mat-icon>cancel</mat-icon>
                    </button>
                  </mat-chip-row>
                  <input
                    placeholder="example@example.com,info@example.com"
                    class="form-control"
                    [matChipInputFor]="chipGridEmail"
                    [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                    [matChipInputAddOnBlur]="addOnBlur"
                    (matChipInputTokenEnd)="addEmail($event)"
                  />
                </mat-chip-grid>
              </div>
            </div>
            <div class="col-xl-6 col-md-6 col-sm-6 col-12">
              <div class="form-group">
                <label
                  >Telefono:
                  <span
                    tooltip-placement="top"
                    ngbTooltip="Haz doble 'Click' sobre el número de telefono para editar"
                  >
                    <fa-icon [icon]="'info-circle'"></fa-icon>
                  </span>
                </label>
                <mat-chip-grid
                  #chipGridTelephone
                  aria-label="Ingrese los teléfonos"
                >
                  <mat-chip-row
                    *ngFor="let telephone of telephones"
                    (removed)="removeTelephone(telephone)"
                    [editable]="true"
                    (edited)="editTelephone(telephone, $event)"
                    [aria-description]="'press enter to edit ' + telephone"
                  >
                    {{ telephone }}
                    <button
                      matChipRemove
                      [attr.aria-label]="'remove ' + telephone"
                    >
                      <mat-icon>cancel</mat-icon>
                    </button>
                  </mat-chip-row>
                  <input
                    placeholder="0900000001,0900000002"
                    class="form-control"
                    [matChipInputFor]="chipGridTelephone"
                    [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                    [matChipInputAddOnBlur]="addOnBlur"
                    (matChipInputTokenEnd)="addTelephone($event)"
                  />
                </mat-chip-grid>
              </div>
            </div>
          </div>

          <div class="row" ng-if="showEstado">
            <div class="col-lg-4 col-md-6 col-sm-12 col-12">
              <div class="form-group">
                <label for="">Estado</label>
                <!-- <md-radio-group formControlName="estado" tabindex="-1">
                  <md-radio-button ng-value="true">Activo</md-radio-button>
                  <md-radio-button ng-value="false">Inactivo</md-radio-button>
                </md-radio-group> -->
              </div>
            </div>
          </div>
        </ng-template>
      </li>
      <li [ngbNavItem]="2">
        <button ngbNavLink>Datos Adicionales</button>
        <ng-template ngbNavContent>
          <h5>hi</h5>
        </ng-template>
      </li>
    </ul>
    <div [ngbNavOutlet]="nav" class="mt-2"></div>
  </div>
  <div class="modal-footer">
    <button
      type="submit"
      class="btn btn-outline-success btn-sm"
      [disabled]="!customerForm.valid"
    >
      <fa-icon [icon]="'save'"></fa-icon> Guardar
    </button>
    <button
      type="button"
      class="btn btn-outline-dark btn-sm"
      (click)="closeModal()"
    >
      &times; Cancelar
    </button>
  </div>
</form>
