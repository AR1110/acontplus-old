<form [formGroup]="customerForm">
  <div class="modal-header">
    <h5 class="modal-title">
      <fa-icon [icon]="modalIcon"></fa-icon> {{ modalTitle }}
    </h5>
    <button type="button" class="btn-close" (click)="closeModal()"></button>
  </div>
  <div class="modal-body">
    <div class="row">
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for=""
            >Tipo Identificación: <span class="text-danger">*</span>
          </label>
          <div class="input-group">
            <div class="input-group-prepend">
              <select
                class="form-select"
                formControlName="idTipoIdentificacion"
                (change)="onChangeTipoIdentificacion()"
                name="tipoDocumento"
                formControlName="idTipoIdentificacion"
                ng-disabled="isDisableSelectIdentificacion"
              >
                @for (item of tiposIdentificacion; track $index) {
                <option [ngValue]="item.idTipoIdentificacion">
                  {{ item.descripcion }}
                </option>
                }
              </select>
            </div>
            <input
              type="text"
              class="form-control border-select"
              name="numeroIdentificacion"
              id="numeroIdentificacion"
              ng-if="codigoIdentificacion !== 'P'"
              ng-class="typeNotify"
              formControlName="numeroIdentificacion"
              ng-keyup="validarNumeroIdentificacion()"
              ng-disabled="isDisableInputIdentificacion"
              valid-number
              placeholder="Ej: 2105234568"
            />

            <input
              type="text"
              class="form-control border-select"
              ng-if="codigoIdentificacion == 'P'"
              name="pasaporte"
              formControlName="numeroIdentificacion"
              ng-disabled="isDisableInputIdentificacion"
              placeholder="Ej: EH123457"
            />
            <!-- <small class="invalid-feedback text-right">{{ message }} </small>
            <small class="valid-feedback text-right">{{ message }} </small> -->
          </div>
        </div>
      </div>
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label>Nombre Fiscal: <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control border-select"
            name="nombreFiscal"
            id="nombreComercial"
            (keyup)="copyTradeName()"
            touppercase
            autocomplete="off"
            formControlName="nombreFiscal"
            placeholder="Ej: TECNOMEGA"
          />
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 col-12">
        <div class="form-group">
          <label>Dirección</label>
          <input
            type="text"
            class="form-control border-select"
            formControlName="direccion"
            touppercase
            placeholder="AV. 09 DE OCTUBRE..."
          />
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-xl-6 col-md-6 col-sm-6 col-12">
        <div class="form-group">
          <label
            >Email:
            <span
              tooltip-placement="top"
              uib-tooltip="Haz doble 'Click' sobre el correo para editar"
            >
              <i class="fas fa-info-circle"></i>
            </span>
          </label>
          <!-- <md-chips
            formControlName="correos"
            md-add-on-blur="true"
            ng-keyup="onKeyupEmail($event)"
            md-transform-chip="transformChipEmail($chip)"
            md-removable="true"
            md-enable-chip-edit="true"
            placeholder="Ej: maxi@gmail.com"
            input-aria-label="Correos"
            tabindex="-1"
          ></md-chips> -->
          <small></small>
        </div>
      </div>
      <div class="col-xl-6 col-md-6 col-sm-6 col-12">
        <div class="form-group">
          <label
            >Telefono:
            <span
              tooltip-placement="top"
              uib-tooltip="Haz doble 'Click' sobre el número de telefono para editar"
            >
              <i class="fas fa-info-circle"></i>
            </span>
          </label>
          <!-- <md-chips
            formControlName="telefonos"
            md-add-on-blur="true"
            md-transform-chip="transformChipTelefono($chip)"
            md-removable="true"
            md-enable-chip-edit="true"
            placeholder="Ej: 0959889744"
            input-aria-label="Número de teléfonos"
            tabindex="-1"
          ></md-chips> -->
        </div>
      </div>
    </div>

    <div class="row" ng-if="showEstado">
      <div class="col-lg-4 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="">Estado</label>
          <!-- <md-radio-group formControlName="estado" tabindex="-1">
            <md-radio-button ng-value="true">Activo</md-radio-button>
            <md-radio-button ng-value="false">Inactivo</md-radio-button>
          </md-radio-group> -->
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="submit" class="btn btn-outline-success btn-sm">
      <fa-icon [icon]="'save'"></fa-icon> Guardar
    </button>
    <button
      type="button"
      class="btn btn-outline-dark btn-sm"
      (click)="closeModal()"
    >
      &times; Cancelar
    </button>
  </div>
</form>
