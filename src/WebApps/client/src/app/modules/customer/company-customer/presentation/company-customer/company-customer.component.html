<app-breadcrumb />

<acp-dynamic-card>
  <div
    class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-1 row-cols-1 g-4 mb-3"
  >
    <div class="col">
      <mat-form-field>
        <mat-label>Buscar</mat-label>
        <input matInput [(ngModel)]="dataSearch.textSearch" />
        <ng-container matSuffix>
          <button type="button" mat-icon-button (click)="refresh()">
            <mat-icon>refresh</mat-icon>
          </button>
        </ng-container>
      </mat-form-field>
    </div>
    <div class="col">
      <div class="d-flex flex-row gap-2 justify-content-end">
        <!-- Export Button with Dropdown -->
        <button mat-raised-button color="primary" [matMenuTriggerFor]="exportMenu">
          Exportar Reporte
        </button>

        <mat-menu #exportMenu="matMenu">
          <button mat-menu-item (click)="exportExcel()">
            <mat-icon>table_view</mat-icon>
            <span>Exportar a Excel</span>
          </button>
          <button mat-menu-item (click)="exportPdf()">
            <mat-icon>picture_as_pdf</mat-icon>
            <span>Exportar a PDF</span>
          </button>
        </mat-menu>

        <button mat-icon-button appCompanyCustomerAddEdit (companyCustomerSaved)="refresh()">
          <mat-icon>add</mat-icon>
        </button>

        <button mat-icon-button (click)="refresh()">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <app-mat-dynamic-table
    [tableData]="dataSource()"
    [columnDefinitions]="columnsDefs"
    [visibleColumns]="columns"
    [templateOp]="templateOp"
    [paginationConfig]="pagination()"
    [enablePagination]="true"
    (pageEvent)="handlePageEvent($event)"
  />
  <ng-template #templateOp let-item="item">
    <acp-button
      (companyCustomerSaved)="refresh()"
      appCompanyCustomerAddEdit
      [id]="item.idCliente"
      variant="success"
      icon="edit"
      matStyle="icon"
    />
    @if (!item.esConsumidorFinal) {
      <acp-button
        (handleClick)="askToDelete(item)"
        variant="danger"
        icon="delete"
        matStyle="icon"
      />
    }
  </ng-template>
</acp-dynamic-card>
