<app-breadcrumb />

<acp-dynamic-card>
  <div class="row">
    <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
      <mat-form-field class="w-100">
        <mat-label>Establecimiento: </mat-label>
        <mat-select
          name="establecimiento"
          id="establecimiento"
          [(ngModel)]="dataSearch.codEstab"
          (selectionChange)="onChangeEstab()"
        >
          @for (item of establecimientos(); track $index) {
            <mat-option [value]="item.codEstab">
              {{ item.nombreComercial }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
    <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
      <mat-form-field>
        <mat-label>Puntos Emisión: </mat-label>
        <mat-select
          name="puntoEmision"
          id="puntoEmision"
          [(ngModel)]="dataSearch.idPuntoEmision"
          (selectionChange)="getDocs()"
        >
          @for (item of puntosEmision(); track $index) {
            <mat-option [value]="item.idPuntoEmision">{{ item.ptoEmi }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <app-mat-dynamic-table
    [tableData]="docs()"
    [columnDefinitions]="columnsDefs"
    [visibleColumns]="columns"
    [templateOp]="templateOp"
  />

  <ng-template #templateOp let-item="item">
    <acp-button
      variant="success"
      icon="save"
      matStyle="icon"
      [disabled]="!item.ultimaSecuencia"
      (handleClick)="saveConfig(item)"
    />
    @if (item.hasInfoAdicional) {
      <acp-button
        icon="sell"
        matStyle="icon"
        [disabled]="!item.ultimaSecuencia"
        (handleClick)="openModalInfoAdicional(item)"
      />
    }
  </ng-template>

  <ng-template #templateSecuencia let-item>
    <mat-form-field>
      <input
        matInput
        type="number"
        [(ngModel)]="item.ultimaSecuencia"
        onclick="this.select()"
        min="1"
        [disabled]="!item.estado"
      />
    </mat-form-field>
  </ng-template>
  <ng-template #templateSelect let-item>
    <mat-checkbox
      type="checkbox"
      [name]="item.nomDoc + item.index"
      [id]="item.nomDoc + item.index"
      [(ngModel)]="item.estado"
    />
  </ng-template>
</acp-dynamic-card>
