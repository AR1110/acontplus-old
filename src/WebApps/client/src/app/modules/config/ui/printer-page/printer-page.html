<app-breadcrumb />

<acp-data-grid
  [showToolbar]="true"
  [toolbarTemplate]="headerToolbar"
  [columns]="columns"
  [data]="printers()"
  [cellTemplate]="{
    actions: opTpl,
    status: statusTpl,
  }"
/>

<ng-template #opTpl let-data>
  <acp-button
    type="button"
    icon="edit"
    variant="warning"
    matStyle="icon"
    (handleClick)="edit(data)"
  />

  <acp-button
    type="button"
    icon="delete"
    variant="danger"
    matStyle="icon"
    (handleClick)="askToDelete(data)"
  />
</ng-template>

<ng-template #statusTpl let-data>
  <mat-slide-toggle [(ngModel)]="data.isActive" (change)="updateStatus(data)">
    {{ data.labelEnabled }}
  </mat-slide-toggle>
</ng-template>

<ng-template #headerToolbar>
  <div class="d-flex flex-row gap-2">
    <acp-button
      type="button"
      icon="add"
      variant="success"
      matStyle="filled"
      text="Agregar Impresora"
      (handleClick)="add()"
    />

    <acp-button
      type="button"
      icon="refresh"
      variant="secondary"
      matStyle="icon"
      (handleClick)="refresh()"
    />
  </div>
</ng-template>
