<app-breadcrumb />

<acp-dynamic-card>
  <!-- #header region -->
  <div class="row">
    <div class="col-6">
      <div class="d-flex flex-row gap-1">
        <button type="button" mat-raised-button id="buttonNew" (click)="(null)">
          <mat-icon>add</mat-icon>
          Agregar Turno
        </button>
        <button type="button" mat-icon-button (click)="(null)">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </div>
  </div>
  <hr />

  <!-- #body region -->
  <div class="table-responsive">
    <table class="table table-no-bordered">
      <thead>
        <tr>
          <th class="text-center">Op.</th>
          <th class="text-center">N°</th>
          <th class="text-center">Descripción.</th>
          <th class="text-center">Estado</th>
        </tr>
      </thead>
      <tbody>
        @for (item of shifts(); track $index) {
          <tr>
            <td class="text-center">
              <div class="d-flex flex-row gap-2 justify-content-center">
                <acp-button
                  variant="warning"
                  matStyle="icon"
                  icon="schedule"
                  (handleClick)="(null)"
                />
                <acp-button variant="warning" matStyle="icon" icon="edit" (handleClick)="(null)" />
                <acp-button
                  variant="danger"
                  matStyle="icon"
                  icon="delete"
                  (handleClick)="askToDelete(item)"
                />
              </div>
            </td>
            <td class="text-center">{{ $index + 1 }}</td>
            <td class="text-center">{{ item.descripcion }}</td>
            <td>
              <span class="badge {{ item.estado ? 'bg-success' : 'bg-danger' }}">
                {{ item.estado ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
          </tr>
        } @empty {
          <tr class="text-center">
            <td colspan="10">Sin registro</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</acp-dynamic-card>
