<mat-dialog-content>
  <div class="d-grid gap-2">
    <mat-form-field>
      <mat-label>Descripción</mat-label>
      <input matInput [(ngModel)]="dataForm.descripcion" />
    </mat-form-field>

    <mat-radio-group
      aria-label="Select an option"
      [(ngModel)]="dataForm.tipo"
      (change)="handleChangeType()"
    >
      <mat-radio-button [value]="true">Contado</mat-radio-button>
      <mat-radio-button [value]="false">Crédito</mat-radio-button>
    </mat-radio-group>

    @if (!dataForm.tipo) {
      <mat-form-field>
        <mat-label>Días crédito</mat-label>
        <input matInput [(ngModel)]="dataForm.diasCredito" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Número cuotas</mat-label>
        <input matInput [(ngModel)]="dataForm.numeroCuota" />
      </mat-form-field>

      <mat-slide-toggle [(ngModel)]="dataForm.entrada">Con entrada</mat-slide-toggle>
    }

    <mat-radio-group aria-label="Select an option" [(ngModel)]="dataForm.gestion">
      <mat-radio-button [value]="false">Compra</mat-radio-button>
      <mat-radio-button [value]="true">Venta</mat-radio-button>
    </mat-radio-group>

    <mat-radio-group aria-label="Select an option" [(ngModel)]="dataForm.estado">
      <mat-radio-button [value]="true">Activo</mat-radio-button>
      <mat-radio-button [value]="false">Inactivo</mat-radio-button>
    </mat-radio-group>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <acp-button
    variant="success"
    [icon]="btnIcon"
    [text]="btnText"
    matStyle="filled"
    (handleClick)="save()"
  />
  <acp-button
    type="button"
    variant="dark"
    text="Cerrar"
    matStyle="filled"
    (handleClick)="dialogRef.close()"
  />
</mat-dialog-actions>
