<app-breadcrumb />
<acp-dynamic-card>
  <div
    class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-1 row-cols-1 g-4"
  >
    <div class="col"></div>
    <div class="col">
      <div class="d-flex flex-row gap-2 justify-content-end">
        <button mat-flat-button (click)="openModalAddUpdate()">
          <mat-icon>add</mat-icon>
          Nuevo
        </button>
        <button mat-icon-button (click)="refresh()">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <app-mat-dynamic-table
    [tableData]="dataSource()"
    [columnDefinitions]="columnsDefs"
    [visibleColumns]="columns"
    [templateOp]="templateOp"
    [paginationConfig]="pagination()"
    [enablePagination]="true"
    (pageEvent)="handlePageEvent($event)"
  />

  <ng-template #templateOp let-item="item">
    <acp-button
      variant="info"
      [icon]="'edit'"
      [matStyle]="'icon'"
      (handleClick)="openModalAddUpdate(item)"
    />
    @if (item.estado) {
      <acp-button
        variant="danger"
        [icon]="'delete'"
        [matStyle]="'icon'"
        (handleClick)="askToDelete(item)"
      />
    }
  </ng-template>
</acp-dynamic-card>
