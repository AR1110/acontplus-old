<app-mat-custom-dialog
  [containerTemplate]="body"
  [actionsTemplate]="footer"
  title="Información Adicional"
  (close)="close()"
/>

<ng-template #body>
  <div class="my-2">
    <app-theme-button variant="info" icon="add" matStyle="raised" (handleClick)="addRow()" text="Agregar Fila" />
  </div>
  <app-mat-dynamic-table
    [tableData]="dataSource()"
    [columnDefinitions]="columnsDefs"
    [visibleColumns]="columns"
    [templateOp]="templateOp"
  />
</ng-template>
<ng-template #templateOp let-item="item">
  <app-theme-button variant="danger" icon="delete_outline" matStyle="icon" (handleClick)="askToDelete(item)" />
</ng-template>

<ng-template #templateName let-item>
  <mat-form-field class="w-100">
    <input matInput placeholder="..." [(ngModel)]="item.nombre" />
  </mat-form-field>
</ng-template>

<ng-template #templateValue let-item>
  <mat-form-field class="w-100 m-1">
    <textarea matInput [(ngModel)]="item.valor"></textarea>
  </mat-form-field>
</ng-template>

<ng-template #templatePoliticaCredito let-item>
  <mat-slide-toggle [(ngModel)]="item.politicaCredito" />
</ng-template>

<ng-template #footer>
  <app-theme-button variant="success" icon="save" matStyle="raised" text="Guardar" (handleClick)="save()" />
</ng-template>
