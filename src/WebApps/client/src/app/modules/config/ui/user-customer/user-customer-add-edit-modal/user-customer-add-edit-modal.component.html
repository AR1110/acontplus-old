<app-mat-custom-dialog

[containerTemplate]="body"
[actionsTemplate]="footer"
(close)="close()"
[title]="titleModal"
/>
<ng-template #body>
  <form (ngSubmit)="onSubmit()" id="formUserCustomer" [formGroup]="dataForm" autocomplete="off">
  <div class="d-grid gap-2">
    <mat-form-field class="w-100">
      <mat-label>Número Identificación:</mat-label>
      <input matInput formControlName="nroIdentificacion" >
    </mat-form-field>

    <mat-form-field class="w-100">
      <mat-label>Nombre:</mat-label>
      <input matInput formControlName="firstName">
    </mat-form-field>

    <mat-form-field class="w-100">
      <mat-label>Apellido:</mat-label>
      <input matInput formControlName="lastName">
    </mat-form-field>

    <mat-form-field class="w-100">
      <mat-label>Correo:</mat-label>
      <input matInput formControlName="email">
    </mat-form-field>


    @if (isAdd()) {
      <mat-form-field class="w-100">
        <mat-label>Usuario:</mat-label>
        <input matInput formControlName="username">
      </mat-form-field>

      <div
        class="row row-cols-1 row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-2"
      >
        <div class="col">
          <mat-form-field class="w-100">
            <mat-label>Contraseña:</mat-label>
            <input matInput formControlName="contrasena">
          </mat-form-field>
        </div>
        <div class="col">
          <mat-form-field class="w-100">
            <mat-label>Confirmar Contraseña::</mat-label>
            <input matInput formControlName="confirmContrasena">
            @if (dataForm.hasError('matchValidator')) {
              <mat-hint>Las contraseñas no coinciden</mat-hint>
            }
          </mat-form-field>
        </div>
      </div>

      <mat-form-field>
        <mat-label>Rol</mat-label>
        <mat-select formControlName="roleId">
          @for (item of roles(); track $index) {
          <mat-option [value]="item.id">
            {{item.name}}
          </mat-option>


          }
        </mat-select>
      </mat-form-field>

          }


    @if(isUpdate()){
      <mat-radio-group aria-label="Select an status" formControlName="estado">
        <mat-radio-button [value]="true">Activo</mat-radio-button>
        <mat-radio-button [value]="false">Inactivo</mat-radio-button>
      </mat-radio-group>

    }

  </div>

  </form>
</ng-template>
<ng-template #footer>
  <app-theme-button
    [type]="'submit'"
  [variant]="'success'"
  [icon]="isAdd()?'save': 'edit'"
    [form]="'formUserCustomer'"
    [text]="isAdd()?'Guardar': 'Actualizar'"
  />
</ng-template>
