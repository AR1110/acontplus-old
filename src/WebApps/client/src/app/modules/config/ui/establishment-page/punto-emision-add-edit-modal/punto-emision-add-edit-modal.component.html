<app-mat-custom-dialog [containerTemplate]="body" [actionsTemplate]="footer" [title]="titleModal" (close)="close()" />

<ng-template #body>
  <div class="d-grid gap-2">
    <mat-form-field>
      <mat-label>Establecimiento</mat-label>
      <input matInput [value]="params.establishmentName" readonly />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Punto Emisión: <span class="text-danger">*</span></mat-label>
      <input matInput appInputNumber [(ngModel)]="data.ptoEmi" placeholder="001" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Tipo Ambiente: <span class="text-danger">*</span></mat-label>
      <mat-select [(ngModel)]="data.ambiente">
        @for (item of tiposAmbiente; track $index) {
          <mat-option [value]="item.code">{{ item.description }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    @if (params.idPuntoEmision > 0) {
      <mat-radio-group aria-label="Select an option" [(ngModel)]="data.estado">
        <mat-radio-button [value]="true">Activo</mat-radio-button>
        <mat-radio-button [value]="false">Inactivo</mat-radio-button>
      </mat-radio-group>
    }
  </div>
</ng-template>
<ng-template #footer>
  <app-theme-button variant="success" icon="save" [text]="btnText" (handleClick)="save()" />
</ng-template>
