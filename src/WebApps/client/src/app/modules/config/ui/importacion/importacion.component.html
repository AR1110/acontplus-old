<app-breadcrumb/>

<app-mat-dynamic-card>
  <div class="d-grid gap-2">

    <div
      class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-1 row-cols-sm-1 row-cols-1 g-4"
    >
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Módulo</mat-label>
          <mat-select (selectionChange)="handleChangeModule()" [(ngModel)]="data().codeModule">
            @for (item of modules(); track $index) {
              <mat-option [value]="item.codigo">{{item.descripcion}}</mat-option>
            }
          </mat-select>
        </mat-form-field>
        @if (data().codeModule) {
          <a [href]="urlFile" class="d-flex align-items-center start mt-2"  target="_blank">
            <mat-icon>download</mat-icon> Descargar el Formato
          </a>

        }

      </div>
      @if(!data().codeModule){
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Seleccionar archivo</mat-label>
          <input #fileInput type="file" hidden (change)="onFileSelected($event)" accept=".xls,.xlsx" >
          <input matInput class="cursor-pointer"  readonly (click)="fileInput.click()">

          <ng-container matSuffix>
            <button mat-icon-button (click)="fileInput.click()">
              <mat-icon>attach_file</mat-icon>
            </button>
          </ng-container>
        </mat-form-field>
      </div>

      }

    </div>
    <mat-divider/>

<!--    <app-theme-button-->
<!--    [type]="'button'"-->
<!--    [variant]="'success'"-->
<!--    [text]="'Nuevo'"-->
<!--    [icon]="'add'"-->
<!--    />-->

    <mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <!-- Definir columnas dinámicamente si los encabezados son variables -->
      @for (col of displayedColumns; track $index){
        <ng-container   [matColumnDef]="col">
          <mat-header-cell *matHeaderCellDef>
            <div style="white-space: normal; word-wrap: break-word; text-align: center;">
              {{ col }}
            </div>
          </mat-header-cell>
          <mat-cell *matCellDef="let element" [style.max-width]="300" style="white-space: normal; word-wrap: break-word;"> {{ element[col] }} </mat-cell>
        </ng-container>

      }

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>

    </mat-table>

  </div>


</app-mat-dynamic-card>
