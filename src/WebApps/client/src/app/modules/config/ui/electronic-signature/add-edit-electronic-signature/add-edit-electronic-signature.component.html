<app-mat-custom-dialog
  [containerTemplate]="body"
  [actionsTemplate]="footer"
  [title]="title"
  (close)="close()"
/>

<ng-template #body>
  <div class="d-grid gap-3 my-2">
    <mat-form-field class="example-full-width">
      <mat-label>Contraseña</mat-label>
      <input matInput [(ngModel)]="data.contrasenia" />
    </mat-form-field>

    @if (!(params.idFirmaElectronica > 0)) {
      <mat-form-field class="w-100">
        <mat-label>
          Seleccionar archivo:
          <span class="text-info">.p12</span>
        </mat-label>
        <input #fileInput type="file" hidden (change)="onFileSelected($event)" accept=".p12" />
        <input matInput class="cursor-pointer" readonly (click)="fileInput.click()" />

        <ng-container matSuffix>
          <button mat-icon-button (click)="fileInput.click()">
            <mat-icon>attach_file</mat-icon>
          </button>
        </ng-container>
      </mat-form-field>
    }
  </div>
</ng-template>
<ng-template #footer>
  <acp-button
    type="button"
    variant="success"
    [icon]="btnIcon"
    (handleClick)="save()"
    [text]="btnText"
  />
</ng-template>
