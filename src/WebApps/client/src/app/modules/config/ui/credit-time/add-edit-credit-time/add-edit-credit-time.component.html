<app-mat-custom-dialog
  [containerTemplate]="body"
  [actionsTemplate]="footer"
  [title]="title"
  (close)="close()"
/>

<ng-template #body>
  <div class="d-grid gap-2">
    <mat-form-field>
      <mat-label>Descripción</mat-label>
      <input matInput [(ngModel)]="data.descripcion" />
    </mat-form-field>

    <mat-radio-group
      aria-label="Select an option"
      [(ngModel)]="data.tipo"
      (change)="handleChangeType()"
    >
      <mat-radio-button [value]="true">Contado</mat-radio-button>
      <mat-radio-button [value]="false">Crédito</mat-radio-button>
    </mat-radio-group>

    @if (!data.tipo) {
      <mat-form-field>
        <mat-label>Días crédito</mat-label>
        <input matInput [(ngModel)]="data.diasCredito" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Número cuotas</mat-label>
        <input matInput [(ngModel)]="data.numeroCuota" />
      </mat-form-field>

      <mat-slide-toggle [(ngModel)]="data.entrada">Con entrada</mat-slide-toggle>
    }

    <mat-radio-group aria-label="Select an option" [(ngModel)]="data.gestion">
      <mat-radio-button [value]="false">Compra</mat-radio-button>
      <mat-radio-button [value]="true">Venta</mat-radio-button>
    </mat-radio-group>

    <mat-radio-group aria-label="Select an option" [(ngModel)]="data.estado">
      <mat-radio-button [value]="true">Activo</mat-radio-button>
      <mat-radio-button [value]="false">Inactivo</mat-radio-button>
    </mat-radio-group>
  </div>
</ng-template>
<ng-template #footer>
  <acp-button variant="success" [icon]="btnIcon" [text]="btnText" (handleClick)="save()" />
</ng-template>
