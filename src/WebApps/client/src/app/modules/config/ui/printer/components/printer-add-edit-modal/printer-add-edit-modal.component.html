<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">
    <mat-icon>{{ modalIcon }}</mat-icon> {{ modalTitle }}
  </h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="_modalRef.dismiss()"
  ></button>
</div>
<div class="modal-body">
  <div class="row">
    <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
      <div class="form-group">
        <label for="establishment">Establecimiento: </label>
        <select
          class="form-select"
          name="establishment"
          id="establishment"
          [(ngModel)]="data.establecimientoId"
          required
        >
          <option [ngValue]="0">Seleccione un establecimiento</option>

          @for (item of estabs; track $index) {
            <option [ngValue]="item.idEstablecimiento">
              {{ item.nombreComercial }}
            </option>
          }
        </select>
      </div>
    </div>
    <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
      <div class="form-group">
        <label for="nameEquipment">Nombre Equipo: </label>
        <input
          type="text"
          id="nameEquipment"
          class="form-control border-select"
          [(ngModel)]="data.machine"
          placeholder="PC-01"
          required
        />
      </div>
    </div>
    <div class="col-xl-3 colg-3 col-md-3 col-sm-3 col-12">
      <div class="form-group">
        <label for="ipAddress">IP Equipo: </label>
        <input
          type="text"
          class="form-control border-select"
          id="ipAddress"
          [(ngModel)]="data.ipAddress"
          placeholder="192.168.1.6:5001"
          required
        />
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-xl-3 colg-3 col-md-3 col-sm-3 col-12">
      <div class="form-group">
        <label for="domain">Dominio: </label>
        <input
          type="text"
          class="form-control border-select"
          id="domain"
          [(ngModel)]="data.domain"
          placeholder="dominio.com"
          required
        />
      </div>
    </div>
    <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
      <div class="form-group">
        <label for="typePrinter">Tipo Impresora </label>
        <select
          class="form-select"
          id="typePrinter"
          [(ngModel)]="data.printerTypeId"
          required
        >
          <option [ngValue]="0">Seleccione un tipo</option>
          @for (item of printerTypes; track $index) {
            <option [ngValue]="item.id">
              {{ item.name }}
            </option>
          }
        </select>
      </div>
    </div>
    <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
      <div class="form-group">
        <label for="namePrinterEdit">Impresora:</label>
        @if (localPrinters.length === 0) {
          <input
            type="text"
            id="namePrinterEdit"
            class="form-control"
            [(ngModel)]="data.name"
            placeholder="epson l3150"
            required
          />
        }
        @if (localPrinters.length > 0) {
          <select class="form-select" [(ngModel)]="data.name" required>
            <option [ngValue]="0">Seleccione una impresora</option>

            @for (item of localPrinters; track $index) {
              <option [ngValue]="item.name">
                {{ item.name }}
              </option>
            }
          </select>
        }
      </div>
    </div>
    @if (data.serverDevice) {
      <div class="col-xl-3 colg-3 col-md-3 col-sm-3 col-12">
        <div class="form-group">
          <label for="macAddress">MAC Address: </label>
          <input
            type="text"
            name="macAddress"
            id="macAddress"
            class="form-control border-select"
            [(ngModel)]="data.macAddress"
            placeholder="00:00:00:00"
          />
        </div>
      </div>
    }
  </div>
  <div class="row">
    <div class="col-xl-3 colg-3 col-md-3 col-sm-3 col-12">
      <div class="form-group">
        <mat-slide-toggle [(ngModel)]="data.isDefault"
          >Predeterminada</mat-slide-toggle
        >
      </div>
    </div>
    <div class="col-xl-3 colg-3 col-md-3 col-sm-3 col-12">
      <div class="form-group">
        <mat-slide-toggle id="serverDevice" [(ngModel)]="data.serverDevice"
          >Servidor</mat-slide-toggle
        >
      </div>
    </div>
  </div>
  <br />
  <div class="table-responsive">
    <table class="table">
      <thead>
        <tr class="small">
          <th class="text-center">N°</th>
          <th>Documento</th>
          <th class="text-center">Estado</th>
          <th class="text-center">Copia</th>
        </tr>
      </thead>
      <tbody>
        @for (item of documents; track $index) {
          <tr class="small">
            <td class="text-center">{{ $index + 1 }}</td>
            <td>{{ item.name }}</td>
            <td class="text-center">
              <mat-slide-toggle
                [(ngModel)]="item.isActive"
                (change)="updateDocument(item)"
              ></mat-slide-toggle>
            </td>
            <td class="text-center">
              @if (item.isActive) {
                <input
                  type="number"
                  id="copies{{ $index + 1 }}"
                  class="form-control"
                  min="1"
                  max="3"
                  [(ngModel)]="item.copies"
                  (blur)="updateDocument(item)"
                />
              }
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
<div class="modal-footer">
  <button type="button" mat-raised-button (click)="saveEdit()">
    <mat-icon>save</mat-icon> Guardar
  </button>

  <app-theme-button
    variant="dark"
    icon="close"
    text="Cancelar"
    (handleClick)="_modalRef.close()"
  >
  </app-theme-button>
</div>
