@if (isActive && currentStep) {
  <div class="tour-overlay">
    <div class="tour-popup" [class]="'position-' + currentStep.position">
      <!-- Tour Header -->
      <div class="tour-header">
        <div class="tour-progress">
          <span class="tour-step-counter">{{ currentStepIndex + 1 }} de {{ totalSteps }}</span>
          <div class="tour-progress-bar">
            <div class="tour-progress-fill" [style.width.%]="progressPercentage"></div>
          </div>
        </div>
        <button class="tour-close-btn" (click)="endTour()" type="button" aria-label="Cerrar tour">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <!-- Tour Content -->
      <div class="tour-content">
        <h4 class="tour-title">{{ currentStep.title }}</h4>
        <p class="tour-description" [innerHTML]="currentStep.content"></p>
      </div>

      <!-- Tour Actions -->
      <div class="tour-actions">
        <div class="tour-actions-left">
          @if (currentStep.showSkip && canGoNext) {
            <button class="btn btn-link btn-sm tour-skip-btn" (click)="skipTour()" type="button">
              <i class="fas fa-forward me-1"></i>
              Saltar Tour
            </button>
          }
        </div>

        <div class="tour-actions-right">
          @if (canGoPrevious) {
            <button class="btn btn-outline-primary btn-sm me-2" (click)="previousStep()" type="button">
              <i class="fas fa-chevron-left me-1"></i>
              Anterior
            </button>
          }

          @if (canGoNext) {
            <button class="btn btn-primary btn-sm" (click)="nextStep()" type="button">
              Siguiente
              <i class="fas fa-chevron-right ms-1"></i>
            </button>
          }

          @if (!canGoNext) {
            <button class="btn btn-success btn-sm" (click)="endTour()" type="button">
              <i class="fas fa-check me-1"></i>
              Finalizar
            </button>
          }
        </div>
      </div>

      <!-- Tour Arrow -->
      <div class="tour-arrow" [class]="'arrow-' + currentStep.position"></div>
    </div>
  </div>
}
