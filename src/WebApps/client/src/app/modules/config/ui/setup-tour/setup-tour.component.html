@if (isActive && currentStep) {
  <div class="tour-overlay">
    <mat-card class="tour-popup tour-popup-right" appearance="raised">
      <!-- Tour Header -->
      <mat-card-header class="tour-header">
        <div class="tour-progress-section">
          <div class="tour-step-info">
            <mat-chip-set>
              <mat-chip class="step-counter">
                <mat-icon matChipAvatar>info</mat-icon>
                {{ currentStepIndex + 1 }} de {{ totalSteps }}
              </mat-chip>
            </mat-chip-set>
          </div>
          <mat-progress-bar
            mode="determinate"
            [value]="progressPercentage"
            class="tour-progress-bar"
          ></mat-progress-bar>
        </div>
        <button
          mat-icon-button
          class="tour-close-btn"
          (click)="endTour()"
          type="button"
          aria-label="Cerrar tour"
          matTooltip="Cerrar tour"
        >
          <mat-icon>close</mat-icon>
        </button>
      </mat-card-header>

      <!-- Tour Content -->
      <mat-card-content class="tour-content">
        <h2 class="tour-title">{{ currentStep.title }}</h2>
        <div class="tour-description" [innerHTML]="currentStep.content"></div>
      </mat-card-content>

      <!-- Tour Actions -->
      <mat-card-actions class="tour-actions" align="end">
        <div class="tour-actions-left">
          @if (currentStep.showSkip && canGoNext) {
            <button mat-button color="warn" (click)="skipTour()" type="button">
              <ng-container>
                <mat-icon>skip_next</mat-icon>
                Saltar Tour
              </ng-container>
            </button>
          }
        </div>

        <div class="tour-actions-right">
          @if (canGoPrevious) {
            <button mat-stroked-button (click)="previousStep()" type="button">
              <ng-container>
                <mat-icon>chevron_left</mat-icon>
                Anterior
              </ng-container>
            </button>
          }

          @if (canGoNext) {
            <button mat-raised-button color="primary" (click)="nextStep()" type="button">
              <ng-container>
                Siguiente
                <mat-icon iconPositionEnd>chevron_right</mat-icon>
              </ng-container>
            </button>
          }

          @if (!canGoNext) {
            <button mat-raised-button color="accent" (click)="endTour()" type="button">
              <ng-container>
                <mat-icon>check</mat-icon>
                Finalizar
              </ng-container>
            </button>
          }
        </div>
      </mat-card-actions>

      <!-- Tour Arrow -->
      <div class="tour-arrow tour-arrow-left">
        <mat-icon class="arrow-icon">play_arrow</mat-icon>
      </div>
    </mat-card>
  </div>
}
