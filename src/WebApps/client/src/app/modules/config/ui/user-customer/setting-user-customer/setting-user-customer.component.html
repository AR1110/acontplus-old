<app-mat-custom-dialog
  [title]="'Configuración Usuario'"
(close)="close()"
[containerTemplate]="body"
[actionsTemplate]="footer"
/>

<ng-template #body>
  <mat-list>
    <mat-list-item><span class="text-muted">Usuario:</span> {{params.nombreCompleto}} </mat-list-item>
    <mat-divider></mat-divider>
    <mat-list-item><span class="text-muted">Ruc Empresa:</span> {{userCustomerRoleData.rucEmpresa}}</mat-list-item>
    <mat-divider></mat-divider>
    <mat-list-item><span class="text-muted">Razón Social:</span> {{userCustomerRoleData.razonSocialEmpresa}}</mat-list-item>
    <mat-divider></mat-divider>
    <mat-list-item><span class="text-muted">Rol:</span> {{userCustomerRoleData.roleName}}</mat-list-item>
  </mat-list>


  <mat-tab-group>
    <mat-tab label="Establecimientos">
     <div class="my-2">
       @if(userCustomerRoleData.idUsuarioRol>0){
         <app-mat-dynamic-card>
           <app-list-asignacion-estab/>

         </app-mat-dynamic-card>
       }
     </div>

    </mat-tab>
    <mat-tab label="Permisos"> Permisos </mat-tab>
    <mat-tab label="Accessos"> Accessos </mat-tab>
  </mat-tab-group>


</ng-template>
<ng-template #footer></ng-template>
