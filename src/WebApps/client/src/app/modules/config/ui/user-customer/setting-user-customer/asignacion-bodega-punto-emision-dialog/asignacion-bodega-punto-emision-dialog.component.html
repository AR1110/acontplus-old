<app-mat-custom-dialog
  [title]="'Asignación de Punto de Emisión y Bodega'"
  [containerTemplate]="body"
  [actionsTemplate]="footer"
  (close)="close()"
/>

<ng-template #body>
  <div class="d-grid gap-2">
    <acp-dynamic-card [isHeaderVisible]="true" [cardSubtitle]="'Puntos de Emisión'">
      <app-mat-dynamic-table
        [tableData]="dataSourcePuntoEmision()"
        [columnDefinitions]="columnsDefsPuntoEmision"
        [visibleColumns]="columnsPuntoEmision"
        [templateOp]="templateOpPuntoEmision"
      />

      <ng-template #templateOpPuntoEmision let-item="item">
        @if (item.idPtoEmi_Asig > 0) {
          <button mat-icon-button (click)="addPuntoEmision(item)">
            <mat-icon>delete_outline</mat-icon>
          </button>
        } @else {
          <button mat-icon-button (click)="addPuntoEmision(item)">
            <mat-icon>save</mat-icon>
          </button>
        }
      </ng-template>

      <ng-template #templatePuntoEmisionDefault let-item>
        @if (item.estado) {
          <mat-slide-toggle
            [(ngModel)]="item.defaultPtoEmi"
            (change)="onChangePuntoEmisionDefault(item)"
          />
        }
      </ng-template>
    </acp-dynamic-card>

    <acp-dynamic-card [isHeaderVisible]="true" [cardSubtitle]="'Bodegas'">
      <app-mat-dynamic-table
        [tableData]="dataSourceBodega()"
        [columnDefinitions]="columnsDefsBodega"
        [visibleColumns]="columnsBodega"
        [templateOp]="templateOpBodega"
      />

      <ng-template #templateOpBodega let-item="item">
        @if (item.idBodeg_Asig > 0) {
          <button mat-icon-button (click)="addBodega(item)">
            <mat-icon>delete_outline</mat-icon>
          </button>
        } @else {
          <button mat-icon-button (click)="addBodega(item)">
            <mat-icon>save</mat-icon>
          </button>
        }
      </ng-template>
      <ng-template #templateDefaultBodega let-item>
        @if (item.estado) {
          <mat-slide-toggle
            [(ngModel)]="item.defaultBodga"
            (change)="onChangeBodegaDefault(item)"
          />
        }
      </ng-template>
    </acp-dynamic-card>
  </div>
</ng-template>
<ng-template #footer />
