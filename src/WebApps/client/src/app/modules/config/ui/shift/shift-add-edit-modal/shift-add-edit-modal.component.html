<app-mat-custom-dialog
  (close)="close()"
  [title]="title"
  [containerTemplate]="body"
  [actionsTemplate]="footer"
/>

<ng-template #body>
  <div class="d-grid gap-3">
    <div class="row">
      <div class="col-12">
        <mat-form-field
          class="w-100"
          appearance="outline"
        >
          <mat-label>Descripción del turno</mat-label>
          <input
            matInput
            [(ngModel)]="data.descripcion"
            name="descripcion"
            placeholder="Ejemplo: Turno mañana"
            maxlength="50"
          />
          <mat-error *ngIf="!data.descripcion || data.descripcion.length === 0">
            La descripción es obligatoria.
          </mat-error>
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <table class="table table-bordered table-sm">
          <thead>
            <tr>
              <th class="text-center">#</th>
              <th class="text-center">Día</th>
              <th class="text-center">Estado</th>
              <th class="text-center">Apertura</th>
              <th class="text-center">Cierre</th>
            </tr>
          </thead>
          <tbody>
            @for (schedule of schedules(); track $index) {
              <tr>
                <td class="text-center">{{ $index + 1 }}</td>
                <td class="text-center">{{ schedule.descripcion }}</td>
                <td class="text-center">
                  <mat-slide-toggle
                    [(ngModel)]="schedule.estado"
                  ></mat-slide-toggle>
                </td>
                <td class="text-center">
                  <div class="d-flex flex-row align-items-center gap-1">
                    <input
                      type="time"
                      [(ngModel)]="schedule.apertura"
                      class="form-control form-control-sm"
                      style="width: 90px"
                    />
                  </div>
                </td>
                <td class="text-center">
                  <div class="d-flex flex-row align-items-center gap-1">
                    <input
                      type="time"
                      [(ngModel)]="schedule.cierre"
                      class="form-control form-control-sm"
                      style="width: 90px"
                    />
                  </div>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</ng-template>

<ng-template #footer>
  <app-theme-button
    [variant]="'success'"
    [icon]="'save'"
    [text]="'Guardar'"
    (handleClick)="save()"
  />
</ng-template>
