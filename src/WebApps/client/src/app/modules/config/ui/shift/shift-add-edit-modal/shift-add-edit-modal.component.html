<app-mat-custom-dialog
  (close)="close()"
  [title]="title"
  [containerTemplate]="body"
  [actionsTemplate]="footer"
/>

<ng-template #body>
  <div class="d-grid gap-3">
    <div class="row">
      <div class="col-12">
        <mat-form-field class="w-100">
          <mat-label>Descripción</mat-label>
          <input
            matInput
            [(ngModel)]="data.descripcion"
            name="descripcion"
            required
          />
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <mat-slide-toggle
          [(ngModel)]="data.estado"
          name="estado"
        >
          Estado
        </mat-slide-toggle>
      </div>
    </div>
  </div>
</ng-template>

<ng-template #footer>
  <app-theme-button
    [variant]="'success'"
    [icon]="'save'"
    [text]="'Guardar'"
    (handleClick)="save()"
  />
</ng-template>
