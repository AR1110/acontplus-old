<app-breadcrumb />
<acp-dynamic-card>
  <div
    class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-1 row-cols-1 g-4"
  >
    <div class="col"></div>
    <div class="col">
      <div class="d-flex flex-row gap-2 justify-content-end">
        <button mat-flat-button (click)="openModalAddUpdate()">
          <mat-icon>add</mat-icon>
          Nuevo
        </button>
        <button mat-icon-button (click)="refresh()">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <app-mat-dynamic-table
    [tableData]="dataSource()"
    [columnDefinitions]="columnsDefs"
    [visibleColumns]="columns"
    [templateOp]="templateOp"
  />

  <ng-template #templateOp let-item="item">
    <button type="button" mat-icon-button (click)="openModalAddUpdate(item)">
      <mat-icon>edit</mat-icon>
    </button>

    <button
      type="button"
      mat-icon-button
      (click)="updateSignature(item)"
      matTooltip="Actualizar firma electrónica (archivo y contraseña)"
    >
      <app-svg-icon id="icon-file-pencil" />
    </button>

    <button
      type="button"
      mat-icon-button
      (click)="downloadSignature(item)"
      matTooltip="Descargar la Firma Electrónica en archivo"
    >
      <mat-icon>download</mat-icon>
    </button>
  </ng-template>
</acp-dynamic-card>
