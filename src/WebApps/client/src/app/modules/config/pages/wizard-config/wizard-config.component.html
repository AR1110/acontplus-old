<app-breadcrumb/>
<div class="row mt-3">
  <div class="col-xl-8 col-lg-8 col-md-8 col-sm-12 col-12">
    <mat-stepper [linear]="isLinear">
      <mat-step [editable]="true" [stepControl]="estabForm">
        <form (ngSubmit)="saveEstab()" [formGroup]="estabForm" autocomplete="off">
          <ng-template matStepLabel>Datos de Usuario</ng-template>

        </form>
      </mat-step>
      <mat-step [editable]="true" [stepControl]="estabForm">
        <form (ngSubmit)="saveEstab()" [formGroup]="estabForm" autocomplete="off">
          <ng-template matStepLabel>Registrar Establecimiento</ng-template>

        </form>
      </mat-step>
      <mat-step>
        <form (ngSubmit)="saveEstab()" [formGroup]="estabForm" autocomplete="off">
          <ng-template matStepLabel>Firma Electrónica</ng-template>

        </form>
      </mat-step>
      <mat-step>
        <form (ngSubmit)="saveEstab()" [formGroup]="estabForm" autocomplete="off">
          <ng-template matStepLabel>Secuenciales de Documentos</ng-template>

        </form>
      </mat-step>
    </mat-stepper>
  </div>
</div>
