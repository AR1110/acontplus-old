<div class="row">
  <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
    <div class="card">
      <div class="card-body shadow">
        <section class="example-section">
          <span class="example-list-section">
            <mat-checkbox class="example-margin" [checked]="allComplete" [color]="task.color"
              [indeterminate]="someComplete()" (change)="setAll($event.checked)">
              {{task.name}}
            </mat-checkbox>
          </span>
          <span class="example-list-section">
            <ul>
              @for (subtask of task.subtasks; track subtask) {
              <li>
                <mat-checkbox [(ngModel)]="subtask.completed" [color]="subtask.color"
                  (ngModelChange)="updateAllComplete()">
                  {{subtask.name}}
                </mat-checkbox>
              </li>
              }
            </ul>
          </span>
        </section>
      </div>
    </div>
  </div>
    <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">

    <div class="card">
      <div class="card-body shadow">
        <section class="example-section">
          <span class="example-list-section">
            <mat-checkbox class="example-margin" [checked]="allComplete" [indeterminate]="someComplete()"
              (change)="setAll($event.checked)">
              {{permissionSale.comprobante.label}}
            </mat-checkbox>
          </span>
          <span class="example-list-section">
            <ul>
              @for (permission of permissions; track $index) {
              <li>
                <mat-checkbox [(ngModel)]="permissionSale.comprobante.permissions[permission].enabled"
                  (ngModelChange)="updateAllComplete()">
                  {{permissionSale.comprobante.permissions[permission].description}}
                </mat-checkbox>
              </li>
              }
            </ul>
          </span>
        </section>

      </div>
    </div>
  </div>
</div>
