<div ngbAccordion [closeOthers]="true" [destroyOnHide]="true">
  @for (item of menus; track $index) {
    <div ngbAccordionItem  >
      <h2 ngbAccordionHeader>
        <button ngbAccordionButton>{{ item.name }}</button>
      </h2>
      <div ngbAccordionCollapse>
        <div ngbAccordionBody>
          <ng-template>
            <div class="table-responsive mt-2 my-custom-table">
              <table class="table">
                <thead>
                <tr>
                  <th>Id</th>
                  <th>Name</th>
                  <th>Options</th>
                </tr>
                </thead>
                <tbody>
                  @for (submenu of item.subMenusNode; track $index) {
                    <tr>
                      <td>{{ $index+1 }}</td>
                      <td>{{ submenu.name }}</td>
                      <td>
                        <button
                          type="button"
                          class="btn btn-outline-danger btn-sm m-l-5"
                          title="Eliminar de la lista"
                          (click)="askToDelete(submenu)"
                        >
                          <fa-icon [icon]="'trash'"></fa-icon>
                        </button>
                        <button
                          type="button"
                          class="btn btn-outline-success btn-sm m-l-5"
                          title="Administrar Acciones"
                          (click)="onActionsOpen(submenu)"
                        >
                          <fa-icon [icon]="'lock'"></fa-icon>
                        </button>
                      </td>
                    </tr>
                  }
                </tbody>
              </table>
            </div>
          </ng-template>
        </div>
      </div>
    </div>
  }
</div>
