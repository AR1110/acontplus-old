<div class="table-responsive">
  <table class="table">
    <thead>
      <tr>
        <th>Nro.</th>
        <th>Nombre Comercial</th>
        <th>Nro. Estab</th>
        <th>Predeterminado</th>
        <th>Op.</th>
      </tr>
    </thead>
    <tbody>
      @for (item of userCustomerRoleEstabs; track $index) {
        <tr>
          <td>{{$index+1}}</td>
          <td [width]="500">{{item.nombreComercial}}</td>
          <td>{{item.estab}}</td>
          <td>
            @if(item.estado){
              <mat-slide-toggle [(ngModel)]="item.defaultEstab" (change)="onChangeDefault(item)"></mat-slide-toggle>
            }

          </td>
          <td>
            @if (item.idEstab_Asig>0) {
              <button class="btn btn-danger btn-sm" (click)="addEstab(item)">
                <fa-icon [icon]="'trash'"></fa-icon>
              </button>
              <button class="btn btn-warning btn-sm m-1" (click)="modalBodegaPuntoEmision(item)">
                <fa-icon [icon]="'user-cog'"></fa-icon>
              </button>
            }@else {
                <button class="btn btn-success btn-sm" (click)="addEstab(item)">
                  <fa-icon [icon]="'save'"></fa-icon>
                </button>
            }

          </td>
        </tr>
      }
      @empty {
        <tr>
          <td colspan="5" class="text-center">Sin registro</td>
        </tr>
      }
    </tbody>
  </table>
</div>
