<app-breadcrumb />

<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="establecimiento">Establecimiento: </label>
          <select name="establecimiento" id="establecimiento" class="form-select" [(ngModel)]="dataSearch.codEstab"
            (change)="onChangeEstab()">
            @for (item of establecimientos; track $index) {
            <option [ngValue]="item.codEstab">{{item.nombreComercial}}</option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="puntoEmision">Puntos Emisión: </label>
          <select name="puntoEmision" id="puntoEmision" class="form-select" [(ngModel)]="dataSearch.idPuntoEmision"
            (change)="getDocs()">
            @for (item of puntosEmision; track $index) {
            <option [ngValue]="item.idPuntoEmision">{{item.ptoEmi}}</option>
            }
          </select>
        </div>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>Nro.</th>
            <th>Documento</th>
            <th></th>
            <th>Secuencia</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (item of docs; track $index) {
          <tr>
            <td>{{$index+1}}</td>
            <td>{{item.descripcion}}</td>
            <td>
              <div class="icheck-primary">
                <input type="checkbox" [name]="item.descripcion + $index" [id]="item.descripcion + $index"
                  [(ngModel)]="item.generacionNro">
                <label [for]="item.descripcion + $index"></label>
              </div>
            </td>
            <td>
              <div class="form-group">
                <input type="number" class="form-control" [(ngModel)]="item.ultimaSecuencia"
                  [disabled]="!item.generacionNro" onclick="this.select()" min="1">
              </div>
            </td>
            <td>
              <button type="button" class="btn btn-success btn-sm" [disabled]="!item.ultimaSecuencia"
                (click)="saveConfig(item)">
                <fa-icon [icon]="'save'"></fa-icon>
              </button>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
