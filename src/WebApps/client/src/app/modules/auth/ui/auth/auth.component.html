<form [formGroup]="form" (ngSubmit)="login()" class="form-horizontal form-material text-center">
  <!--Logo-->
  <a href="javascript:void(0)" class="db">
    <img src="./img/logo-icon.jpg" class="img-responsive" alt="Home" height="100" width="100" />
  </a>
  <div class="center">
    <h5>AcontPlus</h5>
  </div>
  <div class="center">
    <h6>Iniciar de Sesión</h6>
  </div>
  <div class="d-flex flex-column gap-2 mt-4">
    <mat-form-field class="w-100">
      <mat-label>Usuario</mat-label>
      <input matInput placeholder="Usuario" formControlName="username" />
      <!-- @if (form.controls.username.hasError('required')) {
        <mat-error>El usuario es <strong>requerido</strong></mat-error>
      } -->
    </mat-form-field>

    <mat-form-field class="w-100">
      <mat-label>Contraseña</mat-label>
      <input [type]="hide() ? 'password' : 'text'" matInput formControlName="password" placeholder="Contraseña" />
      <button type="button" mat-icon-button matSuffix (click)="clickEvent($event)" [attr.aria-label]="'Hide password'">
        <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    <button
      type="submit"
      mat-flat-button
      style="height: 50px"
      class="btn-lg w-100 text-uppercase btn-rounded m-t-20"
      [disabled]="form.invalid"
    >
      Ingresar
      <mat-icon>exit_to_app</mat-icon>
    </button>
  </div>
</form>
