<app-mat-custom-dialog
  (close)="close()"
  [containerTemplate]="body"
  [actionsTemplate]="footer"
  title="Búsqueda Avanzada"

/>

<ng-template #body>
  <div class="container-fluid vstack gap-2">
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-2">
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Opciones: <span class="text-danger">*</span></mat-label>
          <mat-select>
            <mat-option></mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col"></div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Seleccionar archivo</mat-label>
          <input #fileInput type="file" hidden (change)="onFileSelected($event)" accept=".xls,.xlsx" >
          <input matInput class="cursor-pointer"  readonly (click)="fileInput.click()">

          <ng-container matSuffix>
            <button mat-icon-button (click)="fileInput.click()">
              <mat-icon>attach_file</mat-icon>
            </button>
            <button mat-icon-button  >
              <mat-icon>done</mat-icon>
            </button>
          </ng-container>
          <mat-hint>Para consolidar los productos con un archivo de tipo Excel, debe tener las siguientes columnas en minúsculas: <em>codigo</em>, <em>cantidad</em></mat-hint>
        </mat-form-field>
      </div>
    </div>
  </div>
</ng-template>
<ng-template #footer>
  <app-theme-button
    variant="success"
    matStyle="basic"
    icon="save_alt"
    text="Cargar"
  />
</ng-template>
