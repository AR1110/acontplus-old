<input type="text" placeholder="Search for a street" [formControl]="control" [matAutocomplete]="auto"
  class="form-control" />

<mat-autocomplete #auto="matAutocomplete" class="mat-autocomplete">

  <div class="autocomplete-options">
  <div class="table">
    <div class="sticky-header">
      <div class="column codigo">Código</div>
      <div class="column name">Name</div>
      <div class="column weight">Weight</div>
      <div class="column symbol">Symbol</div>
    </div>

    @for (street of filteredStreets | async; track $index) {
      <mat-option class="option">
        <div class="cell codigo">{{ street.codigo }}</div>
        <div class="cell name">{{ street.descripcion }}</div>
        <div class="cell weight">{{ street.stock }}</div>
        <div class="cell symbol">{{ street.symbol }}</div>
      </mat-option>

    }
  </div>
</div>


</mat-autocomplete>
