<div class="modal-body">
  <div class="input-group input-group-lg">
    <input type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-lg"
      (keyup)="applyFilter()" [(ngModel)]="dataSearch.textSearch">
    <span class="input-group-text" id="inputGroup-sizing-lg">Esc</span>
  </div>

  <section class="section-container-table mt-1">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      @for (column of columns; track $index) {
      <ng-container [matColumnDef]="column.columnDef">
        <th mat-header-cell *matHeaderCellDef> {{column.header}} </th>
        <td mat-cell *matCellDef="let element">
          @if (column.columnDef==="codigo") {
          {{(element.codigo.length > 12) ? ((element.codigo).slice(0, 12) + '...') : element.codigo}}
          }@else {
          {{element[column.columnDef]}}
          }

        </td>
      </ng-container>
      }
      <!-- @for (column of productTarifas; track $index) {
      <ng-container [matColumnDef]="column.tarifa">
        <th mat-header-cell *matHeaderCellDef> {{column.tarifa}} </th>
        <td mat-cell *matCellDef="let element">


        </td>
      </ng-container>
      } -->

      <tr mat-header-row *matHeaderRowDef="displayedColumns;sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

  </section>

  <mat-paginator #paginator
  class="demo-paginator"
  (page)="handlePageEvent($event)"
  [length]="pagination.totalRecords"
  [pageSize]="pagination.pageSize"

  [pageSizeOptions]="pagination.pageSizeOptions"

  [pageIndex]="pagination.pageIndex"
  aria-label="Select page">
  </mat-paginator>

</div>
