<acp-dynamic-card>
  <div class="d-grid gap-2">
    <mat-form-field class="w-100">
      <mat-label>Descripción</mat-label>
      <textarea
        matInput
        placeholder="..."
        appToUpperCase
        [(ngModel)]="data().descripcion"
      ></textarea>
    </mat-form-field>

    <div
      class="row row-cols-xxl-3 row-cols-xl-3 row-cols-lg-3 row-cols-md-3 row-cols-sm-2 row-cols-1 g-2"
    >
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Medida: </mat-label>
          <mat-select [(ngModel)]="data().idMedida">
            @for (item of medidasArray(); track $index) {
              <mat-option [value]="item.idMedida">{{ item.descripcion }}</mat-option>
            }
          </mat-select>
          <span matSuffix>
            <acp-button
              variant="secondary"
              icon="refresh"
              matStyle="icon"
              (handleClick)="refreshMedida()"
            />
          </span>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Código Barra</mat-label>
          <input matInput [(ngModel)]="data().codigoBarra" />
        </mat-form-field>
      </div>
      <div class="col">
        <div class="d-flex gap-5">
          <div class="d-flex gap-2 justify-content-center align-items-center">
            <ngx-colors (open)="openColor()" ngx-colors-trigger [(ngModel)]="data().color" />
            <span>Color</span>
          </div>

          <div class="hstack gap-1">
            <acp-button
              variant="primary"
              [icon]="productBarCodeId > 0 ? 'edit' : 'save'"
              matStyle="icon"
              (handleClick)="save()"
            />
            <acp-button variant="secondary" icon="clear" matStyle="icon" (handleClick)="clear()" />
          </div>
        </div>
      </div>
    </div>

    <acp-data-grid
      [data]="dataSource"
      [columns]="columns"
      [cellTemplate]="{
        op: templateOp,
        color: colorTemplate,
      }"
    />

    <ng-template #templateOp let-data>
      <div class="d-flex gap-1">
        <acp-button variant="info" icon="edit" matStyle="icon" (handleClick)="edit(data)" />
        <acp-button
          variant="danger"
          icon="delete"
          matStyle="icon"
          (handleClick)="askToDelete(data)"
        />
      </div>
    </ng-template>

    <ng-template #colorTemplate let-data>
      <div
        [style.width]="'20px'"
        [style.height]="'20px'"
        [style.background-color]="data.color"
      ></div>
    </ng-template>
  </div>
</acp-dynamic-card>
