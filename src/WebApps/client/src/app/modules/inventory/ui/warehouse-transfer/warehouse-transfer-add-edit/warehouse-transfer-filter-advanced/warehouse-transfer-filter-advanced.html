<app-mat-custom-dialog
title="Filtro Avanzado"
(close)="close()"
>
  <section ngProjectAs="content">
    <div class="row row-cols-xxl-3 row-cols-xl-3 row-cols-lg-3 row-cols-md-2 row-cols-sm-1 row-cols-1 g-1">
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Bodega Destino</mat-label>
          <mat-select  >
            <mat-option>None</mat-option>
            <mat-option value="option1">Option 1</mat-option>
            <mat-option value="option2">Option 2</mat-option>
            <mat-option value="option3">Option 3</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Seleccione Subfamilia(s)</mat-label>
          <mat-select
            [formControl]="checkedSubCategorias"
            multiple
            (selectionChange)="onSelectionChange($event)"
            panelClass="subfamilias-panel"
          >
            <mat-select-trigger>
              {{ getDisplayValue() }}
            </mat-select-trigger>

            <!-- Seleccionar todo -->
            <mat-option
              [value]="allValue"
              (onSelectionChange)="toggleSelectAll($event)">
              Seleccionar todo
            </mat-option>

            <!-- Grupos por familia -->
            @for (item of subCategorias; track item.familia) {
              <!-- Checkbox para el grupo completo -->
              <mat-option
                [value]="'GROUP_' + item.familia"
                (onSelectionChange)="toggleGroup($event, item)"
                class="group-option">
                <strong>{{ item.familia }}</strong>
              </mat-option>

              <!-- Subfamilias indentadas -->
              @for (sf of item.subFamilias; track sf.idSubFamilia) {
                <mat-option [value]="sf.idSubFamilia" class="subfamilia-option">
                  {{ sf.subFamilia }}
                </mat-option>
              }
            }
          </mat-select>
        </mat-form-field>

      </div>
    </div>
  </section>
</app-mat-custom-dialog>
