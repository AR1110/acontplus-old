<acp-dynamic-card>
  <div
    class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-1 row-cols-1 g-4"
  >
    <div class="col">
      <!--      <mat-form-field>-->
      <!--        <mat-label></mat-label>-->
      <!--        <input matInput (keyup)="onSearch($event)" (input)="onSearch($event)" />-->

      <!--        <span matSuffix>-->
      <!--          <button type="button" mat-icon-button (click)="refresh()">-->
      <!--            <mat-icon>search</mat-icon>-->
      <!--          </button>-->
      <!--        </span>-->
      <!--      </mat-form-field>-->
    </div>
    <div class="col">
      <div class="d-flex flex-row gap-2 justify-content-end">
        <button mat-icon-button [disabled]="isLoadingResults()" (click)="openAddEdit()">
          <mat-icon>add</mat-icon>
        </button>
        <button mat-icon-button (click)="refresh()">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <app-mat-dynamic-table
    [templateOp]="templateOp"
    [tableData]="dataSource()"
    [columnDefinitions]="columnsDefs"
    [visibleColumns]="columns"
    [paginationConfig]="pagination()"
    [enablePagination]="true"
  />

  <ng-template #templateOp let-item="item">
    <acp-button
      [variant]="'success'"
      [icon]="'edit'"
      [matStyle]="'icon'"
      (handleClick)="openAddEdit(item)"
    />
    <acp-button [variant]="'danger'" [icon]="'delete'" [matStyle]="'icon'" />
  </ng-template>
</acp-dynamic-card>
