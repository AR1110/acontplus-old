<app-mat-custom-dialog [title]="title()" (close)="close()">
  <section ngProjectAs="content">
    <div class="row row-cols-xxl-4 row-cols-xl-4 row-cols-lg-4 row-cols-md-2 row-cols-sm-1 row-cols-1 g-1">
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Establecimiento Origen</mat-label>
          <mat-select  >
            <mat-option>None</mat-option>
            <mat-option value="option1">Option 1</mat-option>
            <mat-option value="option2">Option 2</mat-option>
            <mat-option value="option3">Option 3</mat-option>
          </mat-select>
        </mat-form-field>

      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Bodega Origen</mat-label>
          <mat-select  >
            <mat-option>None</mat-option>
            <mat-option value="option1">Option 1</mat-option>
            <mat-option value="option2">Option 2</mat-option>
            <mat-option value="option3">Option 3</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Establecimiento Destino</mat-label>
          <mat-select  >
            <mat-option>None</mat-option>
            <mat-option value="option1">Option 1</mat-option>
            <mat-option value="option2">Option 2</mat-option>
            <mat-option value="option3">Option 3</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Bodega Destino</mat-label>
          <mat-select  >
            <mat-option>None</mat-option>
            <mat-option value="option1">Option 1</mat-option>
            <mat-option value="option2">Option 2</mat-option>
            <mat-option value="option3">Option 3</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-xxl-3 col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <mat-form-field class="w-100">
          <mat-label>Punto Emisión</mat-label>
          <mat-select  >
            <mat-option>None</mat-option>
            <mat-option value="option1">Option 1</mat-option>
            <mat-option value="option2">Option 2</mat-option>
            <mat-option value="option3">Option 3</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-xxl-3 col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <mat-form-field class="w-100">
          <mat-label>Fecha de Caducidad:</mat-label>
          <input matInput [matDatepicker]="fechaCaducidad"   />
          <mat-hint>MM/DD/YYYY</mat-hint>
          <mat-datepicker-toggle matIconSuffix [for]="fechaCaducidad"></mat-datepicker-toggle>
          <mat-datepicker #fechaCaducidad></mat-datepicker>
        </mat-form-field>
      </div>
      <div class="col-xxl-6 col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <mat-form-field class="w-100">
          <mat-label>Observación</mat-label>
          <textarea matInput placeholder="..."></textarea>
        </mat-form-field>
      </div>
    </div>

    <div class="row">
      <div class="col-xxl-6 col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12"></div>
      <div class="col-xxl-6 col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12 d-flex justify-content-end">
        <app-theme-button
          variant="info"
          icon="filter_list"
          text="Filtro Avanzado"
          matStyle="basic"
          (handleClick)="openFilterAdvanced()"
        />
      </div>
    </div>
    hola
  </section>
  <section ngProjectAs="actions">
    <app-theme-button
      variant="success"
      [icon]="btnIcon()"
      [text]="btnText()"
      matStyle="basic"
    />
  </section>
</app-mat-custom-dialog>
