<app-breadcrumb />

<acp-dynamic-card>
  <div class="d-grid gap-2">
    <div
      class="row row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-1 row-cols-1 g-4"
    >
      <div class="col"></div>
      <div class="col">
        <div class="d-flex flex-row gap-1 justify-content-end">
          <button mat-icon-button (click)="openDialog()" [disabled]="isLoadingResults()">
            <mat-icon>add</mat-icon>
          </button>
          <button mat-icon-button (click)="refresh()" [disabled]="isLoadingResults()">
            <mat-icon>refresh</mat-icon>
          </button>
        </div>
      </div>
    </div>

    <app-mat-dynamic-table
      [tableData]="dataSource()"
      [columnDefinitions]="columnsDefs"
      [visibleColumns]="columns"
      [paginationConfig]="pagination()"
      [enablePagination]="true"
      [isLoadingData]="isLoadingResults()"
    />
  </div>
</acp-dynamic-card>
