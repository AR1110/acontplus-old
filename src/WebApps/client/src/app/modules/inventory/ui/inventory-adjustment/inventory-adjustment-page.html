<app-breadcrumb />

<acp-data-grid
  [showToolbar]="true"
  [toolbarTemplate]="headerToolbar"
  [data]="dataSource()"
  [columns]="columnsDefs"
  [cellTemplate]="{
    op: templateOp,
  }"
  [length]="pagination().totalRecords"
  [pageIndex]="pagination().pageIndex"
  [pageSize]="pagination().pageSize"
  (page)="handlePageEvent($event)"
/>

<ng-template #headerToolbar>
  <div class="d-grid gap-2">
    <div class="row row-cols-lg-4 row-cols-md-2 row-cols-1">
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Tipo Documento</mat-label>
          <mat-select [(ngModel)]="dataFilter.tipoDocId">
            <mat-option [value]="0">--Todos--</mat-option>
            @for (item of tiposDoc(); track $index) {
              <mat-option [value]="item.idTipoDocumento">{{ item.descripcion }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Establecimiento</mat-label>
          <mat-select [(ngModel)]="dataFilter.estabId">
            @for (item of estabs(); track $index) {
              <mat-option [value]="item.idEstablecimiento">{{ item.nombreEstab }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <acp-date-range-picker
          [showCheckbox]="true"
          (dateRangeSelected)="dateRangeSelected($event)"
        />
      </div>
      <div class="col">
        <div class="hstack gap-1">
          <acp-button
            variant="success"
            icon="add"
            matStyle="filled"
            text="Nuevo"
            (handleClick)="addEdit()"
          />
          <acp-button
            variant="secondary"
            icon="refresh"
            matStyle="icon"
            (handleClick)="refresh()"
          />
          <acp-button
            variant="secondary"
            icon="filter_list"
            matStyle="icon"
            (handleClick)="isMoreFilter.set(!isMoreFilter())"
          />
        </div>
      </div>
    </div>
    @if (isMoreFilter()) {
      <div class="row row-cols-lg-4 row-cols-md-2 row-cols-1">
        <div class="col"></div>
        <div class="col">
          <mat-form-field class="w-100">
            <mat-label>Número Documento</mat-label>
            <input matInput [(ngModel)]="dataFilter.serie" />
          </mat-form-field>
        </div>
        <div class="col">
          <mat-form-field class="w-100">
            <mat-label>Observación</mat-label>
            <input matInput [(ngModel)]="dataFilter.text" />
          </mat-form-field>
        </div>
        <div class="col"></div>
      </div>
    }
  </div>
</ng-template>

<ng-template #templateOp let-data>
  <acp-button [matMenuTriggerFor]="menu" variant="secondary" icon="more_vert" matStyle="icon" />
  <mat-menu #menu="matMenu">
    <button mat-menu-item (click)="openDetail(data)">
      <mat-icon>menu</mat-icon>
      <span>Detalle</span>
    </button>
    <button mat-menu-item disabled>
      <mat-icon>edit</mat-icon>
      <span>Editar</span>
    </button>
    <button mat-menu-item>
      <mat-icon>file_copy</mat-icon>
      <span>Duplicar</span>
    </button>
    <button mat-menu-item>
      <mat-icon>clear</mat-icon>
      <span>Anular</span>
    </button>
    <button mat-menu-item>
      <mat-icon>picture_as_pdf</mat-icon>
      <span>Reporte</span>
    </button>
  </mat-menu>
</ng-template>
