<app-mat-custom-dialog
  [containerTemplate]="containerTamplate"
  [actionsTemplate]="actionsTemplate"
  (close)="close()"
  [loading]="loading()"
  [title]="'Cambio Masivo de Impuesto'"
/>

<ng-template #containerTamplate>
  <div class="d-grid gap-2">
    @if (joinTaxDesc) {
      <h5 class="text-info">{{ joinTaxDesc }}</h5>
    }
    <div class="d-flex justify-content-between align-items-center">
      <h3 class="card-title">{{ dataForm.title }}</h3>
      <button mat-icon-button aria-label="refresh" (click)="onChangeTaxFrom()">
        <mat-icon>refresh</mat-icon>
      </button>
    </div>

    <app-sub-category-group [isInputMat]="true"
      [subCategoryGroups]="subCategories"
      (onSelected)="onSelectSubCategory($event)"
      (onEmptyData)="clearDataSubCategory()"
     />

    <mat-form-field>
      <mat-label>Impuesto Inicial <span class="text-danger">*</span> </mat-label>
      <mat-select [(ngModel)]="dataForm.taxIdFrom" (selectionChange)="onChangeTaxFrom()">
        @for (item of taxRatesFrom; track $index) {
          <mat-option [value]="item.idTarifaImpuesto">{{ item.descripcion }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    @if (dataForm.taxIdFrom > 0) {
      <mat-form-field>
        <mat-label>Impuesto Destino: <span class="text-danger">*</span></mat-label>
        <mat-select [(ngModel)]="dataForm.taxIdTo" (selectionChange)="onChangeTaxTo()">
          @for (item of taxRatesTo; track $index) {
            <mat-option [value]="item.idTarifaImpuesto">{{ item.descripcion }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    }

    <mat-form-field>
      <mat-label>Observación</mat-label>
      <textarea appToUpperCase matInput placeholder="..." [(ngModel)]="dataForm.obs"></textarea>
    </mat-form-field>
  </div>
</ng-template>

<ng-template #actionsTemplate>
  <button mat-flat-button (click)="askToSave()">
    <mat-icon>save</mat-icon>
    Guardar
  </button>
</ng-template>
