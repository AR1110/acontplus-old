<app-mat-custom-dialog

  [title]="title"
(close)="close()"
  [containerTemplate]="body"
  [actionsTemplate]="footer"
  [options]="{
  showButtonClose: false
  }"
/>

<ng-template #body>
  <div class="my-2">
  <div class="d-grid gap-2">

    @if(params.isCalledFromProductModal || isUpdate()){
      <mat-form-field class="w-100">
        <mat-label>Producto</mat-label>
        <input matInput  [(ngModel)]="data.descripcion" disabled>
      </mat-form-field>
    }
    @else if (!params.isCalledFromProductModal && isAdd()) {
      <app-product-search
        [isSearchSimple]="true"
        [isInputMat]="true"
        (onProductSelected)="handleSelectProduct($event)"
      />
    }



    <div
      class="row row-cols-1 row-cols-xxl-3 row-cols-xl-3 row-cols-lg-3 row-cols-md-3 row-cols-sm-3"
    >
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Precio Costo</mat-label>
          <input matInput [value]="data.precioCosto" disabled>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Código</mat-label>
          <input matInput [value]="data.codigo" disabled>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Medida Principal</mat-label>
          <input matInput [value]="data.nombreMedida" disabled>
        </mat-form-field>
      </div>
    </div>

    <div
      class="row row-cols-1 row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-1"
    >
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Medida: </mat-label>
          <mat-select [(ngModel)]="data.idMedida">
            @for (item of medidas(); track $index) {
              <mat-option [value]="item.idMedida">{{
                  item.descripcion
                }}</mat-option>
            }
          </mat-select>
          <span matSuffix class="d-flex">
                  <button
                    type="button"
                    mat-icon-button
                    appMeasureAddEdit
                    (onResultModal)="resultModalMedida($event)"
                    tabindex="-1"
                  >
                    <mat-icon>add</mat-icon>
                  </button>

                  <button
                    type="button"
                    mat-icon-button
                    (click)="refreshMedida($event)"
                    tabindex="-1"
                  >
                    <mat-icon>refresh</mat-icon>
                  </button>
                </span>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Conversión: <span class="text-danger">*</span></mat-label>
          <input type="number" matInput [(ngModel)]="data.conversion" (keyup)="onChangeConversion()">
        </mat-form-field>
      </div>
    </div>

    <div
      class="row row-cols-1 row-cols-xxl-2 row-cols-xl-2 row-cols-lg-2 row-cols-md-2 row-cols-sm-1"
    >
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Precio Costo Fraccionable: <span class="text-danger">*</span></mat-label>
          <input type="number" matInput [(ngModel)]="data.precioCostoFraccionado">
        </mat-form-field>
      </div>
      <div class="col">
        <mat-slide-toggle [(ngModel)]="data.gestionVenta">Para venta</mat-slide-toggle>
      </div>
    </div>


        <app-tabulator
          [tableData]="productTarifa"
          [options]="tabulatorOptions"
          (cellEdited)="cellEdited($event)"
        ></app-tabulator>

  </div>
  </div>
</ng-template >
<ng-template #footer>
  <app-theme-button [type]="'button'" [variant]="'success'" [icon]="isUpdate()? 'edit': 'save'" [text]="btnText"
                    (handleClick)="save()"
  />
  <app-theme-button [type]="'button'" [variant]="'dark'" [icon]=" 'clear'" [text]="'Cerrar'"
                    (handleClick)="close()"
  />
</ng-template>
