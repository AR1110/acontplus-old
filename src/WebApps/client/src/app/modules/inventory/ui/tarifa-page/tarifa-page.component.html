<app-breadcrumb />

<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title></mat-card-title>
      <div class="d-flex flex-row gap-2">
        <button mat-icon-button (click)="refresh()">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-content>
    <!-- setting outline form field appearance -->
    <app-custom-table-container   [isLoadingResults]="isLoadingResults" [valueHeight]="'400px'">
      <table mat-table [dataSource]="dataSource()" matSort matSortActive="descripcion" matSortDisableClear
        matSortDirection="desc">
        <!-- Number Column -->
        <ng-container matColumnDef="index">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let element; let i = index">
            {{ i + 1 }}
          </td>
        </ng-container>

        <ng-container matColumnDef="op">
          <th mat-header-cell *matHeaderCellDef>Op.</th>
          <td mat-cell *matCellDef="let row">
            <div class="d-flex flex-row gap-1">
              <button mat-icon-button (click)="onEdit(row)" >
                <mat-icon>edit</mat-icon>
              </button>
            </div>

          </td>
        </ng-container>


        <!-- Title Column -->
        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef>Código</th>
          <td mat-cell *matCellDef="let row">{{row.codigo
            }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let row">{{row.descripcion
            }}</td>
        </ng-container>

        <ng-container matColumnDef="default">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let row">
            {{row.predeterminada?'SI': 'NO'}}
          </td>
        </ng-container>

        <ng-container matColumnDef="ventaPorMayor">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let row">
            {{row.ventaPorMayor?'SI': 'NO'}}
          </td>
        </ng-container>



        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let row">
            <div [innerHTML]="row.estado | primaryStatus"></div>
          </td>
        </ng-container>


        <tr mat-header-row *matHeaderRowDef="displayedColumns;sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </app-custom-table-container>

  </mat-card-content>
</mat-card>
