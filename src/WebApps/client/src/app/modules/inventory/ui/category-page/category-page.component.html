<app-breadcrumb />
<acp-dynamic-card>
  <div class="row">
    <div class="col-6 d-flex justify-content-start">
      <span class="form-group pull-left page-size form-inline">
        <select
          class="form-select control-color"
          [(ngModel)]="dataSearch.pageSize"
          (change)="changePageSize()"
        >
          @for (item of recordsQuantity; track $index) {
            <option [ngValue]="item">{{ item }}</option>
          }
        </select>
      </span>
    </div>

    <div class="col-6 d-flex justify-content-end">
      <div class="form-group">
        <input
          type="text"
          class="form-control border-select"
          ng-change="searchFilterLocal()"
          ng-model="dataSearch.bySearch"
          placeholder="..."
        />
      </div>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>N°</th>
          <th>Código</th>
          <th>Descripción</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        @for (item of categories; track $index) {
          <tr>
            <td>{{ $index + 1 }}</td>
            <td>{{ item.siglas }}</td>
            <td>{{ item.descripcion }}</td>
            <td>
              <div [innerHTML]="item.estado | primaryStatus"></div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</acp-dynamic-card>
