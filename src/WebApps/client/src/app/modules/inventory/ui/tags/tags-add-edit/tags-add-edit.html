<mat-dialog-content>
  <div class="d-flex flex-column gap-2">
    <mat-form-field class="w-100">
      <mat-label>Descripción</mat-label>
      <input matInput [(ngModel)]="data.descripcion" appToUpperCase placeholder="Ej: Moto" />
    </mat-form-field>

    <acp-input-chip [chips]="etiquetas" [labelText]="'Etiquetas'" />

    @if (data.idEtiqueta > 0) {
      <mat-radio-group aria-label="Select an option status" [(ngModel)]="data.estado">
        <mat-radio-button [value]="true">Activo</mat-radio-button>
        <mat-radio-button [value]="false">Inactivo</mat-radio-button>
      </mat-radio-group>
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <acp-button
    type="submit"
    icon="save"
    [text]="btnText"
    variant="success"
    matStyle="filled"
    (handleClick)="save()"
  />
  <acp-button
    type="button"
    variant="dark"
    text="Cerrar"
    matStyle="filled"
    (handleClick)="dialogRef.close()"
  />
</mat-dialog-actions>
