<app-breadcrumb />

<acp-dynamic-card>
  <div headerActions class="d-flex flex-row gap-2">
    <button mat-icon-button appMeasureAddEdit (onResultModal)="refresh()">
      <mat-icon>add</mat-icon>
    </button>
    <button mat-icon-button (click)="exportToExcel()">
      <mat-icon>save_alt</mat-icon>
    </button>
    <button mat-icon-button (click)="refresh()">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>

  <!-- setting outline form field appearance -->
  <app-custom-table-container
    [pagination]="pagination()"
    [isLoadingResults]="isLoadingResults"
    (onPageEvent)="handlePageEvent($event)"
  >
    <table
      mat-table
      [dataSource]="dataSource()"
      matSort
      matSortActive="descripcion"
      matSortDisableClear
      matSortDirection="desc"
    >
      <!-- Number Column -->
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let element; let i = index">
          {{ i + 1 }}
        </td>
      </ng-container>

      <ng-container matColumnDef="op">
        <th mat-header-cell *matHeaderCellDef>Op.</th>
        <td mat-cell *matCellDef="let row">
          <div class="d-flex flex-row gap-1">
            <button mat-icon-button appMeasureAddEdit [params]="row" (onResultModal)="refresh()">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button (click)="askToDelete(row)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <!-- Title Column -->
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let row">{{ row.codigo }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let row">{{ row.descripcion }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let row">
          <div [innerHTML]="row.estado | primaryStatus"></div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="visibleColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: visibleColumns"></tr>
    </table>
  </app-custom-table-container>
</acp-dynamic-card>
