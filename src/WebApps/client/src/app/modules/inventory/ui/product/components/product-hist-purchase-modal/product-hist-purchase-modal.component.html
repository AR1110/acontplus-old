<app-mat-custom-dialog
  [containerTemplate]="body"
  [title]="'Historial de Compras Habituales - ' + articleName"
  (close)="onModalClose()"
/>

<ng-template #body>
  <app-custom-table-container [isLoadingResults]="isLoadingResults">
    <acp-data-grid
      [data]="documentos"
      [columns]="columns"
      [showPaginator]="false"
      [cellTemplate]="{
        op: templateOp,
      }"
    />
  </app-custom-table-container>

  <ng-template #templateOp let-data>
    <acp-button
      variant="danger"
      icon="remove_shopping_cart"
      matStyle="icon"
      (handleClick)="askToDeleteCH(data)"
    />
  </ng-template>
</ng-template>
