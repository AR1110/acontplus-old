<app-mat-custom-dialog
  [containerTemplate]="body"
  [title]="'Historial de Compras Habituales - ' + articleName"
  (close)="onModalClose()"
/>

<ng-template #body>
  <app-custom-table-container [isLoadingResults]="isLoadingResults">
    <app-mat-dynamic-table
      [templateOp]="templateOp"
      [tableData]="documentos"
      [columnDefinitions]="columnsDefs"
      [visibleColumns]="columns"
    />
  </app-custom-table-container>

  <ng-template #templateOp let-item="item">
    <button mat-icon-button aria-label="Remove Shopping Cart" (click)="askToDeleteCH(item)">
      <mat-icon>remove_shopping_cart</mat-icon>
    </button>
  </ng-template>
</ng-template>
