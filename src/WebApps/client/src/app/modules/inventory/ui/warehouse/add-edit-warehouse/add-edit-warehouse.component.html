<app-mat-custom-dialog
  [containerTemplate]="body"
  [actionsTemplate]="footer"
  [title]="title"
  (close)="close()"
/>
<ng-template #body>
  <div class="d-grid gap-2">
    <mat-form-field class="w-100">
      <mat-label>Establecimiento</mat-label>
      <mat-select [(ngModel)]="data.codEstab" [disabled]="isUpdate()">
        @for (item of estabs(); track $index) {
          <mat-option [value]="item.codEstab">{{item.nombreComercial}}</mat-option>
        }
      </mat-select>
    </mat-form-field>



    <mat-form-field class="w-100" >
      <mat-label>Descripción</mat-label>
      <input matInput appToUpperCase [(ngModel)]="data.descripcion">
    </mat-form-field>

    <mat-form-field class="w-100" >
      <mat-label>Teléfono</mat-label>
      <input matInput appToUpperCase [(ngModel)]="data.telefono">
    </mat-form-field>

    <mat-form-field class="w-100" >
      <mat-label>Dirección</mat-label>
      <textarea matInput appToUpperCase [(ngModel)]="data.direccion"></textarea>
    </mat-form-field>

  </div>
</ng-template>
<ng-template #footer>
  <app-theme-button
    type="button"
    variant="success"
    [icon]="btnIcon"
    (handleClick)="save()"
    [text]="btnText"
  />
</ng-template>
