<mat-dialog-content>
  <div class="d-grid gap-2 m-0 p-0">
    <mat-form-field>
      <mat-label>Descripción</mat-label>
      <input matInput [(ngModel)]="data.descripcion" appToUpperCase />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Código</mat-label>
      <input matInput [(ngModel)]="data.codigo" appToUpperCase />
    </mat-form-field>

    <mat-slide-toggle [(ngModel)]="data.ventaPorMayor">Venta al por mayor</mat-slide-toggle>
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <acp-button
    type="submit"
    icon="save"
    [text]="loading() ? 'Guardando...' : btnText"
    variant="success"
    matStyle="filled"
    [disabled]="loading()"
    (handleClick)="save()"
  />
  <acp-button
    type="button"
    variant="dark"
    text="Cerrar"
    matStyle="filled"
    (handleClick)="dialogRef.close()"
  />
</mat-dialog-actions>
