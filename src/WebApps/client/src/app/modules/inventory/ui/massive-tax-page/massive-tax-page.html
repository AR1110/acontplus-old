<app-breadcrumb />

<acp-data-grid
  [showToolbar]="true"
  [toolbarTemplate]="headerToolbar"
  [columns]="columns"
  [data]="list()"
  [length]="pageCount"
  [pageIndex]="page"
  [pageSize]="pageSize"
  (page)="handlePageEvent($event)"
  [cellTemplate]="{
    actions: opTpl,
  }"
/>

<ng-template #opTpl let-data>
  <!-- No actions needed for this module based on original template -->
</ng-template>

<ng-template #headerToolbar>
  <div class="d-flex flex-row gap-2">
    <acp-button
      type="button"
      icon="add"
      variant="success"
      matStyle="filled"
      text="Nuevo"
      [disabled]="isLoadingResults()"
      (handleClick)="add()"
    />

    <acp-button
      type="button"
      icon="refresh"
      variant="secondary"
      matStyle="icon"
      (handleClick)="refresh()"
    />
  </div>
</ng-template>
