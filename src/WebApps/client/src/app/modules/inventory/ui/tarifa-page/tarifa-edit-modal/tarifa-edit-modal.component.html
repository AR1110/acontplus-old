<app-mat-custom-dialog
  [containerTemplate]="body"
  [actionsTemplate]="footer"
  [title]="titleModal()"
  (close)="closeModal()"
/>

<ng-template #body>
  <div class="d-grid gap-2">
    <mat-form-field>
      <mat-label>Descripcion</mat-label>
      <input matInput [(ngModel)]="data.descripcion" appToUpperCase />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Código</mat-label>
      <input matInput [(ngModel)]="data.codigo" appToUpperCase />
    </mat-form-field>

    <mat-slide-toggle [(ngModel)]="data.ventaPorMayor">Venta al por mayor</mat-slide-toggle>
  </div>
</ng-template>
<ng-template #footer>
  <acp-button variant="success" icon="save" [text]="btnText" (handleClick)="save()" />
</ng-template>
