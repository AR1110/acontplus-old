<acp-dynamic-card>
  <div class="d-grid gap-2">
    <div
      class="row row-cols-xxl-3 row-cols-xl-3 row-cols-lg-3 row-cols-md-3 row-cols-sm-2 row-cols-1 g-2"
    >
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Establecimiento: </mat-label>
          <mat-select
            [(ngModel)]="data().idEstablecimiento"
            (selectionChange)="onChangeEstab.emit()"
          >
            @for (item of estabs(); track $index) {
              <mat-option [value]="item.idEstablecimiento">{{ item.nombreEstab }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Bodega: </mat-label>
          <mat-select [(ngModel)]="data().idBodega">
            @for (item of bodegas(); track $index) {
              <mat-option [value]="item.idBodega">{{ item.descripcion }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <div class="d-flex gap-2">
          <mat-form-field class="w-100">
            <mat-label>Ubicación</mat-label>
            <input matInput [(ngModel)]="data().ubicacion" placeholder="..." appToUpperCase />
          </mat-form-field>

          <div class="hstack gap-1">
            <acp-button
              variant="primary"
              [icon]="productUbicationId > 0 ? 'edit' : 'save'"
              matStyle="icon"
              (handleClick)="save()"
            />
            <acp-button variant="secondary" icon="clear" matStyle="icon" (handleClick)="clear()" />
          </div>
        </div>
      </div>
    </div>

    <acp-data-grid
      [data]="dataSource()"
      [columns]="columns"
      [showPaginator]="false"
      [cellTemplate]="{
        op: templateOp,
      }"
    />

    <ng-template #templateOp let-data>
      <div class="d-flex gap-1">
        <acp-button variant="info" icon="edit" matStyle="icon" (handleClick)="edit(data)" />
        <acp-button
          variant="danger"
          icon="delete"
          matStyle="icon"
          (handleClick)="askToDelete(data)"
        />
      </div>
    </ng-template>
  </div>
</acp-dynamic-card>
