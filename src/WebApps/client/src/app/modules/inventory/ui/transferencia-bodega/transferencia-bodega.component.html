<app-breadcrumb />

<app-mat-dynamic-card>
  <div class="d-grid gap-3">
    <div class="row">
      <div class="col-xxl-8 col-xl-8 col-lg-8 col-md-6 col-sm-12">
        <div
          class="row row-cols-xxl-3 row-cols-xl-3 row-cols-lg-3 row-cols-md-2 row-cols-sm-1 row-cols-1 g-4"
        >
          <div class="col">
            <mat-form-field class="w-100">
              <mat-label
                >Establecimiento: <span class="text-danger">*</span></mat-label
              >
              <mat-select
                [(ngModel)]="dataSearch.codEstab"
                (selectionChange)="onChangeEstab()"
              >
                @for (item of estabs; track $index) {
                <mat-option [value]="item.codEstab">{{
                  item.nombreEstab
                }}</mat-option>

                }
              </mat-select>
            </mat-form-field>
          </div>
          <div class="col">
            <mat-form-field class="w-100">
              <mat-label
                >Punto Emisión: <span class="text-danger">*</span></mat-label
              >
              <mat-select
                [(ngModel)]="dataSearch.puntoEmisionId"
                (selectionChange)="refresh()"
              >
                @for (item of puntosEmision; track $index) {
                <mat-option [value]="item.idPuntoEmision">{{
                  item.ptoEmi
                }}</mat-option>

                }
              </mat-select>
            </mat-form-field>
          </div>
          <div class="col">
            <app-date-range-selection
              (onChangeDateRange)="onChangeDateRange($event)"
              [showInputMaterial]="true"
            />
          </div>
        </div>
      </div>
      <div class="col-xxl-4 col-xl-4 col-lg-4 col-md-6 col-sm-12">
        <div class="d-flex flex-row gap-1 justify-content-end">
          <button
            mat-icon-button
            appProductAddEdit
            (onResultModal)="refresh()"
            [disabled]="isLoadingResults"
          >
            <mat-icon>add</mat-icon>
          </button>
          <button
            mat-icon-button
            (click)="refresh()"
            [disabled]="isLoadingResults"
          >
            <mat-icon>refresh</mat-icon>
          </button>
        </div>
      </div>
    </div>

    <app-mat-dynamic-table
      [isLoadingData]="isLoadingResults"
      [tableData]="dataSource()"
      [columnDefinitions]="columnsDefs"
      [visibleColumns]="columns"
      [templateOp]="templateOp"
      [paginationConfig]="pagination()"
      [enablePagination]="true"
      (pageEvent)="handlePageEvent($event)"
    >
    </app-mat-dynamic-table>
  </div>

  <ng-template #templateOp let-item="item">
    <button mat-icon-button [matMenuTriggerFor]="menu" aria-hidden="false">
      <mat-icon>more_vert</mat-icon>
    </button>

    <mat-menu #menu="matMenu">
      <button mat-menu-item appActionEdit>
        <mat-icon>update</mat-icon>
        <span>Editar</span>
      </button>
      <button mat-menu-item appActionDelete>
        <mat-icon>delete</mat-icon>
        <span>Eliminar</span>
      </button>
    </mat-menu>
  </ng-template>
</app-mat-dynamic-card>
