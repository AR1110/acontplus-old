<app-breadcrumb />

<acp-dynamic-card>
  <div class="d-grid gap-0">
    <div class="row">
      <div class="col-xxl-10 col-xl-10 col-lg-10 col-md-6 col-sm-12">
        <div
          class="row row-cols-xxl-3 row-cols-xl-3 row-cols-lg-3 row-cols-md-2 row-cols-sm-1 row-cols-1 g-1"
        >
          <div class="col">
            <mat-form-field class="w-100">
              <mat-label>Establecimiento: <span class="text-danger">*</span></mat-label>
              <mat-select [(ngModel)]="dataSearch.codEstab" (selectionChange)="onChangeEstab()">
                @for (item of estabs; track $index) {
                  <mat-option [value]="item.codEstab">{{ item.nombreEstab }}</mat-option>
                }
              </mat-select>
            </mat-form-field>
          </div>
          <div class="col">
            <mat-form-field class="w-100">
              <mat-label>Punto Emisión: <span class="text-danger">*</span></mat-label>
              <mat-select [(ngModel)]="dataSearch.puntoEmisionId" (selectionChange)="refresh()">
                @for (item of puntosEmision; track $index) {
                  <mat-option [value]="item.idPuntoEmision">{{ item.ptoEmi }}</mat-option>
                }
              </mat-select>
            </mat-form-field>
          </div>
          <div class="col">
            <app-date-range-selection
              (onChangeDateRange)="onChangeDateRange($event)"
              [showInputMaterial]="true"
              [showMatSuffix]="true"
              [(checkbox)]="dataSearch.useFilterDate"
              (checkboxChange)="refresh()"
            />
          </div>
        </div>
      </div>
      <div class="col-xxl-2 col-xl-2 col-lg-2 col-md-6 col-sm-12">
        <div class="d-flex flex-row gap-1 justify-content-end">
          <button
            *hasPermission="
              action_aliases().CREATE;
              context: inventory_modules_code().WAREHOUSE_TRANSFER
            "
            mat-icon-button
            [disabled]="isLoadingResults()"
            (click)="openAddEditDialog()"
          >
            <mat-icon>add</mat-icon>
          </button>
          <button mat-icon-button (click)="refresh()" [disabled]="isLoadingResults()">
            <mat-icon>refresh</mat-icon>
          </button>
          <button
            mat-icon-button
            (click)="isMoreFilter.set(!isMoreFilter())"
            [disabled]="isLoadingResults()"
          >
            <mat-icon>filter_list</mat-icon>
          </button>
        </div>
      </div>
    </div>
    @if (isMoreFilter()) {
      <div
        class="row row-cols-xxl-3 row-cols-xl-3 row-cols-lg-3 row-cols-md-2 row-cols-sm-1 row-cols-1 g-1"
      >
        <div class="col">
          <mat-form-field class="w-100">
            <mat-label>Nro. Secuencial</mat-label>
            <input
              matInput
              [(ngModel)]="dataSearch.nroSecuencial"
              placeholder="Ej.: 9 o 2-5"
              (keydown.enter)="refresh()"
            />
          </mat-form-field>
        </div>
        <div class="col">
          <mat-form-field class="w-100">
            <mat-label>Buscar por observación</mat-label>
            <input matInput [(ngModel)]="dataSearch.obs" placeholder="..." />
          </mat-form-field>
        </div>
        <div class="col"></div>
      </div>
    }

    <acp-data-grid
      [data]="list()"
      [columns]="columns"
      [length]="pagination().totalRecords"
      [loading]="isLoadingResults()"
      [pageOnFront]="false"
      [pageIndex]="pagination().pageIndex"
      [pageSize]="pagination().pageSize"
      [pageSizeOptions]="pagination().pageSizeOptions"
      (page)="handlePageEvent($event)"
      [rowClassFormatter]="rowClassFormatter"
    />
  </div>
</acp-dynamic-card>
