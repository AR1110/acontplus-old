<form [formGroup]="stateForm">
    <input type="text"
           matInput
           formControlName="subCategoryGroup"
           [matAutocomplete]="autoGroup" class="form-control"
           placeholder="Buscar subfamilia..."
    >
    <mat-autocomplete #autoGroup="matAutocomplete">
      @for (group of stateGroupOptions | async; track $index) {
        <mat-optgroup [label]="group.familia">
          @for (g of group.subFamilias; track $index) {
            <mat-option [value]="g.subFamilia" (onSelectionChange)="onSelectionChange(g)">{{g.subFamilia}}</mat-option>
          }
        </mat-optgroup>
      }
    </mat-autocomplete>
</form>
