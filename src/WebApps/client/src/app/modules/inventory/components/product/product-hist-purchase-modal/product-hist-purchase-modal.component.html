<div class="modal-header">
  <h4 class="modal-title">
    Historial de Compras Habituales - <strong>{{articleName}}</strong>
  </h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()"></button>
</div>
<div class="modal-body">

  <app-custom-table-container [isLoadingResults]="isLoadingResults">

    <app-mat-dynamic-table [templateOp]="templateOp" [dataList]="documentos" [displayColumnDefs]="columnsDefs"
      [displayedColumns]="columns" />
  </app-custom-table-container>

  <ng-template #templateOp let-item="item">
    <button mat-icon-button aria-label="Remove Shopping Cart" (click)="askToDeleteCH(item)">
      <mat-icon>remove_shopping_cart</mat-icon>
    </button>
  </ng-template>

</div>
<div class="modal-footer">
  <button type="button" class="btn btn-dark" (click)="closeModal()">
    &times; Cerrar
  </button>
</div>
