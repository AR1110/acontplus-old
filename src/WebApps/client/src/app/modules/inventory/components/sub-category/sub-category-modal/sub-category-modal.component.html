<form>
  <div class="modal-header">
    <h4 class="modal-title">{{ titleModal }}</h4>
    <button
      type="button"
      class="btn-close"
      aria-label="Close"
      (click)="closeModal()"
    ></button>
  </div>
  <div class="modal-body">
    <div class="form-group">
      <label for="category">Categoria: </label>
      <select name="category" id="category" class="form-select">
        <option value=""></option>
      </select>
    </div>
    <div class="form-group">
      <label for="description"
        >Descripción: <span class="text-danger">*</span>
      </label>
      <input name="description" id="description" class="form-control" />
    </div>
    <div class="row">
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="siglas"
            >Siglas: <span class="text-danger">*</span>
          </label>
          <input name="siglas" id="siglas" class="form-control" />
        </div>
      </div>
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="montoObjetivo"
            >Monto objetivo: <span class="text-danger">*</span>
          </label>
          <input
            type="number"
            name="montoObjetivo"
            id="montoObjetivo"
            class="form-control"
          />
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="sequential"
            >Secuencia: <span class="text-danger">*</span>
          </label>
          <input
            type="number"
            name="sequential"
            id="sequential"
            class="form-control"
          />
        </div>
      </div>
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
        <ngx-file-drop
          dropZoneLabel="Drop files here (max file 2 MB)"
    (onFileDrop)="dropped($event)"
    (onFileOver)="fileOver($event)"
    (onFileLeave)="fileLeave($event)"
    [showBrowseBtn]="true"
    browseBtnLabel="Browse files"
    browseBtnClassName="btn btn-primary m-2"
    dropZoneClassName="my-style"
        >
          <div class="text-center">
            <h3>Drop your file here</h3>
          </div>
        </ngx-file-drop>
        <div *ngIf="croppedImage" class="mt-3">
          <img [src]="croppedImage" alt="Cropped Image" class="img-fluid" />
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="submit" class="btn btn-success">Guardar</button>
    <button type="button" class="btn btn-dark" (click)="closeModal()">
      Cerrar
    </button>
  </div>
</form>
