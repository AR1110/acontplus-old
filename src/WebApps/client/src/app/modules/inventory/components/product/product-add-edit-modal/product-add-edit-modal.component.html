<div class="modal-header">
  	<h4 class="modal-title">{{titleModal}}</h4>
		<button type="button" class="btn-close" aria-label="Close" (click)="closeModal()"></button>
</div>

<div class="modal-body">

   <ul class="nav nav-tabs">
      <li class="nav-item" style="cursor: pointer;">
        <a class="nav-link" [class.active]="selectedTab() === 0" (click)="selectTab(0)">Generales</a>
      </li>
      <li class="nav-item"  style="cursor: pointer;">
        <a class="nav-link" [class.active]="selectedTab() === 1" (click)="selectTab(1)">Datos Adicionales</a>
      </li>

      <li class="nav-item" style="cursor: pointer;">
        <a class="nav-link" [class.active]="selectedTab() === 2" (click)="selectTab(2)">Código de Barras</a>
      </li>
      <li class="nav-item" style="cursor: pointer;">
        <a class="nav-link" [class.active]="selectedTab() === 3" (click)="selectTab(3)">Ubicación</a>
      </li>

    </ul>

    <div class="tab-content mt-3">
      @if(selectedTab()===0){
        <div class="row">
          <div class="colxl-6 col-lg-6 col-md-6 col-12">
            <div class="form-group">
              <label for="description">Descripción: <span class="text-danger">*</span></label>
              <input type="text" class="form-control" placeholder="..." [(ngModel)]="data.descripcion" appToUpperCase />
            </div>
          </div>
          <div class="colxl-6 col-lg-6 col-md-6 col-12">
            <form [formGroup]="subCategoryForm">

              <div class="form-group">
                <label>Ciudad</label>
                <input type="text" matInput class="form-control" formControlName="subCategoryGroup" placeholder="Ej: Mouse..."
                  [matAutocomplete]="autoGroup">
                <mat-autocomplete #autoGroup="matAutocomplete">
                  @for (group of subCategoriesGroupOptions | async ; track group) {
                  <mat-optgroup style="font-weight: 700;" [label]="group.provincia">
                    @for (name of group.ciudades; track $index) {
                    <mat-option [value]="name.descripcion">{{name.descripcion}}</mat-option>
                    }
                  </mat-optgroup>
                  }
                </mat-autocomplete>
              </div>
            </form>

            <div class="form-group">
              <label for="subcategoría">SubCategoría: <span class="text-danger">*</span></label>

              <div class="input-group">
                <select id="subcategoría" class="form-select" name="subcategoría">
                  <!-- @for (group of groupedArrayCategories; track $index) {
                            <optgroup [attr.label]="group.category">
                              @for (item of group.subCategories; track $index) {
                              <option [value]="item.idSubFamilia">
                                {{ item.subFamilia }}
                              </option>
                              }
                            </optgroup>
                            } -->
                </select>

                <button class="btn btn-outline-secondary btn-sm" type="button" tabindex="-1">
                  <fa-icon [icon]="'plus'"></fa-icon>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
            <div class="row">
              <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
                <div class="form-group">
                  <label for="codigo">Código: <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" placeholder="Ej: COM050" />
                </div>
              </div>

              <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
                <div class="form-group">
                  <label for="codigoAuxiliar">Código Aux: </label>
                  <input type="text" class="form-control" placeholder="Ej: COM050" />
                </div>
              </div>

              <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 col-12">
                <div class="form-group">
                  <label for="codigoBarra">Código de Barra: <span class="text-danger">*</span>
                  </label>

                  <input type="text" class="form-control" ng-model="data.codigoBarra" touppercase placeholder="H20089" />
                </div>
              </div>
            </div>
          </div>

          <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
            <div class="row">
              <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
                <div class="form-group">
                  <label for="">Tipo Artículo: <span class="text-danger">*</span>
                  </label>
                  <select class="form-select">
                    @for (item of tiposArticulo; track $index) {
                    <option [value]="item.idTipoArticulo">
                      {{ item.descripcion }}
                    </option>
                    }
                  </select>
                </div>
              </div>

              <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">
                <div class="form-group">
                  <label for="medida">Medida: <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <select class="form-select">
                      @for (item of medidas; track $index) {
                      <option [value]="item.idMedida">
                        {{ item.descripcion }}
                      </option>
                      }
                    </select>

                    <button class="btn btn-outline-secondary btn-sm" appMeasureAddEdit results="resultModalMedida(item)"
                      tabindex="-1">
                      <fa-icon [icon]="'plus'"></fa-icon>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="row" ng-show="tipoRegistro === 1">
          <div class="form-group col-lg-2 col-md-6 col-sm-6 col-12">
            <label for="tipoIVA">Tipo Iva: <span class="text-danger">*</span> </label>
            <select class="form-select" ng-change="recalculateTarifaAdd()" ng-disabled="!articlePermission.isUpdatePrice">
              @for (item of tiposIva; track $index) {
              <option [value]="item.idTipoIva">{{ item.descripcion }}</option>
              }
            </select>
          </div>
          <div class="col-lg-2 col-md-6 col-sm-6 col-xs-6">
            <div class="form-group">
              <label for="">Precio Costo: <span class="text-danger">*</span></label>
              <input type="number" class="form-control" decimal ng-focus="delayFocus('.precioCosto')"
                ng-model="data.precioCosto" ng-blur="redondearPrecioCosto()" ng-change="recalculateTarifaAdd()"
                placeholder="0.00" />
            </div>
          </div>
          <div class="form-group col-lg-2 col-md-6 col-sm-6 col-xs-6">
            <label for="">Precio Sin Subsidio:</label>
            <input type="number" class="form-control" decimal placeholder="0.00" />
          </div>
          <div class="col-lg-2 col-md-6 col-sm-6 col-12">
            <div class="row align-items-center">
              <div class="col-12"></div>
              <div class="col-12"></div>
            </div>
          </div>
          <div class="col-lg-2 col-md-3 col-sm-6 col-12">
            <div class="form-group text-center">
              <label>Adicionales: </label>
            </div>
          </div>
          <div class="col-lg-2 col-md-3 col-sm-6 col-12">
            <!-- @if (dataForm.get('datosAdicionales')?.value) {
                      <div class="form-group">
                        <label>Etiqueta: </label>
                        <select
                          class="form-control "

                        >
                          @for (item of etiquetaActividades; track $index) {
                          <option [value]="item.idEtiqueta">
                            {{ item.descripcion }}
                          </option>
                          }
                        </select>
                      </div>
                      } -->
          </div>
        </div>

        <div class="row">
          <div class="col-lg-10 col-12">

          </div>
        </div>
      }

    </div>

</div>

<div class="modal-footer">
  <button type="button" class="btn btn-success">
    {{btnText}}
  </button>
  <button type="button" class="btn btn-dark">
    &times; Cerrar
  </button>

</div>
