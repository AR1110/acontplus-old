<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">{{titleModal()}} Etiqueta</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="modal.close()"></button>

</div>
<div class="modal-body">

  <div class="form-group ">
    <label for="">Descripción: <span class="text-danger">*</span> </label>
    <input type="text" [(ngModel)]="data.descripcion" appToUpperCase class="form-control border-select"
      placeholder="Ej: MOTO">
  </div>

  <div class="form-group">
    <app-m3-input-chip [chips]="etiquetas" [labelText]="'Etiquetas'" />
  </div>

  @if(data.idEtiqueta>0 ){
  <div class="row">
    <div class="col-lg-6 col-md-6 col-sm-6 col-xs-6">
      <div class="icheck-primary">
        <input type="radio" [(ngModel)]="data.estado" [value]="true" id="someRadioId1" name="someGroupName" />
        <label for="someRadioId1">Activo</label>
      </div>
    </div>
    <div class="col-6 col-md-6 col-sm-6 col-xs-6 text-right">
      <div class="icheck-primary">
        <input type="radio" [(ngModel)]="data.estado" [value]="false" id="someRadioId2" name="someGroupName" />
        <label for="someRadioId2">Inactivo</label>
      </div>
    </div>
  </div>
  }

</div>
<div class="modal-footer">
  <button type="button" class="btn btn-success" (click)="save()">
    {{btnText}}
  </button>
  <button type="button" class="btn btn-dark" (click)="modal.close()">&times; Cerrar</button>
</div>
