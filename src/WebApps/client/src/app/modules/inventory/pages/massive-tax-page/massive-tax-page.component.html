<app-breadcrumb />

<div class="card">
  <div class="card-header">
    <h3 class="card-title">{{dataForm.title}}</h3>
  </div>
  <div class="card-body text-center">
    <h5 class="card-title text-info">{{joinTaxDesc}} {{dataForm.obs}}</h5>
    <div class="row">
      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="taxRateFrom">Impuesto Inicial: <span class="text-danger">*</span></label>
          <select id="taxRateFrom" name="taxRateFrom" class="form-select" [(ngModel)]="dataForm.taxIdFrom"
            (change)="onChangeTaxFrom()" required>
            @for (item of taxRatesFrom; track $index) {
            <option [ngValue]="item.idTarifaImpuesto">{{item.descripcion}}</option>
            }
          </select>

        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">

        <div class="form-group">
          <label for="taxRateTo">Impuesto Destino: <span class="text-danger">*</span></label>
          <select id="taxRateTo" name="taxRateTo" class="form-select" [(ngModel)]="dataForm.taxIdTo" required
            (change)="onChangeTaxTo()">
            @for (item of taxRatesTo; track $index) {
            <option [ngValue]="item.idTarifaImpuesto">{{item.descripcion}}</option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12">

        <div class="form-group">
          <label for="observation">Observación: <span class="text-danger">*</span></label>
          <textarea name="observation" id="observation" [(ngModel)]="dataForm.obs" class="form-control">

          </textarea>
        </div>
      </div>
    </div>
  </div>
  <div class="card-footer text-center">
    <button type="button" class="btn btn-info text-white" (click)="askToSave()">Cambiar</button>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>Op.</th>
            <th>Nro.</th>
            <th>Cantidad</th>
            <th>Observación</th>
            <th>Fecha Registro</th>
            <th>Usuario</th>
          </tr>
        </thead>
        <tbody>
          @for (item of histories; track $index) {
          <tr>
            <td></td>
            <td>{{$index+1}}</td>
            <td>{{item.quantity}}</td>
            <td>{{item.obs}}</td>
            <td>{{item.createAt}}</td>
            <td>{{item.user}}</td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
