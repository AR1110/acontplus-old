<app-breadcrumb />

<div class="card">
  <div class="card-body">
    <div class="row justify-content-between">
      <div class="col-xl-2 col-lg-2 col-md-6 col-sm-6 col-12">
        <select name="tipoArticulo" id="tipoArticulo" class="form-select" [(ngModel)]="mainForm.tipo">
          @for (item of tiposArticulo; track $index) {
            <option [ngValue]="item.code">{{item.description}}</option>
          }
        </select>
      </div>
      @for (item of catalogs; track $index) {
      <div class="col-xl-2 col-lg-2 col-md-6 col-sm-6 col-12">
        <div class="icheck-primary">
          <input type="radio" [id]="item.code" [value]="item.code" name="someGroupCatalogo"
            [(ngModel)]="mainForm.opcion" />
          <label [for]="item.code">{{item.description}}</label>
        </div>
      </div>
      }
    </div>
    <hr>
    <div class="row">
      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-6 col-12">
        <div class="form-group">
          <label for="subFamilias">SubFamilias</label>
          <app-sub-category-select-multiple
          [checkedSubCategorias]="checkedSubCategorias"
          [subCategorias]="subCategorias" />
        </div>
      </div>
      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-6 col-12">

        <div class="form-group">
          <label>Artículo: </label>
          <app-product-search [props]="productSearchProps" (onProductSelected)="onProductSelected($event)"
            (emptyInput)="productResultEmptyInput($event)" />
        </div>
      </div>
      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-6 col-12">

        <div class="form-group">
          <label for="supplierSearch">Proveedor</label>
          <app-supplier-search [isSearchSimple]="isSearchSupplierSimple"
            (onSupplierSelected)="onSupplierSelected($event)"
            (emptyInput)="supplierResultEmptyInput($event)"></app-supplier-search>
        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-6 col-12"></div>
    </div>
    <div class="row">
      <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="nroDocumento">N° de Documento:</label>
          <input type="text" class="form-control" [(ngModel)]="mainForm.nroDocumento" pattern="[0-9]{3}-[0-9]{3}-[0-9]*" placeholder="000-000-XXXXXXXXXXX"
            title="Formato: 000-000-XXXXXXXXXXX"
            oninput="this.value=this.value.replace(/[^0-9-]/g,'').replace(/(\d{3})-?(\d{3})-?(.*)/, '$1-$2-$3')">
        </div>
      </div>
      <div
        class="col-xl-2 col-lg-2 col-md-2 col-sm-6 col-12 d-flex align-items-center justify-content-center mt-xl-3 mtlg-3 mt-md-3">
        <button type="button" class="btn btn-info" (click)="toSearch()">
          <fa-icon [icon]="'search'"></fa-icon> Buscar
        </button>
      </div>
    </div>
    <hr>
    <div class="row">
      <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6 col-12">
        <div class="form-froup">
          <label for="optionCalculate">Opción de cálculo: <span class="text-danger">*</span></label>
          <select name="optionCalculate" id="optionCalculate" class="form-select"
            [(ngModel)]="mainForm.optionToCalculate">
            @for (item of optionsCalculate; track $index) {
            <option [ngValue]="item.code">{{item.description}}</option>
            }
          </select>
        </div>
      </div>

      <div class="col-xl-2 col-lg-2 col-md-2 col-sm-6 col-12">
        <div class="form-froup">
          <label for="optionCalculate">Tarifa: <span class="text-danger">*</span></label>
          <mat-select [formControl]="tarifasSelected" multiple class="form-select">
            @for (item of tarifas; track $index) {
            <mat-option [value]="item.idTarifa">{{item.descripcion}}</mat-option>
            }
          </mat-select>
        </div>
      </div>
      <div class="col-xl-2 col-lg-2 col-md-2 col-sm-6 col-12">
        <div class="form-froup">
          <label for="optionPvp">Opción PVP: <span class="text-danger">*</span></label>
          <select name="optionPvp" id="optionPvp" class="form-select" [(ngModel)]="optionPvp">
            @for (item of optionsPvps; track $index) {
            <option [ngValue]="item.code">{{item.description}}</option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-3 col-sm-6 col-12">
        <div class="form-group">
          <label for="inputValueCalculate">Valor/Porcentaje: <span class="text-danger">*</span></label>
          <div class="input-group">
            <input type="number" name="inputValueCalculate" id="inputValueCalculate"
              [(ngModel)]="mainForm.valueToCalculate" class="form-control">
            <button type="button" class="btn btn-outline-info"  (click)="calculate()">Calcular</button>
            <button type="button" class="btn btn-outline-danger"  ngbTooltip="Deshacer cambios"
              (click)="refreshToNestedProducts()">
                <fa-icon [icon]="'undo-alt'"></fa-icon>
            </button>
          </div>

        </div>
      </div>
      <div class="col-xl-2 col-lg-2 col-md-2 col-sm-6 col-12 d-flex align-items-center justify-content-center mt-xl-3 mtlg-3 mt-md-3">
        <button type="button" class="btn btn-success" (click)="askToSave()">
          Guardar
        </button>
      </div>

    </div>
    <div class="mt-2">
      <app-tabulator
      [columnNames]="columns"
      [dataTree]="true"
      [tableData]="nestedProducts"
        [dataTreeStartExpanded]="true"
        (cellEdited)="cellEdited($event)"
        (cellClick)="cellClick($event)"
        height="400px" />
    </div>
  </div>
</div>
