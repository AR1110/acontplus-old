<app-breadcrumb [crear]="true">
  <button
    type="button"
    class="btn btn-info d-none d-lg-block m-l-15 text-white"
    appProductAddEdit
  >
    <fa-icon [icon]="'plus'"></fa-icon> Nuevo
  </button>

   <button
    type="button"
    class="btn btn-info d-none d-lg-block m-l-15 text-white"
    appSubCategoryModal
  >
    <fa-icon [icon]="'plus'"></fa-icon> Nuevo
  </button>

</app-breadcrumb>

<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="category">Categoría: </label>
          <select name="category" id="category" class="form-select">
            <option value="">Todos</option>
            @for (item of subCategorias; track $index) {
            <option [ngValue]="item.idSubFamilia">
              {{ item.descripcion }}
            </option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="measure">Medida: </label>
          <select name="measure" id="measure" class="form-select">
            <option value="">Todos</option>
            @for (item of measures; track $index) {
            <option [ngValue]="item.idMedida">
              {{ item.descripcion }}
            </option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="brand">Marca: </label>
          <select name="brand" id="brand" class="form-select">
            <option value="">Todos</option>
            @for (item of subCategorias; track $index) {
            <option [ngValue]="item.idSubFamilia">
              {{ item.descripcion }}
            </option>
            }
          </select>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <section class="section-container-table">
      <table mat-table [dataSource]="dataSource" matSort>
        <!-- Options -->
        <ng-container matColumnDef="op">
          <th mat-header-cell *matHeaderCellDef>Op.</th>
          <td mat-cell *matCellDef="let element">
            <div ngbDropdown container="body">
              <button
                type="button"
                class="btn btn-outline-primary btn-sm"
                ngbDropdownToggle
              >
                <fa-icon [icon]="'cog'"></fa-icon>
              </button>
              <div ngbDropdownMenu>
                <button ngbDropdownItem>
                  <fa-icon [icon]="'edit'"></fa-icon>
                  Editar
                </button>

                <button ngbDropdownItem>
                  <fa-icon [icon]="'trash'"></fa-icon>
                  Eliminar
                </button>
              </div>
            </div>
          </td>
        </ng-container>

        <!-- Position Column -->
        <ng-container matColumnDef="position">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nro.</th>
          <td mat-cell *matCellDef="let element">{{ element.position }}</td>
        </ng-container>

        <!-- IDCard Column -->
        <ng-container matColumnDef="s3ObjectUrl">
          <th mat-header-cell *matHeaderCellDef>Imagen</th>
          <td mat-cell *matCellDef="let element">
            <img
              class="img-fluid img-thumbnail"
              width="50"
              [src]="element.s3ObjectUrl"
            />
          </td>
        </ng-container>

        <!-- businessName Column -->
        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Código</th>
          <td mat-cell *matCellDef="let element">
            {{ element.codigo }}
          </td>
        </ng-container>

        <!-- tradeName Column -->
        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
          <td mat-cell *matCellDef="let element">
            {{ element.descripcion }}
          </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="medida">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Medida</th>
          <td mat-cell *matCellDef="let element">{{ element.medida }}</td>
        </ng-container>

        <!-- Address Column -->
        <ng-container matColumnDef="subFamilia">
          <th mat-header-cell *matHeaderCellDef>Subfamilia</th>
          <td mat-cell *matCellDef="let element">{{ element.subFamilia }}</td>
        </ng-container>

        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef>Stock</th>
          <td mat-cell *matCellDef="let element">{{ element.stock }}</td>
        </ng-container>

        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let element">{{ element.address }}</td>
        </ng-container>
        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns; sticky: true"
        ></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="7">
            <!-- No data matching the filter {{ input.value }} -->
          </td>
        </tr>
      </table>
    </section>
    <mat-paginator
      [pageSizeOptions]="pagination.pageSizeOptions"
      showFirstLastButtons
      aria-label="Select page of enterprises elements"
    >
    </mat-paginator>
  </div>
</div>
