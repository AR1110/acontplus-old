<app-breadcrumb/>
<app-product-search></app-product-search>

<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="col-md-2 col-12">
        <button
          appProductAddEdit
          class="btn btn-info d-none d-lg-block m-l-15 text-white"
          type="button"
        >
          <fa-icon [icon]="'plus'"></fa-icon>
          Nuevo
        </button>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="category">Categoría: </label>
          <select class="form-select" id="category" name="category">
            <option value="">Todos</option>
            @for (item of subCategorias; track $index) {
              <option [ngValue]="item.idSubFamilia">
                {{ item.descripcion }}
              </option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="measure">Medida: </label>
          <select class="form-select" id="measure" name="measure">
            <option value="">Todos</option>
            @for (item of measures; track $index) {
              <option [ngValue]="item.idMedida">
                {{ item.descripcion }}
              </option>
            }
          </select>
        </div>
      </div>
      <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
        <div class="form-group">
          <label for="brand">Marca: </label>
          <select class="form-select" id="brand" name="brand">
            <option value="">Todos</option>
            @for (item of subCategorias; track $index) {
              <option [ngValue]="item.idSubFamilia">
                {{ item.descripcion }}
              </option>
            }
          </select>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <section class="section-container-table">
      <table [dataSource]="dataSource" mat-table matSort>
        <!-- Options -->
        <ng-container matColumnDef="op">
          <th *matHeaderCellDef mat-header-cell>Op.</th>
          <td *matCellDef="let element" mat-cell>
            <div container="body" ngbDropdown>
              <button
                class="btn btn-outline-primary btn-sm"
                ngbDropdownToggle
                type="button"
              >
                <fa-icon [icon]="'cog'"></fa-icon>
              </button>
              <div ngbDropdownMenu>
                <button ngbDropdownItem>
                  <fa-icon [icon]="'edit'"></fa-icon>
                  Editar
                </button>

                <button ngbDropdownItem>
                  <fa-icon [icon]="'trash'"></fa-icon>
                  Eliminar
                </button>
              </div>
            </div>
          </td>
        </ng-container>

        <!-- Position Column -->
        <ng-container matColumnDef="position">
          <th *matHeaderCellDef mat-header-cell mat-sort-header>Nro.</th>
          <td *matCellDef="let element" mat-cell>{{ element.position }}</td>
        </ng-container>

        <!-- IDCard Column -->
        <ng-container matColumnDef="s3ObjectUrl">
          <th *matHeaderCellDef mat-header-cell>Imagen</th>
          <td *matCellDef="let element" mat-cell>
            <img
              [src]="element.s3ObjectUrl"
              class="img-fluid img-thumbnail"
              width="50"
            />
          </td>
        </ng-container>

        <!-- businessName Column -->
        <ng-container matColumnDef="codigo">
          <th *matHeaderCellDef mat-header-cell mat-sort-header>Código</th>
          <td *matCellDef="let element" mat-cell>
            {{ element.codigo }}
          </td>
        </ng-container>

        <!-- tradeName Column -->
        <ng-container matColumnDef="descripcion">
          <th *matHeaderCellDef mat-header-cell mat-sort-header>Descripción</th>
          <td *matCellDef="let element" mat-cell>
            {{ element.descripcion }}
          </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="medida">
          <th *matHeaderCellDef mat-header-cell mat-sort-header>Medida</th>
          <td *matCellDef="let element" mat-cell>{{ element.medida }}</td>
        </ng-container>

        <!-- Address Column -->
        <ng-container matColumnDef="subFamilia">
          <th *matHeaderCellDef mat-header-cell>Subfamilia</th>
          <td *matCellDef="let element" mat-cell>{{ element.subFamilia }}</td>
        </ng-container>

        <ng-container matColumnDef="stock">
          <th *matHeaderCellDef mat-header-cell>Stock</th>
          <td *matCellDef="let element" mat-cell>{{ element.stock }}</td>
        </ng-container>

        <ng-container matColumnDef="estado">
          <th *matHeaderCellDef mat-header-cell>Estado</th>
          <td *matCellDef="let element" mat-cell>{{ element.address }}</td>
        </ng-container>
        <tr
          *matHeaderRowDef="displayedColumns; sticky: true"
          mat-header-row
        ></tr>
        <tr *matRowDef="let row; columns: displayedColumns" mat-row></tr>

        <!-- Row shown when there is no matching data. -->
        <tr *matNoDataRow class="mat-row">
          <td class="mat-cell" colspan="7">
            <!-- No data matching the filter {{ input.value }} -->
          </td>
        </tr>
      </table>
    </section>
    <mat-paginator
      [pageSizeOptions]="pagination.pageSizeOptions"
      aria-label="Select page of enterprises elements"
      showFirstLastButtons
    >
    </mat-paginator>
  </div>
</div>
