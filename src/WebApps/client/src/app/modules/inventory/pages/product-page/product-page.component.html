<app-breadcrumb/>




<mat-card>
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title></mat-card-title>
      <div class="d-flex flex-row gap-2">
        <button mat-flat-button appProductAddEdit (onResultModal)="refresh()">
          <mat-icon>add</mat-icon>
          Nuevo
        </button>
        <button mat-icon-button (click)="refresh()">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-content>
    <!-- setting outline form field appearance -->
    <app-custom-table-container [pagination]="pagination()" [isLoadingResults]="isLoadingResults"
      (onPageEvent)="handlePageEvent($event)">
      <table mat-table [dataSource]="dataSource" matSort matSortActive="descripcion" matSortDisableClear
        matSortDirection="desc">
        <!-- Number Column -->
        <ng-container matColumnDef="index">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let element; let i = index">
            {{ i + 1 }}
          </td>
        </ng-container>

        <ng-container matColumnDef="op">
          <th mat-header-cell *matHeaderCellDef>Op.</th>
          <td mat-cell *matCellDef="let row">
            <div class="d-flex flex-row gap-1">
              <button mat-icon-button [matMenuTriggerFor]="menu" aria-hidden="false">
                <mat-icon>more_vert</mat-icon>
              </button>

              <mat-menu #menu="matMenu">

                <button mat-menu-item  >
                  <mat-icon>update</mat-icon>
                  <span>Actualizar Stock</span>
                </button>
                <button mat-menu-item>
                  <mat-icon>delete</mat-icon>
                  <span>Eliminar</span>
                </button>

                <button mat-menu-item (click)="onPhotoModal(row)">
                  <mat-icon>add_a_photo</mat-icon>
                  <span>Imagenes</span>
                </button>

                <button mat-menu-item>
                  <mat-icon>history</mat-icon>
                  <span>Historial compras</span>
                </button>





              </mat-menu>

              <button mat-icon-button  >
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button  >
                <mat-icon>timeline</mat-icon>
              </button>
            </div>

          </td>
        </ng-container>


        <!-- IDCard Column -->
        <ng-container matColumnDef="s3ObjectUrl">
          <th *matHeaderCellDef mat-header-cell>Imagen</th>
          <td *matCellDef="let element" mat-cell>
            <img [src]="element.s3ObjectUrl" class="img-fluid img-thumbnail" width="50" />
          </td>
        </ng-container>

        <!-- businessName Column -->
        <ng-container matColumnDef="codigo">
          <th *matHeaderCellDef mat-header-cell mat-sort-header>Código</th>
          <td *matCellDef="let element" mat-cell>
            {{ element.codigo }}
          </td>
        </ng-container>

        <!-- tradeName Column -->
        <ng-container matColumnDef="descripcion">
          <th *matHeaderCellDef mat-header-cell mat-sort-header>Descripción</th>
          <td *matCellDef="let element" mat-cell>
            {{ element.descripcion }}
          </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="medida">
          <th *matHeaderCellDef mat-header-cell mat-sort-header>Medida</th>
          <td *matCellDef="let element" mat-cell>{{ element.medida }}</td>
        </ng-container>

        <!-- Address Column -->
        <ng-container matColumnDef="subFamilia">
          <th *matHeaderCellDef mat-header-cell>Subfamilia</th>
          <td *matCellDef="let element" mat-cell>{{ element.subFamilia }}</td>
        </ng-container>

        <ng-container matColumnDef="stock">
          <th *matHeaderCellDef mat-header-cell>Stock</th>
          <td *matCellDef="let element" mat-cell>{{ element.stock }}</td>
        </ng-container>



        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let row">
            <div [innerHTML]="row.estado | primaryStatus"></div>
          </td>
        </ng-container>


        <tr mat-header-row *matHeaderRowDef="displayedColumns;sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </app-custom-table-container>

  </mat-card-content>
</mat-card>
