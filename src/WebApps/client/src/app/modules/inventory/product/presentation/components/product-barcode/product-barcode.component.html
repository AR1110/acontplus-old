<acp-dynamic-card>
  <div class="d-grid gap-2">
    <mat-form-field class="w-100">
      <mat-label>Descripción</mat-label>
      <textarea
        matInput
        placeholder="..."
        appToUpperCase
        [(ngModel)]="data().descripcion"
      ></textarea>
    </mat-form-field>

    <div
      class="row row-cols-xxl-3 row-cols-xl-3 row-cols-lg-3 row-cols-md-3 row-cols-sm-2 row-cols-1 g-2"
    >
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Medida: </mat-label>
          <mat-select [(ngModel)]="data().idMedida">
            @for (item of medidasArray(); track $index) {
              <mat-option [value]="item.idMedida">{{ item.descripcion }}</mat-option>
            }
          </mat-select>
          <span matSuffix>
            <button type="button" mat-icon-button (click)="refreshMedida($event)" tabindex="-1">
              <mat-icon>refresh</mat-icon>
            </button>
          </span>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="w-100">
          <mat-label>Código Barra</mat-label>
          <input matInput [(ngModel)]="data().codigoBarra" />
        </mat-form-field>
      </div>
      <div class="col">
        <div class="d-flex gap-5">
          <div class="d-flex gap-2 justify-content-center align-items-center">
            <ngx-colors (open)="openColor()" ngx-colors-trigger [(ngModel)]="data().color" />
            <span>Color</span>
            <!--            <mat-form-field>-->
            <!--              <input matInput [(ngModel)]="infrastructure().color">-->
            <!--            </mat-form-field>-->
          </div>

          <div class="hstack gap-1">
            <button type="button" mat-mini-fab aria-label="Add || Edit" (click)="save()">
              @if (productBarCodeId > 0) {
                <mat-icon>edit</mat-icon>
              } @else {
                <mat-icon>save</mat-icon>
              }
            </button>
            <button mat-mini-fab aria-label="Clear" (click)="clear()">
              <mat-icon>clear</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </div>

    <app-mat-dynamic-table
      [templateOp]="templateOp"
      [tableData]="dataSource"
      [columnDefinitions]="columnsDefs"
      [visibleColumns]="columns"
    />

    <ng-template #templateOp let-item="item">
      <div class="d-flex gap-1">
        <button type="button" mat-icon-button (click)="edit(item)">
          <mat-icon>edit</mat-icon>
        </button>
        <button type="button" mat-icon-button (click)="askToDelete(item)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </ng-template>

    <ng-template #colorTemplate let-item>
      <div
        [style.width]="'20px'"
        [style.height]="'20px'"
        [style.background-color]="item.color"
      ></div>
    </ng-template>
  </div>
</acp-dynamic-card>
