<mat-form-field class="w-100">
  <mat-label>Buscar producto:</mat-label>
  <input
    matInput
    #input
    autocomplete="off"
    cdkOverlayOrigin
    #trigger="cdkOverlayOrigin"
    (input)="applyFilter(input.value)"
    [value]="dataSearch.textSearch"
    (focus)="onFocus($event)"
    (blur)="onBlur($event)"
    (keydown)="handleKeyDown($event)"
    placeholder="Buscar producto"
  />
  <ng-container matPrefix>
    <button mat-icon-button appAddEditProduct (onResult)="resultRegistered.emit($event)">
      <mat-icon>add</mat-icon>
    </button>
  </ng-container>

  <!-- [cdkConnectedOverlayHasBackdrop]="true" -->
  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="isOverlayOpen"
    (overlayOutsideClick)="backdropClick()"
  >
    <div class="overlay-content">
      <app-product-search-list
        [tableData]="dataSource()"
        [highlightRowIndex]="highlightRowIndex"
        [isLoadingResults]="isLoadingResults()"
        [isRateLimitReached]="isRateLimitReached()"
        [pagination]="pagination"
        (rowsEmitter)="handleRows($event)"
        (handlePageEvent)="handlePageEvent($event)"
        (rowSelected)="selectRow($event)"
        (onClickPaginator)="onClickPaginator()"
      />
    </div>
  </ng-template>
</mat-form-field>
