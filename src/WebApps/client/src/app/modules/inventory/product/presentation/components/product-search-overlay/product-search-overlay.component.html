<div class="acp-suggestions-container acp-is-visible">
  <div class="overlay-container">
    <ul #filteredListElement>
      @for (item of filteredList; track item; let idx = $index){

        <li   class="acp-item">
          <!--string logic-->
          @if (isType(item)) {
            <div [class.acp-complete-selected]="idx === selectedIdx()"
                 (click)="select(item)">
              <ng-container
                *ngTemplateOutlet="itemTemplate;  context: { $implicit: item | highlight: toHighlight }">
              </ng-container>
            </div>

          }
          <!--object logic-->
          @if (!isType(item)) {
            <div [class.acp-complete-selected]="idx === selectedIdx()"
                 (click)="select(item)">
              <ng-container
                *ngTemplateOutlet="itemTemplate; context: { $implicit: item | highlight: toHighlight : searchKeyword }">
              </ng-container>
            </div>

          }
        </li>
      }
    </ul>
  </div>
</div>
