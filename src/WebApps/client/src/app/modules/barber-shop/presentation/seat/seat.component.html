<app-breadcrumb/>


<div class="d-grid gap-2">

  <app-theme-button
    [type]="'button'"
    [variant]="'success'"
    [text]="'Nuevo asiento'"
    [icon]="'add'"
  />

</div>

  <div class="container-seat">
    @for (item of [1,2,3,4,5,7];track $index){
      <app-mat-dynamic-card class="seat-card">


        <div class="seat-card__svg-container">
          <svg  xmlns="http://www.w3.org/2000/svg"
                width="24"  height="24"  viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-armchair-2 seat-card__svg">
            <path stroke="none" d="M0 0h24v24H0z"
                  fill="none"/>
            <path d="M5 10v-4a3 3 0 0 1 3 -3h8a3 3 0 0 1 3 3v4" />
            <path d="M16 15v-2a3 3 0 1 1 3 3v3h-14v-3a3 3 0 1 1 3 -3v2" />
            <path d="M8 12h8" /><path d="M7 19v2" />
            <path d="M17 19v2" />
          </svg>
        </div>

        <div class="seat-card__info">
          <h3 class="seat-card__title">Asiento 2</h3>
        </div>

      </app-mat-dynamic-card>

    }

  </div>
