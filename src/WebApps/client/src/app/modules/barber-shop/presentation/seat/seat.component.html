<app-breadcrumb/>


<div class="d-grid gap-2">

  <app-theme-button
    [type]="'button'"
    [variant]="'success'"
    [text]="'Nuevo asiento'"
    [icon]="'add'"
    (handleClick)="openAddEdit()"
  />

</div>

  <div class="container-seat">
    @for (item of dataSource();track $index){
      <div class="seat-card">

        <div class="seat-icon">🪑</div>
        <div class="seat-number">{{ item.name }}  </div>
        <div class="seat-name">3</div>
        <div class="seat-actions">
          <app-theme-button
            [type]="'button'"
            [variant]="'success'"
            [text]="'Nuevo asiento'"
           icon="edit"
            matStyle="icon"
            (handleClick)="openAddEdit()"
          />
          <app-theme-button
            [type]="'button'"
            variant="danger"
            text="Eliminar"
            icon="delete"
            matStyle="icon"
            (handleClick)="openAddEdit()"
          />
        </div>

      </div>

    }

  </div>
