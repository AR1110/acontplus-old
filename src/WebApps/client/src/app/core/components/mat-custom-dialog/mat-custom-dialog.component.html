@if (showHeader()) {
  <div class="m3-dialog-header">
    <h6
      mat-dialog-title
      cdkDrag
      cdkDragRootElement=".cdk-overlay-pane"
      cdkDragHandle
      (mousedown)="toTop(unique)"
    >
      @if (icon()) {
        <mat-icon aria-hidden="false" aria-label="Dialog Icon" fontIcon="{{ icon() }}" />
      }

      {{ title() }}

      <button type="button" mat-icon-button class="close-button" (click)="close.emit()">
        <mat-icon>close</mat-icon>
      </button>
    </h6>
  </div>
}

<mat-dialog-content class="mat-typography">
  @if (loading()) {
    <div class="loading-overlay">
      <mat-spinner />
    </div>
  }
  <ng-container *ngTemplateOutlet="containerTemplate" />
  <ng-content select="content" />
</mat-dialog-content>
<mat-dialog-actions [align]="align()">
  <ng-container *ngTemplateOutlet="actionsTemplate" />
  <ng-content select="actions" />

  @if (this.options().showButtonClose) {
    <acp-button
      variant="dark"
      icon="close"
      ariaLabel="Close Dialog Button"
      text="Cerrar"

      (handleClick)="close.emit()"
    />
  }
</mat-dialog-actions>
