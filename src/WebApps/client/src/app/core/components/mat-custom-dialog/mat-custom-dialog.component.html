@if (showHeader()) {
  <div class="m3-dialog-header">
    <h6 mat-dialog-title cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle (mousedown)="toTop(unique)">
      @if (icon()) {
        <mat-icon aria-hidden="false" aria-label="Dialog Icon" fontIcon="{{ icon() }}"></mat-icon>
      }

      {{ title() }}

      <button type="button" mat-icon-button class="close-button" (click)="close.emit()">
        <mat-icon>close</mat-icon>
      </button>
    </h6>
  </div>
}

<mat-dialog-content class="mat-typography">
  @if (loading()) {
    <div class="loading-overlay">
      <mat-spinner></mat-spinner>
    </div>
  }
  <ng-container *ngTemplateOutlet="containerTemplate"></ng-container>
  <ng-content select="content"></ng-content>
</mat-dialog-content>
<mat-dialog-actions [align]="align()">
  <ng-container *ngTemplateOutlet="actionsTemplate"></ng-container>
  <ng-content select="actions"></ng-content>

  @if (this.options().showButtonClose) {
    <app-theme-button
      variant="dark"
      icon="close"
      ariaLabel="Close Dialog Button"
      text="Cerrar"
      matStyle="basic"
      (handleClick)="close.emit()"
    />
  }
</mat-dialog-actions>
