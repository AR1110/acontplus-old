@if (isSearchSimple) {
<input
  id="typeahead-supplier"
  type="text"
  class="form-control form-control-border"
  [(ngModel)]="textSearch"
  [ngbTypeahead]="search"
  [resultTemplate]="rt"
  (selectItem)="onSelect($event)"
  onclick="select();"
/>
} @else {
<div class="input-group">
  <input
    id="typeahead-supplier"
    type="text"
    class="form-control"
    [(ngModel)]="textSearch"
    [ngbTypeahead]="search"
    [resultTemplate]="rt"
    (selectItem)="onSelect($event)"
    onclick="select();"
  />

  <button type="button" class="btn btn-outline-secondary btn-sm" (click)="openModal()">
    <fa-icon [icon]="'plus'"></fa-icon>
  </button>
  @if (dataSearch.idCliente > 0) {
  <button type="button" class="btn btn-outline-secondary btn-sm" (click)="openModal()">
    <fa-icon [icon]="'edit'"></fa-icon>
  </button>
  }
  <button type="button" class="btn btn-outline-secondary btn-sm">
    <fa-icon [icon]="'search'"></fa-icon>
  </button>
</div>
}

<ng-template #rt let-r="result" let-t="term">
  <ngb-highlight
    [result]="r.numeroIdentificacion + ' - ' + r.nombreFiscal"
    [term]="t"
  />
</ng-template>
