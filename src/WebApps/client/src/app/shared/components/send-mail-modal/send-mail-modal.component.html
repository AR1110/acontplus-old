<div class="modal-header">
  <h4 class="modal-title"><i class="mdi mdi-email"></i> Reenvío de Correo</h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="modal.close()"
  ></button>
</div>
<div class="modal-body">
  <div class="form-group">
    <label> Ingrese el o los correos destinatarios </label>
    @for (item of emails; track $index) {
      <div class="input-group mb-3">
        <input
          type="email"
          [id]="'email' + $index"
          [name]="'email' + $index"
          class="form-control"
          autocomplete="off"
          [(ngModel)]="emails[$index]"
          placeholder="Ingrese un email"
        />

        @if (emails.length !== 1) {
          <button
            class="btn btn-danger btn-sm"
            type="button"
            (click)="removeEmail($index)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        }

        @if (lastIndex === $index) {
          <button
            class="btn btn-primary btn-sm"
            type="button"
            (click)="addEmail()"
          >
            <mat-icon>add</mat-icon>
          </button>
        }
      </div>
    }
  </div>
</div>
<div class="modal-footer">
  <button mat-raised-button type="button" (click)="send()">
    <mat-icon>email</mat-icon> Enviar
  </button>
  <button class="btn btn-dark" type="button" (click)="modal.close()">
    &times; Cerrar
  </button>
</div>
