<div class="modal-header">
  <h4 class="modal-title"><i class="mdi mdi-email"></i> Reenvío de Correo</h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="modal.close()"
  ></button>
</div>
<div class="modal-body">
  <div class="form-group">
    <label> Ingrese el o los correos destinatarios </label>
    @for (item of emails; track $index) {
      <div class="input-group mb-3">
        <input
          type="email"
          [id]="'email' + $index"
          [name]="'email' + $index"
          class="form-control"
          autocomplete="off"
          [(ngModel)]="emails[$index]"
          placeholder="Ingrese un email"
        />

        @if (emails.length !== 1) {
          <app-theme-button
            variant="danger"
            icon="delete"
            matStyle="icon"
            (click)="removeEmail($index)"
          >
          </app-theme-button>
        }

        @if (lastIndex === $index) {
          <app-theme-button
            icon="add"
            matStyle="icon"
            text="Añadir Nuevo"
            (click)="addEmail()"
          >
          </app-theme-button>
        }
      </div>
    }
  </div>
</div>
<div class="modal-footer">
  <app-theme-button
    variant="success"
    icon="emal"
    text="Cancelar"
    (handleClick)="send()"
  >
  </app-theme-button
  ><app-theme-button
    variant="dark"
    icon="close"
    text="Cancelar"
    (handleClick)="modal.close()"
  >
  </app-theme-button>
</div>
