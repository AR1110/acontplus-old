<form id="sendMailForm" (ngSubmit)="send()">
  <app-mat-custom-dialog
    [containerTemplate]="containerTemplate"
    [actionsTemplate]="actionsTemplate"
    icon="email"
    title="Enviar Correo"
    (close)="onClose()"
  />
</form>

<ng-template #containerTemplate>
  <acp-input-chip [labelText]="'Correo'" [chips]="emails()" />
</ng-template>
<ng-template #actionsTemplate>
  <acp-button type="submit" variant="success" icon="email" text="Enviar" form="sendMailForm" />
</ng-template>
