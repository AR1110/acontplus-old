<div class="container-fluid">
  <form [formGroup]="filterForm">
    <div class="row">
      <div class="col-xl-7 col-lg-7 col-md-6 col-sm-12 col-12">
        <div class="row">
          <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Establecimiento</mat-label>
              <mat-select
                formControlName="codEstab"
                (selectionChange)="onEstabChange()"
              >
                <mat-option
                  *ngFor="let item of establecimientos"
                  [value]="item.codEstab"
                >
                  {{ item.nombreComercial }}
                </mat-option>
              </mat-select>
              <mat-error
                *ngIf="
                  filterForm.get('codEstab')?.invalid &&
                  filterForm.get('codEstab')?.touched
                "
              >
                Campo requerido
              </mat-error>
            </mat-form-field>
          </div>

          <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
            <div class="d-flex flex-column">
              <div class="d-flex align-items-center">
                <mat-checkbox
                  formControlName="checkBoxFecha"
                  [disabled]="filterForm.get('idCliente')?.value <= 0"
                  color="primary"
                  class="mr-2"
                >
                </mat-checkbox>

                <app-date-range-selection></app-date-range-selection>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-xl-5 col-lg-5 col-md-6 col-sm-12 col-12">
        <div class="row">
          <div class="col-xl-9 col-lg-9 col-md-12 col-sm-12 col-12">
            <mat-form-field appearance="outline" class="w-100">
              <app-company-customer-search></app-company-customer-search>
            </mat-form-field>
          </div>

          <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 col-12">
            <div class="d-flex align-items-end h-100 mb-3">
              <button
                mat-icon-button
                color="primary"
                matTooltip="Más opciones"
                (click)="onMoreOptionsClick()"
              >
                <mat-icon>visibility</mat-icon>
              </button>
              <button
                mat-icon-button
                color="accent"
                matTooltip="Recargar"
                (click)="reload()"
              >
                <mat-icon>refresh</mat-icon>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Additional options section -->
    <div class="row" *ngIf="showMoreOptions">
      <div class="col-xl-2 col-lg-2 col-md-12 col-sm-12 col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Punto de Emisión</mat-label>
          <mat-select
            formControlName="idPuntoEmision"
            (selectionChange)="reload()"
          >
            <mat-option
              *ngFor="let item of puntosEmision"
              [value]="item.idPuntoEmision"
            >
              {{ item.ptoEmi }}
            </mat-option>
          </mat-select>
          <mat-error
            *ngIf="
              filterForm.get('idPuntoEmision')?.invalid &&
              filterForm.get('idPuntoEmision')?.touched
            "
          >
            Campo requerido
          </mat-error>
        </mat-form-field>
      </div>

      <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Usuario</mat-label>
          <input
            matInput
            [(ngModel)]="usuarioNombre"
            [ngModelOptions]="{ standalone: true }"
            (keyup)="onKeyupUsuarioSearchHandler(usuarioNombre)"
            placeholder="Buscar Usuario"
            autocomplete="off"
          />
          <!-- You'd need to implement an autocomplete component here -->
        </mat-form-field>
      </div>

      <div class="col-xl-2 col-lg-2 col-md-6 col-sm-12 col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Nro. Documento</mat-label>
          <input
            matInput
            formControlName="nroSecuencial"
            placeholder="Ej: 123 o 1-30"
          />
        </mat-form-field>
      </div>

      <div class="col-xl-2 col-lg-2 col-md-12 col-sm-12 col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Dato Adicional</mat-label>
          <input
            matInput
            formControlName="infoAdicional"
            placeholder="Ej: SERIE"
          />
        </mat-form-field>
      </div>

      <div class="col-xl-2 col-lg-2 col-md-12 col-sm-12 col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Estado</mat-label>
          <mat-select formControlName="byEstado" (selectionChange)="reload()">
            <mat-option value="">Todos</mat-option>
            <mat-option
              *ngFor="let item of estadoDocumentos"
              [value]="item.idEstadoPago"
            >
              {{ item.descripcion }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
  </form>
</div>
