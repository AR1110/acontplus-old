<mat-card appearance="outlined">
  @if (showHeader()) {
  <mat-card-header>
    <!-- <div mat-card-avatar></div> -->
    @if(title()){
    <mat-card-title>{{ title() }}</mat-card-title>

    } @if ( subtitle()) {
    <mat-card-subtitle>{{ subtitle() }}</mat-card-subtitle>

    }
  </mat-card-header>

  }

  <mat-card-content>
    <ng-content></ng-content>
  </mat-card-content>

  <mat-card-actions>
    @if (showActions()) {
    <ng-container>
      <button mat-button>
        {{ primaryActionLabel() }}
      </button>
      <button mat-button color="warn">
        {{ secondaryActionLabel() }}
      </button>
    </ng-container>

    }
  </mat-card-actions>
</mat-card>
