<div class="container-upload">
  <div class="avatar-upload">
    <div class="avatar-preview" [ngStyle]="{'background-image': 'url(' + imageUrl + ')'}"></div>

    <div class="avatar-actions">
      <!-- Botón de edición -->
      <label for="imageUpload" class="edit-button">
        <fa-icon [icon]="'pencil'"></fa-icon>
      </label>

      <!-- Botón de eliminación -->
      <button class="delete-button" (click)="onDelete()">
        <fa-icon [icon]="'trash'"></fa-icon>
      </button>
    </div>

    <!-- Input oculto para seleccionar archivos -->
    <input type="file" id="imageUpload" accept=".png, .jpg, .jpeg" (change)="onFileChange($event)"
      style="display: none;" />
  </div>
</div>
