<mat-form-field class="w-100" appearance="outline">
  <mat-label>{{ labelText() }}</mat-label>
  <mat-chip-grid #chipGrid [attr.aria-label]="'Lista de ' + labelText()">
    @for (chip of chips(); track $index) {
      <mat-chip-row
        (removed)="remove(chip)"
        [editable]="true"
        (edited)="edit(chip, $event)"
        [aria-description]="'Presione Enter para editar o el botón X para eliminar ' + chip"
        [matTooltip]="'Clic para editar, X para eliminar'"
        matTooltipPosition="above"
      >
        {{ chip }}
        <button
          matChipRemove
          [attr.aria-label]="'Eliminar ' + chip"
          [matTooltip]="'Eliminar ' + chip"
          matTooltipPosition="above"
        >
          <mat-icon>cancel</mat-icon>
        </button>
      </mat-chip-row>
    }
    <input
      [placeholder]="getPlaceholderText()"
      [matChipInputFor]="chipGrid"
      [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
      [matChipInputAddOnBlur]="addOnBlur"
      (matChipInputTokenEnd)="add($event)"
      [matTooltip]="getInputTooltip()"
      matTooltipPosition="above"
      matTooltipShowDelay="500"
    />
  </mat-chip-grid>
  <mat-hint align="start">
    <mat-icon class="hint-icon">info</mat-icon>
    <span>
      <strong>{{ getHintText() }}</strong>
      <br />
      <small class="text-muted"> Separadores: Enter, coma (,) • Clic en chip para editar </small>
    </span>
  </mat-hint>
</mat-form-field>
