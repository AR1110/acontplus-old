<mat-autocomplete #auto="matAutocomplete">
  @if(isLoadingResults()){
  <mat-option
    disabled
    style="display: flex; justify-content: center; align-items: center"
  >
    <mat-spinner diameter="35"></mat-spinner>
  </mat-option>
  } @for (state of filters | async; track $index) {
  <mat-option
    [value]="state.nombreCompleto"
    (onSelectionChange)="onSelectionChange(state)"
  >
    <span>{{ state.nroIdentificacion }}</span> |
    <small>{{ state.nombreCompleto }}</small>
  </mat-option>
  }
</mat-autocomplete>
<mat-form-field class="w-100">
  <mat-label>Usuario</mat-label>
  <input
    type="text"
    matInput
    [formControl]="control"
    [matAutocomplete]="auto"
    onclick="select();"
  />
</mat-form-field>
