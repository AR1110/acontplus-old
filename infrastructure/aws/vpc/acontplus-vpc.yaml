#============================================================================
# Outputs
#============================================================================
Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub ${ProjectName}-${Environment}-vpc-id

  VpcCidr:
    Description: VPC CIDR block
    Value: !Ref VpcCidr
    Export:
      Name: !Sub ${ProjectName}-${Environment}-vpc-cidr

  VpcIpv6Cidr:
    Description: VPC IPv6 CIDR block
    Condition: EnableIPv6Condition
    Value: !Select [0, !GetAtt VPC.Ipv6CidrBlocks]
    Export:
      Name: !Sub ${ProjectName}-${Environment}-vpc-ipv6-cidr

  PublicSubnetA:
    Description: Public Subnet A ID
    Value: !Ref PublicSubnetA
    Export:
      Name: !Sub ${ProjectName}-${Environment}-snet-public-a-id

  PublicSubnetB:
    Description: Public Subnet B ID
    Value: !Ref PublicSubnetB
    Export:
      Name: !Sub ${ProjectName}-${Environment}-snet-public-b-id

  PrivateSubnetA:
    Description: Private Subnet A ID
    Value: !Ref PrivateSubnetA
    Export:
      Name: !Sub ${ProjectName}-${Environment}-snet-private-a-id

  PrivateSubnetB:
    Description: Private Subnet B ID
    Value: !Ref PrivateSubnetB
    Export:
      Name: !Sub ${ProjectName}-${Environment}-snet-private-b-id

  PrivateSubnetDbA:
    Description: Database Subnet A ID
    Value: !Ref PrivateSubnetDbA
    Export:
      Name: !Sub ${ProjectName}-${Environment}-snet-db-a-id

  PrivateSubnetDbB:
    Description: Database Subnet B ID
    Value: !Ref PrivateSubnetDbB
    Export:
      Name: !Sub ${ProjectName}-${Environment}-snet-db-b-id

  PublicSubnets:
    Description: List of public subnet IDs
    Value: !Join [',', [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export:
      Name: !Sub ${ProjectName}-${Environment}-public-subnets

  PrivateSubnets:
    Description: List of private subnet IDs
    Value: !Join [',', [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
    Export:
      Name: !Sub ${ProjectName}-${Environment}-private-subnets

  DatabaseSubnets:
    Description: List of database subnet IDs
    Value: !Join [',', [!Ref PrivateSubnetDbA, !Ref PrivateSubnetDbB]]
    Export:
      Name: !Sub ${ProjectName}-${Environment}-db-subnets

  DatabaseSubnetGroup:
    Description: RDS DB Subnet Group name
    Value: !Ref DatabaseSubnetGroup
    Export:
      Name: !Sub ${ProjectName}-${Environment}-db-subnet-group

  AlbSecurityGroup:
    Description: ALB Security Group ID
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub ${ProjectName}-${Environment}-alb-sg-id

  EcsSecurityGroup:
    Description: ECS Security Group ID
    Value: !Ref EcsSecurityGroup
    Export:
      Name: !Sub ${ProjectName}-${Environment}-ecs-sg-id

  DatabaseSecurityGroup:
    Description: Database Security Group ID
    Value: !Ref DatabaseSecurityGroup
    Export:
      Name: !Sub ${ProjectName}-${Environment}-db-sg-id

  VpcEndpointSecurityGroup:
    Description: VPC Endpoint Security Group ID
    Value: !Ref VpcEndpointSecurityGroup
    Export:
      Name: !Sub ${ProjectName}-${Environment}-vpce-sg-id

  AvailabilityZones:
    Description: List of Availability Zones used
    Value: !Join [',', [!Select [0, !GetAZs ''], !Select [1, !GetAZs '']]]
    Export:
      Name: !Sub ${ProjectName}-${Environment}-availability-zones

  FlowLogsLogGroup:
    Description: VPC Flow Logs CloudWatch Log Group
    Condition: EnableFlowLogsCondition
    Value: !Ref FlowLogsLogGroup
    Export:
      Name: !Sub ${ProjectName}-${Environment}-flow-logs-group

  NatGatewayAIp:
    Description: NAT Gateway A Public IP
    Condition: CreateNatGateway
    Value: !Ref NatGatewayEipA
    Export:
      Name: !Sub ${ProjectName}-${Environment}-nat-a-ip

  NatGatewayBIp:
    Description: NAT Gateway B Public IP
    Condition: CreateSecondNatGateway
    Value: !Ref NatGatewayEipB
    Export:
      Name: !Sub ${ProjectName}-${Environment}-nat-b-ip
