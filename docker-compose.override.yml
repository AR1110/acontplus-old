# Development environment overrides
# Automatically merged with docker-compose.yml when running: docker-compose up
# Uses .env or .env.development for configuration
#
# Configuration Priority (highest to lowest):
# 1. Environment Variables from .env file
# 2. User Secrets (mounted from local machine)
# 3. appsettings.Development.json (copied into image)
# 4. appsettings.json (copied into image)

services:
  ocelot.api:
    container_name: ocelot-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - AdvancedLogging__LocalFilePath=${LOG_PATH:-/app/logs/log-.txt}
      - AdvancedLogging__EnableLocalFile=${ENABLE_LOCAL_FILE_LOGGING:-true}
      - Serilog__MinimumLevel__Default=${LOG_LEVEL:-Information}
      - SafeOrigins=${SAFE_ORIGINS}
      - JwtSettings__SecurityKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE_GATEWAY}
      - ApiGateways__Acontplus=${APIGATEWAY_ACONTPLUS}
      - ServiceUrls__IdentityApi=${SERVICE_URL_IDENTITY:-http://identity.api:8080}
      - ServiceUrls__AccountingApi=${SERVICE_URL_ACCOUNTING:-http://accounting.api:8080}
      - ServiceUrls__BillingApi=${SERVICE_URL_BILLING:-http://billing.api:8080}
      - ServiceUrls__SalesApi=${SERVICE_URL_SALES:-http://sales.api:8080}
      - ServiceUrls__InventoryApi=${SERVICE_URL_INVENTORY:-http://inventory.api:8080}
      - ServiceUrls__PurchasesApi=${SERVICE_URL_PURCHASES:-http://purchases.api:8080}
      - ServiceUrls__CommonApi=${SERVICE_URL_COMMON:-http://common.api:8080}
      - ServiceUrls__ConfigurationApi=${SERVICE_URL_CONFIGURATION:-http://configuration.api:8080}
      - ServiceUrls__RestaurantApi=${SERVICE_URL_RESTAURANT:-http://restaurant.api:8080}
      - ServiceUrls__MechanicalApi=${SERVICE_URL_MECHANICAL:-http://mechanical.api:8080}
      - ServiceUrls__VetApi=${SERVICE_URL_VET:-http://vet.api:8080}
      - ServiceUrls__BarberShopApi=${SERVICE_URL_BARBERSHOP:-http://barbershop.api:8080}
      - ServiceUrls__TechnicalSupportApi=${SERVICE_URL_TECHSUPPORT:-http://technicalsupport.api:8080}
    ports:
      - "${GATEWAY_PORT:-5000}:8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ./logs/ocelot:/app/logs
    restart: ${RESTART_POLICY:-no}
    logging:
      driver: ${LOG_DRIVER:-json-file}
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: ${LOG_MAX_FILE:-5}

