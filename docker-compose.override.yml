  reports.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - JwtSettings__SecurityKey=3a726udEFCJgKZ4rkfgCjUbeaMNDoThRXcafSQJOaGM
      - JwtSettings__ExpirationInMinutes=900
      - ConnectionStrings__DefaultConnection="Data Source=${SQL_SERVER_HOST};Initial Catalog=${SQL_SERVER_DB};Persist Security Info=True;User ID=${SQL_SERVER_USER};Password=${SQL_SERVER_PASSWORD};MultipleActiveResultSets=True;Trusted_Connection=False;TrustServerCertificate=True"
      - Reports__MainDirectory=Reports
      - AdvancedLogging__EnableLocalFile=False
      - AdvancedLogging__EnableDatabaseLogging=True
      - AdvancedLogging__ConnectionString="Data Source=${SQL_SERVER_HOST};Initial Catalog=${SQL_SERVER_DB};Persist Security Info=True;User ID=${SQL_SERVER_USER};Password=${SQL_SERVER_PASSWORD};MultipleActiveResultSets=True;Trusted_Connection=False;TrustServerCertificate=True"
      - AdvancedLogging__TimeZoneId=America/Guayaquil
      - AdvancedLogging__MinimumLogLevel=Error
      
    ports:
      - "8080"
      - "8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
